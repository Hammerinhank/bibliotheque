/* ====================================================================
   PROPORTIONS D'UN COMPARTIMENT (hauteur / largeur), propre à chaque bibliothèque
   ==================================================================== */
const RATIO_DEFAUT = 4/3;          // ancien affichage : compartiment plus haut que large (3:4)
const RATIO_MIN = 0.15, RATIO_MAX = 6;
function ratioBiblio(b){
  const r = Number(b && b.ratio);
  return (isFinite(r) && r >= RATIO_MIN && r <= RATIO_MAX) ? r : RATIO_DEFAUT;
}
const fmtRatio = r => r.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 });

function formProportions(b){
  let ratio = ratioBiblio(b);
  const f = modale({
    titre:"Proportions d'un compartiment — " + b.nom,
    html:
      `<div class="aide" style="margin-top:0">Déplacez le coin rouge en bas à droite jusqu'à ce que le rectangle ait la forme d'un compartiment réel. La grille de cette bibliothèque sera dessinée avec ces proportions, sur tous vos appareils.</div>
       <div id="pScene" class="scene"><div id="pRect" class="rectComp"><span id="pCote"></span></div><div id="pPoignee" class="poignee"></div></div>
       <div class="ligne2" style="align-items:flex-end">
         <div><label for="pRatio">Hauteur ÷ largeur</label><input type="number" id="pRatio" step="0.01" min="${RATIO_MIN}" max="${RATIO_MAX}"></div>
         <div><label for="pH">ou mesures réelles (cm)</label>
           <div class="ligne2"><input type="number" id="pH" placeholder="haut." min="1"><input type="number" id="pL" placeholder="larg." min="1"></div></div>
       </div>
       <div class="aide" id="pForme"></div>`,
    boutons:[
      {texte:"Annuler"},
      {texte:"Par défaut", garder:true, action:()=>{ ratio = RATIO_DEFAUT; dessiner(true); }},
      {texte:"Enregistrer", classe:"principal", action:()=>enregistrer()}
    ]
  });

  const scene = f.querySelector("#pScene"), rect = f.querySelector("#pRect"), poignee = f.querySelector("#pPoignee");
  const MARGE = 14;
  let w = 0, h = 0;

  const dims = ()=>{ const rc = scene.getBoundingClientRect(); return { W: rc.width - 2*MARGE, H: rc.height - 2*MARGE, rc }; };

  // place le rectangle pour un ratio donné, le plus grand possible dans la scène
  const ajuster = ()=>{
    const { W, H } = dims();
    w = Math.min(W * 0.85, (H * 0.85) / ratio);
    h = w * ratio;
  };

  const dessiner = (recalculer, depuisSaisie)=>{
    if (recalculer) ajuster();
    rect.style.width = w + "px"; rect.style.height = h + "px";
    poignee.style.left = (MARGE + w) + "px"; poignee.style.top = (MARGE + h) + "px";
    f.querySelector("#pCote").textContent = fmtRatio(ratio);
    if (!depuisSaisie) f.querySelector("#pRatio").value = ratio.toFixed(2);
    f.querySelector("#pForme").textContent =
      ratio > 1.05 ? `Compartiment plus haut que large (hauteur = ${fmtRatio(ratio)} × la largeur).`
      : ratio < 0.95 ? `Compartiment plus large que haut (largeur = ${fmtRatio(1/ratio)} × la hauteur).`
      : "Compartiment à peu près carré.";
  };

  let glisse = false;
  const commencer = e=>{
    const { rc } = dims();
    const x = e.clientX - rc.left, y = e.clientY - rc.top;
    if (Math.hypot(x - (MARGE + w), y - (MARGE + h)) > 44) return;   // seulement près du coin
    glisse = true;
    poignee.classList.add("active");
    try{ scene.setPointerCapture(e.pointerId); }catch(er){}
    e.preventDefault();
  };
  scene.addEventListener("pointerdown", commencer);
  scene.addEventListener("pointermove", e=>{
    if (!glisse) return;
    const { W, H, rc } = dims();
    w = Math.max(24, Math.min(W, e.clientX - rc.left - MARGE));
    h = Math.max(24, Math.min(H, e.clientY - rc.top - MARGE));
    ratio = Math.max(RATIO_MIN, Math.min(RATIO_MAX, h / w));
    dessiner(false);
    e.preventDefault();
  });
  const lacher = ()=>{ if (!glisse) return; glisse = false; poignee.classList.remove("active"); };
  scene.addEventListener("pointerup", lacher);
  scene.addEventListener("pointercancel", lacher);

  f.querySelector("#pRatio").oninput = ev=>{
    const v = parseFloat(String(ev.target.value).replace(",", "."));
    if (isFinite(v) && v >= RATIO_MIN && v <= RATIO_MAX){ ratio = v; dessiner(true, true); }
  };
  const depuisMesures = ()=>{
    const hh = parseFloat(f.querySelector("#pH").value), ll = parseFloat(f.querySelector("#pL").value);
    if (hh > 0 && ll > 0){ ratio = Math.max(RATIO_MIN, Math.min(RATIO_MAX, hh / ll)); dessiner(true); }
  };
  f.querySelector("#pH").oninput = depuisMesures;
  f.querySelector("#pL").oninput = depuisMesures;

  const enregistrer = async ()=>{
    b.ratio = Math.round(ratio * 1000) / 1000;
    sauver(); rendreBiblio();
    if (ghPret()){
      toast("Proportions enregistrées : envoi vers GitHub pour tous vos appareils…");
      await envoyerVersGitHub();
    } else {
      toast("Proportions enregistrées sur cet appareil. Ajoutez un jeton GitHub puis envoyez via ☁️ pour les partager avec vos autres appareils.", 6000);
    }
  };

  requestAnimationFrame(()=>dessiner(true));
}

      const x = e.clientX - rc.left, y = e.clientY - rc.top;
      const dist = {
        haut:   Math.abs(y - rc.height * coupe.haut / 100),
        bas:    Math.abs(y - rc.height * coupe.bas / 100),
        gauche: Math.abs(x - rc.width * coupe.gauche / 100),
        droite: Math.abs(x - rc.width * coupe.droite / 100)
      };
      const PROCHE = 32;                                  // px : « à proximité » de la ligne
      let choix = null;
      Object.keys(dist).forEach(n=>{ if (dist[n] <= PROCHE && (!choix || dist[n] < dist[choix])) choix = n; });
      if (!choix) return;
      // deux lignes superposées : on prend celle vers laquelle on tire
      if (choix === "haut" && coupe.haut === coupe.bas - 5 && y > rc.height * coupe.bas / 100) choix = "bas";
      if (choix === "gauche" && coupe.gauche === coupe.droite - 5 && x > rc.width * coupe.droite / 100) choix = "droite";
      ligne = choix;
      cadre.querySelector(CLASSE[ligne]).classList.add("active");
      try{ cadre.setPointerCapture(e.pointerId); }catch(er){}
      e.preventDefault();
    });
    cadre.addEventListener("pointermove", e=>{
      if (!ligne) return;
      const rc = cadre.getBoundingClientRect();
      const px = Math.max(0, Math.min(100, (e.clientX - rc.left) * 100 / rc.width));
      const py = Math.max(0, Math.min(100, (e.clientY - rc.top) * 100 / rc.height));
      const r1 = v => Math.round(v * 10) / 10;
      if      (ligne === "haut")   coupe.haut   = r1(Math.min(py, coupe.bas - 5));
      else if (ligne === "bas")    coupe.bas    = r1(Math.max(py, coupe.haut + 5));
      else if (ligne === "gauche") coupe.gauche = r1(Math.min(px, coupe.droite - 5));
      else                         coupe.droite = r1(Math.max(px, coupe.gauche + 5));
      placerLignes();
      e.preventDefault();
    });
    const lacher = ()=>{
      if (!ligne) return;
      ligne = null;
      cadre.querySelectorAll(".ligneCoupe,.ligneV").forEach(x=>x.classList.remove("active"));

  };

  const tronquer = async ()=>{

      const sy = Math.round(img.height * coupe.haut / 100);
      const sh = Math.max(1, Math.round(img.height * (coupe.bas - coupe.haut) / 100));
      const sx = Math.round(img.width * coupe.gauche / 100);
      const sw = Math.max(1, Math.round(img.width * (coupe.droite - coupe.gauche) / 100));
      const cv = document.createElement("canvas");
      cv.width = sw; cv.height = sh;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, sw, sh);

       ${tousCertifies ? "" : `<div class="colAppoint">

  const majUnRang = ()=>{
    const bP = f.querySelector("#cPermuter");

       · ${esc(dateFr(photoObj(cs, face).maj))}

       </div>

       ${appoint ? `<label for="cLegende">Légende de cette photo d'appoint</label>

         <div class="aide">Cette légende est transmise à l'IA lors du contrôle : elle l'aide à savoir ce que vous vouliez montrer.</div>` : ""}

  const brancherRetirer = (z)=>{

  let filtreRang = "tous";          // "tous" | "devant" (rangée 1) | "derriere" (rangée 2) | "appoint" (photo d'appoint affichée)
  const majLivres = ()=>{
    const z = f.querySelector("#zoneLivres");
    const zf = f.querySelector("#zoneFiltreRang");

    if (!nQ && filtreRang === "questions") filtreRang = "tous";

      ["devant","derriere"].filter(r=>etatRangee(cs, r).total).map(r=>{

        <div class="aide">Ses ${e.total} livre(s) deviennent 🔒 acquis${e.questions ? `, et les ${e.questions} question(s) en suspens sont closes (livres gardés tels quels)` : ""}. Les analyses et photos d'appoint ne la modifieront plus. Une étoile dorée ★ l'indiquera sur la grille.</div>`, "Certifier la rangée", "⭐ Certifier");
      if (!ok) return;
      cs.livres.filter(lv=>(lv.rang === "derriere" ? "derriere" : "devant") === r).forEach(rendreAcquis);
      cs.certif = Object.assign({}, cs.certif || {}, { [r]: new Date().toISOString() });
      journal(`Certification de la ${nomR} de ${lib(k)}`);
      apresReponse(); majPhoto();
      toast(`★ ${nomR[0].toUpperCase() + nomR.slice(1)} certifiée.`, 4000);
    });
    zf.querySelectorAll("[data-decertif]").forEach(el=>el.onclick=async()=>{

      if (!ok) return;
      delete cs.certif[r]; if (!Object.keys(cs.certif).length) delete cs.certif;
      journal(`Certification retirée : ${r === "derriere" ? "rangée 2" : "rangée 1"} de ${lib(k)}`);
      apresReponse(); majPhoto();
    });
    zf.querySelectorAll("[data-valider]").forEach(el=>el.onclick=async()=>{
      const r = el.dataset.valider, e = etatRangee(cs, r);
      const ok = await confirmer(`<div>Valider la ${r === "derriere" ? "rangée 2" : "rangée 1"} : les ${e.probables} livre(s) probable(s) deviennent 🔒 acquis ?</div><div class="aide">À faire quand la liste correspond à l'étagère. Les livres acquis ne sont plus modifiés par les analyses.</div>`, "Valider la rangée", "Valider");
      if (!ok) return;
      cs.livres.filter(lv=>(lv.rang === "derriere" ? "derriere" : "devant") === r && !lv.question).forEach(rendreAcquis);
      apresReponse();
    });
    z.querySelectorAll("[data-modif]").forEach(el=>el.onclick=()=>formLivre(cs, Number(el.dataset.modif), majLivres));
    z.querySelectorAll("[data-suppr]").forEach(el=>el.onclick=async()=>{
      const i = Number(el.dataset.suppr);
      const ok = await confirmer(`Supprimer « ${esc(cs.livres[i].titre)} » ?${estAcquis(cs.livres[i]) ? "<div class='aide'>Ce livre est 🔒 acquis.</div>" : ""}`, "Supprimer le livre", "Supprimer");
      if (!ok) return;
      journal(`Livre supprimé : « ${cs.livres[i].titre} »`);
      cs.livres.splice(i,1); sauver(); majLivres(); rendreBiblio();
      planifierEnvoi("Livres modifiés à la main");
    });
    activerGlisser(z, cs, majLivres);
  };

  f.querySelector("#cPhoto").onclick = ()=>{ enAjoutAppoint = false; f.querySelector("#cFichier").click(); };

    enAjoutAppoint = false;

      toast("Compression de la photo…");

      poserPhoto(cs, cible, Object.assign({ plein, chemin:cheminPhoto(b,k,cible), envoye:false, maj:new Date().toISOString() }, demande ? { legende: demande.legende } : {}));
      delete cachePhotos[cleCache(b,k,cible)];
      avantTroncature = null;
      face = cible; lignesVisibles = false;
      sauver(); majPhoto(); rendreBiblio();

      await envoyerPhotoAuto(b, k, cible, quoiP);

      if (demande && f.isConnected && face === cible) f.querySelector("#cAnalyser").click();   // lecture immédiate de l'appoint demandé
    }catch(e){ toast("Photo illisible : " + e.message, 5000); }

  f.querySelector("#cReutiliser").onclick = ()=>fenetreReutiliserPhoto(b, k, face);
  f.querySelector("#cPermuter").onclick = ()=>permuterRangees(b, k);
  f.querySelector("#cAppointOrdre").onclick = async ()=>{

    const champ = face;
    const btnO = f.querySelector("#cAppointOrdre");
    btnO.disabled = true; btnO.textContent = "Lecture de la photo…";

      const r = await lireAppoint(b, k, champ, { manuel:true, mode:"ordre" });
      fenetreFusionAppoint(b, k, champ, r.lus, r.source);

      if (e.manuel){ lancerClaudeManuel(b, k, e.parties, e.echecs, e.ia, "controle", idAppoint(champ) + "|ordre"); }
      else montrerErreurAnalyse(e);

      btnO.disabled = false; btnO.textContent = "🔀 Nouvelle lecture par l'IA (ordre respecté)";

  };
  f.querySelector("#cAnalyser").onclick = async ()=>{
    const btnA = f.querySelector("#cAnalyser");
    if (estAppoint(face)){
      const champ = face;
      btnA.disabled = true; btnA.textContent = "Lecture de la photo…";
      try{
        const r = await lireAppoint(b, k, champ, { manuel:true, mode:"ordre" });
        btnA.disabled = false; btnA.textContent = "🔍 Nouvelle lecture par l'IA";
        fenetreFusionAppoint(b, k, champ, r.lus, r.source);
      }catch(e){
        btnA.disabled = false; btnA.textContent = "🔍 Nouvelle lecture par l'IA";
        if (e.manuel){ lancerClaudeManuel(b, k, e.parties, e.echecs, e.ia, "controle", idAppoint(champ) + "|ordre"); return; }
        montrerErreurAnalyse(e);
      }
      return;
    }
    if (!cs.photo && !cs.photo2){ toast("Ajoutez d'abord une photo."); return; }
    const portee = face === "photo2" ? "derriere" : (cs.photo ? "devant" : "derriere");   // la photo affichée
    if (!photoObj(cs, portee === "derriere" ? "photo2" : "photo")){ toast("Cette photo n'existe pas encore."); return; }
    const btn = f.querySelector("#cAnalyser");
    btn.disabled = true; btn.textContent = "Analyse…";
    try{
      const livres = await analyserPhoto(b, k, { manuel:true, portee });
      btn.disabled = false; btn.textContent = "🔍 Nouvelle analyse par l'IA";
      appliquerLivresCompartiment(b, k, livres);
    }catch(e){
      btn.disabled = false; btn.textContent = "🔍 Nouvelle analyse par l'IA";
      if (e.manuel){ lancerClaudeManuel(b, k, e.parties, e.echecs, e.ia, undefined, e.portee || portee); return; }
      montrerErreurAnalyse(e);
    }
  };

  f.querySelector("#cAjouter").onclick = ()=>{
    // un livre ajouté à la main va dans la rangée 1, ou dans la rangée 2 si la 1 est certifiée
    const n = (cs.livres||[]).length;
    const cible = certifiee(cs, "devant") ? "derriere" : "devant";
    formLivre(cs, -1, ()=>{
      if (cs.livres.length > n && cible === "derriere") cs.livres[cs.livres.length - 1].rang = "derriere";
      sauver(); majLivres();
    });
  };
  f.querySelector("#cAjouterTete").onclick = ()=>{
    // même rangée que le bouton du bas, mais le nouveau livre est placé en tête de cette rangée
    const n = (cs.livres||[]).length;
    const cible = certifiee(cs, "devant") ? "derriere" : "devant";
    formLivre(cs, -1, ()=>{
      if (cs.livres.length > n){
        const lv = cs.livres.pop();
        if (cible === "derriere") lv.rang = "derriere";
        const rg = (x)=> x.rang === "derriere" ? "derriere" : "devant";
        const premier = cs.livres.findIndex(x=>rg(x) === cible);
        cs.livres.splice(premier < 0 ? (cible === "derriere" ? cs.livres.length : 0) : premier, 0, lv);
      }
      sauver(); majLivres();
    });
  };
  rafraichirCompartimentOuvert = (bid, kk)=>{ if (f.isConnected && bid === b.id && kk === k){ majLivres(); majFaces(); } };

  majPhoto(); majLivres();
}

/* Retrait d'une photo : propose de supprimer aussi les livres identifiés à partir d'elle.
   Photo 1 (devant) -> livres non marqués « derrière » ; photo 2 -> livres « derrière » ;
   compartiment à une seule photo -> tous ses livres. Les ajouts à la main ne sont pas cochés d'office.
   Renvoie null (annulé) ou { ids:Set de livres à supprimer }. */
function choisirRetraitPhoto(cs, face){
  const livres = cs.livres || [];
  const autre = face === "photo2" ? cs.photo : cs.photo2;
  const lies = livres.filter(lv => {
    if (!autre) return true;
    return face === "photo2" ? lv.rang === "derriere" : lv.rang !== "derriere";
  });
  const intro = face === "photo2"
    ? "Retirer la photo du rang de derrière ? La prochaine analyse ne portera plus que sur la photo de devant."
    : "Retirer la photo de ce compartiment ?";
  return new Promise(res=>{
    if (!lies.length){
      confirmer(`${intro} Les livres déjà relevés sont conservés.`, "Retirer la photo", "Retirer").then(ok => res(ok ? { ids:new Set() } : null));
      return;
    }
    let fini = false;
    const finir = v => { if (!fini){ fini = true; res(v); } };
    const lignes = lies.map((lv,i)=>{
      const main = lv.origine === "main";
      return `<div class="coche" style="align-items:flex-start;margin:6px 0">
        <input type="checkbox" data-rl="${i}" ${main ? "" : "checked"} style="margin-top:3px">
        <label style="margin:0;font-weight:normal">${esc(lv.titre)}<span class="aide" style="display:block;margin:0">${esc(lv.auteur||"auteur inconnu")}${lv.rang ? " · " + (lv.rang==="derriere"?"derrière":"devant") : ""}${main ? " · ajouté à la main" : ""}</span></label></div>`;
    }).join("");
    const f = modale({
      titre: "Retirer la photo",
      html: `<div style="font-size:15px">${intro}</div>
        <div style="margin-top:12px;font-weight:600">Supprimer aussi les livres identifiés à partir de cette photo ?</div>
        <div class="aide" style="margin-top:2px">${lies.length} livre(s) concerné(s). Décochez ceux à conserver.</div>
        <div class="barre" style="margin:8px 0 4px">
          <button class="btn" id="rlTous" style="flex:1">Tout cocher</button>
          <button class="btn" id="rlAucun" style="flex:1">Tout décocher</button>
        </div>
        <div style="max-height:40vh;overflow:auto;border:1px solid var(--trait);border-radius:10px;padding:4px 10px">${lignes}</div>`,
      boutons: [
        { texte:"Annuler", action:()=>finir(null) },
        { texte:"Photo seule", action:()=>finir({ ids:new Set() }) },
        { texte:"Photo + livres cochés", classe:"rouge", action:(fd)=>{
            const ids = new Set();
            fd.querySelectorAll("[data-rl]").forEach(c => { if (c.checked) ids.add(lies[Number(c.dataset.rl)]); });
            finir({ ids });
        }}
      ],
      surFermeture: ()=>finir(null),
      apres: (fd)=>{
        const bouton = [...fd.querySelectorAll(".pied .btn")].pop();
        const maj = ()=>{
          const n = [...fd.querySelectorAll("[data-rl]")].filter(c=>c.checked).length;
          bouton.textContent = n ? `Photo + ${n} livre(s)` : "Photo + livres cochés";
          bouton.disabled = !n;
        };
        fd.querySelectorAll("[data-rl]").forEach((c)=>{
          c.onchange = maj;
          const l = c.nextElementSibling; if (l) l.onclick = ()=>{ c.checked = !c.checked; maj(); };
        });
        fd.querySelector("#rlTous").onclick = ()=>{ fd.querySelectorAll("[data-rl]").forEach(c=>c.checked=true); maj(); };
        fd.querySelector("#rlAucun").onclick = ()=>{ fd.querySelectorAll("[data-rl]").forEach(c=>c.checked=false); maj(); };
        maj();
      }
    });
  });
}

function formLivre(cs, index, apres){
  const lv = index >= 0 ? cs.livres[index]
    : { titre:"", auteur:"", annee:"", resume:"", categorie:"", remarque:"", certitude:"haute" };
  modale({
    titre: index>=0 ? "Modifier le livre" : "Nouveau livre",
    html:
      `<label for="lT">Titre</label><input type="text" id="lT" value="${esc(lv.titre)}">
       <label for="lA">Auteur</label><input type="text" id="lA" value="${esc(lv.auteur)}">

/* ====================================================================
   ANALYSE DE TOUTES LES PHOTOS
   ==================================================================== */
async function analyserToutesPhotos(b){
  const cibles = Object.keys(b.cases||{}).filter(k=>b.cases[k].photo || b.cases[k].photo2);
  if (!cibles.length){ toast("Aucune photo à analyser dans cette bibliothèque."); return; }
  const vierges = cibles.filter(k=>!(b.cases[k].livres||[]).length);
  const choix = await new Promise(res=>{
    modale({ titre:"Analyser les photos",
      html:`<div>${cibles.length} photo(s) dans cette bibliothèque, dont ${vierges.length} sans livre relevé.</div>
            <div class="aide">Chaque photo part chez Gemini une par une ; les compartiments déjà remplis seront écrasés si vous choisissez « toutes ».</div>`,
      boutons:[
        {texte:"Annuler", action:()=>res(null)},
        {texte:`Les ${vierges.length} vierges`, action:()=>res(vierges)},
        {texte:`Les ${cibles.length} photos`, classe:"principal", action:()=>res(cibles)}
      ], surFermeture:()=>res(null)});
  });
  if (!choix || !choix.length) return;
  await analyserListe(b, choix, "Analyse des photos");
}

async function analyserListe(b, choix, titre){
  const pg = fenetreProgres(titre || "Analyse des photos");
  let fait=0, trouves=0; const erreurs=[]; let erreurBloquante=null; const parIA = { gemini:0, claude:0 };
  for (const k of choix){
    pg.maj(fait, choix.length, "Compartiment " + k + (b.cases[k].photo && b.cases[k].photo2 ? " — deux rangs, 2 photos" : ""));
    try{
      const livres = await analyserPhoto(b, k);
      b.cases[k].livres = livres;
      b.cases[k].analyse = infoAnalyse(livres, b.cases[k]);
      if (livres.source) parIA[livres.source.ia]++;
      trouves += livres.length;
      sauver();
      if ((fait + 1) % 5 === 0){ pg.maj(fait + 1, choix.length, "Sauvegarde sur GitHub…"); await envoyerDonneesAuto("Analyse de « " + b.nom + " » (" + (fait + 1) + " / " + choix.length + ")"); }
    }catch(e){
      // Modèle retiré / quota / refus : inutile de continuer, toutes les photos échoueraient.
      if (e.modele){ erreurBloquante = e; break; }
      erreurs.push(k + " : " + e.message);
    }
    fait++;
    pg.maj(fait, choix.length, "");
  }
  pg.fermer();
  if (fait) envoyerDonneesAuto("Analyse de « " + b.nom + " »");
  if (erreurBloquante){
    rendreBiblio();
    toast(`Analyse arrêtée après ${fait} photo(s) sur ${choix.length}.`, 5000);
    montrerErreurAnalyse(erreurBloquante);
    return;
  }
  rendreBiblio();
  modale({ titre:"Analyse terminée",
    html:`<div>${fait} photo(s) traitée(s), ${trouves} livre(s) relevé(s).</div>
          ${parIA.gemini && parIA.claude ? `<div class="aide">Réponses : ${parIA.gemini} par Gemini, ${parIA.claude} par Claude (en secours).</div>`
            : parIA.claude ? `<div class="aide">Toutes les réponses viennent de Claude.</div>` : ""}
          ${erreurs.length?`<div class="aide">${erreurs.length} échec(s) :<br>${esc(erreurs.join(" | "))}</div>`:""}
          ${erreurs.length && (modeManuel("claude") || modeManuel("gemini")) ? `<div class="aide">Une IA sans clé (copier-coller) ne peut pas traiter une série : ouvrez chaque compartiment en échec et touchez 🔍 Analyser.</div>` : ""}`,
    boutons:[{texte:"Fermer"}]});
}

/* ====================================================================
   SÉRIE DE PHOTOS : APPUI LONG + TOUCHER → PLUSIEURS COMPARTIMENTS
   ==================================================================== */
const DUREE_APPUI_LONG = 600;   // ms
let selDepart = null;           // { bibId, cle } : compartiment tenu longtemps
let serie = null;               // { bibId, liste:[clés], inverse, encours, actif }
let appuiLongActif = false;
let ignorerClicJusqua = 0;

const lib = k => String(k).replace("-", "·");

function brancherCase(el, b){
  const k = el.dataset.case;
  let minuteur = null, x0 = 0, y0 = 0;
  const stop = ()=>{ clearTimeout(minuteur); minuteur = null; };
  el.addEventListener("pointerdown", e=>{
    if (e.pointerType === "mouse" && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; stop();
    minuteur = setTimeout(()=>{ minuteur = null; appuiLongActif = true; appuiLong(b, k, el); }, DUREE_APPUI_LONG);
  });
  el.addEventListener("pointermove", e=>{
    if (minuteur && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) stop();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t, stop));
  el.addEventListener("contextmenu", e=>e.preventDefault());
  el.addEventListener("click", e=>{
    e.stopPropagation();
    if (Date.now() < ignorerClicJusqua) return;          // relâchement de l'appui long
    if (selDepart && selDepart.bibId === b.id){ toucherArrivee(b, k); return; }
    if (serie && serie.actif && serie.liste.includes(k)){ toast("Ce compartiment est en cours de remplissage."); return; }
    ouvrirCompartiment(b, k);
  });
}

function appuiLong(b, k){
  if (serie){ toast(serie.actif ? "Un remplissage est déjà en cours : attendez qu'il se termine." : "Une sélection est déjà en cours."); return; }
  try{ if (navigator.vibrate) navigator.vibrate(35); }catch(e){}
  selDepart = { bibId:b.id, cle:k };
  majBarreSel(); majMarquesGrille();
}

function majMarquesGrille(){
  const b = biblio(biblioCourante);
  document.querySelectorAll("#vueBiblio [data-case]").forEach(el=>{
    const k = el.dataset.case;
    el.classList.toggle("depart", !!(b && selDepart && selDepart.bibId === b.id && selDepart.cle === k));
    const pos = (b && serie && serie.bibId === b.id) ? serie.liste.indexOf(k) : -1;
    el.classList.toggle("plage", pos >= 0);
    el.classList.toggle("encours", !!(b && serie && serie.bibId === b.id && serie.encours === k));
    let o = el.querySelector(".ordre");
    if (pos >= 0){
      if (!o){ o = document.createElement("span"); o.className = "ordre"; el.appendChild(o); }
      o.textContent = pos + 1;
    } else if (o) o.remove();
  });
}

function majBarreSel(){
  const z = $("#barreSel");
  if (selDepart){
    z.innerHTML = `<span>Départ : <b>${lib(selDepart.cle)}</b> — touchez le compartiment d'arrivée</span>
                   <button class="btn" id="bsAnnuler">Annuler</button>`;
  } else if (serie && !serie.actif){
    z.innerHTML = `<span>Sélection : <b>${serie.liste.length}</b> compartiment(s)</span>
                   <button class="btn" id="bsAnnuler">Annuler</button>`;
  } else { z.hidden = true; z.innerHTML = ""; return; }
  z.hidden = false;
  z.querySelector("#bsAnnuler").onclick = ()=>annulerSelection("Sélection annulée.");
}

function annulerSelection(msg){
  const avait = !!(selDepart || (serie && !serie.actif));
  selDepart = null;
  if (serie && !serie.actif) serie = null;
  majBarreSel(); majMarquesGrille();
  if (msg && avait) toast(msg);
}

/* ordre rangée par rangée, de gauche à droite ; à rebours si l'arrivée précède le départ */
function plageCases(b, k1, k2){
  const idx = k=>{ const [r,c] = k.split("-").map(Number); return (r-1)*b.compartiments + (c-1); };
  const i1 = idx(k1), i2 = idx(k2), pas = i2 >= i1 ? 1 : -1;
  const liste = [];
  for (let i = i1; ; i += pas){
    liste.push(clef(Math.floor(i / b.compartiments) + 1, (i % b.compartiments) + 1));
    if (i === i2) break;
  }
  return { liste, inverse: pas < 0 };
}

function texteOrdre(liste){
  if (liste.length <= 8) return liste.map(lib).join(" → ");
  return liste.slice(0,3).map(lib).join(" → ") + " → … → " + liste.slice(-2).map(lib).join(" → ");
}

function blocOrdre(){
  return `<div class="aide" style="font-size:13px">Ordre de remplissage : ${esc(texteOrdre(serie.liste))}</div>` +
    (serie.inverse ? `<div class="alerte">⚠️ Sens inversé : le compartiment d'arrivée est avant celui de départ. Les compartiments seront remplis en remontant, de ${lib(serie.liste[0])} vers ${lib(serie.liste[serie.liste.length-1])}.</div>` : "");
}

async function toucherArrivee(b, k){
  const depart = selDepart.cle;
  if (k === depart){ annulerSelection("Sélection annulée."); return; }
  const { liste, inverse } = plageCases(b, depart, k);
  selDepart = null;
  serie = { bibId:b.id, liste, inverse, encours:null, actif:false };
  majBarreSel(); majMarquesGrille();
  if (inverse) toast("⚠️ Sens inversé : les compartiments seront remplis en remontant.", 4500);

  // compartiments qui ont déjà une photo
  const occupes = liste.filter(x=>b.cases[x] && b.cases[x].photo);
  if (occupes.length){
    const choix = await new Promise(res=>{
      modale({ titre:"Compartiments déjà photographiés",
        html:`<div>${liste.length} compartiment(s) sélectionné(s), dont <b>${occupes.length}</b> qui ont déjà une photo :
              ${esc(occupes.map(lib).join(", "))}.</div>` + blocOrdre() +
             `<div class="aide">« Remplacer » : leurs photos seront changées (les livres relevés sont conservés).<br>
              « Les sauter » : ils gardent leur photo et sont retirés de la sélection.</div>`,
        boutons:[
          {texte:"Ne rien faire", action:()=>res(null)},
          {texte:"Les sauter", action:()=>res("sauter")},
          {texte:"Remplacer", classe:"principal", action:()=>res("remplacer")}
        ], surFermeture:()=>res(null) });
    });
    if (!choix){ annulerSelection(); return; }
    if (choix === "sauter"){
      serie.liste = liste.filter(x=>!occupes.includes(x));
      majBarreSel(); majMarquesGrille();
      if (!serie.liste.length){ annulerSelection(); toast("Tous les compartiments sélectionnés ont déjà une photo : rien à faire."); return; }
    }
  }

  const n = serie.liste.length;
  modale({ titre:`Photos pour ${n} compartiment(s)`,
    html: blocOrdre() +
      (ghPret() ? `<div class="aide">Chaque photo est envoyée sur GitHub dès qu'elle est placée ; la grille se remplit au fur et à mesure.</div>`
                : `<div class="alerte">Pas de jeton GitHub : les photos resteront sur cet appareil (envoi possible plus tard via ☁️). La mémoire de l'appareil est limitée à quelques dizaines de photos.</div>`) +
      `<div class="aide">📁 Photos existantes : choisissez exactement ${n} photo(s), dans l'ordre des compartiments.<br>
       📷 Appareil photo : une photo par compartiment, avec possibilité de la reprendre.</div>`,
    boutons:[
      {texte:"Annuler", action:()=>annulerSelection()},
      {texte:"📁 Photos existantes", action:()=>ouvrirSelecteurPhotos(b)},
      {texte:"📷 Appareil photo", classe:"principal", action:()=>serieAppareil(b)}
    ],
    surFermeture:()=>annulerSelection() });
}

/* ---------- photos existantes ---------- */
function ouvrirSelecteurPhotos(b){
  const inp = $("#entreeMulti");
  inp.value = "";
  inp.onchange = ()=>{
    const files = Array.from(inp.files || []);
    inp.value = "";
    recevoirPhotosExistantes(b, files);
  };
  inp.oncancel = ()=>annulerSelection("Aucune photo choisie : sélection annulée.");
  inp.click();          // appelé directement dans le geste de l'utilisateur (exigence iOS)
}

function recevoirPhotosExistantes(b, files){
  if (!serie) return;
  const n = serie.liste.length;
  if (!files.length){ annulerSelection("Aucune photo choisie : sélection annulée."); return; }
  if (files.length !== n){
    modale({ titre:"Nombre de photos différent",
      html:`<div>Vous avez choisi <b>${files.length}</b> photo(s) pour <b>${n}</b> compartiment(s) : <b>rien n'a été fait</b>.</div>
            <div class="aide">Chaque photo doit aller dans un compartiment, dans l'ordre où vous l'avez sélectionnée : il faut donc exactement ${n} photo(s).
            ${files.length > n ? `Il y en a ${files.length - n} de trop.` : `Il en manque ${n - files.length}.`}</div>`,
      boutons:[
        {texte:"Annuler", action:()=>annulerSelection()},
        {texte:"Choisir à nouveau", classe:"principal", action:()=>ouvrirSelecteurPhotos(b)}
      ],
      surFermeture:()=>annulerSelection() });
    return;
  }
  const urls = files.map(f=>URL.createObjectURL(f));
  const liberer = ()=>setTimeout(()=>urls.forEach(u=>URL.revokeObjectURL(u)), 1000);
  modale({ titre:"Vérifiez l'ordre",
    html:`<div class="aide" style="margin-top:0">Chaque photo ira dans le compartiment indiqué dessous. Si l'ordre ne convient pas, choisissez à nouveau en touchant les photos dans le bon ordre.</div>
          ${serie.inverse ? `<div class="alerte">⚠️ Sens inversé : remplissage en remontant.</div>` : ""}
          <div class="recap">${urls.map((u,i)=>`<div class="duo"><img src="${u}" alt=""><span>→ ${lib(serie.liste[i])}</span></div>`).join("")}</div>`,
    boutons:[
      {texte:"Annuler", action:()=>{ liberer(); annulerSelection(); }},
      {texte:"Choisir à nouveau", action:()=>{ liberer(); ouvrirSelecteurPhotos(b); }},
      {texte:"Valider", classe:"principal", action:()=>{ liberer(); remplirDepuisFichiers(b, files); }}
    ],
    surFermeture:()=>{ liberer(); annulerSelection(); } });
}

async function remplirDepuisFichiers(b, files){
  const liste = serie.liste.slice();
  serie.actif = true; majBarreSel();
  const total = liste.length;
  let fait = 0, envoyees = 0, locales = 0;
  const affectees = [], erreurs = [];
  for (let i = 0; i < total; i++){
    const k = liste[i];
    serie.encours = k; majMarquesGrille();
    majSuivi(fait, total, `${lib(k)} : préparation de la photo…`);
    try{
      await affecterPhoto(b, k, files[i]);
      affectees.push(k);
      if (ghPret()){
        majSuivi(fait, total, `${lib(k)} : envoi vers GitHub…`);
        try{ await televerserPhoto(b, k); envoyees++; }
        catch(e){ locales++; erreurs.push(lib(k) + " (envoi) : " + e.message); }
      } else locales++;
    }catch(e){ erreurs.push(lib(k) + " : " + e.message); }
    fait++;
    majSuivi(fait, total, "");
  }
  masquerSuivi();
  bilanSerie(b, affectees, envoyees, locales, erreurs, false);
}

/* ---------- outils communs ---------- */
async function affecterPhoto(b, k, file){
  const brut  = await lireFichier(file);
  const plein = await redimensionner(brut, cfg.tailleMax, cfg.qualite);
  b.cases[k] = b.cases[k] || { livres:[] };
  b.cases[k].photo = { plein, chemin:cheminPhoto(b, k, "photo"), envoye:false, maj:new Date().toISOString() };
  delete cachePhotos[cleCache(b, k, "photo")];
  sauver(); rendreBiblio();
}

async function televerserPhoto(b, k, champ){
  champ = champ || "photo";
  const cs = b.cases[k];
  const ph = photoObj(cs, champ);
  if (ph && !ph.plein && ph.enIDB && !ph.envoye){ try{ ph.plein = await idbLire(ph.enIDB); }catch(e){} }
  if (!ph || !ph.plein) return;
  const plein = ph.plein;
  const chemin = cheminPhoto(b, k, champ);
  const quoi = estAppoint(champ) ? " appoint " + numeroAppoint(cs, champ) : (champ === "photo2" ? " derrière" : "");
  await ghEcrire(chemin, base64Seul(plein), "Photo " + b.nom + " " + k + quoi);
  if (photoObj(cs, champ) === ph && ph.plein === plein){    // pas remplacée entre-temps
    cachePhotos[cleCache(b, k, champ)] = plein;
    ph.chemin = chemin;
    ph.envoye = true;
    ph.plein = null;                              // libère la mémoire de l'appareil
    sauver(); rendreBiblio();
  }
}

function majSuivi(fait, total, detail){
  const z = $("#suivi");
  z.hidden = false;
  z.innerHTML = `<div><b>Remplissage : ${fait} / ${total}</b> — restants : ${Math.max(0, total - fait)}</div>
    <div class="barreint"><i style="width:${total ? Math.round(fait*100/total) : 0}%"></i></div>
    ${detail ? `<div class="aide">${esc(detail)}</div>` : ""}`;
}
function masquerSuivi(){ const z = $("#suivi"); z.hidden = true; z.innerHTML = ""; }

/* ---------- appareil photo ---------- */
function serieAppareil(b){
  const liste = serie.liste.slice();
  serie.actif = true; serie.encours = liste[0];
  majBarreSel(); majMarquesGrille();
  const inp = $("#entreeSerie");
  const et = { i:0, fichier:null, url:null, statuts:{}, chaine:Promise.resolve(),
               affectees:[], envoyees:0, locales:0, erreurs:[], termine:false };
  liste.forEach(k=>et.statuts[k] = "attente");
  const ICONE = { attente:"", traitement:"⏳", envoi:"⬆️", envoye:"☁️", local:"📱", echec:"⚠️" };

  const f = modale({ titre:"Photos en série",
    html:`<div class="bande" id="aBande"></div><div id="aCible" class="cibleSerie"></div>
          <div id="aZone"></div><div id="aEnvoi" class="aide"></div>`,
    boutons:[{texte:"Terminer", classe:"principal", action:()=>terminer()}],
    surFermeture:()=>terminer() });

  const dessiner = ()=>{
    if (!f.isConnected) return;
    const courant = liste[et.i];
    f.querySelector("#aBande").innerHTML = liste.map(k=>{
      const ph = b.cases[k] && b.cases[k].photo;
      const src = ph ? photoImmediate(b, k) : null;
      const montrer = et.statuts[k] !== "attente" && src;
      return `<div class="vig ${k===courant?"cour":""}" data-v="${k}">
        ${montrer ? `<img src="${src}" alt="">` : "📷"}
        <span class="lib">${lib(k)}</span><span class="st">${ICONE[et.statuts[k]]||""}</span></div>`;
    }).join("");
    const cv = f.querySelector(`[data-v="${courant}"]`);
    if (cv) cv.scrollIntoView({ inline:"center", block:"nearest" });

    f.querySelector("#aCible").innerHTML = courant
      ? `Compartiment <b>${lib(courant)}</b> — traités : ${et.i} / ${liste.length}, restants : ${liste.length - et.i}`
      : `Toutes les photos sont prises.`;

    const z = f.querySelector("#aZone");
    if (!courant){ z.innerHTML = ""; }
    else if (et.fichier){
      z.innerHTML = `<img class="photo-apercu" src="${et.url}" alt="Photo prise">
        <div class="barre"><button class="btn" id="aReprendre" style="flex:1">↺ Reprendre</button>
        <button class="btn principal" id="aUtiliser" style="flex:1">✓ Utiliser</button></div>`;
      z.querySelector("#aReprendre").onclick = ()=>prendre();
      z.querySelector("#aUtiliser").onclick = ()=>utiliser();
    } else {
      z.innerHTML = `<button class="btn principal plein" id="aPrendre">📷 Photographier ${lib(courant)}</button>
        <div class="aide">De face, bien éclairé, tranches lisibles.</div>`;
      z.querySelector("#aPrendre").onclick = ()=>prendre();
    }

    const enCours = liste.filter(k=>["traitement","envoi"].includes(et.statuts[k])).length;
    f.querySelector("#aEnvoi").textContent = ghPret()
      ? `GitHub : ${et.envoyees} photo(s) envoyée(s)${enCours ? `, ${enCours} en cours` : ""}${et.locales ? `, ${et.locales} restée(s) sur l'appareil` : ""}.`
      : `Sans jeton GitHub : les photos restent sur cet appareil.`;
  };

  const prendre = ()=>{
    inp.value = "";
    inp.onchange = ()=>{
      const file = inp.files && inp.files[0];
      inp.value = "";
      if (!file || et.termine) return;
      if (et.url) URL.revokeObjectURL(et.url);
      et.fichier = file; et.url = URL.createObjectURL(file);
      dessiner();
    };
    inp.click();        // directement dans le geste de l'utilisateur (exigence iOS)
  };

  const utiliser = ()=>{
    const k = liste[et.i], file = et.fichier, url = et.url;
    if (!k || !file) return;
    et.fichier = null; et.url = null;
    et.statuts[k] = "traitement";
    et.i++;
    const suivant = liste[et.i];
    serie.encours = suivant || null; majMarquesGrille();
    dessiner();
    if (suivant) prendre();               // enchaîne sur le compartiment suivant
    et.chaine = et.chaine.then(async ()=>{
      try{
        await affecterPhoto(b, k, file);
        et.affectees.push(k);
      }catch(e){
        et.statuts[k] = "echec"; et.erreurs.push(lib(k) + " : " + e.message);
        URL.revokeObjectURL(url); dessiner(); rafraichirSuivi(); return;
      }
      URL.revokeObjectURL(url);
      if (ghPret()){
        et.statuts[k] = "envoi"; dessiner();
        try{ await televerserPhoto(b, k); et.statuts[k] = "envoye"; et.envoyees++; }
        catch(e){ et.statuts[k] = "local"; et.locales++; et.erreurs.push(lib(k) + " (envoi) : " + e.message); }
      } else { et.statuts[k] = "local"; et.locales++; }
      dessiner(); rafraichirSuivi();
    });
    if (!suivant) terminer();
  };

  const rafraichirSuivi = ()=>{
    if (!et.termine) return;
    const n = liste.filter(k=>et.statuts[k] !== "attente").length;
    const faits = liste.filter(k=>["envoye","local","echec"].includes(et.statuts[k])).length;
    majSuivi(faits, n, "Envoi des dernières photos…");
  };

  const terminer = async ()=>{
    if (et.termine) return;
    et.termine = true;
    if (et.url) URL.revokeObjectURL(et.url);
    et.fichier = null; et.url = null;
    if (f.isConnected) f.remove();
    serie.encours = null; majMarquesGrille();
    rafraichirSuivi();
    await et.chaine;
    masquerSuivi();
    bilanSerie(b, et.affectees, et.envoyees, et.locales, et.erreurs, et.i < liste.length);
  };

  dessiner();
  prendre();            // ouvre l'appareil tout de suite pour le premier compartiment
}

/* La liste des livres (même contenu que « Voir ») mise en page en PDF */
async function pdfListe(b, o){
  if (!compteLivres(b)){ toast("Aucun livre relevé : analysez d'abord des photos."); return; }
  try{
    const jsPDF = await chargerJsPDF();
    const doc = new jsPDF({ unit:"mm", format:"a4" });
    const MG = 16, LARG = 210 - MG*2, BAS = 297 - MG;
    let y = MG;
    const saut = (h)=>{ if (y + h > BAS){ doc.addPage(); y = MG; } };
    const lignes = texteListe(b, o).split("\n");
    lignes.forEach((l, i)=>{
      if (i === 0){                                    // titre
        doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(0);
        const t = doc.splitTextToSize(l.replace(/^BIBLIOTHÈQUE : /, ""), LARG);
        doc.text(t, MG, y + 4); y += t.length*7 + 2; return;
      }
      if (i === 1){                                    // date
        doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(110);
        doc.text(l, MG, y); y += 3; doc.setDrawColor(190); doc.line(MG, y, MG+LARG, y); y += 6; return;
      }
      if (!l.trim()){ y += 2; return; }
      if (/^═══/.test(l)){                             // grande section
        const t = l.replace(/═/g, "").trim();
        saut(16); y += 3;
        doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(0);
        doc.text(t, MG, y); y += 2; doc.setDrawColor(120); doc.line(MG, y, MG+LARG, y); y += 6; return;
      }
      if (/^— Rangée/.test(l)){                        // compartiment
        saut(12);
        doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(120, 90, 20);
        const t = doc.splitTextToSize(l.replace(/^— /, ""), LARG);
        doc.text(t, MG, y); y += t.length*4.8 + 1; doc.setTextColor(0); return;
      }
      if (/^\s{5}\S/.test(l) && !/^\s{3}\d+\./.test(l)){  // résumé
        doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(95);
        const t = doc.splitTextToSize(l.trim(), LARG - 12);
        saut(t.length*4);
        doc.text(t, MG + 12, y); y += t.length*4 + 1; doc.setTextColor(0); return;
      }
      const retrait = /^\s+/.test(l) ? 5 : 0;           // livre
      doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(l.trim() === "(vide)" ? 140 : 0);
      const t = doc.splitTextToSize(l.trim(), LARG - retrait);
      saut(t.length*4.6);
      doc.text(t, MG + retrait, y); y += t.length*4.6; doc.setTextColor(0);
    });
    const n = doc.getNumberOfPages();
    for (let p=1; p<=n; p++){
      doc.setPage(p);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140);
      doc.text(b.nom + " — liste des livres — page " + p + " / " + n, 105, 290, {align:"center"});
    }
    const nom = "liste-" + b.nom.replace(/[^\w\-]+/g,"_") + "-" + new Date().toISOString().slice(0,10) + ".pdf";
    proposerPdf(doc.output("blob"), nom, "Liste des livres en PDF", `PDF prêt : ${compteLivres(b)} livre(s), ${n} page(s).`);
  }catch(e){
    modale({titre:"PDF impossible", html:`<div class="aide">${esc(e.message)}</div>`, boutons:[{texte:"Fermer"}]});
  }
}

function ligneLivre(lv, o, empl){
  let s = lv.titre;
  if (o.auteur && lv.auteur) s += " — " + lv.auteur;
  if (o.annee && lv.annee) s += " (" + lv.annee + ")";
  if (o.emplacement && empl) s += "  [R" + empl.r + "C" + empl.c + (lv.rang === "derriere" ? ", derrière" : "") + "]";
  if (o.emplacement && !empl && lv.rang === "derriere") s += "  [derrière]";
  if (lv.certitude === "faible") s += "  (lecture incertaine)";
  if (o.resume && lv.resume) s += "\n     " + lv.resume;
  return s;
}

function texteListe(b, o){
  const L = [];
  L.push("BIBLIOTHÈQUE : " + b.nom + (b.lieu ? " (" + b.lieu + ")" : ""));
  L.push("Généré le " + dateFr());
  L.push("");
  L.push("═══ LIVRES PAR COMPARTIMENT ═══");
  L.push("");
  const parcourir = (r,c,horsGrille)=>{
    const cs = b.cases[clef(r,c)];
    if (!cs) return;
    const l = cs.livres || [];
    L.push("— Rangée " + r + " · compartiment " + c + (horsGrille ? " (hors grille)" : "") +
           " — " + l.length + " livre(s)" + (cs.photo2 ? " — deux rangs" : "") + (cs.photo || cs.photo2 ? "" : " — pas de photo"));
    if (!l.length) L.push("   (vide)");
    l.forEach((lv,i)=>L.push("   " + (i+1) + ". " + ligneLivre(lv, o, null)));
    L.push("");
  };
  for (let r=1; r<=b.rangees; r++) for (let c=1; c<=b.compartiments; c++) parcourir(r,c,false);
  Object.keys(b.cases||{}).forEach(k=>{
    const [r,c] = k.split("-").map(Number);
    if (r>b.rangees || c>b.compartiments) parcourir(r,c,true);
  });

  const tri = tousLesLivres(b).slice().sort((a,z)=>
    (a.livre.titre||"").localeCompare(z.livre.titre||"", "fr", {sensitivity:"base"}));
  const distincts = new Set(tri.map(x=>(x.livre.titre||"").toLowerCase().trim()+"|"+(x.livre.auteur||"").toLowerCase().trim()));
  L.push("═══ LISTE EXHAUSTIVE — " + tri.length + " livre(s), " + distincts.size + " titre(s) distinct(s) ═══");
  L.push("");
  tri.forEach((x,i)=>L.push((o.numeroter ? (i+1) + ". " : "• ") + ligneLivre(x.livre, o, {r:x.r,c:x.c})));
  return L.join("\n");
}

async function lancerResumes(b){
  const tous = tousLesLivres(b).map(x=>x.livre);
  if (!tous.length){ toast("Aucun livre relevé : analysez d'abord des photos."); return; }
  const manquants = tous.filter(lv=>!lv.resume);
  const incomplets = tous.filter(lv=>!lv.resume || !lv.auteur);
  const boutons = [{texte:"Annuler", action:()=>null}];
  boutons.push({texte:`Tous (${tous.length})`, action:()=>"tous"});
  if (incomplets.length > manquants.length)
    boutons.push({texte:`Sans résumé ou sans auteur (${incomplets.length})`, action:()=>"incomplets"});
  if (manquants.length)
    boutons.push({texte:`Les ${manquants.length} sans résumé`, classe:"principal", action:()=>"manquants"});
  const choix = await new Promise(res=>{
    modale({ titre:"Résumés et auteurs",
      html:`<div>${tous.length} livre(s) dans cette bibliothèque : ${tous.length - manquants.length} ont déjà un résumé, ${manquants.length} n'en ont pas${incomplets.length > manquants.length ? `, et ${incomplets.length - manquants.length} ont un résumé mais pas d'auteur` : ""}.</div>
            <div class="aide">Gemini renvoie un résumé d'une ligne, l'auteur complet avec une précision brève et l'année de première parution. Traitement par lots de 20, avec décompte.</div>
            ${!manquants.length ? `<div class="aide">✅ Tous les livres ont déjà un résumé.</div>` : ""}`,
      boutons: boutons.map(x=>({ texte:x.texte, classe:x.classe, action:()=>res(x.action()) })),
      surFermeture:()=>res(null)});
  });
  if (!choix) return;
  const liste = choix === "tous" ? tous : choix === "incomplets" ? incomplets : manquants;
  if (!liste.length) return;

  // garde-fou : ne pas redemander par accident ce qui a déjà été obtenu (Gemini est souvent saturé)
  const deja = liste.filter(lv=>lv.resume);
  if (deja.length){
    const pct = Math.round(deja.length * 100 / liste.length);
    const ok = await confirmer(
      `<div><b>${deja.length} livre(s) sur ${liste.length} (${pct} %) ont déjà un résumé.</b></div>
       <div class="aide">Les redemander refera ${Math.ceil(liste.length / 20)} requête(s) à Gemini au lieu de ${Math.ceil((liste.length - deja.length) / 20)}, alors que son serveur est souvent saturé, et <b>remplacera</b> les résumés, auteurs et années déjà obtenus par les nouvelles réponses.</div>
       ${liste.length > deja.length ? `<div class="aide">Pour ne traiter que les ${liste.length - deja.length} livre(s) qui en manquent, annulez puis choisissez « sans résumé ».</div>` : ""}`,
      "Redemander des résumés déjà obtenus ?", `Oui, redemander les ${liste.length}`);
    if (!ok) return;
  }

  const ok = await traiterParLots(liste, cfg.qResume, ["resume","auteur","annee"], "Résumés et auteurs", 20);
  rendreBiblio();
  if (ok){
    const avec = liste.filter(lv=>lv.resume).length;
    modale({ titre:"Résumés obtenus",
      html:`<div>${avec} livre(s) sur ${liste.length} ont maintenant un résumé.</div>
            <div class="aide">Ils apparaissent dans chaque compartiment, dans la liste (case « Résumé ») et dans le PDF.</div>`,
      boutons:[{texte:"Fermer"}]});
  }
}

/* ====================================================================
   PDF TRIÉ PAR AUTEUR OU PAR TITRE (avec filtre facultatif)
   ==================================================================== */
function optionsTri(){
  const d = { tri:"auteur", nomFamille:true, choix:"tous", auteurChoisi:"", texteTitre:"", texteAuteur:"", resume:true };
  const o = Object.assign(d, cfg.triOpts || {});
  // reprise des réglages de la V1.22.0 (champFiltre / filtre)
  if (o.filtre && !cfg.triOpts.choix){
    if (o.champFiltre === "auteur"){ o.choix = "auteur"; o.texteAuteur = o.filtre; }
    else { o.choix = "titre"; o.texteTitre = o.filtre; }
  }
  delete o.filtre; delete o.champFiltre;
  return o;
}
function simplifier(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
/* clé de tri d'un auteur : nom de famille (dernier mot, ou partie avant la virgule) ou tel qu'écrit */
function cleAuteur(a, nomFamille){
  const t = String(a||"").trim();
  if (!t) return "";
  if (!nomFamille) return simplifier(t);
  if (t.includes(",")) return simplifier(t);                     // « Hugo, Victor » : déjà nom d'abord
  const premier = t.split(/\s*(?:;|&|\bet\b|\band\b)\s*/i)[0].trim();  // premier auteur seulement
  const mots = premier.replace(/\(.*?\)/g,"").trim().split(/\s+/);
  if (mots.length < 2) return simplifier(premier);
  // particules rattachées au nom : de, du, des, d', van, von, le, la, di, da
  let i = mots.length - 1;
  while (i > 0 && /^(de|du|des|d'|d’|van|von|der|le|la|di|da|del|della)$/i.test(mots[i-1])) i--;
  const nom = mots.slice(i).join(" "), prenom = mots.slice(0, i).join(" ");
  // à la française, « de Balzac » se range à B : on retire de / du / des / d' en tête de la clé
  return simplifier(nom + " " + prenom).replace(/^(de |du |des |d'|d’)/, "");
}
/* auteurs relevés dans la bibliothèque : [{cle, nom, n}] triés sur le nom de famille */
function listeAuteurs(b){
  const m = new Map();
  tousLesLivres(b).forEach(x=>{
    const a = String(x.livre.auteur||"").trim(); if (!a) return;
    const k = cleAuteur(a, true);
    if (!m.has(k)) m.set(k, { cle:k, nom:a, n:0 });
    m.get(k).n++;
  });
  return [...m.values()].sort((x,z)=>x.cle.localeCompare(z.cle,"fr",{sensitivity:"base"}));
}
function livresFiltres(b, o){
  const tous = tousLesLivres(b).map(x=>x.livre);
  if (o.choix === "unAuteur"){
    if (!o.auteurChoisi) return [];
    return tous.filter(lv=>lv.auteur && cleAuteur(lv.auteur, true) === o.auteurChoisi);
  }
  if (o.choix === "titre" || o.choix === "auteur"){
    const f = simplifier(o.choix === "titre" ? o.texteTitre : o.texteAuteur);
    if (!f) return tous;
    return tous.filter(lv=>simplifier(o.choix === "auteur" ? lv.auteur : lv.titre).includes(f));
  }
  return tous;
}
/* description lisible du filtre (vide = tous les livres) */
function descFiltre(b, o){
  if (o.choix === "unAuteur"){
    const a = listeAuteurs(b).find(x=>x.cle === o.auteurChoisi);
    return a ? `livres de ${a.nom}` : "";
  }
  if (o.choix === "titre" && o.texteTitre) return `titre contenant « ${o.texteTitre} »`;
  if (o.choix === "auteur" && o.texteAuteur) return `auteur contenant « ${o.texteAuteur} »`;
  return "";
}

  const radio = (v, lib)=>`<div class="coche"><input type="radio" name="tChoix" id="tC_${v}" value="${v}" ${o.choix===v?"checked":""}><label for="tC_${v}" style="margin:0">${lib}</label></div>`;
  const f = modale({

       <div class="coche" id="tZoneNom" style="margin-left:26px"><input type="checkbox" id="tNom" ${o.nomFamille?"checked":""}><label for="tNom" style="margin:0">Classer sur le nom de famille (« Victor Hugo » rangé à H)</label></div>
       <div class="coche"><input type="radio" name="tTri" id="tTriT" value="titre" ${o.tri==="titre"?"checked":""}><label for="tTriT" style="margin:0">Titre (par lettre ; l'article initial « Le, La, Les, L', Un, Une, Des » est ignoré)</label></div>
       <div class="sep"></div>
       <div class="coche"><input type="checkbox" id="tResume" ${o.resume?"checked":""}><label for="tResume" style="margin:0">Résumés (s'ils existent)</label></div>
       <div class="aide">Emplacements (rg, cl, rang) et schéma : selon la case « Emplacement dans le PDF » de l'écran de la bibliothèque (actuellement ${cfg.pdfEmplacement ? "cochée" : "décochée"}).</div>`,
    boutons:[
      {texte:"Fermer"},
      {texte:"📄 Produire le PDF", classe:"principal", garder:true, action:()=>{
        const op = lire(); cfg.triOpts = op; sauverCfg();
        if (!livresFiltres(b, op).length){ toast("Aucun livre ne correspond à ce choix."); return false; }
        pdfTrie(b, op);
      }}
    ]
  });
  const lire = ()=>({
    choix: (f.querySelector('input[name="tChoix"]:checked')||{}).value || "tous",
    auteurChoisi: f.querySelector("#tAuteur").value,
    texteTitre: f.querySelector("#tTexteTitre").value.trim(),
    texteAuteur: f.querySelector("#tTexteAuteur").value.trim(),
    tri: f.querySelector("#tTriT").checked ? "titre" : "auteur",
    nomFamille: f.querySelector("#tNom").checked,
    resume: f.querySelector("#tResume").checked
  });
  const griser = (el, actif)=>{ el.style.opacity = actif ? "" : ".45"; el.style.pointerEvents = actif ? "" : "none"; };
  const maj = ()=>{
    const op = lire(); cfg.triOpts = op; sauverCfg();
    ["unAuteur","titre","auteur"].forEach(v=>griser(f.querySelector("#tZ_" + v), op.choix === v));
    griser(f.querySelector("#tZoneNom"), op.tri === "auteur");
    const n = livresFiltres(b, op).length, total = compteLivres(b), d = descFiltre(b, op);
    f.querySelector("#tCompte").textContent = d ? `→ ${n} livre(s) sur ${total} : ${d}.` : `→ les ${total} livres.`;
  };
  // toucher un champ sélectionne automatiquement l'option correspondante
  const choisir = (v)=>{ f.querySelector("#tC_" + v).checked = true; maj(); };
  f.querySelectorAll('input[name="tChoix"], input[name="tTri"], #tNom, #tResume').forEach(el=>el.onchange = maj);
  f.querySelector("#tAuteur").onchange = ()=>choisir("unAuteur");
  f.querySelector("#tTexteTitre").oninput = ()=>choisir("titre");
  f.querySelector("#tTexteAuteur").oninput = ()=>choisir("auteur");
  f.querySelector("#tZ_unAuteur").onclick = ()=>{ if (lire().choix !== "unAuteur") choisir("unAuteur"); };
  f.querySelector("#tZ_titre").onclick = ()=>{ if (lire().choix !== "titre"){ choisir("titre"); f.querySelector("#tTexteTitre").focus(); } };
  f.querySelector("#tZ_auteur").onclick = ()=>{ if (lire().choix !== "auteur"){ choisir("auteur"); f.querySelector("#tTexteAuteur").focus(); } };
  maj();
}
async function pdfTrie(b, o){
  const livres = livresFiltres(b, o);
  try{
    const jsPDF = await chargerJsPDF();
    const blob = construirePdf(jsPDF, b, livres, o);
    const d = descFiltre(b, o);
    const suffixe = o.choix === "unAuteur" && d ? "-" + d.replace(/^livres de /,"").replace(/[^\w\-]+/g,"_") : (d ? "-filtre" : "");
    const nom = "tri-" + (o.tri === "titre" ? "titre" : "auteur") + suffixe + "-" + b.nom.replace(/[^\w\-]+/g,"_") + "-" + new Date().toISOString().slice(0,10) + ".pdf";
    proposerPdf(blob, nom, "PDF trié par " + (o.tri === "titre" ? "titre" : "auteur"),
      `PDF prêt : ${livres.length} livre(s)${d ? " — " + esc(d) : ""}.`);
  }catch(e){
    modale({titre:"PDF impossible", html:`<div class="aide">${esc(e.message)}</div>`, boutons:[{texte:"Fermer"}]});
  }
}

/* PDF par catégories (mode absent) ou trié par auteur / titre (mode = options de tri) */
function construirePdf(jsPDF, b, livres, mode){
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const MG = 18, LARG = 210 - MG*2;
  let y = MG;
  const groupes = {};
  const INCONNU = mode ? (mode.tri === "titre" ? "Sans titre" : "Auteur inconnu") : "Non classé";
  const cleTitre = (lv)=> normaliser(lv.titre);
  // clé de groupe et clé de tri des groupes
  const cleGroupe = {};
  livres.forEach(lv=>{
    let g, k;
    if (!mode){ g = (lv.categorie || "").trim() || INCONNU; k = g.toLowerCase(); }
    else if (mode.tri === "auteur"){
      k = cleAuteur(lv.auteur, mode.nomFamille);
      g = k ? String(lv.auteur).trim() : INCONNU;
      // un même auteur écrit de façons légèrement différentes (casse, accents) reste groupé
      g = Object.keys(groupes).find(x=>x !== INCONNU && cleAuteur(x, mode.nomFamille) === k) || g;
    } else {
      const t = cleTitre(lv);
      g = t ? (/^[a-z]/.test(t) ? t[0].toUpperCase() : "0-9 / autres") : INCONNU;
      k = g === "0-9 / autres" ? " " : g.toLowerCase();
    }
    (groupes[g] = groupes[g] || []).push(lv);
    cleGroupe[g] = k;
  });
  const cats = Object.keys(groupes).sort((a,z)=>{
    if (a === INCONNU) return 1;
    if (z === INCONNU) return -1;
    return (cleGroupe[a]||"").localeCompare(cleGroupe[z]||"", "fr", {sensitivity:"base"});
  });
  const saut = (h)=>{ if (y + h > 297 - MG){ doc.addPage(); y = MG; } };
  // emplacement de chaque livre (rangée, colonne), si la case est cochée
  const avecEmpl = !!cfg.pdfEmplacement;
  const basHaut = avecEmpl && !!cfg.pdfRangsBasHaut;
  const empl = new Map();
  if (avecEmpl) tousLesLivres(b).forEach(x=>empl.set(x.livre, x));
  // numéro de rangée tel qu'il est écrit dans le PDF (les compartiments hors grille gardent leur numéro)
  const rgPdf = (r)=> (basHaut && r <= b.rangees) ? b.rangees - r + 1 : r;
  const RAPPEL = `Numérotation des emplacements (rg: rangée, cl: colonne, rang) : rangées numérotées de ${basHaut ? "bas en haut (1 = rangée du bas)" : "haut en bas (1 = rangée du haut)"}, colonnes de gauche à droite (1 = colonne de gauche) ; dernier chiffre : 1 = rang de devant (1re photo), 2 = rang de derrière (2e photo).`;
  const encadre = (texte)=>{
    doc.setFont("helvetica","italic"); doc.setFontSize(9.5);
    const lt = doc.splitTextToSize(texte, LARG - 6);
    const h = lt.length*4.3 + 4;
    saut(h + 2);
    doc.setDrawColor(170); doc.setFillColor(244, 241, 232);
    doc.rect(MG, y, LARG, h, "FD");
    doc.setTextColor(60); doc.text(lt, MG + 3, y + 4.6);
    doc.setTextColor(0);
    y += h + 5;
  };

  doc.setFont("helvetica","bold"); doc.setFontSize(20);
  doc.text(b.nom, MG, y); y += 9;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110);
  const sousTitre = !mode ? `${livres.length} livres, ${cats.length} catégories`
    : mode.tri === "auteur" ? `${livres.length} livres triés par auteur (${cats.filter(c=>c!==INCONNU).length} auteurs${mode.nomFamille ? ", classés sur le nom de famille" : ""})`
    : `${livres.length} livres triés par titre`;
  doc.text(`${sousTitre}${b.lieu ? " — " + b.lieu : ""} — ${new Date().toLocaleDateString("fr-FR")}`, MG, y);
  const filtrePdf = mode ? descFiltre(b, mode) : "";
  if (filtrePdf){
    y += 5;
    doc.text(`Sélection : ${filtrePdf}`, MG, y);
  }
  y += 4; doc.setDrawColor(190); doc.line(MG, y, MG+LARG, y); y += 7;
  doc.setTextColor(0);

  if (avecEmpl){
    encadre(RAPPEL);
    // schéma de la bibliothèque : une cellule par compartiment, avec ses numéros
    const R = b.rangees, C = b.compartiments;
    const ratio = ratioBiblio(b);                 // hauteur / largeur d'un compartiment
    const HMAX = 110;
    let cw = LARG / C, ch = cw * ratio;
    if (ch * R > HMAX){ ch = HMAX / R; cw = ch / ratio; }
    const lg = cw * C, x0 = MG + (LARG - lg) / 2;
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
    doc.text("Plan de la bibliothèque", MG, y); y += 3;
    saut(ch * R + 8);
    const y0 = y;
    doc.setDrawColor(90); doc.setLineWidth(0.6);
    doc.rect(x0, y0, lg, ch * R);
    doc.setLineWidth(0.25);
    const fs = Math.max(5, Math.min(10, cw * 0.9, ch * 1.6));
    for (let r = 1; r <= R; r++){
      for (let c = 1; c <= C; c++){
        const cx = x0 + (c - 1) * cw, cy = y0 + (r - 1) * ch;
        const cs = (b.cases||{})[clef(r, c)];
        const nb = cs ? (cs.livres||[]).length : 0;
        doc.setFillColor(nb ? 250 : 238, nb ? 247 : 238, nb ? 238 : 238);
        doc.rect(cx, cy, cw, ch, "FD");
        doc.setFont("helvetica","bold"); doc.setFontSize(fs); doc.setTextColor(30);
        const deux = ch > fs * 0.9;               // assez de hauteur pour deux lignes ?
        if (deux){
          doc.text(`rg ${rgPdf(r)}`, cx + cw/2, cy + ch/2 - fs*0.12, { align:"center" });
          doc.text(`cl ${c}`, cx + cw/2, cy + ch/2 + fs*0.3, { align:"center" });
        } else {
          doc.text(`${rgPdf(r)}·${c}`, cx + cw/2, cy + ch/2 + fs*0.12, { align:"center" });
        }
        if (nb && ch > fs * 1.4){
          doc.setFont("helvetica","normal"); doc.setFontSize(Math.max(4.5, fs * 0.6)); doc.setTextColor(120);
          doc.text(`${nb} livre${nb > 1 ? "s" : ""}`, cx + cw/2, cy + ch - 1.6, { align:"center" });
        }
      }
    }
    doc.setTextColor(0);
    y = y0 + ch * R + 5;
    const hors = Object.keys(b.cases||{}).filter(k=>{ const [r,c] = k.split("-").map(Number); return r > R || c > C; });
    if (hors.length){
      doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(110);
      const lh = doc.splitTextToSize(`Compartiments hors grille (numérotés comme à l'écran) : ${hors.map(nomCaseCourt).join(", ")}.`, LARG);
      doc.text(lh, MG, y); y += lh.length*4 + 2; doc.setTextColor(0);
    }
    doc.setDrawColor(190); doc.line(MG, y, MG+LARG, y); y += 8;
  }

  cats.forEach(cat=>{
    const l = groupes[cat].slice().sort((x,z)=>{
      if (mode && mode.tri === "titre"){
        const d = cleTitre(x).localeCompare(cleTitre(z),"fr",{sensitivity:"base"});
        return d !== 0 ? d : (x.auteur||"").localeCompare(z.auteur||"","fr",{sensitivity:"base"});
      }
      if (mode && mode.tri === "auteur")
        return cleTitre(x).localeCompare(cleTitre(z),"fr",{sensitivity:"base"});
      const d = (x.auteur||"zzz").localeCompare(z.auteur||"zzz","fr",{sensitivity:"base"});
      return d !== 0 ? d : (x.titre||"").localeCompare(z.titre||"","fr",{sensitivity:"base"});
    });
    saut(16);
    doc.setFont("helvetica","bold"); doc.setFontSize(13);
    doc.text(cat + "  (" + l.length + ")", MG, y); y += 2;
    doc.setDrawColor(150); doc.line(MG, y, MG+LARG, y); y += 6;
    l.forEach(lv=>{
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
      let entete = lv.titre || "(sans titre)";
      if (lv.auteur && !(mode && mode.tri === "auteur" && cat !== INCONNU)) entete += " — " + lv.auteur;
      if (lv.annee) entete += " (" + lv.annee + ")";
      const e = empl.get(lv);
      if (e) entete += " (rg: " + rgPdf(e.r) + ", cl: " + e.c + ", " + (lv.rang === "derriere" ? 2 : 1) + ")";
      const lignes = doc.splitTextToSize(entete, LARG);
      const avecResume = lv.resume && (!mode || mode.resume);
      saut(lignes.length*5 + (avecResume?6:0) + 2);
      doc.text(lignes, MG, y); y += lignes.length*5;
      if (avecResume){
        doc.setFont("helvetica","italic"); doc.setFontSize(9.5); doc.setTextColor(95);
        const lr = doc.splitTextToSize(lv.resume, LARG - 4);
        saut(lr.length*4.4 + 2);
        doc.text(lr, MG+4, y); y += lr.length*4.4;
        doc.setTextColor(0);
      }
      y += 2.5;
    });
    y += 4;
  });
  if (avecEmpl){ y += 2; encadre("Rappel — " + RAPPEL); }

  const n = doc.getNumberOfPages();
  for (let p=1; p<=n; p++){
    doc.setPage(p);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(b.nom + " — page " + p + " / " + n, 105, 290, {align:"center"});
  }
  return doc.output("blob");
}
