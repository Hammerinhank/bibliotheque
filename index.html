/* ====== FUSION DE DEUX LECTURES D'UNE MÊME RANGÉE (livres dans le même ordre) ====== */

/* Aligne deux listes ordonnées (ancienne A, nouvelle B) en respectant l'ordre, en maximisant la ressemblance.
   Renvoie des étapes : {type:"paire", a, b, sur, raison} | {type:"ancien", a} | {type:"nouveau", b} */
function alignerListes(A, B){
  const sc = (a, b)=>{
    const t = simTitre(a.titre, b.titre), au = simAuteur(a.auteur, b.auteur);
    if (!(t >= 0.5 || (au !== null && au >= 0.8 && t >= 0.3))) return null;
    return { s: t + (au === null ? 0 : 0.3 * au), t, au };
  };
  const n = A.length, m = B.length;
  const S = Array.from({length:n+1}, ()=>new Float64Array(m+1));
  const memo = Array.from({length:n}, ()=>new Array(m));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++){
    let v = Math.max(S[i-1][j], S[i][j-1]);
    const x = memo[i-1][j-1] = sc(A[i-1], B[j-1]);
    if (x) v = Math.max(v, S[i-1][j-1] + x.s);
    S[i][j] = v;
  }
  // remontée
  const etapes = [];
  let i = n, j = m;
  while (i > 0 || j > 0){
    const x = i > 0 && j > 0 ? memo[i-1][j-1] : null;
    if (x && Math.abs(S[i][j] - (S[i-1][j-1] + x.s)) < 1e-9){
      etapes.push({ type:"paire", a:A[i-1], b:B[j-1], sur: memeLivreSur(x.t, x.au),
        raison: x.t >= 0.85 ? "auteur différent" : "titre approchant" + (x.au !== null && x.au >= 0.8 ? ", même auteur" : "") });
      i--; j--;
    } else if (i > 0 && (j === 0 || S[i][j] === S[i-1][j])){ etapes.push({ type:"ancien", a:A[i-1] }); i--; }
    else { etapes.push({ type:"nouveau", b:B[j-1] }); j--; }
  }
  etapes.reverse();
  // entre deux livres appariés, autant de livres « seulement anciens » que « seulement nouveaux » : même place, donc sans doute les mêmes livres mal lus
  const out = [];
  let k = 0;
  while (k < etapes.length){
    if (etapes[k].type === "paire"){ out.push(etapes[k]); k++; continue; }
    let f = k; while (f < etapes.length && etapes[f].type !== "paire") f++;
    const trou = etapes.slice(k, f);
    const anc = trou.filter(e=>e.type === "ancien"), nou = trou.filter(e=>e.type === "nouveau");
    const encadre = k > 0 && f < etapes.length;
    if (anc.length && anc.length === nou.length && anc.length <= 3 && encadre)
      anc.forEach((e, x)=>out.push({ type:"paire", a:e.a, b:nou[x].b, sur:false, parPlace:true, raison:"même place entre deux livres reconnus, titres différents" }));
    else {
      // ordre : anciens puis nouveaux (à la même place)
      anc.forEach(e=>out.push(e)); nou.forEach(e=>out.push(e));
    }
    k = f;
  }
  // livres qui semblent avoir changé de place (présents des deux côtés, mais hors alignement)
  const seulsA = out.filter(e=>e.type === "ancien"), seulsB = out.filter(e=>e.type === "nouveau");
  seulsA.forEach(e=>{ const d = seulsB.find(x=>simTitre(x.b.titre, e.a.titre) >= 0.85); if (d){ e.deplace = d.b; d.deplace = e.a; } });
  return out;
}

/* Fenêtre de fusion générique : une ligne par livre, dans l'ordre, avec les choix à faire et une poignée ≡
   pour corriger l'ordre de deux livres voisins (glisser-déposer).
   blocs : [{ r, etapes, entete (html), avant:[livres hors zone avant], apres:[livres hors zone après] }]
   surValider(resultatParRang, bilan) reçoit la liste complète de chaque rangée concernée. */
function fenetreFusionGenerique(opts){
  const { titre, intro, blocs, surValider, surAnnuler, texteValider } = opts;
  blocs.forEach(bl=>bl.etapes.forEach(e=>{
    if (e.type === "paire"){ e.choix = "meme"; e.titreDe = e.parPlace ? "nouveau" : "ancien"; }
    else if (e.type === "ancien") e.choix = e.deplace ? "retirer" : "garder";
    else e.choix = "ajouter";
  }));
  const titresDiff = (e)=> e.type === "paire" && normaliser(e.a.titre) !== normaliser(e.b.titre);
  const aut = (lv)=> lv.auteur ? ` <span style="opacity:.75">— ${esc(lv.auteur)}</span>` : "";
  const boutons = (id, liste, v)=>`<div class="onglets" style="margin:6px 0 0" data-f="${id}">${liste.map(([val, lib])=>
      `<button data-v="${val}" class="${v===val?"actif":""}">${lib}</button>`).join("")}</div>`;
  const nomNouveau = opts.nomNouveau || "nouvelle photo";
  const ligne = (e, id)=>{
    let h = "";
    if (e.type === "paire" && e.sur){
      h += `<span style="color:var(--vert)">✅</span> <b>${esc(e.a.titre)}</b>${aut(e.a)}`;
      if (titresDiff(e)) h += `<div class="aide" style="margin:2px 0 0">Lecture de la ${nomNouveau} : « ${esc(e.b.titre)} »</div>` + boutons(id + "t", [["ancien","Garder le titre actuel"],["nouveau","Prendre la nouvelle lecture"]], e.titreDe);
    } else if (e.type === "paire"){
      h += `<span style="color:var(--orange)">🟡 à confirmer</span> — ${esc(e.raison)}
        <div style="margin:3px 0 0">Liste actuelle : <b>${esc(e.a.titre)}</b>${aut(e.a)}</div>
        <div>${nomNouveau[0].toUpperCase() + nomNouveau.slice(1)} : <b>${esc(e.b.titre)}</b>${aut(e.b)}</div>` +
        boutons(id, [["meme","Même livre"],["deux","Deux livres différents"]], e.choix) +
        `<div data-ft="${id}" ${e.choix === "meme" ? "" : "hidden"}>${boutons(id + "t", [["ancien","Titre actuel"],["nouveau","Titre de la " + nomNouveau]], e.titreDe)}</div>`;
    } else if (e.type === "ancien"){
      h += `<span style="color:var(--orange)">📕 absent de la ${nomNouveau}</span> : <b>${esc(e.a.titre)}</b>${aut(e.a)}` +
        (e.deplace ? `<div class="aide" style="margin:2px 0 0">⚠️ semble avoir changé de place (retrouvé plus loin) : retiré ici par défaut.</div>` : "") +
        boutons(id, [["garder","Garder"],["retirer","Retirer"]], e.choix);
    } else {
      h += `<span style="color:var(--bronze)">🆕 absent de la liste actuelle</span> : <b>${esc(e.b.titre)}</b>${aut(e.b)}` +
        (e.deplace ? `<div class="aide" style="margin:2px 0 0">⚠️ c'est sans doute « ${esc(e.deplace.titre)} », déplacé : ajouté ici par défaut.</div>` : "") +
        boutons(id, [["ajouter","Ajouter"],["ignorer","Ignorer"]], e.choix);
    }
    return `<div class="livre deplacable" data-idx="${id.split("_")[1]}"><div class="poigneeGlisser" title="Maintenir et glisser pour corriger l'ordre"><span><i></i><i></i><i></i><i></i></span></div>${h}</div>`;
  };
  const compte = (bl, f)=>bl.etapes.filter(f).length;
  const hors = (l, ou)=> l.length ? `<div class="aide" style="margin:4px 0">${ou} : ${l.length} livre(s) hors de la zone photographiée, inchangé(s) (${l.slice(0,2).map(x=>"« "+esc(x.titre)+" »").join(", ")}${l.length > 2 ? "…" : ""}).</div>` : "";
  const html = blocs.map((bl, nb)=>{
    const s = compte(bl, e=>e.type === "paire" && e.sur), p = compte(bl, e=>e.type === "paire" && !e.sur),
          a = compte(bl, e=>e.type === "ancien"), n = compte(bl, e=>e.type === "nouveau"),
          dep = compte(bl, e=>e.type === "ancien" && e.deplace);
    return `<div class="titreSection" style="margin-top:${nb ? 16 : 4}px">${bl.entete}</div>
      <div class="aide" style="margin:-4px 0 6px"><b>${s}</b> identique(s), <b>${p}</b> à confirmer, <b>${a}</b> seulement dans la liste, <b>${n}</b> seulement sur la ${nomNouveau}.</div>
      ${dep ? `<div class="encadre">⚠️ <b>Ordre différent</b> : ${dep} livre(s) semblent avoir changé de place. Si les livres ont été réorganisés, il vaut mieux vider les listes et repartir de zéro.</div>` : ""}
      ${(s + p) && (a + n) >= 4 && (s + p) < 0.3 * Math.min(s + p + a, s + p + n) ? `<div class="encadre">⚠️ <b>Peu de livres en commun</b> (${s + p}) : la photo correspond peut-être à un autre compartiment ou à l'autre rangée.</div>` : ""}
      ${hors(bl.avant || [], "Avant")}
      <div data-bloc="${nb}">${bl.etapes.map((e, x)=>ligne(e, nb + "_" + x)).join("")}</div>
      ${hors(bl.apres || [], "Après")}`;
  }).join("");

  const f = modale({
    titre,
    html:`${intro}
          <div class="aide">Les choix par défaut sont déjà sélectionnés : vérifiez surtout les lignes 🟡, 📕 et 🆕. Si deux livres voisins sont dans le mauvais ordre, faites glisser l'un d'eux avec sa poignée ≡. Résumés, catégories et renseignements déjà obtenus sont conservés.</div>
          ${html}`,
    boutons:[
      {texte:"Retour", action:()=>{ if (surAnnuler) surAnnuler(); }},
      {texte: texteValider || "Valider la fusion", classe:"principal", action:(fd)=>{
        const res = {}; let aj = 0, re = 0, co = 0; const vus = [];
        blocs.forEach((bl, nb)=>{
          const ordre = [...fd.querySelectorAll(`[data-bloc="${nb}"] > .livre`)].map(x=>Number(x.dataset.idx));
          const l = [];
          ordre.forEach(x=>{
            const e = bl.etapes[x];
            if (e.type === "paire"){
              if (e.choix === "deux"){ l.push(e.a, e.b); aj++; vus.push(e.b); return; }
              const lv = e.a;
              if (e.titreDe === "nouveau" && titresDiff(e)){ lv.titre = e.b.titre; if (e.b.auteur) lv.auteur = e.b.auteur; co++; }
              ["auteur","annee"].forEach(c=>{ if (!lv[c] && e.b[c]) lv[c] = e.b[c]; });
              l.push(lv); vus.push(lv);
            } else if (e.type === "ancien"){ if (e.choix === "garder") l.push(e.a); else re++; }
            else if (e.choix === "ajouter"){ l.push(e.b); aj++; vus.push(e.b); }
          });
          res[bl.r] = (bl.avant || []).concat(l, bl.apres || []);
        });
        surValider(res, { aj, re, co, vus });
      }}
    ],
    surFermeture:()=>{ if (surAnnuler) surAnnuler(); }
  });
  f.querySelectorAll("[data-f]").forEach(z=>{
    const id = z.dataset.f, estTitre = id.endsWith("t");
    const [nb, x] = (estTitre ? id.slice(0, -1) : id).split("_").map(Number);
    const e = blocs[nb].etapes[x];
    z.querySelectorAll("button").forEach(bt=>bt.onclick = (ev)=>{
      ev.preventDefault();
      if (estTitre) e.titreDe = bt.dataset.v; else e.choix = bt.dataset.v;
      z.querySelectorAll("button").forEach(y=>y.classList.toggle("actif", y === bt));
      if (!estTitre){ const ft = f.querySelector(`[data-ft="${id}"]`); if (ft) ft.hidden = e.choix !== "meme"; }
    });
  });
  f.querySelectorAll("[data-bloc]").forEach(z=>glisserListe(z));
  return f;
}

/* Fusion de deux lectures complètes d'une même rangée (nouvelle analyse). */
function fenetreFusion(k, rangs, parRang, surValider, introSupp, cs){
  const NOMR = { devant:"Rangée 1 (devant)", derriere:"Rangée 2 (derrière)" };
  return fusionConvergente({
    b: biblioDeCase(cs), k, cs,
    temoin:(r)=>temoinRang(cs, r),
    nomSource: rangs.length > 1 ? "les nouvelles photos" : (rangs[0] === "derriere" ? "la photo de derrière" : "la photo de devant"),
    titre:"Nouvelle analyse — " + lib(k),
    intro:`<div>Cette rangée avait déjà une liste. Les livres étant rangés dans le même ordre d'une photo à l'autre, la nouvelle lecture est alignée sur la liste actuelle : les livres reconnus sans ambiguïté servent de repères pour situer les autres.</div>${introSupp || ""}`,
    blocs: rangs.map(r=>({ r, etapes: alignerListes(parRang[r].vieux, parRang[r].neufs),
      entete:`${NOMR[r]} — liste actuelle : ${parRang[r].vieux.length}, nouvelle photo : ${parRang[r].neufs.length}` })),

  });
}

/* Vérification d'une photo d'appoint en supposant l'ordre respecté : l'appoint ne couvre qu'une partie de la rangée ;
   on repère la zone correspondante de la liste, puis on aligne livre par livre à l'intérieur de cette zone. */
function preparerFusionAppoint(cs, lus, rangForce, champAppoint){
  const rangDe = (lv)=> lv.rang === "derriere" ? "derriere" : "devant";
  const livresLus = lus.filter(x=>!x.illisible).map(x=>({ id:uid(), titre:x.titre || "(titre non lu)", auteur:x.auteur,
    annee:/^\d{4}$/.test(x.annee) ? x.annee : "", certitude:x.certitude, remarque:"", resume:"", categorie:"", origine:"appoint",
    ...(x.x1 != null ? { vues:[{ champ: champAppoint || "", x1:x.x1, x2:x.x2 }] } : {}) }));
  const essai = (r)=>{
    const liste = (cs.livres||[]).filter(lv=>rangDe(lv) === r);
    const et = alignerListes(liste, livresLus);
    const iP = et.findIndex(e=>e.type === "paire"), jP = et.length - 1 - [...et].reverse().findIndex(e=>e.type === "paire");
    if (iP < 0) return { r, etapes: et.filter(e=>e.type === "nouveau"), avant: liste, apres: [], sur: 0, paires: 0 };
    const avant = et.slice(0, iP).filter(e=>e.type === "ancien").map(e=>e.a);
    const apres = et.slice(jP + 1).filter(e=>e.type === "ancien").map(e=>e.a);
    const etapes = et.slice(0, iP).filter(e=>e.type === "nouveau").concat(et.slice(iP, jP + 1), et.slice(jP + 1).filter(e=>e.type === "nouveau"));
    return { r, etapes, avant, apres, sur: et.filter(e=>e.type === "paire" && e.sur).length, paires: et.filter(e=>e.type === "paire").length };
  };
  if (rangForce) return essai(rangForce);
  const deuxRangees = !cs.unRang && (!!cs.photo2 || (cs.livres||[]).some(lv=>lv.rang === "derriere"));
  if (!deuxRangees) return essai("devant");
  const a = essai("devant"), b = essai("derriere");
  return (b.sur > a.sur || (b.sur === a.sur && b.paires > a.paires)) ? b : a;
}

/* ====== RANGÉE D'UNE PHOTO D'APPOINT ======
   Avant tout rapprochement : à quelle rangée la photo d'appoint correspond-elle ?
   - une seule rangée : il faut au moins quelques livres reconnus ;
   - deux rangées : il faut des correspondances nettes avec l'une et pas avec l'autre.
   Sinon, on demande. Le résultat est mémorisé sur l'appoint (appoint.rang) et affiché dans la liste des appoints. */
function correspondancesRangee(cs, lus, r){
  const liste = (cs.livres||[]).filter(lv=>(lv.rang === "derriere" ? "derriere" : "devant") === r);
  let n = 0;
  lus.forEach(lu=>{
    if (lu.illisible || !lu.titre) return;
    if (liste.some(lv=>{ const t = simTitre(lu.titre, lv.titre), au = simAuteur(lu.auteur, lv.auteur); return memeLivreSur(t, au); })) n++;
  });
  return { n, total: liste.length };
}
function deuxRangeesCase(cs){ return !cs.unRang && (!!cs.photo2 || (cs.livres||[]).some(lv=>lv.rang === "derriere")); }
const NOM_RANGEE = { devant:"rangée 1 (devant)", derriere:"rangée 2 (derrière)" };

/* Refus motivé : aucune rangée n'a de livres en commun avec la photo d'appoint. */
function refuserAppointSansCorrespondance(b, k, champ, lus, c1, c2){
  const cs = b.cases[k];
  const num = numeroAppoint(cs, champ);
  const deux = deuxRangeesCase(cs);
  const lisibles = lus.filter(l=>!l.illisible && l.titre);
  const pistes = [];
  pistes.push(`<li><b>Erreur de compartiment</b> : la photo montre peut-être un autre compartiment que ${esc(lib(k))}.</li>`);
  if (deux){
    if (!c2.total) pistes.push(`<li><b>Rangée 2 pas encore relevée</b> : la rangée 2 (derrière) n'a aucun livre dans la liste${cs.photo2 ? " alors qu'elle a une photo : analysez d'abord la photo de derrière (🔍 Analyser → Derrière seul)" : ""}. C'est sans doute elle que montre l'appoint.</li>`);
    else if (!c1.total) pistes.push(`<li><b>Rangée 1 pas encore relevée</b> : la rangée 1 (devant) n'a aucun livre dans la liste : analysez d'abord la photo de devant.</li>`);
    else pistes.push(`<li><b>Erreur de rangée</b> : aucune des deux rangées relevées ne correspond ; la liste de l'une d'elles est peut-être incomplète ou fausse.</li>`);
  } else if (!cs.unRang){
    pistes.push(`<li><b>Rangée de derrière pas encore photographiée</b> : si ce compartiment a deux rangées, la photo d'appoint montre sans doute la rangée de derrière. Prenez d'abord la photo de derrière (onglet ➕ Derrière) et analysez-la.</li>`);
  }
  modale({ titre:"Appoint " + num + " — aucune correspondance",
    html:`<div><b>Aucun livre de cette photo d'appoint ne se retrouve dans ${deux ? "les rangées relevées" : "la liste"} du compartiment ${esc(lib(k))}</b> : le résultat n'est affecté à aucune rangée.</div>
          <div class="aide">Livres lus sur la photo : ${lisibles.length}. Reconnus dans la rangée 1 : <b>${c1.n}</b> (sur ${c1.total})${deux ? `, dans la rangée 2 : <b>${c2.n}</b> (sur ${c2.total})` : ""}.</div>
          <div style="margin-top:8px">Causes possibles :</div><ul>${pistes.join("")}</ul>
          <div class="aide">Le résultat de la lecture est sauvegardé (📜 Résultats d'analyse sauvegardés) : vous pourrez le réutiliser une fois le problème corrigé, sans redemander à l'IA.</div>
          ${lisibles.length ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">📷 Ce qui a été lu sur la photo (${lisibles.length})</summary>
            <div class="aide" style="margin:6px 0 0 14px">${lisibles.map(l=>esc(l.titre) + (l.auteur ? ` <span style="opacity:.7">— ${esc(l.auteur)}</span>` : "")).join("<br>")}</div></details>` : ""}`,
    boutons:[{texte:"Compris", classe:"principal"}] });
}

function securiserRangeeAppoint(b, k, champ, lus){
  const cs = b.cases[k];
  const appoint = photoObj(cs, champ);
  const num = numeroAppoint(cs, champ);
  const lisibles = lus.filter(l=>!l.illisible && l.titre).length;
  const minimum = Math.min(2, Math.max(1, lisibles));        // « quelques » livres : 2, ou 1 si la photo n'en montre qu'un
  const memoriser = (r, auto, c1, c2)=>{
    if (!appoint) return;
    appoint.rang = r;
    appoint.rangInfo = { auto, n1:c1 ? c1.n : null, n2:c2 ? c2.n : null, date:new Date().toISOString() };
    sauver();
    if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k);
  };
  return new Promise(res=>{
    const deux = deuxRangeesCase(cs);
    const c1 = correspondancesRangee(cs, lus, "devant");
    const c2 = deux ? correspondancesRangee(cs, lus, "derriere") : { n:0, total:0 };
    const ok1 = c1.n >= minimum, ok2 = deux && c2.n >= minimum;

    // règle de fond : jamais d'affectation sans livres en commun
    if (!ok1 && !ok2){ refuserAppointSansCorrespondance(b, k, champ, lus, c1, c2); res(null); return; }
    if (ok1 && !ok2){ memoriser("devant", true, c1, c2); res("devant"); return; }
    if (ok2 && !ok1){ memoriser("derriere", true, c1, c2); res("derriere"); return; }

    // les deux rangées ont des livres en commun avec la photo : écart net, sinon on demande
    if (c1.n >= 3 * c2.n && c1.n - c2.n >= 2){ memoriser("devant", true, c1, c2); res("devant"); return; }
    if (c2.n >= 3 * c1.n && c2.n - c1.n >= 2){ memoriser("derriere", true, c1, c2); res("derriere"); return; }
    let fait = false;
    const prec = appoint && appoint.rang;
    modale({ titre:"Appoint " + num + " — quelle rangée ?",
      html:`<div>Cette photo d'appoint a des livres en commun avec <b>les deux rangées</b> : impossible de trancher avec certitude.</div>
            <div class="aide">Livres lus : ${lisibles}. Reconnus dans la rangée 1 : <b>${c1.n}</b> (sur ${c1.total}), dans la rangée 2 : <b>${c2.n}</b> (sur ${c2.total}).</div>
            ${prec ? `<div class="aide">Rattachée précédemment à la ${NOM_RANGEE[prec]}.</div>` : ""}
            <div class="aide">Un même livre présent dans les deux listes est peut-être un doublon à corriger.</div>`,
      boutons:[
        { texte:"Annuler", action:()=>{ fait = true; res(null); } },
        { texte:`Rangée 1 (${c1.n})`, classe: (prec ? prec === "devant" : c1.n >= c2.n) ? "principal" : "", action:()=>{ fait = true; memoriser("devant", false, c1, c2); res("devant"); } },
        { texte:`Rangée 2 (${c2.n})`, classe: (prec ? prec === "derriere" : c2.n > c1.n) ? "principal" : "", action:()=>{ fait = true; memoriser("derriere", false, c1, c2); res("derriere"); } }
      ],
      surFermeture:()=>{ if (!fait) res(null); } });
  });
}

async function fenetreFusionAppoint(b, k, champ, lus, source, rangForce){
  if (!rangForce){ rangForce = await securiserRangeeAppoint(b, k, champ, lus); if (!rangForce) return; }
  const cs = b.cases[k];
  const appoint = photoObj(cs, champ);
  const num = numeroAppoint(cs, champ);
  const deuxRangees = !cs.unRang && (!!cs.photo2 || (cs.livres||[]).some(lv=>lv.rang === "derriere"));
  const nomR = (r)=> r === "derriere" ? "rangée 2 (derrière)" : "rangée 1 (devant)";
  const marquer = ()=>{ if (appoint) appoint.verif = new Date().toISOString(); sauver(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); if (biblioCourante === b.id) rendreBiblio(); };
  if (certifiee(cs, rangForce)){ toast(`La ${nomR(rangForce)} est certifiée ★ : cette photo d'appoint ne la modifie pas.`, 6000); marquer(); return; }
  const P = preparerFusionAppoint(cs, lus, rangForce, champ);
  if (deuxRangees || P.r === "derriere") P.etapes.forEach(e=>{ if (e.type === "nouveau") e.b.rang = P.r; });
  const zone = P.paires
    ? (()=>{ const pa = P.etapes.filter(e=>e.type === "paire"); return `de « ${esc(pa[0].a.titre)} » à « ${esc(pa[pa.length-1].a.titre)} »`; })()
    : "";
  const autre = P.r === "derriere" ? "devant" : "derriere";
  let f;
  f = fusionConvergente({
    b, k, cs,
    temoin:()=>temoinPhoto(cs, champ),
    nomSource:"l'appoint " + num,
    titre:"Appoint " + num + " — " + lib(k),
    intro:`<div>L'IA a lu <b>${lus.length}</b> livre(s) sur la photo d'appoint, sans voir la liste. En supposant que l'ordre est le même que dans la liste,
             ${P.paires ? `la photo correspond à la zone ${zone} de la ${nomR(P.r)}.` : `<b>aucun livre ne correspond</b> à la ${nomR(P.r)} : impossible de situer la zone ; tous les livres lus sont présentés comme nouveaux.`}</div>
           ${deuxRangees ? `<div class="barre" style="margin-top:6px"><button class="btn" id="faAutre" style="flex:1">Comparer plutôt à la ${nomR(autre)}</button></div>` : ""}
           <div class="aide">${esc(texteSource(source).trim())}</div>`,
    blocs:[{ r:P.r, etapes:P.etapes, avant:P.avant, apres:P.apres,
      entete:`Zone photographiée — ${nomR(P.r)}` }],
    texteValider:"Appliquer",
    surValider:(res, bilan)=>{
      const rangDe = (lv)=> lv.rang === "derriere" ? "derriere" : "devant";
      const autres = (cs.livres||[]).filter(lv=>rangDe(lv) !== P.r);
      cs.livres = P.r === "devant" ? res[P.r].concat(autres) : autres.concat(res[P.r]);
      if (appoint){
        (bilan.vus || []).forEach(lv=>{ if (!lv.id) lv.id = uid(); });
        appoint.livresVus = (bilan.vus || []).map(lv=>lv.id);
      }
      marquer();
      toast(`Appoint ${num} : ${bilan.acquis} livre(s) devenu(s) 🔒 acquis, ${bilan.aj} ajout(s), ${bilan.questions} question(s). ${cs.livres.length} livre(s) dans ${lib(k)}.`, 5000);
      envoyerDonneesAuto("Listes de livres de " + lib(k));
    },
    surAnnuler: marquer
  });
  const bA = f.querySelector("#faAutre");
  if (bA) bA.onclick = ()=>{
    const cA = correspondancesRangee(cs, lus, autre);
    const lisiblesA = lus.filter(l=>!l.illisible && l.titre).length;
    if (cA.n < Math.min(2, Math.max(1, lisiblesA))){
      toast(`Impossible : la ${nomR(autre)} n'a ${cA.n ? "qu'un livre" : "aucun livre"} en commun avec cette photo${cA.total ? "" : " (elle n'a encore aucun livre relevé)"}.`, 6000);
      return;
    }
    f.remove();
    if (appoint){ appoint.rang = autre; appoint.rangInfo = { auto:false, date:new Date().toISOString() }; sauver(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); }
    fenetreFusionAppoint(b, k, champ, lus, source, autre);
  };
}

/* ====================================================================
   CONTRÔLE DE LA LISTE PAR LES PHOTOS D'APPOINT
   ==================================================================== */
/* ====== GLISSER-DÉPOSER ======
   glisserListe(z, surLacher) : les enfants .livre de z qui ont une .poignee peuvent être réordonnés.
   surLacher(ordreAvant, ordreApres) reçoit les data-idx avant/après (si l'ordre a changé). */
function glisserListe(z, surLacher){
  const defilant = (el)=>{ for (let p = el.parentElement; p; p = p.parentElement){ const o = getComputedStyle(p).overflowY; if ((o === "auto" || o === "scroll") && p.scrollHeight > p.clientHeight) return p; } return document.scrollingElement; };
  const enfants = ()=>[...z.children].filter(x=>x.classList.contains("livre"));
  // la poignée doit recevoir le doigt : touch-action none (pas de défilement ni de zoom depuis elle)
  z.querySelectorAll(":scope > .livre > .poigneeGlisser").forEach(h=>{
    // iOS : empêcher la sélection de texte et le menu « Copier » au toucher de la poignée
    h.addEventListener("touchstart", (e)=>{ e.preventDefault(); }, { passive:false });
    h.addEventListener("selectstart", (e)=>e.preventDefault());
    h.addEventListener("contextmenu", (e)=>e.preventDefault());
    h.addEventListener("pointerdown", (e)=>{
      if (e.button && e.button !== 0) return;
      e.preventDefault();
      const item = h.closest(".livre");
      const scr = defilant(z);
      const ordreAvant = enfants().map(x=>Number(x.dataset.idx));
      let dernierY = e.clientY, minuterie = null, fini = false;
      const scrollDe = ()=> scr === document.scrollingElement ? window.scrollY : scr.scrollTop;
      const y0 = e.clientY, scroll0 = scrollDe(), top0 = item.offsetTop;
      // le livre suit le doigt : décalage visuel = déplacement du doigt (défilement compris) − déplacement réel dans la liste
      const suivre = ()=>{
        const dy = (dernierY + scrollDe()) - (y0 + scroll0) - (item.offsetTop - top0);
        item.style.transform = `translateY(${dy}px) scale(1.02)`;
      };
      item.classList.add("enDrag");
      suivre();
      document.body.classList.add("glisseEnCours");
      try{ const sel = window.getSelection && window.getSelection(); if (sel) sel.removeAllRanges(); }catch(_){}
      try{ h.setPointerCapture(e.pointerId); }catch(_){}
      if (navigator.vibrate) try{ navigator.vibrate(10); }catch(_){}
      const placer = ()=>{
        const autres = enfants().filter(x=>x !== item);
        let avant = null;
        for (const x of autres){ const r = x.getBoundingClientRect(); if (dernierY < r.top + r.height / 2){ avant = x; break; } }
        // on ne déplace jamais l'élément tenu (iOS perdrait le suivi du doigt) : ce sont ses voisins qui changent de côté
        const tous = enfants();
        const iItem = tous.indexOf(item);
        const iCible = avant ? tous.indexOf(avant) : tous.length;
        if (iCible > iItem + 1) tous.slice(iItem + 1, iCible).forEach(x=>z.insertBefore(x, item));
        else if (iCible < iItem){ const ref = item.nextElementSibling; tous.slice(iCible, iItem).forEach(x=>z.insertBefore(x, ref)); }
      };
      const defiler = ()=>{
        const r = scr === document.scrollingElement ? { top:0, bottom:window.innerHeight } : scr.getBoundingClientRect();
        const marge = 60;
        let v = 0;
        if (dernierY < r.top + marge) v = -Math.ceil((r.top + marge - dernierY) / 4);
        else if (dernierY > r.bottom - marge) v = Math.ceil((dernierY - (r.bottom - marge)) / 4);
        if (v){ scr.scrollTop += v; placer(); suivre(); }
        minuterie = fini ? null : requestAnimationFrame(defiler);
      };
      minuterie = requestAnimationFrame(defiler);
      const bouger = (ev)=>{ ev.preventDefault(); dernierY = ev.clientY; placer(); suivre(); };
      const lacher = ()=>{
        fini = true;
        if (minuterie) cancelAnimationFrame(minuterie);
        h.removeEventListener("pointermove", bouger);
        h.removeEventListener("pointerup", lacher);
        h.removeEventListener("pointercancel", lacher);
        item.classList.remove("enDrag");
        item.style.transform = "";
        document.body.classList.remove("glisseEnCours");
        const ordreApres = enfants().map(x=>Number(x.dataset.idx));
        if (ordreApres.join() !== ordreAvant.join() && surLacher) surLacher(ordreAvant, ordreApres);
      };
      h.addEventListener("pointermove", bouger, { passive:false });
      h.addEventListener("pointerup", lacher);
      h.addEventListener("pointercancel", lacher);
    });
  });
}
/* Liste des livres d'un compartiment : au lâcher, les livres affichés reprennent les mêmes emplacements de cs.livres dans leur nouvel ordre. */
function activerGlisser(z, cs, apres){
  glisserListe(z, (ordreAvant, ordreApres)=>{
    const emplacements = [...ordreAvant].sort((a,b)=>a-b);
    const copie = cs.livres.slice();
    emplacements.forEach((pos, n)=>{ cs.livres[pos] = copie[ordreApres[n]]; });
    sauver(); if (typeof rendreBiblio === "function") rendreBiblio();
    apres();
    toast("Ordre modifié.");
    journal("Ordre des livres modifié (glisser-déposer)");
    planifierEnvoi("Ordre des livres modifié");
  });
}

/* Envoie UNE photo d'appoint à l'IA, sans la liste ; renvoie les livres lus de gauche à droite. */
async function lireAppoint(bib, cle, champ, opts){
  const cs = bib.cases[cle];
  const a = photoObj(cs, champ);
  if (!a) throw new Error("Photo d'appoint introuvable.");
  const img = await photoPleine(bib, cle, champ);
  if (!img) throw new Error("Photo d'appoint introuvable (ni sur cet appareil ni sur GitHub).");
  let q = cfg.qLectureAppoint || QUESTION_APPOINT_DEFAUT;
  if (/"corrections"/.test(q)) q = QUESTION_APPOINT_DEFAUT;      // ancienne question (format d'avant la V1.32) : ignorée
  const parties = [{ text: q + CONSIGNE_POSITION + (a.legende ? "\n\nIndication de la personne qui a pris la photo : " + a.legende : "") }];
  parties.push({ inline_data:{ mime_type:"image/jpeg", data: base64Seul(img) } });
  const rep = await interrogerIA(parties, jsonDepuisTexte, opts);
  const lus = lusDepuisReponse(rep.res);
  journal(`Lecture IA de l'appoint ${numeroAppoint(cs, champ)} de ${cle} (${rep.ia} ${rep.modele || ""}) : ${lus.length} livre(s) lu(s)`);
  journaliserResultat(bib, cle, "appoint", { appoint: idAppoint(champ), mode: (opts && opts.mode) || "", source:{ ia:rep.ia, modele:rep.modele }, lus });
  return { lus, source:{ ia:rep.ia, modele:rep.modele, echecs:rep.echecs } };
}

function lusDepuisReponse(j){
  const l = Array.isArray(j && j.livres) ? j.livres : (Array.isArray(j) ? j : []);
  return l.filter(Boolean).map(x=>({
    titre: String(x.titre||"").trim(), auteur: String(x.auteur||"").trim(), annee: String(x.annee||"").trim(),
    certitude: ["haute","moyenne","faible"].includes(x.certitude) ? x.certitude : "moyenne",
    remarque: String(x.remarque||"").trim(),
    ...(lirePosition(x) || {})
  })).map(x=>Object.assign(x, { illisible: !x.titre && !x.auteur }));
}

/* ---------- ressemblance ---------- */
function distanceEdition(a, b){
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prec = Array.from({length:n+1}, (_,j)=>j);
  for (let i = 1; i <= m; i++){
    const cour = [i];
    for (let j = 1; j <= n; j++)
      cour[j] = Math.min(prec[j] + 1, cour[j-1] + 1, prec[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prec = cour;
  }
  return prec[n];
}
function ratioTexte(a, b){
  if (!a || !b) return 0;
  return 1 - distanceEdition(a, b) / Math.max(a.length, b.length);
}
/* titres : 0 à 1 (fautes de lecture, mots manquants, sous-titres tolérés) */
function simTitre(a, b){
  const A = normaliser(a), B = normaliser(b);
  if (!A || !B) return 0;
  if (A === B) return 1;
  if ((A.length >= 5 && B.includes(A)) || (B.length >= 5 && A.includes(B))) return 0.9;
  const ma = A.split(" ").filter(m=>m.length > 2), mb = B.split(" ").filter(m=>m.length > 2);
  let mots = 0;
  if (ma.length && mb.length){
    const communs = ma.filter(m=>mb.some(n=>ratioTexte(m, n) >= 0.8)).length;
    mots = communs / Math.max(ma.length, mb.length);
  }
  return Math.max(ratioTexte(A, B), mots);
}
/* auteurs : comparaison des noms de famille ; null si l'un des deux manque */
function nomDeFamille(a){
  const t = simplifier(String(a||"").replace(/\(.*?\)/g, "")).replace(/[^a-z\s,'-]/g, " ").trim();
  if (!t) return "";
  if (t.includes(",")) return t.split(",")[0].trim();
  const mots = t.split(/\s+/).filter(Boolean);
  return mots[mots.length - 1] || "";
}
/* noms significatifs d'un champ auteur (plusieurs auteurs, initiales, mentions entre parenthèses ignorées) */
const MOTS_AUTEUR_VIDES = new Set(["texte","textes","dessin","dessins","scenario","scenariste","scenaristes","illustrations","illustre","traduction","traduit","auteur","auteurs","collectif","par","avec","et","and","de","du","des","la","le","les","van","von","der","den","ne","nee","en","francais","francaise","belge","americain","anglais","ecrivain","romancier","dessinateur","couleurs"]);
function nomsAuteur(a){
  return simplifier(String(a||"").replace(/\(.*?\)/g, " ")).replace(/[^a-z\s'-]/g, " ").split(/[\s'-]+/)
    .filter(m=>m.length >= 3 && !MOTS_AUTEUR_VIDES.has(m));
}
/* auteurs : 1 si au moins un nom en commun (à une faute près), sinon ressemblance du meilleur couple ; null si un côté est vide */
function simAuteur(a, b){
  const A = nomsAuteur(a), B = nomsAuteur(b);
  if (!A.length || !B.length) return null;
  let m = 0;
  A.forEach(x=>B.forEach(y=>{ m = Math.max(m, ratioTexte(x, y)); }));
  return m >= 0.8 ? 1 : m;
}
/* même livre sans rien demander ? titres identiques (normalisés) quels que soient les auteurs,
   ou titres très proches et auteurs compatibles (un nom en commun, ou auteur absent d'un côté) */
function memeLivreSur(t, au){ return t >= 0.99 || (t >= 0.85 && (au === null || au >= 0.8)); }

/* ---------- rapprochement ----------
   Renvoie pour chaque livre lu : { lu, etat:"sur"|"probable"|"absent"|"illisible", cible, pos, rang, raison }
   + ordreAnormal (liste de paires) + retraits (livres de la liste non vus alors qu'ils sont encadrés par des livres vus). */
function rapprocherAppoint(cs, lus){
  const livres = cs.livres || [];
  const rangDe = (lv)=> lv.rang === "derriere" ? "derriere" : "devant";
  const posDans = new Map();                       // position de chaque livre dans sa rangée
  const parRang = { devant:[], derriere:[] };
  livres.forEach(lv=>{ const r = rangDe(lv); posDans.set(lv, parRang[r].length); parRang[r].push(lv); });
  const score = (lu, lv)=>{
    const t = simTitre(lu.titre, lv.titre), au = simAuteur(lu.auteur, lv.auteur);
    return { t, au, s: t + (au === null ? 0 : 0.3 * au) };
  };
  const res = lus.map(lu=>({ lu, etat: lu.illisible ? "illisible" : "absent", cible:null, raison:"" }));
  const pris = new Set();

  // 1. correspondances sûres (titre quasi identique, auteur compatible), attribuées une à une, les meilleures d'abord
  const paires = [];
  res.forEach((r, i)=>{ if (r.etat === "illisible") return;
    livres.forEach(lv=>{ const sc = score(r.lu, lv); if (sc.t >= 0.5 || (sc.au !== null && sc.au >= 0.8 && sc.t >= 0.3)) paires.push({ i, lv, sc }); }); });
  paires.sort((x,y)=>y.sc.s - x.sc.s);
  paires.forEach(p=>{
    const r = res[p.i];
    if (r.cible || pris.has(p.lv)) return;
    if (memeLivreSur(p.sc.t, p.sc.au)){ r.etat = "sur"; r.cible = p.lv; pris.add(p.lv); }
  });

  // 2. voisinage : un livre non reconnu est cherché entre les livres sûrs qui l'encadrent sur la photo
  const ancres = res.map((r,i)=>({r,i})).filter(x=>x.r.etat === "sur");
  res.forEach((r, i)=>{
    if (r.etat !== "absent") return;
    const avant = [...ancres].reverse().find(x=>x.i < i), apres = ancres.find(x=>x.i > i);
    const rg = avant ? rangDe(avant.r.cible) : apres ? rangDe(apres.r.cible) : null;
    let fenetre;
    if (rg && avant && apres && rangDe(apres.r.cible) === rg){
      const p0 = posDans.get(avant.r.cible), p1 = posDans.get(apres.r.cible);
      fenetre = parRang[rg].slice(Math.min(p0,p1) + 1, Math.max(p0,p1));
    } else if (rg){
      const ref = avant || apres, p = posDans.get(ref.r.cible);
      const ecart = Math.abs(ref.i - i) + 1;
      fenetre = avant ? parRang[rg].slice(p + 1, p + 1 + ecart) : parRang[rg].slice(Math.max(0, p - ecart), p);
    } else fenetre = livres;
    fenetre = fenetre.filter(lv=>!pris.has(lv));
    let meilleur = null;
    fenetre.forEach(lv=>{ const sc = score(r.lu, lv); if (!meilleur || sc.s > meilleur.sc.s) meilleur = { lv, sc }; });
    if (meilleur && (meilleur.sc.t >= 0.5 || (meilleur.sc.au !== null && meilleur.sc.au >= 0.75))){
      r.etat = "probable"; r.cible = meilleur.lv; pris.add(meilleur.lv);
      r.raison = `titre ressemblant${meilleur.sc.au !== null && meilleur.sc.au >= 0.75 ? ", même auteur" : ""}, à la bonne place`;
      return;
    }
    // même nombre de livres non reconnus que de trous entre deux voisins sûrs : rapprochement par position
    if (avant && apres && meilleur && fenetre.length === 1){
      const entre = res.slice(avant.i + 1, apres.i).filter(x=>x.etat === "absent" || x.etat === "illisible").length;
      if (entre === 1 && (meilleur.sc.t >= 0.25 || (meilleur.sc.au !== null && meilleur.sc.au >= 0.5))){
        r.etat = "probable"; r.cible = meilleur.lv; pris.add(meilleur.lv);
        r.raison = "seul livre de la liste à cet endroit, titre lu différent";
        return;
      }
    }
    // ailleurs dans la liste, avec un titre ressemblant : à confirmer, et l'ordre sera signalé
    let loin = null;
    livres.filter(lv=>!pris.has(lv)).forEach(lv=>{ const sc = score(r.lu, lv); if (sc.t >= 0.6 && (!loin || sc.s > loin.sc.s)) loin = { lv, sc }; });
    if (loin){ r.etat = "probable"; r.cible = loin.lv; pris.add(loin.lv); r.raison = "titre ressemblant, mais ailleurs dans la liste"; }
  });
  res.forEach(r=>{ if (r.cible){ r.rang = rangDe(r.cible); r.pos = posDans.get(r.cible); } });

  // 3. ordre : sur la photo (gauche → droite), les livres reconnus d'une même rangée doivent se suivre dans le même ordre que la liste
  const ordreAnormal = [];
  ["devant","derriere"].forEach(rg=>{
    const seq = res.filter(r=>r.cible && r.rang === rg && r.etat === "sur");
    for (let x = 1; x < seq.length; x++)
      if (seq[x].pos < seq[x-1].pos) ordreAnormal.push([seq[x-1], seq[x]]);
  });

  // 4. retraits possibles : livres de la liste situés entre deux livres reconnus, mais absents de la photo
  const retraits = [];
  ["devant","derriere"].forEach(rg=>{
    const pos = res.filter(r=>r.cible && r.rang === rg).map(r=>r.pos);
    if (pos.length < 2) return;
    const p0 = Math.min(...pos), p1 = Math.max(...pos);
    parRang[rg].slice(p0 + 1, p1).forEach(lv=>{ if (!pris.has(lv)) retraits.push(lv); });
  });
  return { res, ordreAnormal, retraits, parRang };
}

/* ---------- fenêtre de vérification ---------- */
async function fenetreVerifAppoint(b, k, champ, lus, source){
  const rangAppoint = lus.length ? await securiserRangeeAppoint(b, k, champ, lus) : null;
  if (lus.length && !rangAppoint) return;
  const cs = b.cases[k];
  const appoint = photoObj(cs, champ);
  const num = numeroAppoint(cs, champ);
  const rafraichir = ()=>{ if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); if (biblioCourante === b.id) rendreBiblio(); };
  const marquer = ()=>{ if (appoint){ appoint.verif = new Date().toISOString(); } sauver(); rafraichir(); };
  if (!lus.length){
    marquer();
    modale({ titre:"Photo d'appoint " + num, html:`<div>L'IA n'a lu aucun livre sur cette photo.</div><div class="aide">${esc(texteSource(source).trim())}</div>`, boutons:[{texte:"Fermer"}] });
    return;
  }
  const deuxRangees = !cs.unRang && (!!cs.photo2 || (cs.livres||[]).some(lv=>lv.rang === "derriere"));
  const nomRg = (r)=> r === "derriere" ? "rangée 2" : "rangée 1";
  // on ne compare qu'à la rangée photographiée
  const R = rapprocherAppoint({ livres:(cs.livres||[]).filter(lv=>(lv.rang === "derriere" ? "derriere" : "devant") === rangAppoint) }, lus);
  const res = R.res;
  // choix de l'utilisateur pour les « probables » : "oui" | "non" | "" (sans choix = ignoré)
  const choix = res.map(()=> "");
  const rangNouveau = res.map(()=> rangAppoint || "devant");

  // voisin reconnu le plus proche (pour placer un livre ajouté)
  const voisin = (i)=>{
    for (let x = i - 1; x >= 0; x--) if (res[x].etat === "sur" || (res[x].etat === "probable" && choix[x] === "oui")) return { apres:res[x].cible };
    for (let x = i + 1; x < res.length; x++) if (res[x].etat === "sur" || (res[x].etat === "probable" && choix[x] === "oui")) return { avant:res[x].cible };
    return null;
  };
  const estNouveau = (i)=> res[i].etat === "absent" || (res[i].etat === "probable" && choix[i] === "non");
  const placeTexte = (i)=>{
    const v = voisin(i);
    if (v && v.apres) return `→ ${nomRg(v.apres.rang === "derriere" ? "derriere" : "devant")}, après « ${esc(v.apres.titre)} »`;
    if (v && v.avant) return `→ ${nomRg(v.avant.rang === "derriere" ? "derriere" : "devant")}, avant « ${esc(v.avant.titre)} »`;
    return deuxRangees ? "" : "→ rangée 1, en fin de liste";
  };
  const nb = (e)=>res.filter(r=>r.etat === e).length;

  const ligne = (r, i)=>{
    const lu = r.lu.illisible ? `<i>tranche illisible</i>` :
      `<b>${esc(r.lu.titre || "(titre non lu)")}</b>${r.lu.auteur ? ` <span style="opacity:.75">— ${esc(r.lu.auteur)}</span>` : ""}${r.lu.remarque ? ` <span class="aide">(${esc(r.lu.remarque)})</span>` : ""}`;
    let etat = "", actions = "";
    if (r.etat === "sur"){
      etat = `<span style="color:var(--vert)">✅ déjà relevé</span> — ${nomRg(r.rang)}, n° ${r.pos + 1}${normaliser(r.cible.titre) !== normaliser(r.lu.titre) ? ` : « ${esc(r.cible.titre)} »` : ""}`;
    } else if (r.etat === "probable"){
      etat = `<span style="color:var(--orange)">🟡 sans doute « ${esc(r.cible.titre)} »${r.cible.auteur ? " — " + esc(r.cible.auteur) : ""}</span> (${nomRg(r.rang)}, n° ${r.pos + 1}) — ${esc(r.raison)}`;
      actions = `<div class="onglets" style="margin:6px 0 0" data-ch="${i}">
          <button data-v="oui" class="${choix[i]==="oui"?"actif":""}">C'est lui</button>
          <button data-v="non" class="${choix[i]==="non"?"actif":""}">Autre livre</button></div>`;
    } else if (r.etat === "absent"){
      etat = `<span style="color:var(--bronze)">🆕 absent des listes</span>`;
    } else etat = `<span class="aide">non exploitable</span>`;
    if (r.etat !== "illisible"){
      actions += `<div data-zn="${i}" style="${estNouveau(i) ? "" : "display:none"}">
        <div class="coche" style="margin:6px 0 0"><input type="checkbox" data-aj="${i}" checked><label style="margin:0">Ajouter à la liste <span class="aide" data-pl="${i}">${placeTexte(i)}</span></label></div>
        ${deuxRangees ? `<div class="onglets" style="margin:4px 0 0" data-rg="${i}" ${voisin(i) ? 'hidden' : ''}>
          <button data-v="devant" class="actif">Rangée 1</button><button data-v="derriere">Rangée 2</button></div>` : ""}
      </div>`;
    }
    return `<div style="padding:8px 0;border-bottom:1px solid var(--trait)"><div><span class="aide" style="margin:0">${i + 1}.</span> ${lu}</div>
      <div class="aide" style="margin:3px 0 0">${etat}</div>${actions}</div>`;
  };

  // corrections : livre reconnu dont la liste diffère de ce qui est lu
  const corrections = [];
  res.forEach((r, i)=>{
    if (!r.cible || r.lu.illisible) return;
    const c = r.cible;
    const add = (champ, nouveau, coche, lib)=>corrections.push({ i, champ, nouveau, coche, lib });
    if (r.lu.titre && normaliser(r.lu.titre) !== normaliser(c.titre)) add("titre", r.lu.titre, false, "Titre");
    if (r.lu.auteur && !c.auteur) add("auteur", r.lu.auteur, true, "Auteur (manquant)");
    else if (r.lu.auteur && c.auteur && simAuteur(r.lu.auteur, c.auteur) !== null && simAuteur(r.lu.auteur, c.auteur) < 0.8) add("auteur", r.lu.auteur, false, "Auteur");
    if (/^\d{4}$/.test(r.lu.annee) && !c.annee) add("annee", r.lu.annee, true, "Année (manquante)");
  });
  const htmlCorr = corrections.map((c, n)=>{
    const r = res[c.i];
    return `<div class="prop" data-cor-ligne="${n}"><div class="coche" style="align-items:flex-start">
      <input type="checkbox" data-cor="${n}" ${c.coche ? "checked" : ""} style="margin-top:3px">
      <div style="flex:1"><div class="t">${esc(r.cible.titre)} <span class="aide" style="font-weight:400">(${nomRg(r.rang)}, n° ${r.pos + 1})</span></div>
      <div class="chg">${c.lib} : ${esc(String(r.cible[c.champ] || "—"))} → <b>${esc(c.nouveau)}</b></div>
      ${r.etat === "probable" ? `<div class="mot">Appliqué seulement si vous confirmez « C'est lui » plus haut.</div>` : ""}</div></div></div>`;
  }).join("");
  const htmlRet = R.retraits.map((lv, n)=>`<div class="prop retirer"><div class="coche" style="align-items:flex-start">
      <input type="checkbox" data-ret="${n}" style="margin-top:3px">
      <div style="flex:1"><div class="t">${esc(lv.titre)} <span class="aide" style="font-weight:400">(${nomRg(lv.rang === "derriere" ? "derriere" : "devant")})</span></div>
      <div class="mot">Dans la liste entre deux livres reconnus sur la photo, mais pas vu dessus. À retirer seulement si vous êtes sûr qu'il n'est pas là.</div></div></div></div>`).join("");
  const ordre = R.ordreAnormal.length ? `<div class="encadre">⚠️ Ordre différent de la liste : ${R.ordreAnormal.map(([x,y])=>`« ${esc(x.cible.titre)} » puis « ${esc(y.cible.titre)} » sur la photo, mais dans l'ordre inverse dans la liste`).join(" ; ")}. Les emplacements proposés pour les ajouts peuvent être faux.</div>` : "";

  const f = modale({
    titre:"Photo d'appoint " + num + " — " + lib(k),
    html:`<div>L'IA a lu <b>${res.length}</b> livre(s) sur cette photo, de gauche à droite :
            <b>${nb("sur")}</b> déjà relevé(s), <b>${nb("probable")}</b> à confirmer, <b>${nb("absent")}</b> absent(s)${nb("illisible") ? `, ${nb("illisible")} illisible(s)` : ""}.</div>
          <div class="aide">Photo rattachée à la <b>${NOM_RANGEE[rangAppoint]}</b>. L'IA n'a pas vu la liste : c'est l'application qui a comparé chaque titre lu à la liste de cette rangée (titre, auteur et place dans l'ordre).${esc(texteSource(source))}</div>
          ${ordre}
          <div class="titreSection" style="margin-top:12px">📷 Lu sur la photo</div>
          <div>${res.map(ligne).join("")}</div>
          ${corrections.length ? `<div class="titreSection" style="margin-top:14px">✏️ Corrections proposées (${corrections.length})</div>
             <div class="aide" style="margin:-4px 0 8px">Les champs manquants sont cochés ; les titres ou auteurs différents ne le sont pas : cochez si la lecture de la photo est meilleure.</div>${htmlCorr}` : ""}
          ${R.retraits.length ? `<div class="titreSection" style="margin-top:14px">🗑 Retraits possibles (${R.retraits.length})</div>${htmlRet}` : ""}`,
    boutons:[
      {texte:"Ne rien changer", action:()=>{ marquer(); }},
      {texte:"Appliquer", classe:"principal", action:(fd)=>{
        let ajo = 0, cor = 0, ret = 0;
        // corrections (celles des « probables » seulement si confirmés)
        corrections.forEach((c, n)=>{
          const r = res[c.i];
          if (!fd.querySelector(`[data-cor="${n}"]`).checked) return;
          if (r.etat === "probable" && choix[c.i] !== "oui") return;
          r.cible[c.champ] = c.nouveau; cor++;
        });
        // ajouts, insérés à leur place dans l'ordre de la photo
        cs.livres = cs.livres || [];
        let dernier = null;
        res.forEach((r, i)=>{
          if (r.etat === "sur" || (r.etat === "probable" && choix[i] === "oui")){ dernier = r.cible; return; }
          if (!estNouveau(i) || r.lu.illisible) return;
          const cb = fd.querySelector(`[data-aj="${i}"]`);
          if (!cb || !cb.checked) return;
          const lv = { id:uid(), titre:r.lu.titre || "(titre non lu)", auteur:r.lu.auteur, annee:/^\d{4}$/.test(r.lu.annee) ? r.lu.annee : "",
            certitude:r.lu.certitude, remarque:"", resume:"", categorie:"", origine:"appoint" };
          let suivant = null;
          for (let x = i + 1; x < res.length; x++) if (res[x].etat === "sur" || (res[x].etat === "probable" && choix[x] === "oui")){ suivant = res[x].cible; break; }
          const ref = dernier || suivant;
          const rg = ref ? (ref.rang === "derriere" ? "derriere" : "devant") : (deuxRangees ? rangNouveau[i] : "devant");
          if (deuxRangees || rg === "derriere") lv.rang = rg;
          if (dernier) cs.livres.splice(cs.livres.indexOf(dernier) + 1, 0, lv);
          else if (suivant) cs.livres.splice(cs.livres.indexOf(suivant), 0, lv);
          else {
            const derniersRang = cs.livres.filter(x=>(x.rang === "derriere" ? "derriere" : "devant") === rg);
            const apres = derniersRang[derniersRang.length - 1];
            if (apres) cs.livres.splice(cs.livres.indexOf(apres) + 1, 0, lv); else cs.livres.push(lv);
          }
          dernier = lv; ajo++;
        });
        const aRetirer = new Set(R.retraits.filter((lv, n)=>fd.querySelector(`[data-ret="${n}"]`).checked));
        if (aRetirer.size){ cs.livres = cs.livres.filter(lv=>!aRetirer.has(lv)); ret = aRetirer.size; }
        marquer();
        toast(`${ajo} ajout(s), ${cor} correction(s), ${ret} retrait(s). ${cs.livres.length} livre(s) dans ${lib(k)}.`, 5000);
        if (ajo + cor + ret) envoyerDonneesAuto("Listes de livres de " + lib(k));
      }}
    ],
    surFermeture:()=>{ marquer(); }
  });

  const majLigne = (i)=>{
    const zn = f.querySelector(`[data-zn="${i}"]`);
    if (zn) zn.style.display = estNouveau(i) ? "" : "none";
    res.forEach((_, x)=>{
      const pl = f.querySelector(`[data-pl="${x}"]`); if (pl) pl.innerHTML = placeTexte(x);
      const rg = f.querySelector(`[data-rg="${x}"]`); if (rg) rg.hidden = !!voisin(x);
    });
  };
  f.querySelectorAll("[data-ch]").forEach(z=>{
    const i = Number(z.dataset.ch);
    z.querySelectorAll("button").forEach(bt=>bt.onclick = (e)=>{
      e.preventDefault();
      choix[i] = choix[i] === bt.dataset.v ? "" : bt.dataset.v;         // second toucher = annuler le choix
      z.querySelectorAll("button").forEach(x=>x.classList.toggle("actif", x.dataset.v === choix[i]));
      majLigne(i);
    });
  });
  f.querySelectorAll("[data-rg]").forEach(z=>{
    const i = Number(z.dataset.rg);
    z.querySelectorAll("button").forEach(bt=>bt.onclick = (e)=>{
      e.preventDefault(); rangNouveau[i] = bt.dataset.v;
      z.querySelectorAll("button").forEach(x=>x.classList.toggle("actif", x === bt));
    });
  });
}

/* ====================================================================
   RECHERCHE D'UN MODÈLE GEMINI QUI FONCTIONNE
   ==================================================================== */
const EXCLUS_MODELES = /embedding|tts|image|imagen|veo|lyria|live|audio|native|robotics|computer-use|aqa|learnlm|gemma|nano|banana|search|dialog/i;

async function listerModelesGemini(cle){
  const tous = []; let jeton = ""; let tours = 0;
  do{
    const u = `https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=${encodeURIComponent(cle)}${jeton?"&pageToken="+encodeURIComponent(jeton):""}`;
    const r = await fetch(u);
    if (!r.ok) throw new Error("Liste des modèles refusée (" + r.status + ") : " + extraitMessageGoogle(await r.text()));
    const j = await r.json();
    (j.models||[]).forEach(m=>tous.push(m));
    jeton = j.nextPageToken || "";
  } while (jeton && ++tours < 10);
  const candidats = tous.filter(m=>{
    const id = String(m.name||"").replace(/^models\//,"");
    return /^gemini/i.test(id) && (m.supportedGenerationMethods||[]).includes("generateContent") && !EXCLUS_MODELES.test(id);
  }).map(m=>({ id:String(m.name).replace(/^models\//,""), nom:m.displayName||"" }));
  candidats.sort((a,b)=>rangModele(a.id).localeCompare(rangModele(b.id)));
  return { total: tous.length, candidats };
}

/* Clé de tri : alias « -latest » d'abord, puis stables avant preview/exp, version la plus récente, flash > pro > flash-lite. */
function rangModele(id){
  const alias = /latest$/i.test(id) ? 0 : 1;
  const instable = /preview|exp/i.test(id) ? 1 : 0;
  const mv = id.match(/gemini-(\d+)(?:\.(\d+))?/i);
  const version = mv ? (parseInt(mv[1],10)*100 + parseInt(mv[2]||"0",10)) : 0;
  const famille = /lite/i.test(id) ? 2 : /flash/i.test(id) ? 0 : /pro/i.test(id) ? 1 : 3;
  return `${alias}${instable}${String(9999-version).padStart(4,"0")}${famille}${id}`;
}

/* Petite image JPEG contenant un nombre à lire : preuve que le modèle lit bien les photos. */
function imageDeTest(){
  const n = String(1000 + Math.floor(Math.random()*9000));
  const c = document.createElement("canvas"); c.width = 480; c.height = 200;
  const x = c.getContext("2d");
  x.fillStyle = "#f4ecd8"; x.fillRect(0,0,480,200);
  x.fillStyle = "#1a1a1a"; x.font = "bold 64px Georgia, serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("LIVRE " + n, 240, 100);
  return { n, b64: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
}

async function testerModele(id, cle, fournisseur){
  const img = imageDeTest();
  const ctl = new AbortController();
  const minuteur = setTimeout(()=>ctl.abort(), 45000);
  const t0 = performance.now();
  try{
    const txt = await (fournisseur === "claude" ? claude : gemini)([
      { text:'Recopie exactement le texte écrit sur cette image. Réponds UNIQUEMENT par un objet JSON : {"texte":""}' },
      { inline_data:{ mime_type:"image/jpeg", data: img.b64 } }
    ], { modele:id, cle, signal:ctl.signal, maxTokens:2048 });
    const ms = Math.round(performance.now() - t0);
    const lu = txt.replace(/\D/g,"");
    return lu.includes(img.n)
      ? { etat:"ok", ms, detail:`lit l'image en ${(ms/1000).toFixed(1).replace(".",",")} s` }
      : { etat:"aveugle", ms, detail:"répond mais ne lit pas l'image correctement" };
  }catch(e){
    if (e.name === "AbortError") return { etat:"delai", detail:"pas de réponse en 45 s" };
    const st = e.statut;
    if (st === 404) return { etat:"indispo", detail:"retiré ou indisponible (404)" };
    if (st === 429) return { etat:"quota", detail:"quota épuisé ou hors offre gratuite (429)" };
    if (st === 403) return { etat:"refus", detail:"accès refusé à cette clé (403)" };
    if (st === 401) return { etat:"refus", detail:"clé refusée (401)" };
    if (st === 402) return { etat:"quota", detail:"crédit insuffisant" };
    return { etat:"erreur", detail: String(e.message||e).split("\n")[0].slice(0,140) };
  }finally{ clearTimeout(minuteur); }
}

/* Mémoire des tests de modèles Gemini : chaque test COMPLÈTE la mémoire au lieu de l'écraser.
   Par modèle : dernier état, temps du dernier test, historique des tests, temps des vraies analyses. */
function lireTestsModeles(){
  try{ const t = JSON.parse(localStorage.getItem(CLE_MODELES)||"null"); if (t && Array.isArray(t.liste)) return t; }catch(e){}
  return null;
}
function ecrireTestsModeles(t){ try{ localStorage.setItem(CLE_MODELES, JSON.stringify(t)); }catch(e){} }
function enregistrerTestModele(res){
  const t = lireTestsModeles() || { date:null, liste:[] };
  const maintenant = new Date().toISOString();
  let m = t.liste.find(x=>x.id === res.id);
  if (!m){ m = { id:res.id, nom:res.nom || "" }; t.liste.push(m); }
  Object.assign(m, { etat:res.etat, detail:res.detail, ms:res.ms, dateTest:maintenant, nom: res.nom || m.nom });
  m.historique = (m.historique || []).concat([{ date:maintenant, etat:res.etat, ms:res.ms }]).slice(-10);
  t.date = maintenant;
  ecrireTestsModeles(t);
  return m;
}
/* temps d'une vraie analyse (photo de rayonnage) réussie avec un modèle */
function enregistrerTempsAnalyse(id, ms){
  if (!id || !ms) return;
  const t = lireTestsModeles() || { date:null, liste:[] };
  let m = t.liste.find(x=>x.id === id);
  if (!m){ m = { id, nom:"" }; t.liste.push(m); }
  m.analyses = (m.analyses || []).concat([{ date:new Date().toISOString(), ms }]).slice(-10);
  ecrireTestsModeles(t);
}
const secondes = (ms)=> ms == null ? "—" : (ms/1000).toFixed(1).replace(".", ",") + " s";
function vitesseModele(m){
  if (!m) return "";
  const morceaux = [];
  const okTests = (m.historique || []).filter(h=>h.etat === "ok" && h.ms);
  if (m.etat === "ok" && m.ms) morceaux.push(`test ${secondes(m.ms)}` + (okTests.length > 1 ? ` (moy. ${secondes(okTests.reduce((s,h)=>s+h.ms,0)/okTests.length)} sur ${okTests.length})` : ""));
  const an = m.analyses || [];
  if (an.length) morceaux.push(`analyses réelles ~${secondes(an.reduce((s,h)=>s+h.ms,0)/an.length)} (${an.length})`);
  return morceaux.join(" · ");
}


const ICONE_ETAT = { ok:"✅", aveugle:"👁️‍🗨️", indispo:"🚫", quota:"⏳", refus:"🔒", delai:"⌛", erreur:"❌", attente:"…" };

/* Fenêtre de recherche. surChoix(id) est appelé quand l'utilisateur adopte un modèle. */
function chercherModeles(cle, surChoix){
  if (!cle){ toast("Saisissez d'abord la clé API Gemini."); return; }
  let arret = false, enCours = false;
  const f = modale({
    titre:"Trouver un modèle Gemini",
    html:
      `<div class="aide" style="margin-top:0">Google retire régulièrement d'anciens modèles. Cet outil demande la liste des modèles ouverts à votre clé, puis envoie à chacun une petite image contenant un nombre à lire : seuls ceux qui le lisent sont capables d'analyser vos photos.</div>
       <div class="encadre">Modèle actuel : <b>${esc(cfg.modele)}</b></div>
       <div id="mEtat" class="aide"></div>
       <div class="progres" id="mProg" hidden><div id="mProgT"></div><div class="barreint"><i id="mProgB"></i></div></div>
       <div id="mListe" class="modeles"></div>
       <div id="mReco"></div>`,
    boutons:[
      {texte:"Fermer", action:()=>{ arret = true; }},
      {texte:"Tout tester", garder:true, action:()=>{ lancer(false); return false; }},
      {texte:"Jusqu'au premier qui marche", classe:"principal", garder:true, action:()=>{ lancer(true); return false; }}
    ],
    surFermeture:()=>{ arret = true; }
  });
  const etat = f.querySelector("#mEtat"), liste = f.querySelector("#mListe"), reco = f.querySelector("#mReco");
  const boutonsLancer = [...f.querySelectorAll(".pied .btn")].slice(1);

  const adopter = (id)=>{
    cfg.modele = id; sauverCfg(); delete iaEnPanne.gemini;
    if (surChoix) surChoix(id);
    toast("Modèle adopté : " + id);
    f.querySelectorAll(".encadre b")[0].textContent = id;
  };

  const ligne = (m, r)=>{
    const d = document.createElement("div");
    d.className = "mod" + (r.etat==="ok" ? " ok" : "");
    d.dataset.id = m.id;
    d.innerHTML = `<span style="font-size:18px">${ICONE_ETAT[r.etat]||"?"}</span>
      <div class="txtMod"><div class="nomMod">${esc(m.id)}${m.id===cfg.modele?" <span class='detMod'>(actuel)</span>":""}</div>
      <div class="detMod">${esc(r.detail||"")}${m.nom?" · "+esc(m.nom):""}</div>
      ${vitesseModele(r) || r.dateTest ? `<div class="detMod">⏱ ${esc(vitesseModele(r) || "—")}${r.dateTest ? " · testé le " + esc(dateFr(r.dateTest)) : ""}</div>` : ""}</div>
      ${r.etat==="ok" ? `<button class="btn vert">Utiliser</button>` : ""}`;
    const b = d.querySelector("button");
    if (b) b.onclick = ()=>adopter(m.id);
    return d;
  };

  const afficherReco = (resultats)=>{
    const bons = resultats.filter(x=>x.etat==="ok");
    liste.querySelectorAll(".mod").forEach(x=>x.classList.remove("reco"));
    if (!bons.length){
      reco.innerHTML = resultats.length ? `<div class="encadre">Aucun modèle testé ne lit les images avec cette clé. Vérifiez la clé, ou réessayez plus tard si ce sont des quotas épuisés (⏳).</div>` : "";
      return;
    }
    // Recommandé : le premier qui marche dans l'ordre de préférence, en évitant « lite » s'il y a mieux.
    const choix = bons.find(x=>!/lite/i.test(x.id)) || bons[0];
    const el = liste.querySelector(`.mod[data-id="${CSS.escape(choix.id)}"]`);
    if (el) el.classList.add("reco");
    reco.innerHTML = `<div class="encadre">⭐ Recommandé : <b>${esc(choix.id)}</b>${/latest$/i.test(choix.id)?" — cet alias suit automatiquement la dernière version, il ne devrait pas disparaître.":""}
      ${choix.id===cfg.modele ? "<br>C'est déjà le modèle utilisé." : `<br><button class="btn principal plein" id="mAdopter" style="margin-top:8px">Utiliser ${esc(choix.id)}</button>`}</div>`;
    const b = reco.querySelector("#mAdopter");
    if (b) b.onclick = ()=>{ adopter(choix.id); b.remove(); };
  };

  // toute la mémoire des tests, modèles qui marchent du plus rapide au plus lent
  function afficherMemoire(){
    const t = lireTestsModeles();
    if (!t) return;
    liste.innerHTML = "";
    t.liste.slice().sort((a, b)=>{
      const oa = a.etat === "ok" ? 0 : 1, ob = b.etat === "ok" ? 0 : 1;
      if (oa !== ob) return oa - ob;
      if (!oa) return (a.ms || 1e9) - (b.ms || 1e9);
      return rangModele(a.id).localeCompare(rangModele(b.id));
    }).forEach(x=>liste.appendChild(ligne(x, x)));
    afficherReco(t.liste);
  }
  // Affiche le dernier test conservé
  const ancien = lireTestsModeles();
  if (ancien){
    etat.textContent = `Dernier test : ${dateFr(ancien.date)} — ${ancien.liste.filter(x=>x.etat==="ok").length} modèle(s) opérationnel(s) sur ${ancien.liste.length} testé(s). Relancez un test pour mettre à jour.`;
    afficherMemoire();
  } else {
    etat.textContent = "Aucun test encore fait sur cet appareil. « Jusqu'au premier qui marche » est le plus rapide ; « Tout tester » donne le tableau complet.";
  }

  async function lancer(premierSeul){
    if (enCours) return;
    enCours = true; arret = false;
    boutonsLancer.forEach(b=>b.disabled = true);
    liste.innerHTML = ""; reco.innerHTML = "";
    etat.textContent = "Demande de la liste des modèles à Google…";
    let cands;
    try{
      const r = await listerModelesGemini(cle);
      cands = r.candidats;
      etat.textContent = `${r.total} modèle(s) ouverts à votre clé, dont ${cands.length} capable(s) a priori d'analyser une photo. Essai de chacun…`;
    }catch(e){
      etat.textContent = "Échec : " + e.message;
      enCours = false; boutonsLancer.forEach(b=>b.disabled = false);
      return;
    }
    const prog = f.querySelector("#mProg"), progT = f.querySelector("#mProgT"), progB = f.querySelector("#mProgB");
    prog.hidden = false;
    const resultats = [];
    for (let i=0; i<cands.length; i++){
      if (arret || !f.isConnected) break;
      const m = cands[i];
      progT.textContent = `Testés : ${i} / ${cands.length} — restants : ${cands.length-i} · essai de ${m.id}…`;
      progB.style.width = Math.round(i*100/cands.length) + "%";
      const r = await testerModele(m.id, cle);
      const res = enregistrerTestModele(Object.assign({ id:m.id, nom:m.nom }, r));
      resultats.push(res);
      liste.appendChild(ligne(m, res));
      if (premierSeul && r.etat === "ok") break;
    }
    const n = resultats.length;
    progT.textContent = `Testés : ${n} / ${cands.length} — restants : ${cands.length-n}${arret?" (arrêté)":""}`;
    progB.style.width = cands.length ? Math.round(n*100/cands.length) + "%" : "100%";
    const bons = resultats.filter(x=>x.etat==="ok").length;
    etat.textContent = `${bons} modèle(s) opérationnel(s) sur ${n} testé(s).` + (premierSeul && bons && n<cands.length ? " « Tout tester » pour voir les autres." : "");
    afficherMemoire();
    const memo = lireTestsModeles();

    if (surChoix) surChoix(cfg.modele);
    enCours = false; boutonsLancer.forEach(b=>b.disabled = false);
  }
}

/* Remplit la liste déroulante des modèles : modèles testés opérationnels d'abord, puis les autres connus. */
function majSelectModeles(sel, choisi){
  const t = lireTestsModeles();
  const ok = t ? t.liste.filter(x=>x.etat==="ok").map(x=>x.id) : [];
  const ko = t ? t.liste.filter(x=>x.etat!=="ok").map(x=>x.id) : [];
  const base = ["gemini-flash-latest","gemini-2.5-flash","gemini-2.5-pro"];
  const tous = [...new Set([choisi || cfg.modele, ...ok, ...base.filter(x=>!ko.includes(x))])].filter(Boolean);
  const infos = {}; (t ? t.liste : []).forEach(x=>infos[x.id] = x);
  sel.innerHTML = tous.map(m=>{
    const marque = ok.includes(m) ? "✅ " : ko.includes(m) ? "⚠️ " : "";
    const x = infos[m];
    const temps = x && x.etat === "ok" && x.ms ? " — " + secondes(x.ms) + ((x.analyses||[]).length ? " / analyse ~" + secondes(x.analyses.reduce((s,h)=>s+h.ms,0)/x.analyses.length) : "") : "";
    return `<option value="${esc(m)}" ${m===(choisi||cfg.modele)?"selected":""}>${marque}${esc(m)}${temps}</option>`;
  }).join("");
}

function jsonDepuisTexte(txt){
  let t = txt.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  const d = t.indexOf("{"), f = t.lastIndexOf("}");
  if (d > 0 || (f >= 0 && f < t.length-1)) t = t.slice(d>=0?d:0, f>=0?f+1:undefined);
  return JSON.parse(t);
}

/* Analyse d'un compartiment : une photo, ou deux photos (rang de devant + rang de derrière)
   envoyées ensemble pour que Gemini produise une liste unique sans doublon. */
/* portée d'une analyse : "deux" (les deux rangs), "devant" ou "derriere" (une seule photo) */
function porteeParDefaut(cs){ return cs && cs.photo && cs.photo2 ? "deux" : (cs && cs.photo ? "devant" : "derriere"); }
/* rang de chaque livre selon la portée + mémorisation de la portée dans la liste */
function finaliserPortee(livres, portee, cs){
  if (portee === "devant" && cs && cs.photo2) livres.forEach(lv=>{ lv.rang = "devant"; });
  if (portee === "derriere") livres.forEach(lv=>{ lv.rang = "derriere"; });
  // position sur la photo analysée
  if (portee !== "deux") livres.forEach(lv=>{
    if (lv.x1 != null){ ajouterVue(lv, { champ: portee === "derriere" ? "photo2" : "photo", x1:lv.x1, x2:lv.x2 }); }
    delete lv.x1; delete lv.x2;
  });
  livres.portee = portee;
  return livres;
}
async function analyserPhoto(bib, cle, opts){
  opts = opts || {};
  const cs = bib.cases[cle];
  const portee = opts.portee || porteeParDefaut(cs);
  const deux = portee === "deux" && !!(cs && cs.photo && cs.photo2);
  const avant = cs && cs.photo && portee !== "derriere" ? await photoPleine(bib, cle, "photo") : null;
  const arriere = cs && cs.photo2 && portee !== "devant" ? await photoPleine(bib, cle, "photo2") : null;
  if (!avant && !arriere) throw new Error("Photo introuvable (ni sur cet appareil ni sur GitHub).");
  if (deux && (!avant || !arriere)) throw new Error("Une des deux photos du compartiment est introuvable (ni sur cet appareil ni sur GitHub).");

  let parties;
  if (deux){
    parties = [
      { text: cfg.qAnalyse2 || QUESTION_DEUX_RANGS_DEFAUT },
      { text: "Photo 1 (compartiment tel quel, rang de devant) :" },
      { inline_data: { mime_type:"image/jpeg", data: base64Seul(avant) } },
      { text: "Photo 2 (après avoir retiré les livres de devant, rang de derrière) :" },
      { inline_data: { mime_type:"image/jpeg", data: base64Seul(arriere) } }
    ];
  } else {
    parties = [
      { text: cfg.qAnalyse + CONSIGNE_POSITION },
      { inline_data: { mime_type:"image/jpeg", data: base64Seul(avant || arriere) } }
    ];
  }
  let rep;
  try{ rep = await interrogerIA(parties, jsonDepuisTexte, opts); }
  catch(e){ e.portee = portee; throw e; }
  const livresA = finaliserPortee(livresDepuisReponse(rep.res, deux, !!avant, { ia:rep.ia, modele:rep.modele, echecs:rep.echecs }), portee, cs);
  journal(`Analyse IA de ${cle} (${portee}, ${rep.ia} ${rep.modele || ""}) : ${livresA.length} livre(s)`);
  journaliserResultat(bib, cle, "analyse", { portee, source:{ ia:rep.ia, modele:rep.modele }, livres: livresA.map(l=>Object.assign({}, l)) });
  return livresA;
}

/* Transforme la réponse JSON d'une IA en livres (commun à Gemini, Claude par clé et Claude par copier-coller). */
function livresDepuisReponse(j, deux, avecAvant, source){
  const bruts = Array.isArray(j && j.livres) ? j.livres : (Array.isArray(j) ? j : []);
  const livres = bruts.filter(x=>x && String(x.titre||"").trim()).map(x=>{
    const lv = {
      id: uid(),
      titre: String(x.titre||"").trim(),
      auteur: String(x.auteur||"").trim(),
      annee: String(x.annee||"").trim(),
      certitude: ["haute","moyenne","faible"].includes(x.certitude) ? x.certitude : "moyenne",
      remarque: String(x.remarque||"").trim(),
      resume:"", categorie:"",
      origine:"ia"
    };
    const pos = lirePosition(x);
    if (pos && !deux){ lv.x1 = pos.x1; lv.x2 = pos.x2; }
    if (deux){
      const r = String(x.rang||"").toLowerCase();
      lv.rang = /derri/.test(r) ? "derriere" : "devant";
    } else if (!avecAvant){
      lv.rang = "derriere";
    }
    return lv;
  });
  if (!deux){ livres.source = source; return livres; }
  const fus = fusionnerDoublons(livres);
  fus.fusionnes = livres.length - fus.length;
  fus.source = source;
  return fus;
}

/* Filet de sécurité : même titre (et même auteur, ou auteur absent d'un côté) = même livre. */
function normaliser(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g," ").replace(/^(le|la|les|l|un|une|des|the) /,"").trim();
}
function fusionnerDoublons(livres){
  const rangC = { haute:3, moyenne:2, faible:1 };
  const res = [];
  livres.forEach(lv=>{
    const t = normaliser(lv.titre), a = normaliser(lv.auteur);
    const d = res.find(x=>normaliser(x.titre) === t && (!a || !normaliser(x.auteur) || normaliser(x.auteur) === a));
    if (!d){ res.push(lv); return; }
    if (!d.auteur && lv.auteur) d.auteur = lv.auteur;
    if (!d.annee && lv.annee) d.annee = lv.annee;
    if (!d.remarque && lv.remarque) d.remarque = lv.remarque;
    if ((rangC[lv.certitude]||0) > (rangC[d.certitude]||0)) d.certitude = lv.certitude;
    if (lv.rang === "derriere") d.rang = "derriere";   // vu sur la photo du fond : il est derrière
  });
  return res;
}

function texteBilanAnalyse(livres){
  return texteBilanSimple(livres) + texteSource(livres.source);
}
/* Vrai si chaque photo présente du compartiment a été analysée après sa dernière modification.
   Données antérieures sans trace d'analyse : un compartiment à une seule photo et avec des livres est réputé analysé. */
/* Date de la dernière analyse de chaque rang. Les analyses anciennes (sans détail par rang) valent pour les deux rangs. */
function datesAnalyseRangs(cs){
  const a = cs && cs.analyse;
  if (!a) return {};
  return a.rangs ? Object.assign({}, a.rangs) : { devant:a.maj, derriere:a.maj };
}
/* État d'analyse d'un compartiment : null s'il n'a pas de livre, sinon
   { rangs: photos de devant/derrière toutes analysées, appoints: photos d'appoint toutes prises en compte } */
function etatAnalyse(cs){
  if (!cs || !(cs.livres||[]).length) return null;
  const appoints = cs.appoints || [];
  const presents = [["photo","devant"],["photo2","derriere"]].filter(([ch])=>cs[ch]);
  if (!presents.length && !appoints.length) return null;
  if (!cs.analyse) return { rangs: presents.length === 1, appoints: !appoints.length };
  const dates = datesAnalyseRangs(cs);
  const rangs = presents.every(([ch, r])=>(Date.parse(cs[ch].maj || "") || 0) <= (Date.parse(dates[r] || "") || 0));
  // une photo d'appoint compte comme prise en compte dès qu'une analyse ou un contrôle postérieur a eu lieu
  const tc = Math.max(Date.parse(cs.analyse.maj || "") || 0, Date.parse((cs.controle && cs.controle.maj) || "") || 0);
  return { rangs, appoints: appoints.every(a=>(Date.parse(a.maj || "") || 0) <= Math.max(tc, Date.parse(a.verif || "") || 0)) };
}
/* Vrai si chaque photo présente du compartiment a été analysée après sa dernière modification. */
function photosToutesAnalysees(cs){
  const e = etatAnalyse(cs);
  return !!(e && e.rangs && e.appoints);
}

function infoAnalyse(livres, cs){
  const src = livres.source || {};
  const maintenant = new Date().toISOString();
  const portee = livres.portee || porteeParDefaut(cs);
  const rangs = datesAnalyseRangs(cs);
  (portee === "deux" ? ["devant","derriere"] : [portee]).forEach(r=>{ rangs[r] = maintenant; });
  return { maj:maintenant, rangs, ia: src.ia || "gemini", modele: src.modele || cfg.modele, photos: cs.photo && cs.photo2 ? 2 : 1, manuel: !!src.manuel };
}
function texteBilanSimple(livres){
  if (!livres.some(x=>x.rang)) return livres.length + " livre(s) identifié(s).";
  const der = livres.filter(x=>x.rang==="derriere").length;
  return `${livres.length} livre(s) identifié(s) : ${livres.length-der} devant, ${der} derrière` +
         (livres.fusionnes ? ` (${livres.fusionnes} doublon(s) fusionné(s))` : "") + ".";
}

async function traiterParLots(livres, question, champs, titreFenetre, taille){
  const lot = taille || 20;
  const pg = fenetreProgres(titreFenetre);
  let fait = 0;
  try{
    for (let d=0; d<livres.length; d+=lot){
      const tranche = livres.slice(d, d+lot);
      pg.maj(fait, livres.length, `Lot ${Math.floor(d/lot)+1} sur ${Math.ceil(livres.length/lot)} — envoi à Gemini…`);
      const liste = tranche.map((lv,i)=>`${i}. ${lv.titre}${lv.auteur?" — "+lv.auteur:""}${lv.annee?" ("+lv.annee+")":""}`).join("\n");
      const j = (await interrogerIA([{ text: question + "\n\nListe :\n" + liste }], jsonDepuisTexte)).res;
      (Array.isArray(j.livres)?j.livres:[]).forEach(rep=>{
        const i = Number(rep.i);
        if (!Number.isInteger(i) || i<0 || i>=tranche.length) return;
        champs.forEach(ch=>{
          const v = rep[ch];
          if (v != null && String(v).trim() && String(v).trim() !== "?") tranche[i][ch] = String(v).trim();
        });
      });
      fait += tranche.length;
      pg.maj(fait, livres.length, "");
      sauver();
    }
    pg.fermer();
    return true;
  }catch(e){
    pg.fermer();
    modale({titre:"Traitement interrompu",
      html:`<div>${fait} livre(s) sur ${livres.length} ont été traités avant l'erreur ; ils sont conservés.</div>
            <div class="aide">${esc(e.message)}</div>`, boutons:[{texte:"Fermer"}]});
    return false;
  }
}

function biblio(id){ return data.bibliotheques.find(b=>b.id===id) || null; }

function tousLesLivres(bib){
  const out = [];
  for (let r=1; r<=bib.rangees; r++)
    for (let c=1; c<=bib.compartiments; c++){
      const cs = bib.cases[clef(r,c)];
      if (cs) (cs.livres||[]).forEach(lv=>out.push({ livre:lv, r, c }));
    }
  Object.keys(bib.cases||{}).forEach(k=>{
    const [r,c] = k.split("-").map(Number);
    if (r>bib.rangees || c>bib.compartiments)
      (bib.cases[k].livres||[]).forEach(lv=>out.push({ livre:lv, r, c, horsGrille:true }));
  });
  return out;
}
function compteLivres(bib){ return tousLesLivres(bib).length; }
function comptePhotos(bib){ return Object.keys(bib.cases||{}).reduce((n,k)=>n + champsPhotoCase(bib.cases[k]).length, 0); }

/* résultats de la recherche au-dessus de la grille */
function afficherRechercheBiblio(b){
  const z = $("#bRechRes");
  if (!z) return;
  const q = rechercheBiblio.trim();
  if (!q){ z.innerHTML = ""; return; }
  const tous = [];
  Object.entries(b.cases || {}).forEach(([k, cs])=>(cs.livres || []).forEach(lv=>tous.push({ k, cs, lv })));
  const tri = tous.map(o=>Object.assign(o, { s: scoreRecherche(q, o.lv) })).filter(o=>o.s > 0.45).sort((a, z2)=>z2.s - a.s);
  if (!tri.length){ z.innerHTML = `<div class="aide">Aucun livre ne correspond encore : continuez à taper.</div>`; return; }
  // tous ceux qui correspondent presque aussi bien que le meilleur (ex. tous les livres d'un auteur)
  const groupe = tri.filter(o=>o.s >= tri[0].s - 0.12);
  const net = groupe.length === 1;
  const ou = (o)=>{
    const [r, c] = o.k.split("-");
    const rg = o.lv.rang === "derriere" ? "derriere" : "devant";
    const memeRang = (o.cs.livres || []).filter(x=>(x.rang === "derriere" ? "derriere" : "devant") === rg);
    const deux = !!o.cs.photo2 || (o.cs.livres || []).some(x=>x.rang === "derriere");
    return `rangée ${r}, compartiment ${c}${deux ? (rg === "derriere" ? ", rang de derrière" : ", rang de devant") : ""} — ${memeRang.indexOf(o.lv) + 1}${memeRang.indexOf(o.lv) ? "e" : "er"} livre en partant de la gauche`;
  };
  const carte = (o, i, principal)=>`<div class="prop" style="display:flex;gap:10px;align-items:center;${principal ? "border-left:3px solid var(--vert)" : ""}">
      <div style="flex:1"><div class="t">${esc(o.lv.titre)}</div><div class="chg">${esc(o.lv.auteur || "auteur inconnu")}</div><div class="aide" style="margin:2px 0 0">${esc(ou(o))}</div></div>
      <button class="btn ${principal ? "principal" : ""}" data-loc="${i}">📍 Localiser</button></div>`;
  const pos = (o)=>{ const [r, c] = o.k.split("-").map(Number); return r * 1000 + c * 10 + (o.lv.rang === "derriere" ? 1 : 0); };
  const MAX = 80;
  const liste = net ? [tri[0]] : groupe.slice().sort((a, z2)=>pos(a) - pos(z2) || a.cs.livres.indexOf(a.lv) - z2.cs.livres.indexOf(z2.lv)).slice(0, MAX);
  const nbCases = new Set(groupe.map(o=>o.k + (o.lv.rang === "derriere" ? "|d" : ""))).size;
  z.innerHTML = `<div class="aide" style="margin:6px 0 4px">${net ? "Livre trouvé :" : `<b>${groupe.length}</b> livres correspondent${groupe.length > MAX ? ` (${MAX} premiers affichés)` : ""} — continuez à taper pour préciser :`}</div>` +
    (!net ? `<button class="btn principal plein" id="bLocTous" style="margin-bottom:6px">📍 Localiser tous (${nbCases} emplacement${nbCases > 1 ? "s" : ""})</button>` : "") +
    `<div style="${!net && liste.length > 6 ? "max-height:50vh;overflow:auto;border:1px solid var(--trait);border-radius:10px;padding:4px" : ""}">` +
    liste.map((o, i)=>carte(o, i, net)).join("") + `</div>`;
  const bT = z.querySelector("#bLocTous");
  if (bT) bT.onclick = ()=>{
    const devant = groupe.filter(o=>o.lv.rang !== "derriere").length, derriere = groupe.length - devant;
    if (!(vueRangee === "derriere" ? derriere : devant)) vueRangee = vueRangee === "derriere" ? "devant" : "derriere";
    caseCible = { bib: b.id, ks: new Set(groupe.map(o=>o.k + "|" + (o.lv.rang === "derriere" ? "derriere" : "devant"))) };
    rendreBiblio();
    const el = document.querySelector("#vueBiblio .case .cadreCible");
    if (el) el.closest(".case").scrollIntoView({ behavior:"smooth", block:"center" });
    toast(`${groupe.length} livre(s) : ${devant} en rangée de devant, ${derriere} en rangée de derrière.` + (devant && derriere ? " Basculez Rangées 1 / Rangées 2 pour voir les autres." : ""), 7000);
  };
  z.querySelectorAll("[data-loc]").forEach(bt=>bt.onclick = ()=>{
    const o = liste[Number(bt.dataset.loc)];
    vueRangee = o.lv.rang === "derriere" ? "derriere" : "devant";
    caseCible = { bib: b.id, k: o.k };
    rendreBiblio();
    const el = document.querySelector(`#vueBiblio [data-case="${o.k}"]`);
    if (el) el.scrollIntoView({ behavior:"smooth", block:"center" });
    toast(`« ${o.lv.titre} » : ${ou(o)}.`, 6000);
    journal(`Livre localisé : « ${o.lv.titre} » (${o.k}${vueRangee === "derriere" ? ", derrière" : ""})`);
  });
}
