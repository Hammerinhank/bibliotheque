function ligneLivre(lv, o, empl){
  let s = lv.titre;
  if (o.auteur && lv.auteur) s += " — " + lv.auteur;
  if (o.annee && lv.annee) s += " (" + lv.annee + ")";
  if (o.emplacement && empl) s += "  [R" + empl.r + "C" + empl.c + (lv.rang === "derriere" ? ", derrière" : "") + "]";
  if (o.emplacement && !empl && lv.rang === "derriere") s += "  [derrière]";
  if (lv.certitude === "faible") s += "  (lecture incertaine)";
  if (o.resume && lv.resume) s += "\n     " + lv.resume;
  return s;
}

function texteListe(b, o){
  const L = [];
  L.push("BIBLIOTHÈQUE : " + b.nom + (b.lieu ? " (" + b.lieu + ")" : ""));
  L.push("Généré le " + dateFr());
  L.push("");
  L.push("═══ LIVRES PAR COMPARTIMENT ═══");
  L.push("");
  const parcourir = (r,c,horsGrille)=>{
    const cs = b.cases[clef(r,c)];
    if (!cs) return;
    const l = cs.livres || [];
    L.push("— Rangée " + r + " · compartiment " + c + (horsGrille ? " (hors grille)" : "") +
           " — " + l.length + " livre(s)" + (cs.photo2 ? " — deux rangs" : "") + (cs.photo || cs.photo2 ? "" : " — pas de photo"));
    if (!l.length) L.push("   (vide)");
    l.forEach((lv,i)=>L.push("   " + (i+1) + ". " + ligneLivre(lv, o, null)));
    L.push("");
  };
  for (let r=1; r<=b.rangees; r++) for (let c=1; c<=b.compartiments; c++) parcourir(r,c,false);
  Object.keys(b.cases||{}).forEach(k=>{
    const [r,c] = k.split("-").map(Number);
    if (r>b.rangees || c>b.compartiments) parcourir(r,c,true);
  });

  const tri = tousLesLivres(b).slice().sort((a,z)=>
    (a.livre.titre||"").localeCompare(z.livre.titre||"", "fr", {sensitivity:"base"}));
  const distincts = new Set(tri.map(x=>(x.livre.titre||"").toLowerCase().trim()+"|"+(x.livre.auteur||"").toLowerCase().trim()));
  L.push("═══ LISTE EXHAUSTIVE — " + tri.length + " livre(s), " + distincts.size + " titre(s) distinct(s) ═══");
  L.push("");
  tri.forEach((x,i)=>L.push((o.numeroter ? (i+1) + ". " : "• ") + ligneLivre(x.livre, o, {r:x.r,c:x.c})));
  return L.join("\n");
}

   ==================================================================== */
function chargerJsPDF(){
  return new Promise((res,rej)=>{
    if (window.jspdf && window.jspdf.jsPDF) return res(window.jspdf.jsPDF);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = ()=> (window.jspdf && window.jspdf.jsPDF) ? res(window.jspdf.jsPDF) : rej(new Error("jsPDF indisponible"));
    s.onerror = ()=>rej(new Error("Téléchargement de la bibliothèque PDF impossible (réseau ?)"));
    document.head.appendChild(s);
  });
}

async function lancerPdf(b){
  const tous = tousLesLivres(b).map(x=>x.livre);
  if (!tous.length){ toast("Aucun livre relevé : analysez d'abord des photos."); return; }
  const sansCat = tous.filter(lv=>!lv.categorie);
  if (sansCat.length){
    const ok = await confirmer(
      `${sansCat.length} livre(s) sur ${tous.length} n'ont pas encore de catégorie thématique.<br><br>Demander leur classement à Gemini maintenant ?`,
      "Classement thématique", "Classer");
    if (ok){
      const fini = await traiterParLots(sansCat, cfg.qCategorie, ["categorie"], "Classement thématique", 30);
      if (!fini) return;
    }
  }
  try{
    const jsPDF = await chargerJsPDF();
    const blob = construirePdf(jsPDF, b, tous);
    const url = URL.createObjectURL(blob);
    const nom = "bibliotheque-" + b.nom.replace(/[^\w\-]+/g,"_") + "-" + new Date().toISOString().slice(0,10) + ".pdf";
    modale({ titre:"PDF classé par thèmes",
      html:`<div>PDF prêt : ${tous.length} livre(s).</div>
            <div class="aide">Sur iPhone, « Ouvrir » affiche le PDF dans un onglet ; le bouton de partage permet ensuite de l'enregistrer dans Fichiers.</div>`,
      boutons:[
        {texte:"Fermer", action:()=>setTimeout(()=>URL.revokeObjectURL(url), 60000)},
        {texte:"Ouvrir", garder:true, action:()=>window.open(url,"_blank")},
        {texte:"Télécharger", classe:"principal", garder:true, action:()=>{
          const a = document.createElement("a"); a.href=url; a.download=nom;
          document.body.appendChild(a); a.click(); a.remove();
        }}
      ]});
  }catch(e){
    modale({titre:"PDF impossible", html:`<div class="aide">${esc(e.message)}</div>`, boutons:[{texte:"Fermer"}]});
  }
}

function construirePdf(jsPDF, b, livres){
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const MG = 18, LARG = 210 - MG*2;
  let y = MG;
  const groupes = {};
  livres.forEach(lv=>{
    const cat = (lv.categorie || "Non classé").trim();
    (groupes[cat] = groupes[cat] || []).push(lv);
  });
  const cats = Object.keys(groupes).sort((a,z)=>{
    if (a === "Non classé") return 1;
    if (z === "Non classé") return -1;
    return a.localeCompare(z, "fr");
  });
  const saut = (h)=>{ if (y + h > 297 - MG){ doc.addPage(); y = MG; } };

  doc.setFont("helvetica","bold"); doc.setFontSize(20);
  doc.text(b.nom, MG, y); y += 9;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110);
  doc.text(`${livres.length} livres, ${cats.length} catégories${b.lieu ? " — " + b.lieu : ""} — ${new Date().toLocaleDateString("fr-FR")}`, MG, y);
  y += 4; doc.setDrawColor(190); doc.line(MG, y, MG+LARG, y); y += 9;
  doc.setTextColor(0);

  cats.forEach(cat=>{
    const l = groupes[cat].slice().sort((x,z)=>{
      const d = (x.auteur||"zzz").localeCompare(z.auteur||"zzz","fr",{sensitivity:"base"});
      return d !== 0 ? d : (x.titre||"").localeCompare(z.titre||"","fr",{sensitivity:"base"});
    });
    saut(16);
    doc.setFont("helvetica","bold"); doc.setFontSize(13);
    doc.text(cat + "  (" + l.length + ")", MG, y); y += 2;
    doc.setDrawColor(150); doc.line(MG, y, MG+LARG, y); y += 6;
    l.forEach(lv=>{
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
      let entete = lv.titre;
      if (lv.auteur) entete += " — " + lv.auteur;
      if (lv.annee) entete += " (" + lv.annee + ")";
      const lignes = doc.splitTextToSize(entete, LARG);
      saut(lignes.length*5 + (lv.resume?6:0) + 2);
      doc.text(lignes, MG, y); y += lignes.length*5;
      if (lv.resume){
        doc.setFont("helvetica","italic"); doc.setFontSize(9.5); doc.setTextColor(95);
        const lr = doc.splitTextToSize(lv.resume, LARG - 4);
        saut(lr.length*4.4 + 2);
        doc.text(lr, MG+4, y); y += lr.length*4.4;
        doc.setTextColor(0);
      }
      y += 2.5;
    });
    y += 4;
  });

  const n = doc.getNumberOfPages();
  for (let p=1; p<=n; p++){
    doc.setPage(p);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(b.nom + " — page " + p + " / " + n, 105, 290, {align:"center"});
  }
  return doc.output("blob");
}

         <div class="aide">Le jeton reste sur l'appareil. Les données iront dans ${FICHIER_JSON} et les photos dans images/&lt;bibliothèque&gt;/&lt;rangée-compartiment&gt;.jpg.</div>
         <button class="btn" id="rTest" style="margin-top:10px">Tester l'accès au dépôt</button>
         <div id="rStatut" class="aide"></div>
       </div>

       <div id="pQuestions" hidden>
         <label for="qA">Question posée pour analyser une photo</label>
         <textarea id="qA" style="min-height:160px">${esc(cfg.qAnalyse)}</textarea>
         <button class="btn" id="qAr" style="margin-top:6px">Texte par défaut</button>
         <label for="qA2">Question pour un compartiment à deux rangs (photo de devant + photo de derrière)</label>
         <textarea id="qA2" style="min-height:180px">${esc(cfg.qAnalyse2 || QUESTION_DEUX_RANGS_DEFAUT)}</textarea>
         <button class="btn" id="qA2r" style="margin-top:6px">Texte par défaut</button>
         <label for="qAp">Question pour le contrôle par les photos d'appoint</label>
         <textarea id="qAp" style="min-height:180px">${esc(cfg.qAppoint || QUESTION_APPOINT_DEFAUT)}</textarea>
         <button class="btn" id="qApr" style="margin-top:6px">Texte par défaut</button>
         <label for="qR">Question posée pour les résumés</label>
         <textarea id="qR" style="min-height:140px">${esc(cfg.qResume)}</textarea>
         <button class="btn" id="qRr" style="margin-top:6px">Texte par défaut</button>
         <label for="qC">Question posée pour les catégories</label>
         <textarea id="qC" style="min-height:120px">${esc(cfg.qCategorie)}</textarea>
         <button class="btn" id="qCr" style="margin-top:6px">Texte par défaut</button>
       </div>

       <div id="pEntretien" hidden>
         <div id="rStats"></div>
         <div class="sep"></div>
         <button class="btn rouge plein" id="dEffacer">Effacer les données de cet appareil</button>
         <div class="aide">GitHub n'est pas touché : les données pourront être récupérées via ☁️ si elles y ont été envoyées. Pensez à exporter un fichier avant, par sécurité.</div>
       </div>`,
    boutons:[
      {texte:"Fermer"},
      {texte:"Enregistrer", classe:"principal", garder:true, action:(fd)=>{
        const cle = fd.querySelector("#rCle").value.trim();
        if (cle) localStorage.setItem(CLE_GEM, cle); else localStorage.removeItem(CLE_GEM);
        cfg.modele = fd.querySelector("#rModele").value;
        const cleC = fd.querySelector("#rCleClaude").value.trim();
        if (cleC) localStorage.setItem(CLE_CLAUDE, cleC); else localStorage.removeItem(CLE_CLAUDE);
        cfg.modeleClaude = fd.querySelector("#rModeleClaude").value || CFG_DEFAUT.modeleClaude;
        cfg.iaPrincipale = fd.querySelector("#rIa").value;
        cfg.secours = fd.querySelector("#rSecours").checked;
        cfg.claudeMode = fd.querySelector("#rModeClaude").value;
        cfg.geminiMode = fd.querySelector("#rModeGemini").value;
        delete iaEnPanne.gemini; delete iaEnPanne.claude;   // nouvelle configuration : on redonne sa chance à chacune
        cfg.tailleMax = Math.max(600, Math.min(3000, parseInt(fd.querySelector("#rTaille").value,10)||1600));
        cfg.ghUser = fd.querySelector("#rUser").value.trim() || CFG_DEFAUT.ghUser;
        cfg.ghRepo = fd.querySelector("#rRepo").value.trim() || CFG_DEFAUT.ghRepo;
        cfg.ghBranche = fd.querySelector("#rBranche").value.trim() || "main";
        const tok = fd.querySelector("#rToken").value.trim();
        if (tok) localStorage.setItem(CLE_TOKEN, tok); else localStorage.removeItem(CLE_TOKEN);
        cfg.qAnalyse = fd.querySelector("#qA").value;
        cfg.qAnalyse2 = fd.querySelector("#qA2").value;
        cfg.qAppoint = fd.querySelector("#qAp").value;
        cfg.qResume = fd.querySelector("#qR").value;
        cfg.qCategorie = fd.querySelector("#qC").value;
        sauverCfg(); majBandeau();
        toast("Réglages enregistrés.");
        fd.remove();
      }}
    ]
  });

  const activer = (nom)=>{
    f.querySelectorAll("[data-o]").forEach(x=>x.classList.toggle("actif", x.dataset.o===nom));
    ["gemini","github","questions","entretien"].forEach(o=>{
      f.querySelector("#p"+o[0].toUpperCase()+o.slice(1)).hidden = (o !== nom);
    });
  };
  f.querySelectorAll("[data-o]").forEach(btn=>{ btn.onclick = ()=>activer(btn.dataset.o); });
  activer(ongletInitial || "gemini");

  const modeClaude = f.querySelector("#rModeClaude");
  const majModeClaude = ()=>{
    const manuel = modeClaude.value === "manuel";
    f.querySelector("#rBlocApiClaude").hidden = manuel;
    f.querySelector("#rAideModeClaude").textContent = manuel
      ? "Aucune clé ni facturation à l'usage. Depuis un compartiment, l'app copie la photo et ouvre Claude avec la question ; vous collez la photo en pièce jointe, puis copiez sa réponse et touchez le bouton vert « Copier la réponse de Claude ». Fonctionne photo par photo (pas pour une série, ni pour les résumés et le PDF)."
      : "La requête part directement vers l'API d'Anthropic, sans rien faire à la main ; il faut une clé API.";
  };
  modeClaude.onchange = majModeClaude;
  majModeClaude();

  const modeGemini = f.querySelector("#rModeGemini");
  const majModeGemini = ()=>{
    const manuel = modeGemini.value === "manuel";
    f.querySelector("#rBlocApiGemini").hidden = manuel;
    f.querySelector("#rAideModeGemini").textContent = manuel
      ? "Aucune clé API. Depuis un compartiment, l'app copie la photo et ouvre Gemini avec la question ; vous collez la photo, puis copiez sa réponse et touchez le bouton vert « Copier la réponse de Gemini ». Fonctionne photo par photo (pas pour une série, ni pour les résumés et le PDF)."
      : "La requête part directement vers l'API de Google, sans rien faire à la main ; il faut une clé API.";
  };
  modeGemini.onchange = majModeGemini;
  majModeGemini();

  const selClaude = f.querySelector("#rModeleClaude");
  majSelectClaude(selClaude, cfg.modeleClaude);
  const statutClaude = f.querySelector("#rStatutClaude");
  const lireCleClaude = ()=>{
    const c = f.querySelector("#rCleClaude").value.trim();
    if (c) localStorage.setItem(CLE_CLAUDE, c);
    if (!c) statutClaude.textContent = "Saisissez d'abord la clé API Claude.";
    return c;
  };
  f.querySelector("#rListeClaude").onclick = async ()=>{
    const c = lireCleClaude(); if (!c) return;
    statutClaude.textContent = "Demande de la liste à Anthropic…";
    try{
      const l = await listerModelesClaude(c);
      localStorage.setItem(CLE_MODELES_CLAUDE, JSON.stringify(l));
      majSelectClaude(selClaude, selClaude.value);
      statutClaude.textContent = l.length + " modèle(s) disponible(s) pour cette clé. Tous les modèles Claude récents lisent les images.";
    }catch(e){ statutClaude.textContent = "Échec : " + e.message; }
  };
  f.querySelector("#rTestClaude").onclick = async ()=>{
    const c = lireCleClaude(); if (!c) return;
    const m = selClaude.value;
    statutClaude.textContent = "Test de " + m + " : lecture d'un nombre sur une petite image…";
    const r = await testerModele(m, c, "claude");
    statutClaude.textContent = (ICONE_ETAT[r.etat]||"") + " " + m + " : " + r.detail + (r.etat==="ok" ? " — utilisable en secours." : "");
    if (r.etat === "ok") delete iaEnPanne.claude;
  };

  const selModele = f.querySelector("#rModele");
  majSelectModeles(selModele, cfg.modele);
  const infoModeles = ()=>{
    const t = lireTestsModeles();
    f.querySelector("#rInfoModeles").textContent = t
      ? `Dernier test : ${dateFr(t.date)} — ✅ = lit les photos, ⚠️ = a échoué au test. Les modèles changent : refaites le test si une analyse échoue.`
      : "Le bouton ci-dessus vérifie quels modèles sont disponibles pour votre clé et savent lire une photo, puis en recommande un.";
  };
  infoModeles();
  f.querySelector("#rTestGemini").onclick = async ()=>{
    const st = f.querySelector("#rStatutGemini");
    const cle = f.querySelector("#rCle").value.trim();
    if (!cle){ st.textContent = "Saisissez d'abord la clé API Gemini."; return; }
    localStorage.setItem(CLE_GEM, cle);
    const m = selModele.value;
    const btn = f.querySelector("#rTestGemini");
    btn.disabled = true;
    st.textContent = "Test de " + m + " : lecture d'un nombre sur une petite image…";
    const r = await testerModele(m, cle, "gemini");
    btn.disabled = false;
    st.textContent = (ICONE_ETAT[r.etat]||"") + " " + m + " : " + r.detail + (r.etat === "ok" ? " — utilisable pour les analyses." : " — choisissez un autre modèle ou touchez « Trouver un modèle qui marche ».");
    if (r.etat === "ok") delete iaEnPanne.gemini;
    // le résultat met à jour la marque ✅ / ⚠️ de la liste
    const t = lireTestsModeles() || { date:new Date().toISOString(), liste:[] };
    t.liste = t.liste.filter(x=>x.id !== m).concat([Object.assign({ id:m, nom:m }, r)]);
    try{ localStorage.setItem(CLE_MODELES, JSON.stringify(t)); }catch(e){}
    majSelectModeles(selModele, m);
  };
  f.querySelector("#rChercher").onclick = ()=>{
    const cle = f.querySelector("#rCle").value.trim();
    if (cle) localStorage.setItem(CLE_GEM, cle);
    chercherModeles(cle, id=>{ majSelectModeles(selModele, id); infoModeles(); });
  };

  f.querySelector("#qAr").onclick = ()=>{ f.querySelector("#qA").value = QUESTION_ANALYSE_DEFAUT; };
  f.querySelector("#qA2r").onclick = ()=>{ f.querySelector("#qA2").value = QUESTION_DEUX_RANGS_DEFAUT; };
  f.querySelector("#qApr").onclick = ()=>{ f.querySelector("#qAp").value = QUESTION_APPOINT_DEFAUT; };
  f.querySelector("#qRr").onclick = ()=>{ f.querySelector("#qR").value = QUESTION_RESUME_DEFAUT; };
  f.querySelector("#qCr").onclick = ()=>{ f.querySelector("#qC").value = QUESTION_CATEGORIE_DEFAUT; };

  f.querySelector("#rTest").onclick = async ()=>{
    const s = f.querySelector("#rStatut");
    cfg.ghUser = f.querySelector("#rUser").value.trim() || CFG_DEFAUT.ghUser;
    cfg.ghRepo = f.querySelector("#rRepo").value.trim() || CFG_DEFAUT.ghRepo;
    cfg.ghBranche = f.querySelector("#rBranche").value.trim() || "main";
    const tok = f.querySelector("#rToken").value.trim();
    if (tok) localStorage.setItem(CLE_TOKEN, tok);
    s.textContent = "Test en cours…";
    try{
      const t = await ghLireTexte(FICHIER_JSON);
      s.textContent = t === null
        ? "Dépôt accessible. " + FICHIER_JSON + " n'existe pas encore : il sera créé au premier envoi."
        : "Dépôt accessible, fichier trouvé (" + t.length + " caractères).";
      etatSync = "ok"; majBandeau();
    }catch(e){ s.textContent = "Échec : " + e.message; etatSync="echec"; majBandeau(); }
  };

  let octets = 0;
  try{ octets = (localStorage.getItem(CLE_DATA)||"").length; }catch(e){}
  const attente = photosEnAttente().length;
  f.querySelector("#rStats").innerHTML =
    `<div class="aide">${data.bibliotheques.length} bibliothèque(s) · 
      ${data.bibliotheques.reduce((n,b)=>n+compteLivres(b),0)} livre(s) · 
      ${data.bibliotheques.reduce((n,b)=>n+comptePhotos(b),0)} photo(s), dont ${attente} pas encore envoyée(s).<br>
      Mémoire de l'appareil utilisée : ${(octets/1024).toFixed(0)} Ko (limite du navigateur : environ 5 000 Ko).<br>
      Dernière modification : ${esc(dateFr(data.maj))||"—"}</div>`;

  f.querySelector("#dEffacer").onclick = async ()=>{
    const ok = await confirmer("Effacer toutes les bibliothèques enregistrées sur cet appareil ?", "Effacer", "Effacer");
    if (!ok) return;
    const ok2 = await confirmer("Dernière confirmation : l'effacement local est définitif.", "Effacer", "Effacer définitivement");
    if (!ok2) return;
    data = { bibliotheques:[], maj:null };
    biblioCourante = null; sale = false;
    sauver(false); rendre(); f.remove();
    toast("Données de cet appareil effacées.");
  };
}

/* ====================================================================
   HISTORIQUE DES VERSIONS
   ==================================================================== */
function ouvrirHistorique(){
  modale({
    titre:"Historique des versions",
    html:`<div class="hist">` + HISTORIQUE.map(h=>
      `<h3>${esc(h.v)} — ${esc(h.d)}</h3><ul>${h.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join("") + `</div>`,
    boutons:[{texte:"Fermer"}]
  });
}

/* ====================================================================
   DÉMARRAGE
   ==================================================================== */
$("#badgeVersion").onclick = ouvrirHistorique;
$("#btnSync").onclick = ouvrirSync;
$("#bandeau").onclick = ()=>{ if (!ghLisible()) ouvrirReglages("github"); else ouvrirSync(); };
$("#btnReglages").onclick = ()=>ouvrirReglages();
$("#btnAttenteClaude").onclick = ()=>recevoirReponseClaude(null);
$("#btnAnnulClaude").onclick = async ()=>{
  const a = lireAttenteClaude();
  const ok = await confirmer("Abandonner l'attente de la réponse de " + NOM_IA[(a && a.ia)||"claude"] + " ? Vous pourrez relancer la demande depuis le compartiment.", "Abandonner", "Abandonner");
  if (ok){ localStorage.removeItem(CLE_ATTENTE_CLAUDE); majAttenteClaude(); }
};
setTimeout(majAttenteClaude, 0);
$("#btnRetour").onclick = ()=>{ annulerSelection(); biblioCourante = null; rendreListe(); window.scrollTo(0,0); };
document.addEventListener("pointerup", ()=>{
  if (appuiLongActif){ appuiLongActif = false; ignorerClicJusqua = Date.now() + 450; }
}, true);
document.addEventListener("click", e=>{
  if (!selDepart) return;
  if (e.target.closest(".case, #barreSel, #zoneModales")) return;
  annulerSelection("Sélection annulée.");
});
document.addEventListener("keydown", e=>{
  if (e.key === "Escape"){
    const m = $("#zoneModales").lastElementChild;
    if (m){ const x = m.querySelector("[data-fermer]"); if (x) x.click(); else m.remove(); }
  }
});

charger();
rendre();
if (ghLisible()) recupererDeGitHub(true);
if (!cleGemini()) setTimeout(()=>toast("Renseignez votre clé Gemini dans les réglages ⚙️ pour analyser les photos.", 5000), 900);
</script>
</body>
</html>
