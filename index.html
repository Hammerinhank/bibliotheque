<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothèques</title>
<style>
:root{
  --encre:#14171a;
  --encre2:#1c2126;
  --encre3:#262d34;
  --trait:#39434c;
  --texte:#e9e4d9;
  --texte2:#a7a293;
  --bronze:#c9a227;
  --bronze-sombre:#7d6415;
  --vert:#4f9d69;
  --vert-sombre:#1f5133;
  --rouge:#d05a4a;
  --rouge-sombre:#5a241d;
  --orange:#e0a83a;
  --orange-sombre:#7a5510;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--encre);color:var(--texte);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-weight:600}
.serif{font-family:Iowan Old Style,Palatino,Georgia,"Times New Roman",serif}

/* ---------- en-tête ---------- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:7px;
  padding:10px 12px;background:var(--encre2);
  border-bottom:1px solid var(--trait);
}
header h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icone{
  background:var(--encre3);border:1px solid var(--trait);color:var(--texte);
  border-radius:10px;padding:7px 10px;font-size:16px;line-height:1;cursor:pointer;
}
.icone:active{background:var(--trait)}
#badgeVersion{
  background:var(--bronze-sombre);border:1px solid var(--bronze);color:#fff8e1;
  font-weight:700;font-size:13px;border-radius:999px;padding:6px 11px;cursor:pointer;letter-spacing:.3px;
}
#btnSync.aenvoyer{background:var(--orange-sombre);border-color:var(--orange)}
#btnSync.ok{background:var(--vert-sombre);border-color:var(--vert)}
#btnSync.echec{background:var(--rouge-sombre);border-color:var(--rouge)}

main{padding:14px 12px 90px;max-width:900px;margin:0 auto}

/* ---------- boutons ---------- */
button{font-family:inherit}
.btn{
  background:var(--encre3);color:var(--texte);border:1px solid var(--trait);
  border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer;text-align:center;
}
.btn:active{background:var(--trait)}
.btn.principal{background:var(--bronze-sombre);border-color:var(--bronze);color:#fff8e1;font-weight:600}
.btn.vert{background:var(--vert-sombre);border-color:var(--vert)}
.btn.rouge{background:var(--rouge-sombre);border-color:var(--rouge)}
.btn.plein{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.barre{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

/* ---------- bandeau d'état ---------- */
#bandeau{
  display:flex;align-items:center;gap:10px;width:100%;
  background:var(--encre2);border:1px solid var(--trait);border-radius:12px;
  padding:10px 12px;margin-bottom:12px;cursor:pointer;color:var(--texte);
  font-size:14px;text-align:left;
}
#bandeau .pastille{font-size:17px}
#bandeau .txt{flex:1;min-width:0}
#bandeau .txt b{display:block;font-size:14.5px}
#bandeau .txt span{color:var(--texte2);font-size:12.5px}
#bandeau .fleche{color:var(--texte2)}
#bandeau.aenvoyer{border-color:var(--orange)}
#bandeau.echec{border-color:var(--rouge)}
#bandeau.ok{border-color:var(--vert)}

/* ---------- cartes ---------- */
.carte{
  background:var(--encre2);border:1px solid var(--trait);border-left:4px solid var(--bronze);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
}
.carte h2{font-size:19px}
.carte .meta{color:var(--texte2);font-size:13.5px;margin-top:4px}
.vide{border:1px dashed var(--trait);border-radius:12px;padding:22px 16px;text-align:center;color:var(--texte2)}
.titreSection{font-size:12.5px;color:var(--bronze);letter-spacing:.4px;margin:18px 0 6px}
details.pliable{margin:18px 0 6px;border:1.5px solid var(--bronze);border-radius:12px;background:var(--encre2,rgba(255,255,255,.03));overflow:hidden}
details.pliable > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;-webkit-user-select:none;user-select:none;
  margin:0;padding:12px 14px;font-size:15px;font-weight:700;letter-spacing:.3px;color:var(--bronze);background:rgba(200,160,70,.10)}
details.pliable > summary::-webkit-details-marker{display:none}
details.pliable > summary::before{content:"▶";display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--bronze);color:#1b1b1b;font-size:11px;flex:none;transition:transform .15s}
details.pliable[open] > summary::before{transform:rotate(90deg)}
details.pliable[open] > summary{border-bottom:1px solid var(--trait)}
details.pliable > summary .etat{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--texte2);letter-spacing:0;white-space:nowrap}
details.pliable > .contenuPli{padding:4px 12px 12px}
.boutonsDuo{display:flex;gap:8px} .boutonsDuo .btn{flex:1}

/* ---------- bloc d'action expliqué ---------- */
.action{margin-bottom:14px}
.action .btn{width:100%}
.action .expl{font-size:12.5px;color:var(--texte2);margin-top:5px;padding:0 2px}
.sens{font-weight:600;color:var(--texte)}

/* ---------- grille des compartiments ---------- */
.rangee{margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.rangee > .titre{font-size:12.5px;color:var(--bronze);margin-bottom:5px;letter-spacing:.4px}
.cases{display:grid;gap:6px}
.case{
  position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;
  background:var(--encre3);border:1px solid var(--trait);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.case img{width:100%;height:100%;object-fit:cover;display:block}
.case .sansphoto{font-size:20px;opacity:.45}
.case .num{position:absolute;top:2px;left:3px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px}
.case .nb{position:absolute;bottom:0;left:0;right:0;font-size:11px;text-align:center;background:rgba(0,0,0,.6);color:#fff;padding:1px 0}
.case.analysee{border:4px solid #3ddc6a}
.case.analysee.complete{box-shadow:0 0 6px rgba(61,220,106,.45)}
.case.analysee.cotesV{border-top-color:var(--trait);border-bottom-color:var(--trait)}
.case.analysee.sansBas{border-bottom-color:var(--trait)}
.legende i.cV{border-top-color:var(--trait)!important;border-bottom-color:var(--trait)!important}
.legende i.sB{border-bottom-color:var(--trait)!important}
.case.aenvoyer{border:3px solid var(--orange);box-shadow:none}
.case .deux{position:absolute;top:3px;right:3px;z-index:2;font-size:12px;font-weight:800;letter-spacing:.3px;line-height:1.25;color:#1c1500;
  background:#ffd23f;border:1.5px solid #1c1500;border-radius:6px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap}
.case .deux.appoint{background:#e8e2cf;font-weight:700}
.case .deux.unRang{background:#ffffff}
.case .cadreCible{position:absolute;inset:0;border:5px solid #ff3b30;border-radius:inherit;z-index:6;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.55);animation:cibleClignote 1s ease-in-out 5}
@keyframes cibleClignote{0%,100%{border-color:#ff3b30}50%{border-color:rgba(255,59,48,.2)}}
#bRech{display:block;width:100%;box-sizing:border-box;height:48px;font-size:17px;padding:10px 14px;margin:6px 0 10px;
  border-radius:12px;-webkit-appearance:none;appearance:none}
.case .etoile{position:absolute;bottom:3px;z-index:3;font-size:15px;line-height:1;color:#ffd23f;text-shadow:0 0 3px #000,0 0 6px rgba(0,0,0,.8)}
.case .etoile.g{left:4px}
.case .etoile.d{right:4px}
.case .deux small{font-size:10px;font-weight:700;opacity:.8}
.legende .pastilleDeux.gris{background:#ffffff}
.legende .pastilleDeux, .legende b{white-space:nowrap}
.legende .pastilleDeux{display:inline-block;font-size:10px;font-weight:800;color:#1c1500;background:#ffd23f;border:1px solid #1c1500;border-radius:4px;padding:0 4px;margin-right:4px}
.rang{display:inline-block;font-size:11px;border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}
.rang.devant{background:var(--encre3);color:var(--texte2)}
.rang.derriere{background:var(--bronze-sombre);color:#fff8e1}
#cFaces{margin-bottom:8px;align-items:center}
#cFaces{align-items:flex-start}
#cFaces .colAppoint{flex:1;min-width:130px;display:flex;flex-direction:column;align-items:stretch;gap:10px}
#cFaces select{width:100%;border-radius:999px;padding:7px 10px;font-size:13.5px}
#cFaces .colAppoint button{width:100%}
.prop{background:var(--encre);border:1px solid var(--trait);border-left:3px solid var(--bronze);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.prop.ajouter{border-left-color:var(--vert)}
.prop.retirer{border-left-color:var(--rouge)}
.prop .act{font-size:11.5px;letter-spacing:.3px;color:var(--texte2)}
.prop .t{font-size:15px;font-weight:600}
.prop .chg{font-size:13.5px;margin-top:3px}
.prop .chg b{color:var(--bronze)}
.prop .mot{font-size:12.5px;color:var(--texte2);font-style:italic;margin-top:3px}
.legende{font-size:12px;color:var(--texte2);display:flex;gap:14px;flex-wrap:wrap;margin-top:-4px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid;margin-right:4px;vertical-align:-1px}

/* ---------- modales ---------- */
.fond{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}
.modale{background:var(--encre2);border:1px solid var(--bronze);border-radius:14px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column}
.modale > .tete{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--trait);position:sticky;top:0;background:var(--encre2);border-radius:14px 14px 0 0}
.modale > .tete h2{font-size:16px;flex:1;min-width:0}
.modale > .corps{padding:13px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modale > .pied{padding:11px 13px;border-top:1px solid var(--trait);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

label{display:block;font-size:13px;color:var(--texte2);margin:10px 0 4px}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--encre);color:var(--texte);border:1px solid var(--trait);
  border-radius:9px;padding:9px 10px;font-size:16px;font-family:inherit;
}
textarea{min-height:90px;resize:vertical;line-height:1.4}
.ligne2{display:flex;gap:10px}
.ligne2 > *{flex:1}
.coche{display:flex;align-items:center;gap:7px;font-size:14px;margin:6px 0}
.coche input{width:18px;height:18px;accent-color:var(--bronze)}

/* ---------- tableau de comparaison ---------- */
.compare{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 4px}
.compare th,.compare td{border:1px solid var(--trait);padding:6px 8px;text-align:left}
.compare th{background:var(--encre3);color:var(--texte2);font-weight:600}
.compare td.n{text-align:right;font-variant-numeric:tabular-nums}
.compare tr.diff td{color:var(--orange);font-weight:600}
.compare tr.sousTitre th{background:var(--encre);color:var(--bronze);text-align:center;letter-spacing:.3px}
.compare td.detail{font-size:12.5px;line-height:1.45}
.compare td.detail ul{margin:0;padding-left:16px}
.compare .ici{color:var(--vert)} .compare .gh{color:#7fb2e6}

/* ---------- livres ---------- */
.livre{background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:9px 10px;margin-bottom:8px;position:relative}
.livre.deplacable{padding-left:56px}
.modale .corps{overflow-x:hidden}
.livre .poigneeGlisser{position:absolute;top:0;left:0;bottom:0;width:52px;pointer-events:auto;z-index:2;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.livre .poigneeGlisser span{display:flex;flex-direction:column;gap:4px;padding:8px 7px;border:1px solid var(--trait);border-radius:7px;background:var(--encre3)}
.livre .poigneeGlisser i{display:block;width:18px;height:2px;border-radius:2px;background:var(--texte2)}
body.glisseEnCours, body.glisseEnCours *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.livre.enDrag{opacity:.95;border-color:var(--bronze);box-shadow:0 8px 22px rgba(0,0,0,.6);z-index:5;transition:none;will-change:transform}
.livre.enDrag .poigneeGlisser{cursor:grabbing}
.livre.enDrag .poigneeGlisser span{border-color:var(--bronze)}
.livre.enDrag .poigneeGlisser i{background:var(--bronze)}
.livre .t{font-size:15.5px;font-weight:600}
.livre .a{font-size:13.5px;color:var(--texte2)}
.livre .r{font-size:13px;color:#cfc8b6;margin-top:4px;font-style:italic}
.livre .cat{font-size:11.5px;color:var(--bronze);margin-top:3px}
.livre .actions{display:flex;gap:6px;margin-top:7px}
.livre .actions button{font-size:12.5px;padding:5px 9px;border-radius:8px}
.certitude-faible{border-left:3px solid var(--rouge)}
.certitude-moyenne{border-left:3px solid var(--orange)}

/* ---------- divers ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--encre3);border:1px solid var(--bronze);color:var(--texte);
  padding:10px 15px;border-radius:12px;z-index:90;max-width:92%;font-size:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#toast.masque{display:none}
/* ---------- IA sans clé (Claude ou Gemini) : bouton vert vif en attente de la réponse ---------- */
.btn.vif,#attenteClaude button.vif{background:#19e35f;border-color:#7dffa8;color:#062611;font-weight:700;box-shadow:0 0 0 3px rgba(25,227,95,.28),0 6px 20px rgba(25,227,95,.35)}
.btn.vif:active{background:#12b84b}
#attenteClaude{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:70;
  width:calc(100% - 20px);max-width:620px;display:flex;gap:6px;align-items:stretch}
#attenteClaude[hidden]{display:none}
body.attenteClaude{padding-bottom:84px}
body.attenteClaude #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#attenteClaude button.vif{flex:1;border-radius:14px;padding:13px 12px;font-size:15.5px;cursor:pointer;animation:pulseVif 1.6s ease-in-out infinite}
#attenteClaude button.annul{flex:none;border-radius:14px;background:var(--encre3);border:1px solid var(--trait);color:var(--texte);padding:0 13px;font-size:16px}
@keyframes pulseVif{0%,100%{box-shadow:0 0 0 3px rgba(25,227,95,.28),0 6px 20px rgba(25,227,95,.35)}50%{box-shadow:0 0 0 7px rgba(25,227,95,.18),0 6px 26px rgba(25,227,95,.55)}}
.etape{display:flex;gap:10px;align-items:flex-start;background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:10px;margin-top:8px}
.etape .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bronze-sombre);color:#fff8e1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.etape .c{flex:1;min-width:0}
.etape .btn{margin-top:6px}
.progres{background:var(--encre);border:1px solid var(--bronze);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.progres .barreint{height:6px;background:var(--trait);border-radius:4px;margin-top:7px;overflow:hidden}
.progres .barreint i{display:block;height:100%;background:var(--bronze);width:0}
.aide{font-size:12.5px;color:var(--texte2);margin-top:6px}
.sep{height:1px;background:var(--trait);margin:16px 0}
/* ---------- scan des photos du dépôt ---------- */
.scanTotaux{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.scanTotaux button{flex:1;min-width:78px;border-radius:10px;padding:8px 6px;font-size:13px;border:1px solid var(--trait);background:var(--encre);color:var(--texte);cursor:pointer}
.scanTotaux button b{display:block;font-size:19px}
.scanTotaux button.actif{box-shadow:0 0 0 2px var(--bronze) inset}
.scanTotaux .t-vert b{color:var(--vert)} .scanTotaux .t-orange b{color:var(--orange)} .scanTotaux .t-rouge b{color:var(--rouge)}
.scanListe{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;margin-top:6px}
.scanLigne{display:flex;gap:9px;align-items:flex-start;background:var(--encre);border:1px solid var(--trait);border-left-width:6px;border-radius:10px;padding:8px 10px;font-size:13.5px;cursor:pointer;text-align:left;color:var(--texte);width:100%;box-sizing:border-box}
.scanLigne .txt{flex:1;min-width:0}
.scanLigne .reaff{margin-top:7px;padding:7px 10px;font-size:13px;background:var(--orange-sombre);border-color:var(--orange)}
.scanLigne.vert{border-left-color:var(--vert)} .scanLigne.orange{border-left-color:var(--orange)} .scanLigne.rouge{border-left-color:var(--rouge)}
.scanLigne .pt{flex:none;width:12px;height:12px;border-radius:50%;margin-top:4px}
.scanLigne.vert .pt{background:var(--vert)} .scanLigne.orange .pt{background:var(--orange)} .scanLigne.rouge .pt{background:var(--rouge)}
.scanLigne .ch{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;color:var(--texte2)}
.scanLigne .qui{font-weight:600}
/* ---------- recherche de modèle Gemini ---------- */
.modeles{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:46vh;overflow-y:auto}
.mod{display:flex;align-items:center;gap:8px;background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;font-size:13.5px}
.mod.ok{border-color:var(--vert)}
.mod.reco{border-color:var(--bronze);box-shadow:0 0 0 1px var(--bronze) inset}
.mod .nomMod{font-weight:600;word-break:break-all}
.mod .detMod{font-size:12px;color:var(--texte2)}
.mod .txtMod{flex:1;min-width:0}
.mod .btn{padding:6px 10px;font-size:13px;flex:none}
.encadre{background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.onglets{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.onglets button{background:var(--encre);border:1px solid var(--trait);color:var(--texte2);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.onglets button.actif{background:var(--bronze-sombre);border-color:var(--bronze);color:#fff8e1}
.photo-apercu{width:100%;border-radius:10px;border:1px solid var(--trait);display:block}
/* ---------- lignes de coupe ---------- */
.cadrePhoto{position:relative;border-radius:10px;overflow:hidden}
/* affichage « Entière » : toute la photo dans le cadre, sans défilement interne */
.cadreCentre{text-align:center}
.cadreCentre .cadrePhoto{display:inline-block;vertical-align:top;max-width:100%}
.cadreCentre .photo-apercu{width:auto;max-width:100%;max-height:52vh;margin:0 auto}
/* affichages 100 % et 200 % : la photo défile dans son cadre */
.cadreZoom{overflow:auto;-webkit-overflow-scrolling:touch;max-height:60vh;border:1px solid var(--trait);border-radius:10px;background:#000}
.cadreZoom .photo-apercu{max-width:none;border:0;border-radius:0}
.cadrePhoto .photo-apercu{-webkit-user-drag:none;-webkit-touch-callout:none}
.cadrePhoto.coupe{touch-action:none;-webkit-user-select:none;user-select:none}
.voile{position:absolute;left:0;right:0;background:rgba(0,0,0,.5);pointer-events:none}
.voile.h{top:0}
.voile.b{bottom:0}
.ligneCoupe{position:absolute;left:0;right:0;height:0;pointer-events:none}
.ligneCoupe::before{content:"";position:absolute;left:0;right:0;top:-2px;height:4px;background:#ff1a1a;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(255,26,26,.9)}
.ligneCoupe::after{content:"⇕";position:absolute;right:8px;top:-13px;width:26px;height:26px;border-radius:50%;background:#ff1a1a;color:#fff;font-size:15px;line-height:26px;text-align:center;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.ligneCoupe.active::before{height:6px;top:-3px}

    "La liste d'avant est mise de côté : bouton pour revenir en arrière. Une seule sauvegarde GitHub à la fin."
  ]},
  { v:"V1.41.1", d:"23/09/2026", l:[
    "Règle de fond : le résultat d'une photo d'appoint n'est jamais affecté à une rangée qui n'a pas quelques livres en commun avec lui (plus de « Continuer quand même »).",
    "Sans correspondance : refus expliqué — erreur de compartiment, erreur de rangée, ou rangée pas encore relevée (photo de derrière absente ou non analysée) — avec la liste de ce qui a été lu ; le résultat reste réutilisable (📜).",
    "« Comparer plutôt à l'autre rangée » refuse aussi une rangée sans livres en commun.",
    "Nouvelle analyse d'une rangée déjà relevée : alerte si aucun livre n'est en commun avec la liste actuelle (autre compartiment ou autre rangée ?)."
  ]},
  { v:"V1.41.0", d:"23/09/2026", l:[
    "Photo d'appoint : avant tout rapprochement, l'app établit la rangée photographiée. Une rangée : il faut quelques livres reconnus, sinon elle demande confirmation. Deux rangées : il faut des correspondances nettes avec l'une et pas avec l'autre, sinon elle demande laquelle.",
    "La rangée de chaque appoint est mémorisée et affichée dans la liste déroulante des appoints (« Appoint 2 · rangée 1 — légende »). La vérification ne compare ensuite qu'à cette rangée."
  ]},
  { v:"V1.40.0", d:"23/09/2026", l:[
    "Modèles Gemini : chaque recherche ou test complète la mémoire au lieu de l'écraser ; pour chaque modèle sont conservés le dernier état, le temps de réponse du test, la moyenne des 10 derniers tests et la date.",
    "Le temps des vraies analyses de photos est aussi mesuré et mémorisé par modèle (moyenne des 10 dernières).",
    "Temps affichés dans la fenêtre « Trouver un modèle » (triée : modèles qui marchent du plus rapide au plus lent) et dans la liste des modèles des réglages."
  ]},
  { v:"V1.39.0", d:"23/09/2026", l:[
    "Les listes de livres qui résultent d'une analyse (compléter, remplacer, fusionner, vérification d'appoint, analyse de toute la bibliothèque) sont envoyées sur GitHub automatiquement, dès qu'elles sont appliquées.",
    "Garde-fous : sans réseau, avertissement ; si GitHub a été modifié ailleurs ou si l'envoi ferait disparaître quelque chose, l'envoi automatique est suspendu et expliqué (décision dans ☁️)."
  ]},
  { v:"V1.38.0", d:"23/09/2026", l:[
    "Chaque photo (devant, derrière, appoint, troncature) est envoyée sur GitHub dès qu'elle est prise ; sans réseau ni jeton, un avertissement le signale et elle partira au prochain envoi ☁️.",
    "Chaque résultat d'analyse de Gemini ou de Claude (analyse d'un compartiment, lecture d'un appoint, copier-coller) est sauvegardé sur GitHub dès son arrivée, dans analyses/… ; sans réseau, il est gardé de côté et part au prochain envoi.",
    "Nouveau bouton « 📜 Résultats sauvegardés » dans un compartiment : réutiliser un résultat passé sans redemander à l'IA."
  ]},
  { v:"V1.37.1", d:"23/09/2026", l:[
    "Scan des photos : « Réaffecter » et « Marquer non associée » côte à côte sur la même ligne, légèrement espacés, pour éviter d'appuyer sur l'un à la place de l'autre."
  ]},
  { v:"V1.37.0", d:"23/09/2026", l:[
    "Scan des photos du dépôt : bouton « ✖ Marquer non associée » sur chaque photo orpheline (orange) qui n'a jamais été à la bonne place ; elle passe en rouge et sort des réaffectations. Réversible (« ↩ Remettre en orpheline »). Marque mémorisée avec les données (envoyée sur GitHub)."
  ]},
  { v:"V1.36.1", d:"23/09/2026", l:[
    "La récupération automatique depuis GitHub à l'ouverture ne remplace plus jamais en silence les données de l'appareil si elles contiennent des choses absentes de GitHub (livres, photos, rangs, « 1 rang », appoints, résumés) : elle demande d'abord."
  ]},
  { v:"V1.36.0", d:"23/09/2026", l:[
    "Nouveau « 🕘 Restaurer une version précédente » (écran ☁️) : liste des 30 dernières versions envoyées sur GitHub avec livres, photos, compartiments à 2 rangs, « 1 rang » et appoints ; comparaison puis restauration (les photos orphelines sont à nouveau rattachées).",
    "Garde-fou à l'envoi : si l'envoi ferait disparaître de GitHub des livres, photos, compartiments à 2 rangs, marques « 1 rang », appoints ou résumés, l'app le détaille et demande confirmation.",
    "Protection contre plusieurs fenêtres ouvertes (onglet + écran d'accueil) : une page restée ouverte avec d'anciennes données ne peut plus écraser les nouvelles.",
    "Tableau de comparaison enrichi : compartiments à 2 rangs, « 1 rang », appoints."
  ]},
  { v:"V1.35.1", d:"23/09/2026", l:[
    "Correctif glisser-déposer : la poignée ≡ portait le même nom qu'une poignée des lignes de coupe (rendue insensible au doigt), d'où la sélection de texte en bleu au lieu du déplacement. Poignée renommée, sélection de texte et menu « Copier » bloqués pendant le glisser."
  ]},
  { v:"V1.35.0", d:"23/09/2026", l:[
    "Photo d'appoint : second bouton « 🔀 Vérifier (ordre respecté) ». L'app repère la zone de la rangée que couvre l'appoint (sans supposer qu'il commence au premier livre ni finit au dernier), puis aligne livre par livre dans cette zone ; les livres hors zone ne sont pas touchés.",
    "Choix de la rangée comparée (la plus ressemblante par défaut, bouton pour comparer à l'autre).",
    "Fusions (rangée et appoint) : chaque ligne a une poignée ≡ pour corriger au glisser-déposer l'ordre de deux livres voisins ; l'ordre affiché est celui enregistré."
  ]},
  { v:"V1.34.0", d:"23/09/2026", l:[
    "Nouvelle analyse d'une rangée déjà relevée : bouton « 🔀 Fusionner (même rangée, même ordre) ». Les deux listes sont alignées dans l'ordre ; les livres reconnus sans ambiguïté servent de repères pour situer les autres.",
    "Une ligne par livre avec ses choix : ✅ identique (garder le titre ou prendre la nouvelle lecture), 🟡 à confirmer (même livre / deux livres), 📕 absent de la nouvelle photo (garder / retirer), 🆕 absent de la liste (ajouter / ignorer). Livres qui ont changé de place signalés."
  ]},
  { v:"V1.33.0", d:"23/09/2026", l:[
    "Liste des livres d'un compartiment : poignée ≡ à droite de chaque livre ; en la maintenant, on fait glisser le livre pour le replacer ailleurs dans la liste (défilement automatique en haut et en bas). L'ordre est enregistré.",
    "Fonctionne aussi avec le filtre Rangée 1 / Rangée 2 : seul l'ordre des livres affichés change."
  ]},
  { v:"V1.32.0", d:"23/09/2026", l:[
    "Vérification photo par photo : « 🔎 Vérifier avec cette photo d'appoint » n'envoie que la photo affichée ; le contrôle de toutes les photos d'un coup est supprimé.",
    "L'IA lit la photo à l'aveugle (sans voir la liste), de gauche à droite ; c'est l'application qui rapproche chaque livre lu des listes des rangées 1 et 2 (titre et auteur, tolérance aux fautes, et voisinage : l'ordre des livres est le même d'une photo à l'autre).",
    "Pour chaque livre lu : ✅ déjà relevé (rangée, position), 🟡 à confirmer (C'est lui / Autre livre), 🆕 absent (à ajouter, inséré à sa place dans l'ordre). Alerte si l'ordre diffère de la liste.",
    "Corrections (titre, auteur, année) et retraits (livres de la liste non vus alors qu'ils devraient être sur la photo) proposés en dessous."
  ]},
  { v:"V1.31.0", d:"23/09/2026", l:[
    "Contrôle par appoints : la fenêtre donne toujours la liste complète de ce que l'IA a lu sur les photos d'appoint, titre par titre, avec pour chacun : ✅ déjà relevé (et sous quel titre), 🆕 absent de la liste, ou ⚠️ rapprochement douteux.",
    "Tout livre lu et absent de la liste peut être ajouté d'un geste, même si l'IA ne l'a pas proposé ; les rapprochements douteux sont proposés à l'ajout mais décochés.",
    "L'IA doit désormais recopier le titre tel qu'elle le lit (et non un simple numéro), ce qui permet de vérifier ses rapprochements."
  ]},
  { v:"V1.30.1", d:"23/09/2026", l:[
    "Bouton « 🔎 Contrôler la liste » renommé « 🔎 Compléter / vérifier la liste avec les appoints », avec une ligne d'explication dessous.",
    "Bouton « ➕ Appoint » placé sous la liste des appoints, à droite, un peu espacé et de même largeur."
  ]},
  { v:"V1.30.0", d:"23/09/2026", l:[
    "Contrôle par photo d'appoint repensé : la fenêtre sépare clairement les livres « déjà relevés » (avec leur rangée) et ceux qui avaient échappé à la photo d'ensemble.",
    "Livres nouveaux : bouton « Ajouter » avec, si le compartiment a deux rangées, le choix Rangée 1 / Rangée 2 pour chacun (ou pour tous d'un coup) ; en compartiment à une rangée, ajout direct en rangée 1.",
    "Corrections et retraits éventuels présentés à part, en dessous."
  ]},
  { v:"V1.29.2", d:"23/09/2026", l:[
    "Correctif iPhone : « Ajouter une photo d'appoint » ne faisait rien (Safari refuse d'ouvrir l'appareil photo depuis une liste déroulante). C'est désormais un vrai bouton « ➕ Appoint » ; la liste ne sert plus qu'à choisir un appoint existant."
  ]},
  { v:"V1.29.1", d:"23/09/2026", l:[
    "Étiquette « 1 RANG » sur fond blanc (au lieu de gris), sur la grille, dans la légende et dans la fenêtre du compartiment."
  ]},
  { v:"V1.29.0", d:"23/09/2026", l:[
    "Nouvelle étiquette grise « 1 RANG » (même format que « 2 RANGS ») : se pose ou s'enlève dans la fenêtre d'un compartiment, pour indiquer qu'il n'a qu'un rang et qu'il est complet. Mémorisée avec les données (sauvegardée sur GitHub).",
    "Si une photo de derrière est ajoutée, « 2 RANGS » prend le dessus."
  ]},
  { v:"V1.28.0", d:"23/09/2026", l:[
    "Fenêtre d'un compartiment : sous « Livres de ce compartiment », nombre de livres de la rangée 1 (devant) et de la rangée 2 (derrière), et trois boutons « Tous » (par défaut), « Rangée 1 », « Rangée 2 » pour filtrer la liste."
  ]},
  { v:"V1.27.0", d:"23/09/2026", l:[
    "Cadre vert toujours épais ; ce sont les côtés allumés qui indiquent l'état : 4 côtés = tout est analysé, côtés verticaux seuls = une photo de rang (devant ou derrière) non analysée, côté du bas éteint = une photo d'appoint non prise en compte.",
    "L'état d'analyse est désormais suivi rang par rang : analyser le seul rang de derrière ne marque plus la photo de devant comme analysée (et inversement)."
  ]},
  { v:"V1.26.1", d:"23/09/2026", l:[
    "Grille : suppression de l'effet « deux photos empilées », l'étiquette « 2 RANGS » suffit.",
    "Cadres des compartiments bien plus visibles : vert vif, épais (4 px) si toutes les photos sont analysées, moyen (2 px) s'il en reste une non analysée ; orange 3 px pour une photo à envoyer."
  ]},
  { v:"V1.26.0", d:"23/09/2026", l:[
    "Grille : un compartiment à deux rangs est bien plus visible — grosse étiquette jaune « 2 RANGS » et effet de deux photos empilées ; les photos d'appoint sont signalées à part (« +1 zoom »).",
    "Légende complétée en conséquence."
  ]},
  { v:"V1.25.0", d:"23/09/2026", l:[
    "Compartiment à deux rangs : « Analyser » demande quoi analyser — les deux rangs ensemble, le rang de devant seul ou le rang de derrière seul — avec un texte explicatif.",

    "La fenêtre de choix (compléter / remplacer) n'apparaît que si le rang analysé avait déjà des livres, et compare rang par rang ; « Annuler » ne change rien."
  ]},
  { v:"V1.24.0", d:"23/09/2026", l:[
    "Nouvelle analyse d'un compartiment qui a déjà des livres : la fenêtre compare l'ancienne et la nouvelle liste (communs, nouveaux, absents) au lieu d'une simple liste de titres.",
    "Boutons explicites : « Garder l'ancienne liste », « Ajouter seulement les nouveaux (n) » (sans doublons), « Remplacer par la nouvelle liste (n) ».",
    "En remplaçant, les résumés, auteurs, années et catégories déjà obtenus pour les livres communs sont conservés."
  ]},
  { v:"V1.23.0", d:"23/09/2026", l:[
    "PDF trié : choix explicite « Quels livres ? » — tous, un seul auteur (choisi dans la liste des auteurs relevés, avec leur nombre de livres), titre contenant…, auteur contenant….",

  ]},
  { v:"V1.22.0", d:"23/09/2026", l:[
    "Suppression du gros bouton « 📄 PDF » redondant à côté de « Voir la liste » (le PDF reste disponible dans la fenêtre de la liste).",
    "Nouveau « 🔤 PDF trié par auteur ou par titre » : tri par auteur (nom de famille ou tel qu'écrit) ou par titre (article initial ignoré), avec filtre facultatif sur tout ou partie du titre ou de l'auteur ; reprend les options d'emplacement. Choix mémorisés."
  ]},
  { v:"V1.21.0", d:"23/09/2026", l:[
    "Liste des livres : bouton « 📄 PDF » à côté de « 📋 Voir », et dans la fenêtre de la liste ; le PDF reprend les options d'affichage choisies (mémorisées).",
    "La section « Ce que l'on peut en tirer » est repliée par défaut.",
    "Sections pliables bien plus visibles : bandeau encadré, titre plus grand, pastille ▶ qui pivote."
  ]},
  { v:"V1.20.1", d:"23/09/2026", l:[
    "Résumés et auteurs : le bouton principal devient « sans résumé » ; nouveau choix « sans résumé ou sans auteur ».",
    "Confirmation obligatoire avant de redemander à Gemini des livres déjà traités (combien le sont, écrasement des résumés, risque de saturation du serveur)."
  ]},
  { v:"V1.20.0", d:"23/09/2026", l:[
    "PDF avec emplacements : choix de numéroter les rangées de haut en bas (comme à l'écran) ou de bas en haut ; ce choix ne s'applique qu'aux mentions (rg: X, cl: Y, Z) du PDF.",
    "En tête et en fin du PDF, rappel du sens de numérotation (rangées, colonnes de gauche à droite, rang 1 devant / 2 derrière).",
    "En tête du PDF, schéma de la bibliothèque : chaque compartiment porte ses numéros de rangée et de colonne, selon la numérotation choisie, et son nombre de livres."

  { v:"V1.19.1", d:"23/09/2026", l:[
    "PDF : la mention d'emplacement précise le rang de livres, (rg: X, cl: Y, 1) pour le rang de devant (1re photo), (rg: X, cl: Y, 2) pour le rang de derrière (2e photo)."
  ]},
  { v:"V1.19.0", d:"23/09/2026", l:[
    "Écran d'une bibliothèque : la section « Ce que l'on peut en tirer » se plie et se déplie en touchant son titre ; l'état est mémorisé.",
    "Case à cocher « Emplacement dans le PDF » : ajoute après chaque livre du PDF la mention (rg: X, cl: Y), rangée et colonne où il est rangé. Choix mémorisé."
  ]},
  { v:"V1.18.0", d:"23/09/2026", l:[
    "Scan des photos du dépôt : bouton « ↩️ Réaffecter » sur chaque photo orpheline (orange) pour la remettre dans son compartiment d'origine, et bouton pour réaffecter d'un coup toutes celles dont la place est libre. Si la place est prise : remplacer, ou ajouter en photo d'appoint.",
    "Tableau de comparaison appareil / GitHub enrichi : résumés, catégories, compartiments analysés, photos pas encore envoyées (lignes en orange si elles diffèrent).",
    "Nouveau « Détail des différences » par bibliothèque (livres ajoutés, retirés ou modifiés, résumés, catégories, photos, analyses, nom, dimensions…), pour comprendre pourquoi un envoi est nécessaire même quand les totaux sont identiques."
  ]},
  { v:"V1.17.0", d:"23/09/2026", l:[
    "Réglages ⚙️ → Entretien : bouton « 🗂️ Scanner les photos du dépôt GitHub » qui liste toutes les images présentes sur le dépôt, avec décompte de progression.",
    "Vert : photo associée actuellement à un compartiment ; orange : photo créée pour un compartiment mais aujourd'hui orpheline (retirée, remplacée, compartiment ou bibliothèque supprimés) ; rouge : image jamais associée à un compartiment.",
    "Totaux cliquables pour filtrer la liste ; toucher une ligne ouvre la photo en taille réelle. Signale aussi les photos associées mais introuvables sur le dépôt."
  ]},
  { v:"V1.16.1", d:"22/09/2026", l:[
    "Libellé du second onglet d'un compartiment raccourci : « ➕ Derrière » au lieu de « ➕ Rang de derrière »."
  ]},
  { v:"V1.16.0", d:"22/09/2026", l:[
    "Photos d'appoint : autant de photos que voulu par compartiment (zooms, angles), en plus des deux photos de rang. Liste déroulante à droite des boutons Devant / Derrière pour les choisir ou en ajouter une.",
    "Chaque appoint a une légende libre, ses propres outils (taille réelle, lignes de coupe, tronquer, retirer) et son fichier sur GitHub (…-appoint-<id>.jpg).",
    "Bouton « 🔎 Contrôler la liste » depuis une photo d'appoint : l'IA compare la liste déjà relevée à ces photos et propose des corrections, ajouts ou retraits, traités par lots de 3 photos avec décompte.",
    "Chaque proposition est présentée avec son motif et l'ancienne valeur en regard de la nouvelle ; vous cochez celles à appliquer. Rien n'est modifié sans votre accord.",
    "Question dédiée modifiable dans Réglages → Questions ; fonctionne aussi avec une IA sans clé (copier-coller)."
  ]},
  { v:"V1.15.0", d:"22/09/2026", l:[
    "Ménage interne, sans changement visible : commentaire de code égaré remis à sa place, et la série de photos construit désormais le chemin de l'image avec la fonction commune cheminPhoto (au lieu de le réécrire à la main).",
    "Vérification faite que tout ce qui a été ajouté depuis la V1.7.0 est bien présent : choix d'un modèle Gemini opérationnel, compartiments à deux rangs, Claude en secours, IA sans clé par copier-coller, lignes de coupe rouges et vertes."
  ]},
  { v:"V1.14.0", d:"22/09/2026", l:[
    "Réglages ⚙️ → IA → Gemini : bouton « 🧪 Tester ce modèle » qui vérifie sur une petite image que le modèle choisi dans la liste répond et lit les photos.",
    "Gemini sans clé API : « Accès à Gemini » → « Sans clé : copier-coller dans Gemini », même démarche que pour Claude (copier la photo, ouvrir Gemini avec la question, coller la photo, copier la réponse).",
    "Bouton vert vif « 📥 Copier la réponse de Gemini » (ou de Claude) en bas de l'écran tant que la réponse est attendue ; il remplit le compartiment."
  ]},
  { v:"V1.13.0", d:"22/09/2026", l:[
    "Lignes de coupe : en plus des deux lignes rouges horizontales, deux lignes vertes verticales, placées par défaut sur les bords gauche et droit de la photo.",
    "« Tronquer » conserve le rectangle délimité par les quatre lignes ; laissées sur les bords, les lignes vertes ne changent rien.",
    "Les lignes vertes repartent des bords à chaque affichage ; la position des rouges reste mémorisée."
  ]},
  { v:"V1.12.0", d:"22/09/2026", l:[
    "Grille : liseré vert épais (2 px) quand toutes les photos du compartiment ont été analysées ; liseré vert fin (1 px) s'il reste une photo non analysée (photo ajoutée, changée ou tronquée après la dernière analyse).",
    "La légende distingue les deux cas ; « Ajouter à la suite » après une analyse compte désormais comme une analyse."
  ]},
  { v:"V1.11.0", d:"22/09/2026", l:[
    "Retirer une photo propose aussi de supprimer les livres identifiés à partir de cette photo (rang de devant pour la photo 1, rang de derrière pour la photo 2, tous si le compartiment n'a qu'une photo).",
    "Les livres concernés sont listés avec une case à cocher chacun ; deux choix : « Photo seule » ou « Photo + livres cochés ». Les livres ajoutés à la main ne sont pas cochés d'office.",
    "Les livres portent désormais leur origine (analyse IA ou ajout à la main)."
  ]},
  { v:"V1.10.1", d:"22/09/2026", l:[
    "Correction : le bouton vert « Copier la réponse de Claude » apparaissait dès l'ouverture de la fenêtre « Demander à Claude », même si rien n'avait été envoyé. Il n'apparaît plus qu'après avoir touché « Ouvrir Claude » ou « Copier le texte de la question ».",
    "Le bouton vert est déplacé en bas de l'écran : il ne masque plus l'en-tête (⚙️, ☁️) ni le bandeau d'état ; il indique l'heure de la demande."
  ]},
  { v:"V1.10.0", d:"22/09/2026", l:[
    "Claude sans clé API : réglages ⚙️ → IA → Claude → « Sans clé : copier-coller ». La voie par clé API reste disponible.",
    "Depuis un compartiment : copie de la photo (ou des deux photos côte à côte) dans le presse-papier et ouverture de Claude avec la question déjà écrite ; il reste à coller la photo en pièce jointe.",
    "Bouton vert vif « 📥 Copier la réponse de Claude » affiché en haut de l'écran tant que la réponse est attendue (il survit à un rechargement) : il lit la réponse copiée dans Claude et remplit le compartiment.",
    "Si Gemini échoue et que le secours est Claude sans clé, cette démarche est proposée directement. Zone de collage manuel si le presse-papier n'est pas lisible."
  ]},
  { v:"V1.9.0", d:"22/09/2026", l:[
    "Claude (Anthropic) en secours de Gemini : si Gemini échoue (modèle retiré, quota, erreur, réponse illisible), la même question avec les mêmes photos est posée à Claude, sans rien faire de plus.",
    "Réglages ⚙️ → onglet « IA » : IA à interroger en premier (Gemini ou Claude), secours automatique activable, clé API Claude (sur l'appareil seulement, partagée sous claude_api_key), choix du modèle Claude avec liste à jour et bouton de test sur une image.",
    "Une IA en panne n'est plus réessayée pour les photos suivantes de la même série ; les bilans indiquent quelle IA a répondu.",
    "Le secours vaut pour l'analyse des photos, les résumés et les catégories du PDF."
  ]},
  { v:"V1.8.0", d:"22/09/2026", l:[
    "Compartiments à deux rangs de livres : onglets « Devant » / « Derrière » dans la fenêtre du compartiment, avec une seconde photo prise après avoir retiré les livres de devant.",
    "Chaque photo a ses propres outils (taille réelle, lignes de coupe, tronquer, retirer) et son propre fichier sur GitHub (…-derriere.jpg).",
    "L'analyse envoie les deux photos ensemble à Gemini, qui produit une liste unique : un livre du fond déjà visible sur la première photo n'est compté qu'une fois ; doublons restants fusionnés automatiquement.",
    "Chaque livre indique son rang (devant / derrière), modifiable à la main ; repère « 2📷 » sur la grille ; question dédiée modifiable dans Réglages → Questions."
  ]},

async function copierTexte(txt){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); return true; }
  }catch(e){}
  try{
    const z = document.createElement("textarea");
    z.value = txt;
    z.style.position="fixed"; z.style.top="0"; z.style.left="0"; z.style.opacity="0";
    document.body.appendChild(z);
    z.focus(); z.select(); z.setSelectionRange(0, txt.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(z);
    return ok;
  }catch(e){ return false; }
}

function modale(opts){
  const fond = document.createElement("div");
  fond.className = "fond";
  const boutons = (opts.boutons||[]).map((b,i)=>
    `<button class="btn ${b.classe||""}" data-b="${i}">${esc(b.texte)}</button>`).join("");
  fond.innerHTML =
    `<div class="modale">
       <div class="tete"><h2 class="serif">${esc(opts.titre||"")}</h2>
         <button class="icone" data-fermer="1">✕</button></div>
       <div class="corps">${opts.html||""}</div>
       ${boutons ? `<div class="pied">${boutons}</div>` : ""}
     </div>`;
  $("#zoneModales").appendChild(fond);
  fond.querySelector('[data-fermer]').onclick = ()=>{ fond.remove(); if(opts.surFermeture) opts.surFermeture(); };
  (opts.boutons||[]).forEach((b,i)=>{
    fond.querySelector(`[data-b="${i}"]`).onclick = ()=>{
      if (b.action){ const r = b.action(fond); if (r === false) return; }
      if (b.garder !== true) fond.remove();
    };
  });
  if (opts.apres) opts.apres(fond);
  return fond;
}

function confirmer(message, titre, texteOui){
  return new Promise(res=>{
    modale({
      titre: titre||"Confirmer",
      html: `<div style="font-size:15px">${message}</div>`,
      boutons:[
        {texte:"Annuler", action:()=>res(false)},
        {texte:texteOui||"Confirmer", classe:"principal", action:()=>res(true)}
      ],
      surFermeture:()=>res(false)
    });
  });
}

function fenetreProgres(titre){
  const f = modale({ titre, html:
    `<div class="progres"><div id="pgTexte">Préparation…</div>
     <div class="barreint"><i id="pgBarre"></i></div></div>
     <div id="pgDetail" class="aide"></div>` });
  return {
    maj(fait, total, detail){
      const t = f.querySelector("#pgTexte"), b = f.querySelector("#pgBarre");
      if (t) t.textContent = `Traités : ${fait} / ${total} — restants : ${Math.max(0,total-fait)}`;
      if (b) b.style.width = total ? Math.round(fait*100/total) + "%" : "0%";
      if (detail !== undefined){ const d = f.querySelector("#pgDetail"); if (d) d.textContent = detail; }
    },
    fermer(){ f.remove(); }
  };
}

function charger(){
  try{ const d = localStorage.getItem(CLE_DATA); if (d) data = JSON.parse(d); }
  catch(e){ console.warn("Données locales illisibles", e); }
  if (!data || !Array.isArray(data.bibliotheques)) data = { bibliotheques:[], maj:null };
  try{ const c = localStorage.getItem(CLE_CFG); if (c) cfg = Object.assign({}, CFG_DEFAUT, JSON.parse(c)); }catch(e){}
  // relèvement unique des anciens réglages de photo (1 600 px, 72 %) vers une définition plus lisible
  cfg.tirerOuvert = false;          // « Ce que l'on peut en tirer » toujours replié au lancement
  if ((cfg.versionPhotos || 1) < 2){
    cfg.tailleMax = Math.max(cfg.tailleMax || 0, 3000);
    cfg.qualite = Math.max(cfg.qualite || 0, 0.88);
    cfg.tailleAppoint = Math.max(cfg.tailleAppoint || 0, 4000);
    cfg.versionPhotos = 2;
    sauverCfg();
  }
  // Un champ laissé vide reprend la valeur par défaut : le dépôt reste toujours lisible.
  ["ghUser","ghRepo","ghBranche"].forEach(k => { if (!cfg[k]) cfg[k] = CFG_DEFAUT[k]; });
  sale = localStorage.getItem(CLE_SALE) === "1";
  try{ revConnue = localStorage.getItem(CLE_REV); if (revConnue === null){ revConnue = "init-" + Date.now(); localStorage.setItem(CLE_REV, revConnue); } }catch(e){}
  if (retirerMiniatures(data)){
    try{ localStorage.setItem(CLE_DATA, JSON.stringify(data)); }catch(e){}
  }
}

function sauver(marquerSale){
  // une autre fenêtre a enregistré depuis le chargement de celle-ci : ne rien écraser
  try{
    const rev = localStorage.getItem(CLE_REV);
    if (revConnue !== null && rev !== null && rev !== revConnue){ journal("Enregistrement refusé : page périmée (autre fenêtre de l'app)"); fenetrePerimee(); return; }
  }catch(e){}
  if (marquerSale !== false){ sale = true; data.maj = new Date().toISOString(); }
  try{ synchroniserPhotosIdb(); }catch(e){}
  try{
    // les images en attente sont dans IndexedDB : on ne garde ici que les données
    localStorage.setItem(CLE_DATA, JSON.stringify(data, (cle, v)=> cle === "plein" && typeof v === "string" && v.length > 2000 ? undefined : v));
    revConnue = String(Date.now()) + "-" + Math.random().toString(36).slice(2, 7);
    localStorage.setItem(CLE_REV, revConnue);
    localStorage.setItem(CLE_SALE, sale ? "1" : "0");
  }catch(e){
    journal("ÉCHEC d'enregistrement sur l'appareil (mémoire pleine) : " + (e && e.message));
    avertirEchecStockage(e);
    console.error(e);
  }
  majBandeau();
}

/* ====================================================================
   PHOTOS EN ATTENTE DANS INDEXEDDB (et non plus dans le localStorage, limité à ~5 Mo partagés par toutes les apps)
   ==================================================================== */
const IDB_NOM = "biblio_photos", IDB_STORE = "attente";
let idbPromesse = null;
function idbOuvrir(){
  if (idbPromesse) return idbPromesse;
  idbPromesse = new Promise((res, rej)=>{
    try{
      const r = indexedDB.open(IDB_NOM, 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore(IDB_STORE); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    }catch(e){ rej(e); }
  });
  return idbPromesse;
}
async function idbOp(mode, fn){
  const db = await idbOuvrir();
  return await new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, mode), st = tx.objectStore(IDB_STORE);
    const r = fn(st);
    tx.oncomplete = ()=>res(r && r.result);
    tx.onerror = ()=>rej(tx.error);
    tx.onabort = ()=>rej(tx.error);
  });
}
const idbLire = (cle)=> idbOp("readonly", st=>st.get(cle));
const idbEcrire = (cle, val)=> idbOp("readwrite", st=>st.put(val, cle));
const idbSupprimer = (cle)=> idbOp("readwrite", st=>st.delete(cle));
const idbCles = ()=> idbOp("readonly", st=>st.getAllKeys());

/* tous les objets photo (rangées et appoints) */
function toutesPhotos(){
  const l = [];
  (data.bibliotheques || []).forEach(b=>Object.keys(b.cases || {}).forEach(k=>{
    const cs = b.cases[k];
    champsPhotoCase(cs).forEach(ch=>{ const ph = photoObj(cs, ch); if (ph) l.push({ b, k, cs, ch, ph }); });
  }));
  return l;
}
const cleIdb = (x)=> x.ph.chemin || (x.b.id + "|" + x.k + "|" + x.ch);
const dejaDansIdb = new Map();          // clé → taille de l'image déjà écrite (évite de réécrire à chaque enregistrement)

/* avant chaque enregistrement : les photos non envoyées passent dans IndexedDB ; celles envoyées en sortent */
function synchroniserPhotosIdb(){
  toutesPhotos().forEach(x=>{
    const cle = cleIdb(x);
    if (x.ph.plein && !x.ph.envoye){
      x.ph.enIDB = cle;
      if (dejaDansIdb.get(cle) !== x.ph.plein.length){
        dejaDansIdb.set(cle, x.ph.plein.length);
        idbEcrire(cle, x.ph.plein).catch(e=>{ dejaDansIdb.delete(cle); journal("ÉCHEC d'écriture d'une photo en attente (IndexedDB) : " + (e && e.message)); });
      }
    } else if (x.ph.enIDB && (x.ph.envoye || !x.ph.plein)){
      const c = x.ph.enIDB; delete x.ph.enIDB; dejaDansIdb.delete(c);
      idbSupprimer(c).catch(()=>{});
    }
  });
}
/* au démarrage : remettre en mémoire les photos en attente */
async function rechargerPhotosIdb(){
  let n = 0;
  for (const x of toutesPhotos()){
    if (x.ph.enIDB && !x.ph.plein && !x.ph.envoye){
      try{ const d = await idbLire(x.ph.enIDB); if (d){ x.ph.plein = d; dejaDansIdb.set(x.ph.enIDB, d.length); n++; } }
      catch(e){ journal("ÉCHEC de lecture d'une photo en attente (IndexedDB) : " + (e && e.message)); }
    }
  }
  if (n){ journal(`${n} photo(s) en attente rechargée(s) depuis IndexedDB`); rendre(); }
}

/* ====== DIAGNOSTIC DE L'ESPACE ====== */
async function diagnosticStockage(){
  const lignes = [];
  let totalLS = 0, bib = 0, autres = [];
  try{
    for (let i = 0; i < localStorage.length; i++){
      const c = localStorage.key(i), v = localStorage.getItem(c) || "";
      const o = (c.length + v.length) * 2;          // le navigateur compte 2 octets par caractère
      totalLS += o;
      if (c.startsWith("biblio_")) { bib += o; lignes.push([c, o]); }
      else autres.push([c, o]);
    }
  }catch(e){}
  autres.sort((a, z)=>z[1] - a[1]);
  let nIdb = 0, oIdb = 0;
  try{ const cles = await idbCles(); nIdb = cles.length; for (const c of cles){ const v = await idbLire(c); oIdb += (v || "").length; } }catch(e){}
  let est = null;
  try{ if (navigator.storage && navigator.storage.estimate) est = await navigator.storage.estimate(); }catch(e){}
  const ko = (o)=> o >= 1048576 ? (o / 1048576).toFixed(2).replace(".", ",") + " Mo" : Math.round(o / 1024) + " Ko";
  modale({ titre:"Espace de stockage de cet appareil",
    html:`<div><b>Stockage local (localStorage)</b> : ${ko(totalLS)} utilisés sur environ 5 Mo, <b>partagés par toutes vos apps</b> de l'adresse ${esc(location.host)}.</div>
      <div class="titreSection" style="margin-top:10px">Cette app : ${ko(bib)}</div>
      ${lignes.sort((a, z)=>z[1] - a[1]).map(([c, o])=>`<div class="aide" style="margin:2px 0">${esc(c)} : ${ko(o)}</div>`).join("")}
      <div class="titreSection" style="margin-top:10px">Autres apps de la même adresse : ${ko(autres.reduce((s, x)=>s + x[1], 0))}</div>
      ${autres.slice(0, 15).map(([c, o])=>`<div class="aide" style="margin:2px 0">${esc(c)} : ${ko(o)}</div>`).join("") || `<div class="aide">aucune</div>`}
      <div class="titreSection" style="margin-top:10px">Photos en attente (IndexedDB) : ${nIdb} — ${ko(oIdb)}</div>
      <div class="aide">IndexedDB dispose de beaucoup plus de place ; les photos y attendent d'être envoyées sur GitHub.</div>
      ${est ? `<div class="aide">Estimation du navigateur : ${ko(est.usage || 0)} utilisés${est.quota ? " sur " + ko(est.quota) : ""}.</div>` : ""}`,
    boutons:[{texte:"Fermer"}] });
}

function lireFichier(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result);
    fr.onerror = ()=>rej(new Error("Lecture du fichier impossible"));
    fr.readAsDataURL(file);
  });
}

function redimensionner(dataURL, maxDim, qualite){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const f = Math.min(1, maxDim/Math.max(w,h));
      w = Math.round(w*f); h = Math.round(h*f);
      const cv = document.createElement("canvas");
      cv.width=w; cv.height=h;
      const cx = cv.getContext("2d");
      cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg", qualite));
    };
    img.onerror = ()=>rej(new Error("Image illisible"));
    img.src = dataURL;
  });
}

function base64Seul(dataURL){ return (dataURL||"").split(",")[1] || ""; }

/* Photo en pleine résolution : en attente d'envoi (plein), en mémoire, ou lue sur GitHub.
   Plus aucune miniature : on voit toujours la vraie photo, celle que reçoit Gemini. */
const chargementsPhotos = {};
const fileChargements = [];
let chargementsActifs = 0;
const MAX_CHARGEMENTS = 4;

function pomperChargements(){
  while (chargementsActifs < MAX_CHARGEMENTS && fileChargements.length){
    const tache = fileChargements.shift();
    chargementsActifs++;
    tache().finally(()=>{ chargementsActifs--; pomperChargements(); });
  }
}

/* Un compartiment peut avoir deux photos de rang : "photo" (devant) et "photo2" (derrière, prise
   après avoir retiré les livres de devant), plus autant de photos d'appoint que voulu
   (zooms, autres angles), désignées par "appoint:<id>" et rangées dans cs.appoints. */
const CHAMPS_PHOTO = ["photo","photo2"];
const NOM_FACE = { photo:"devant", photo2:"derrière" };
const PRE_APPOINT = "appoint:";
function estAppoint(champ){ return typeof champ === "string" && champ.indexOf(PRE_APPOINT) === 0; }
function idAppoint(champ){ return String(champ).slice(PRE_APPOINT.length); }

/* La photo désignée par un champ, qu'elle soit de rang ou d'appoint. */
function photoObj(cs, champ){
  if (!cs) return null;
  if (estAppoint(champ)) return (cs.appoints||[]).find(a=>a.id === idAppoint(champ)) || null;
  return cs[champ || "photo"] || null;
}
/* Pose (ou retire, avec val null) la photo d'un champ, en gardant la légende d'un appoint. */
function poserPhoto(cs, champ, val){
  if (!estAppoint(champ)){ cs[champ] = val; return; }
  cs.appoints = cs.appoints || [];
  const id = idAppoint(champ);
  const i = cs.appoints.findIndex(a=>a.id === id);
  if (!val){ if (i >= 0) cs.appoints.splice(i, 1); return; }
  val.id = id;
  if (i >= 0){ if (val.legende === undefined) val.legende = cs.appoints[i].legende || ""; cs.appoints[i] = val; }
  else { if (val.legende === undefined) val.legende = ""; cs.appoints.push(val); }
}
/* Tous les champs de photo réellement présents dans un compartiment. */
function champsPhotoCase(cs){
  return CHAMPS_PHOTO.filter(ch=>cs && cs[ch]).concat(((cs && cs.appoints) || []).map(a=>PRE_APPOINT + a.id));
}
function numeroAppoint(cs, champ){ return ((cs && cs.appoints) || []).findIndex(a=>a.id === idAppoint(champ)) + 1; }

function cheminPhoto(b, k, champ){
  const suffixe = estAppoint(champ) ? "-appoint-" + idAppoint(champ) : (champ === "photo2" ? "-derriere" : "");
  return "images/" + b.id + "/" + k + suffixe + ".jpg";
}
function cleCache(b, k, champ){
  const suffixe = estAppoint(champ) ? "#a" + idAppoint(champ) : (champ === "photo2" ? "#2" : "");
  return b.id + "/" + k + suffixe;
}

function photoImmediate(bib, cle, champ){
  champ = champ || "photo";
  const ph = photoObj(bib.cases[cle], champ);
  if (!ph) return null;
  return ph.plein || cachePhotos[cleCache(bib, cle, champ)] || null;
}

function photoPleine(bib, cle, champ){
  champ = champ || "photo";
  const cs = bib.cases[cle];
  const photo = photoObj(cs, champ);
  if (!photo) return Promise.resolve(null);
  const deja = photoImmediate(bib, cle, champ);
  if (deja) return Promise.resolve(deja);
  if (!photo.envoye && photo.enIDB) return idbLire(photo.enIDB).then(d=>{ if (d) photo.plein = d; return d || null; }).catch(()=>null);
  if (!photo.envoye || !photo.chemin) return Promise.resolve(null);
  const id = cleCache(bib, cle, champ);
  if (chargementsPhotos[id]) return chargementsPhotos[id];
  const p = new Promise(res=>{
    fileChargements.push(async ()=>{
      const d = await ghLireImage(photo.chemin, photo.maj);
      if (d && photoObj(cs, champ) === photo) cachePhotos[id] = d;
      res(d);
    });
    pomperChargements();
  });
  chargementsPhotos[id] = p;
  p.finally(()=>{ delete chargementsPhotos[id]; });
  return p;
}

function retirerMiniatures(jeu){
  let n = 0;
  ((jeu && jeu.bibliotheques) || []).forEach(b=>{
    Object.keys(b.cases||{}).forEach(k=>{
      const ph = b.cases[k].photo;
      if (ph && "mini" in ph){ delete ph.mini; n++; }
    });
  });
  return n;
}

function ghToken(){ return localStorage.getItem(CLE_TOKEN) || ""; }
function ghLisible(){ return !!(cfg.ghUser && cfg.ghRepo); }          // lecture : dépôt public, pas de jeton requis
function ghPret(){ return !!(ghLisible() && ghToken()); }                // écriture : jeton requis
function ghEntetes(accept){
  const h = { Accept: accept };
  if (ghToken()) h.Authorization = "token " + ghToken();
  return h;
}
function ghUrl(chemin){ return `https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${chemin}`; }

async function ghLireTexte(chemin){
  const r = await fetch(ghUrl(chemin) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), {
    headers: ghEntetes("application/vnd.github.raw")
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub " + r.status + " : " + (await r.text()).slice(0,200));
  return await r.text();
}

async function ghLireImage(chemin, version){
  const enDataURL = async (r)=>{
    const b = new Blob([await r.arrayBuffer()], { type:"image/jpeg" });
    return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(b); });
  };
  const parApi = async ()=>{
    const r = await fetch(ghUrl(chemin) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), {
      headers: ghEntetes("application/vnd.github.raw")
    });
    return r.ok ? await enDataURL(r) : null;
  };
  // sans jeton : raw.githubusercontent.com (pas de limite de 60 requêtes/heure de l'API)
  const parRaw = async ()=>{
    const u = `https://raw.githubusercontent.com/${cfg.ghUser}/${cfg.ghRepo}/${encodeURIComponent(cfg.ghBranche)}/${chemin}?v=${encodeURIComponent(version||"")}`;
    const r = await fetch(u, { cache:"no-cache" });
    return r.ok ? await enDataURL(r) : null;
  };
  try{
    if (ghToken()) return (await parApi()) || (await parRaw());
    return (await parRaw()) || (await parApi());
  }catch(e){
    try{ return ghToken() ? await parRaw() : await parApi(); }catch(e2){ return null; }
  }
}

async function ghSha(chemin){
  const r = await fetch(ghUrl(chemin) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), {
    headers: ghEntetes("application/vnd.github+json")
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  return j.sha || null;
}

async function ghEcrire(chemin, contenuBase64, message){
  const sha = await ghSha(chemin);
  const corps = { message, content: contenuBase64, branch: cfg.ghBranche };
  if (sha) corps.sha = sha;
  const r = await fetch(ghUrl(chemin), {
    method:"PUT",
    headers:{ Authorization:"token " + ghToken(), Accept:"application/vnd.github+json", "Content-Type":"application/json" },
    body: JSON.stringify(corps)
  });
  if (!r.ok) throw new Error("GitHub " + r.status + " : " + (await r.text()).slice(0,200));
  return await r.json();
}

function enBase64Utf8(txt){ return btoa(unescape(encodeURIComponent(txt))); }

/* résumé chiffré d'un jeu de données, pour les comparaisons */
function resume(jeu){
  if (!jeu || !Array.isArray(jeu.bibliotheques)) return null;
  let livres=0, photos=0, resumes=0, categories=0, analyses=0, attente=0, deuxRangs=0, unRang=0, appoints=0;
  jeu.bibliotheques.forEach(b=>{
    Object.keys(b.cases||{}).forEach(k=>{
      const cs = b.cases[k];
      champsPhotoCase(cs).forEach(ch=>{ photos++; const ph = photoObj(cs, ch); if (ph && !ph.envoye) attente++; });
      (cs.livres||[]).forEach(lv=>{ livres++; if (lv.resume) resumes++; if (lv.categorie) categories++; });
      if (cs.analyse) analyses++;
      if (cs.photo && cs.photo2) deuxRangs++;
      if (cs.unRang && !cs.photo2) unRang++;
      appoints += (cs.appoints || []).length;
    });
  });
  return { bibliotheques: jeu.bibliotheques.length, livres, photos, resumes, categories, analyses, attente, deuxRangs, unRang, appoints, maj: jeu.maj };
}

/* forme canonique (clés triées, sans la photo en mémoire) pour comparer deux objets */
function canon(o){
  if (Array.isArray(o)) return "[" + o.map(canon).join(",") + "]";
  if (o && typeof o === "object"){
    return "{" + Object.keys(o).filter(k=>k !== "plein" && o[k] !== undefined).sort()
      .map(k=>JSON.stringify(k) + ":" + canon(o[k])).join(",") + "}";
  }
  return JSON.stringify(o === undefined ? null : o);
}
function nomCaseCourt(k){ const [r, c] = k.split("-"); return "R" + r + "·C" + c; }

/* Liste lisible de tout ce qui diffère entre deux jeux de données, par bibliothèque. */
function differences(loc, dist){
  const res = [];
  if (!loc || !dist) return res;
  const L = {}, D = {};
  (loc.bibliotheques||[]).forEach(b=>L[b.id] = b);
  (dist.bibliotheques||[]).forEach(b=>D[b.id] = b);
  const ids = Object.keys(L).concat(Object.keys(D).filter(id=>!L[id]));
  const ordreL = (loc.bibliotheques||[]).map(b=>b.id).join(","), ordreD = (dist.bibliotheques||[]).map(b=>b.id).join(",");
  ids.forEach(id=>{
    const a = L[id], d = D[id];
    const nom = (a||d).nom || "Sans nom";
    if (!d){ res.push({ nom, items:[`<span class="ici">Bibliothèque présente seulement sur cet appareil</span> (${compteLivres(a)} livre(s))`] }); return; }
    if (!a){ res.push({ nom, items:[`<span class="gh">Bibliothèque présente seulement sur GitHub</span> (${compteLivres(d)} livre(s))`] }); return; }
    const items = [];
    if ((a.nom||"") !== (d.nom||"")) items.push(`nom : « ${esc(a.nom)} » ici, « ${esc(d.nom)} » sur GitHub`);
    if ((a.lieu||"") !== (d.lieu||"")) items.push(`lieu : « ${esc(a.lieu||"—")} » ici, « ${esc(d.lieu||"—")} » sur GitHub`);
    if (a.rangees !== d.rangees || a.compartiments !== d.compartiments)
      items.push(`dimensions : ${a.rangees}×${a.compartiments} ici, ${d.rangees}×${d.compartiments} sur GitHub`);
    if (canon(a.ratio) !== canon(d.ratio)) items.push("proportions de la grille différentes");
    const autresA = Object.assign({}, a), autresD = Object.assign({}, d);
    ["id","nom","lieu","rangees","compartiments","ratio","cases"].forEach(k=>{ delete autresA[k]; delete autresD[k]; });
    if (canon(autresA) !== canon(autresD)) items.push("autres réglages de la bibliothèque différents");

    // compartiment par compartiment, en regroupant par nature de différence
    const g = {};
    const noter = (cle, k, n)=>{ g[cle] = g[cle] || { n:0, cases:new Set() }; g[cle].n += (n||1); g[cle].cases.add(k); };
    const ca = a.cases||{}, cd = d.cases||{};
    Object.keys(ca).concat(Object.keys(cd).filter(k=>!ca[k])).forEach(k=>{
      const x = ca[k] || {}, y = cd[k] || {};
      const lx = x.livres||[], ly = y.livres||[];
      const mx = {}, my = {};
      lx.forEach(l=>mx[l.id] = l); ly.forEach(l=>my[l.id] = l);
      lx.forEach(l=>{
        const m = my[l.id];
        if (!m){ noter("livresIci", k); return; }
        if (["titre","auteur","annee"].some(c=>(l[c]||"") !== (m[c]||""))) noter("fiche", k);
        if ((l.resume||"") !== (m.resume||"")) noter("resume", k);
        if ((l.categorie||"") !== (m.categorie||"")) noter("categorie", k);
        const ra = Object.assign({}, l), rb = Object.assign({}, m);
        ["id","titre","auteur","annee","resume","categorie"].forEach(c=>{ delete ra[c]; delete rb[c]; });
        if (canon(ra) !== canon(rb)) noter("livreAutre", k);
      });
      ly.forEach(l=>{ if (!mx[l.id]) noter("livresGH", k); });
      const communs = lx.filter(l=>my[l.id]).map(l=>l.id).join(","), communsD = ly.filter(l=>mx[l.id]).map(l=>l.id).join(",");
      if (communs !== communsD) noter("ordre", k);
      const champs = new Set(champsPhotoCase(x).concat(champsPhotoCase(y)));
      champs.forEach(ch=>{
        const px = photoObj(x, ch), py = photoObj(y, ch);
        if (px && !px.envoye) noter("attente", k);
        if (px && !py) noter("photoIci", k);
        else if (!px && py) noter("photoGH", k);
        else if ((px.chemin||"") !== (py.chemin||"") || (px.maj||"") !== (py.maj||"")) noter("photoChange", k);
        else if ((px.legende||"") !== (py.legende||"")) noter("legende", k);
      });
      if (canon(x.analyse) !== canon(y.analyse)) noter("analyse", k);
      if (canon(x.controle) !== canon(y.controle)) noter("controle", k);
      const rx = Object.assign({}, x), ry = Object.assign({}, y);
      ["livres","photo","photo2","appoints","analyse","controle"].forEach(c=>{ delete rx[c]; delete ry[c]; });
      if (canon(rx) !== canon(ry)) noter("caseAutre", k);
    });
    const LIB = {
      livresIci:   n=>`<span class="ici">${n} livre(s) seulement sur cet appareil</span>`,
      livresGH:    n=>`<span class="gh">${n} livre(s) seulement sur GitHub</span>`,
      fiche:       n=>`${n} livre(s) au titre, à l'auteur ou à l'année modifiés`,
      resume:      n=>`${n} résumé(s) différent(s)`,
      categorie:   n=>`${n} catégorie(s) différente(s)`,
      livreAutre:  n=>`${n} livre(s) aux détails modifiés (rang, certitude, remarque…)`,
      ordre:       n=>`ordre des livres différent dans ${n} compartiment(s)`,
      attente:     n=>`<span class="ici">${n} photo(s) pas encore envoyée(s) sur GitHub</span>`,
      photoIci:    n=>`<span class="ici">${n} photo(s) seulement sur cet appareil</span>`,
      photoGH:     n=>`<span class="gh">${n} photo(s) seulement sur GitHub</span>`,
      photoChange: n=>`${n} photo(s) remplacée(s) ou retouchée(s)`,
      legende:     n=>`${n} légende(s) de photo d'appoint différente(s)`,
      analyse:     n=>`état d'analyse différent dans ${n} compartiment(s)`,
      controle:    n=>`contrôle par photos d'appoint différent dans ${n} compartiment(s)`,
      caseAutre:   n=>`autres données différentes dans ${n} compartiment(s)`
    };
    Object.keys(LIB).forEach(cle=>{
      if (!g[cle]) return;
      const cs = [...g[cle].cases].sort((p, q)=>p.localeCompare(q, "fr", { numeric:true }));
      const ou = cs.slice(0, 4).map(nomCaseCourt).join(", ") + (cs.length > 4 ? "…" : "");
      items.push(LIB[cle](g[cle].n) + ` <span class="aide">(${ou})</span>`);
    });
    if (items.length) res.push({ nom, items });
  });
  if (ordreL !== ordreD && ids.every(id=>L[id] && D[id])) res.push({ nom:"Liste des bibliothèques", items:["ordre d'affichage différent"] });
  return res;
}

/* jeuLoc / jeuDist : les jeux de données complets (pas leur résumé) */
function tableauComparaison(jeuLoc, jeuDist, titreDist){
  const loc = resume(jeuLoc), dist = resume(jeuDist);
  const c = (v)=> v==null ? "—" : v;
  const ligne = (lib, cle)=>{
    const a = loc && loc[cle], b = dist && dist[cle];
    const diff = loc && dist && a !== b;
    return `<tr class="${diff?"diff":""}"><th>${lib}</th><td class="n">${c(a)}</td><td class="n">${c(b)}</td></tr>`;
  };
  let detail = "";
  if (loc && dist){
    const diffs = differences(jeuLoc, jeuDist);
    detail = `<tr class="sousTitre"><th colspan="3">Détail des différences</th></tr>`;
    if (diffs.length){
      detail += diffs.map(x=>`<tr><th>${esc(x.nom)}</th><td colspan="2" class="detail"><ul>${x.items.map(i=>`<li>${i}</li>`).join("")}</ul></td></tr>`).join("");
    } else {
      detail += `<tr><td colspan="3" class="detail">Aucune différence de contenu : livres, photos et réglages sont identiques.` +
        (loc.maj !== dist.maj ? " Seule la date de modification diffère." : "") +
        (jeuLoc === data && sale ? " L'appareil garde seulement la marque « à envoyer » (une modification a sans doute été faite puis défaite) : un envoi ne changerait rien au contenu." : "") +
        `</td></tr>`;
    }
  }
  return `<table class="compare">
    <tr><th></th><th>Cet appareil</th><th>${esc(titreDist||"GitHub")}</th></tr>
    ${ligne("Bibliothèques","bibliotheques")}
    ${ligne("Livres","livres")}
    ${ligne("Résumés","resumes")}
    ${ligne("Catégories","categories")}
    ${ligne("Photos","photos")}
    ${ligne("Photos pas encore envoyées","attente")}
    ${ligne("Compartiments à 2 rangs","deuxRangs")}
    ${ligne("Marqués « 1 rang »","unRang")}
    ${ligne("Photos d'appoint","appoints")}
    ${ligne("Compartiments analysés","analyses")}
    <tr class="${loc && dist && loc.maj !== dist.maj ? "diff" : ""}"><th>Modifiée le</th><td>${esc(loc&&loc.maj?dateFr(loc.maj):"—")}</td><td>${esc(dist&&dist.maj?dateFr(dist.maj):"—")}</td></tr>
    ${detail}
  </table>`;
}
