function exporterFichier(){
  const blob = new Blob([JSON.stringify(data,null,1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bibliotheques-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  toast("Fichier exporté. Rien n'a été modifié.");
}

/* ====================================================================
   SAUVEGARDE IMMÉDIATE : photos dès qu'elles sont prises, résultats d'analyse dès qu'ils arrivent
   ==================================================================== */
const CLE_JOURNAL = "biblio_journal_attente";
let versionJournal = 0;                           // change à chaque nouveau résultat sauvegardé
const resultatsSession = [];                      // résultats obtenus pendant cette session (chemin + contenu)      // résultats d'analyse pas encore envoyés (pas de réseau)

/* Avertissement bien visible quand une sauvegarde immédiate n'a pas pu se faire. */
function avertirNonSauve(quoi, raison){
  // plusieurs échecs d'affilée (analyse de toute une bibliothèque sans réseau) : un seul avertissement à la fois
  const deja = document.getElementById("avertNonSauve");
  if (deja){ deja.dataset.n = String(Number(deja.dataset.n || 1) + 1); deja.querySelector(".nbAutres").textContent = `+ ${Number(deja.dataset.n) - 1} autre(s) élément(s) dans le même cas.`; return; }
  modale({ titre:"⚠️ Pas encore sauvegardé sur GitHub",
    html:`<div id="avertNonSauve" data-n="1"><div><b>${esc(quoi)}</b> n'existe pour l'instant que <b>sur cet appareil</b>.</div>
          <div class="aide">${esc(raison)}</div>
          <div class="aide">Dès que le réseau revient, ouvrez ☁️ et envoyez : ${quoi.startsWith("Photo") ? "la photo partira" : quoi.startsWith("Résultat") ? "le résultat partira" : "tout partira"} avec le reste.</div>
          <div class="aide nbAutres" style="font-weight:600"></div></div>`,
    boutons:[{texte:"Compris", classe:"principal"}] });
}
function raisonEchec(e){
  if (!ghPret()) return "Aucun jeton GitHub n'est enregistré (réglages ⚙️) : l'envoi automatique est impossible.";
  if (typeof navigator !== "undefined" && navigator.onLine === false) return "Pas de réseau.";
  return "L'envoi a échoué" + (e && e.message ? " : " + e.message : "") + ".";
}

/* Envoie tout de suite une photo qui vient d'être prise ou modifiée. */
async function envoyerPhotoAuto(b, k, champ, quoi){
  if (!ghPret() || navigator.onLine === false){ avertirNonSauve(quoi, raisonEchec()); return false; }
  try{
    await televerserPhoto(b, k, champ);
    toast(quoi + " : sauvegardée sur GitHub ✓", 3000);
    journal(quoi + " de " + k + " envoyée sur GitHub");
    return true;
  }catch(e){ avertirNonSauve(quoi, raisonEchec(e)); return false; }
}

/* Journal des résultats d'analyse : un fichier par résultat, jamais écrasé.
   analyses/<bibliothèque>/<compartiment>/<date>-<genre>.json */
function journalEnAttente(){ try{ return JSON.parse(localStorage.getItem(CLE_JOURNAL) || "[]"); }catch(e){ return []; } }
function ecrireJournalEnAttente(l){ try{ localStorage.setItem(CLE_JOURNAL, JSON.stringify(l)); }catch(e){} }

async function journaliserResultat(b, k, genre, contenu){
  const date = new Date().toISOString();
  const nomGenre = genre === "appoint" ? "appoint-" + (contenu.appoint || "") + (contenu.mode === "ordre" ? "-ordre" : "") : "analyse-" + (contenu.portee || "deux");
  const chemin = `analyses/${b.id}/${k}/${date.replace(/[:.]/g, "-")}-${nomGenre}.json`;
  const doc = Object.assign({ date, bibliotheque:b.id, nomBibliotheque:b.nom, compartiment:k, genre }, contenu);
  resultatsSession.push({ chemin, doc });
  versionJournal++;
  const quoi = (genre === "appoint" ? "Résultat de la lecture de l'appoint" : "Résultat de l'analyse") + " de " + lib(k);
  if (!ghPret() || navigator.onLine === false){
    ecrireJournalEnAttente(journalEnAttente().concat([{ chemin, doc }]));
    avertirNonSauve(quoi, raisonEchec() + " Il est gardé de côté et partira au prochain envoi ☁️.");
    return false;
  }
  try{
    await ghEcrire(chemin, enBase64Utf8(JSON.stringify(doc, null, 1)), quoi);
    viderJournalEnAttente();                 // profite du réseau pour envoyer ceux restés de côté
    return true;
  }catch(e){
    ecrireJournalEnAttente(journalEnAttente().concat([{ chemin, doc }]));
    avertirNonSauve(quoi, raisonEchec(e) + " Il est gardé de côté et partira au prochain envoi ☁️.");
    return false;
  }
}
async function viderJournalEnAttente(pg){
  let l = journalEnAttente();
  if (!l.length || !ghPret()) return 0;
  let n = 0;
  for (let i = 0; i < l.length; i++){
    const x = l[i];
    if (pg) pg.maj(i, l.length, `Résultat d'analyse ${i + 1} / ${l.length} — reste ${l.length - i}`);
    try{ await ghEcrire(x.chemin, enBase64Utf8(JSON.stringify(x.doc, null, 1)), "Résultat d'analyse " + x.doc.compartiment); n++; x.fait = true; }
    catch(e){ break; }
  }
  ecrireJournalEnAttente(l.filter(x=>!x.fait));
  return n;
}

/* Envoi automatique des DONNÉES (listes de livres de chaque rangée) juste après une analyse appliquée.
   Garde-fous : pas de réseau → avertissement ; GitHub modifié ailleurs ou envoi avec pertes → envoi suspendu, on explique. */
let envoiAutoEnCours = null;
async function envoyerDonneesAuto(quoi, opts){
  opts = opts || {};
  if (reconstructionEnCours) return false;                     // une seule sauvegarde, à la fin de la reconstruction
  if (envoiAutoEnCours){ try{ await envoiAutoEnCours; }catch(e){} }
  envoiAutoEnCours = (async ()=>{
    if (pagePerimee()){ journal("Sauvegarde auto refusée (page périmée) : " + quoi); fenetrePerimee(); return false; }
    if (!ghPret() || navigator.onLine === false){
      journal("Sauvegarde auto impossible (" + raisonEchec() + ") : " + quoi + (opts.silencieuxHorsReseau ? " — envoi au retour du réseau" : ""));
      if (!opts.silencieuxHorsReseau) avertirNonSauve(quoi, raisonEchec());
      return false;
    }
    try{
      const txt = await ghLireTexte(FICHIER_JSON);
      if (txt){
        const j = JSON.parse(txt);
        const connue = localStorage.getItem(CLE_SYNC);
        // une reconstruction peut légitimement réduire le nombre de livres et de résumés
        const pertes = pertesEnvoi(data, j).filter(x=>!(opts.livresEnMoinsVoulus && (/^(livres|résumés|dont) :/.test(x) || /^\d+ livre\(s\) .* absent/.test(x))));
        if ((j.maj && connue && j.maj !== connue) || pertes.length){
          journal("Sauvegarde auto SUSPENDUE : " + quoi + (pertes.length ? " — " + pertes.join(" ; ") : " — GitHub modifié ailleurs"));
          modale({ titre:"⚠️ Sauvegarde automatique suspendue",
            html:`<div><b>${esc(quoi)}</b> est enregistré sur cet appareil, mais n'a pas été envoyé automatiquement :</div>
                  <ul>${j.maj && connue && j.maj !== connue ? "<li>la version GitHub a été modifiée ailleurs (autre appareil ou autre fenêtre) depuis votre dernier échange ;</li>" : ""}
                  ${pertes.map(x=>`<li>l'envoi ferait disparaître des éléments de GitHub — ${esc(x)} ;</li>`).join("")}</ul>
                  <div class="aide">Ouvrez ☁️ pour comparer et décider en connaissance de cause.</div>`,
            boutons:[{texte:"Plus tard"}, {texte:"Ouvrir ☁️", classe:"principal", action:()=>ouvrirSync()}] });
          return false;
        }
      }
      // photos et résultats restés de côté, puis les données
      for (const p of photosEnAttente()){ try{ await televerserPhoto(p.bib, p.cle, p.champ); }catch(e){} }
      if (journalEnAttente().length) await viderJournalEnAttente();
      data.maj = new Date().toISOString();
      await ghEcrire(FICHIER_JSON, enBase64Utf8(JSON.stringify(data, null, 1)), "Bibliothèques — " + quoi + " — " + dateFr());
      localStorage.setItem(CLE_SYNC, data.maj);
      sale = photosEnAttente().length > 0; etatSync = "ok";
      sauver(false);
      toast(quoi + " : sauvegardé sur GitHub ✓", 3000);
      journal("Sauvegarde auto réussie : " + quoi + " (" + etatCourt() + ")");
      return true;
    }catch(e){
      etatSync = "echec"; majBandeau();
      journal("ÉCHEC sauvegarde auto : " + quoi + " — " + (e && e.message));
      avertirNonSauve(quoi, raisonEchec(e));
      return false;
    }
  })();
  const r = await envoiAutoEnCours;
  envoiAutoEnCours = null;
  return r;
}

/* ====================================================================
   RÉSULTATS SAUVEGARDÉS : vider les listes d'un compartiment, puis, photo par photo,
   réutiliser un résultat sauvegardé ou redemander à l'IA.
   ==================================================================== */
let reconstructionEnCours = false;

async function listerResultatsSauves(b, k){
  const locaux = journalEnAttente().filter(x=>x.doc.bibliotheque === b.id && x.doc.compartiment === k)
    .map(x=>({ nom:x.chemin.split("/").pop(), doc:x.doc, local:true }));
  let distants = [];
  if (ghLisible()){
    const r = await fetch(ghUrl(`analyses/${b.id}/${k}`) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), { headers: ghEntetes() });
    if (r.ok) distants = (await r.json()).filter(x=>x.type === "file" && /\.json$/.test(x.name)).map(x=>({ nom:x.name, chemin:x.path }));
    else if (r.status !== 404) throw new Error("GitHub " + r.status);
  }
  const connus = new Set(locaux.concat(distants).map(x=>x.nom));
  const session = resultatsSession.filter(x=>x.doc.bibliotheque === b.id && x.doc.compartiment === k)
    .map(x=>({ nom:x.chemin.split("/").pop(), doc:x.doc, cheminSession:x.chemin })).filter(x=>!connus.has(x.nom));
  return locaux.concat(distants, session).map(x=>{
    const m = x.nom.match(/^(\d{4})-(\d\d)-(\d\d)T(\d\d)-(\d\d)-(\d\d)/);
    // les noms de fichier portent l'heure UTC : on l'affiche à l'heure locale
    const t = m ? `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z` : x.nom;
    const dl = m ? new Date(t) : null;
    const deux = (n)=>String(n).padStart(2, "0");
    const quand = dl ? `${deux(dl.getDate())}/${deux(dl.getMonth() + 1)} ${deux(dl.getHours())}:${deux(dl.getMinutes())}` : x.nom;
    const ma = x.nom.match(/-appoint-([a-z0-9]+)(-ordre)?\.json$/i);
    const mp = x.nom.match(/-analyse-(deux|devant|derriere)\.json$/i);
    return Object.assign(x, { t, quand, genre: ma ? "appoint" : "analyse", appoint: ma ? ma[1] : null, mode: ma && ma[2] ? "ordre" : "verif", portee: mp ? mp[1] : null });
  }).sort((a, z)=>a.t.localeCompare(z.t));
}

/* Vider les listes d'un compartiment (photos conservées ; liste d'avant mise de côté). */
async function viderListesCompartiment(b, k){
  const cs = b.cases[k] = b.cases[k] || { livres:[] };
  const ok = await confirmer(`<div>Vider les listes de livres de ${esc(lib(k))} (${(cs.livres||[]).filter(lv=>!certifiee(cs, lv.rang === "derriere" ? "derriere" : "devant")).length} livre(s)) ?${cs.certif ? " Les rangées certifiées ★ sont conservées." : ""}</div>
    <div class="aide">Les photos (devant, derrière, appoints) sont conservées. Vous pourrez ensuite, photo par photo, relancer une analyse ou réutiliser un résultat sauvegardé. La liste actuelle est mise de côté : « ↩ Rétablir » la remet.</div>`, "Vider les listes", "Vider");
  if (!ok) return;
  journal(`Listes vidées pour ${lib(k)} (${(cs.livres||[]).length} livre(s) mis de côté)`);
  cs.avantReconstruction = { date:new Date().toISOString(), livres:(cs.livres||[]).slice() };
  // les rangées certifiées ★ sont épargnées
  cs.livres = (cs.livres||[]).filter(lv=>certifiee(cs, lv.rang === "derriere" ? "derriere" : "devant"));
  delete cs.analyse;
  (cs.appoints||[]).forEach(a=>{ if (!(a.rang && certifiee(cs, a.rang))){ delete a.rang; delete a.rangInfo; } });
  sauver(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); rendreBiblio();
  toast("Listes vidées. Choisissez une photo, puis 🔍 nouvelle analyse ou ♻️ analyse sauvegardée.", 6000);
  envoyerDonneesAuto("Listes de livres de " + lib(k), { livresEnMoinsVoulus:true });
}
function retablirListesCompartiment(b, k){
  const cs = b.cases[k], sv = cs && cs.avantReconstruction;
  if (!sv) return;
  if (cs.certif){ toast("Impossible : une rangée de ce compartiment est certifiée ★.", 5000); return; }
  cs.livres = sv.livres; delete cs.avantReconstruction; sauver();
  journal(`Listes rétablies pour ${lib(k)} (${cs.livres.length} livre(s))`);
  if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); rendreBiblio();
  toast(`Liste du ${dateFr(sv.date)} rétablie (${cs.livres.length} livre(s)).`, 5000);
  envoyerDonneesAuto("Listes de livres de " + lib(k));
}

/* Résultats sauvegardés de LA photo affichée : choisir lequel réutiliser (ou aucun), supprimer ceux devenus inutiles. */
async function supprimerResultat(x){
  // 1. gardé de côté sur l'appareil (pas encore envoyé)
  ecrireJournalEnAttente(journalEnAttente().filter(y=>y.chemin.split("/").pop() !== x.nom));
  // 2. obtenu pendant cette session
  for (let i = resultatsSession.length - 1; i >= 0; i--) if (resultatsSession[i].chemin.split("/").pop() === x.nom) resultatsSession.splice(i, 1);
  // 3. sur GitHub
  const chemin = x.chemin || x.cheminSession;
  if (chemin && ghPret()) await ghSupprimer(chemin, "Suppression d'un résultat d'analyse sauvegardé");
  versionJournal++;
}
async function ghSupprimer(chemin, message){
  const sha = await ghSha(chemin);
  if (!sha) return false;
  const r = await fetch(ghUrl(chemin), { method:"DELETE", headers: ghEntetes("application/vnd.github+json"),
    body: JSON.stringify({ message: message || "Suppression", sha, branch: cfg.ghBranche }) });
  if (!r.ok) throw new Error("GitHub " + r.status + " : " + (await r.text()).slice(0, 150));
  return true;
}

async function fenetreReutiliserPhoto(b, k, face){
  const cs = b.cases[k];
  let liste;
  try{ liste = await listerResultatsSauves(b, k); }
  catch(e){ toast("Liste illisible : " + e.message, 6000); return; }
  const appoint = estAppoint(face);
  const retenus = liste.filter(x=> appoint ? (x.genre === "appoint" && x.appoint === idAppoint(face))
    : x.genre === "analyse" && (x.portee === "deux" || porteeActuelle(cs, x) === (face === "photo2" ? "derriere" : "devant"))).reverse();   // plus récent d'abord
  const inversee = (x)=> !appoint && x.genre === "analyse" && analyseInversee(cs, x.t);
  const nomPhoto = appoint ? "l'appoint " + numeroAppoint(cs, face) : face === "photo2" ? "la photo de derrière" : "la photo de devant";
  const nomPortee = { deux:"analyse des deux rangées (devant + derrière)", devant:"analyse de la rangée 1 seule", derriere:"analyse de la rangée 2 seule" };
  if (!retenus.length){
    modale({ titre:"Analyses sauvegardées", html:`<div>Aucune analyse sauvegardée pour ${nomPhoto}.</div><div class="aide">Utilisez « 🔍 Nouvelle analyse par l'IA ».</div>`, boutons:[{texte:"Fermer"}] });
    return;
  }
  // une analyse faite avant le dernier changement de la photo concerne une photo remplacée depuis
  const photoMaj = (champ)=>{ const p = photoObj(cs, champ); return p ? Date.parse(p.maj || "") || 0 : 0; };
  const obsolete = (x)=>{
    const t = Date.parse(x.t) || 0;
    if (appoint) return t < photoMaj(face);
    if (x.portee === "deux") return t < Math.max(photoMaj("photo"), photoMaj("photo2"));
    return t < photoMaj(face);
  };
  const nObs = retenus.filter(obsolete).length;
  const f = modale({ titre:"Analyses sauvegardées — " + nomPhoto,
    html:`<div>Choisissez l'analyse à réutiliser (aucune question n'est reposée à l'IA), ou fermez sans rien faire.</div>
      <div class="aide">🗑 supprime définitivement une sauvegarde (sur cet appareil et sur GitHub).${nObs ? ` Les analyses marquées ⚠️ ont été faites sur une photo remplacée depuis : elles ne correspondent plus à la photo actuelle.` : ""}</div>
      ${retenus.map((x, i)=>`<div class="prop" style="display:flex;gap:8px;align-items:center;${obsolete(x) ? "opacity:.75" : ""}">
        <div style="flex:1"><div class="t">${esc(x.quand)}${i === 0 ? " <span class='aide'>(la plus récente)</span>" : ""}</div>
          <div class="chg">${appoint ? "lecture de l'appoint" : esc(nomPortee[porteeActuelle(cs, x)] || "analyse")}${x.local ? " — pas encore sur GitHub" : ""}</div>
          ${inversee(x) ? `<div class="mot" title="Faite avant une permutation des rangées">⇄ faite avant la permutation des rangées : rattachée à cette photo, livres placés dans la bonne rangée</div>` : ""}
          ${obsolete(x) ? `<div class="mot" style="color:var(--orange)">⚠️ faite sur une photo remplacée depuis</div>` : ""}</div>
        <button class="btn principal" data-r="${i}">Utiliser</button>
        <button class="btn rouge" data-sup="${i}" title="Supprimer définitivement cette sauvegarde">🗑</button></div>`).join("")}`,
    boutons:[
      ...(nObs ? [{ texte:`🗑 Supprimer les ${nObs} obsolète(s)`, classe:"rouge", garder:true, action:async ()=>{
        const ok = await confirmer(`Supprimer définitivement les ${nObs} analyse(s) faites sur une photo remplacée depuis ?`, "Supprimer des sauvegardes", "Supprimer");
        if (!ok) return false;
        try{ for (const x of retenus.filter(obsolete)) await supprimerResultat(x); }
        catch(e){ toast("Suppression incomplète : " + e.message, 6000); }
        f.remove(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k);
        toast("Sauvegardes obsolètes supprimées.");
        fenetreReutiliserPhoto(b, k, face);
        return false;
      }}] : []),
      { texte:"Ne rien faire" }
    ] });
  f.querySelectorAll("[data-sup]").forEach(bt=>bt.onclick = async ()=>{
    const x = retenus[Number(bt.dataset.sup)];
    const ok = await confirmer(`Supprimer définitivement l'analyse du ${esc(x.quand)} ?<div class="aide">Elle ne pourra plus être réutilisée.</div>`, "Supprimer une sauvegarde", "Supprimer");
    if (!ok) return;
    try{ await supprimerResultat(x); toast("Sauvegarde supprimée."); }
    catch(e){ toast("Suppression impossible : " + e.message, 6000); return; }
    f.remove(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k);
    fenetreReutiliserPhoto(b, k, face);
  });
  f.querySelectorAll("[data-r]").forEach(bt=>bt.onclick = async ()=>{
    const x = retenus[Number(bt.dataset.r)];
    let doc = x.doc;
    if (!doc){ try{ doc = JSON.parse(await ghLireTexte(x.chemin)); x.doc = doc; }catch(e){ toast("Lecture impossible : " + e.message, 5000); return; } }
    f.remove();
    const src = Object.assign({ ia:"gemini", modele:"", echecs:[] }, doc.source || {});
    src.modele = (src.modele || "") + " — résultat sauvegardé du " + x.quand;
    if (appoint){
      fenetreFusionAppoint(b, k, face, (doc.lus || []).map(l=>Object.assign({}, l)), src);
    } else {
      const inv = analyseInversee(cs, x.t);
      const echange = (c)=> c === "photo" ? "photo2" : c === "photo2" ? "photo" : c;
      const livres = (doc.livres || []).map(l=>{
        const n = Object.assign({}, l, { id:uid() });
        if (inv){
          if (n.rang) n.rang = n.rang === "derriere" ? "devant" : "derriere";
          if (n.vues) n.vues = n.vues.map(v=>Object.assign({}, v, { champ: echange(v.champ) }));
        }
        return n;
      });
      livres.source = src;
      finaliserPortee(livres, porteeActuelle(cs, Object.assign({}, x, { portee: doc.portee || x.portee })) || porteeParDefaut(cs), cs);
      appliquerLivresCompartiment(b, k, livres);
    }
  });
}


/* ====== PERMUTER LES RANGÉES DE DEVANT ET DE DERRIÈRE ======
   Les photos échangent leur place (et leur fichier sur GitHub, pour garder des noms cohérents),
   les livres changent de rangée, ainsi que tout ce qui s'y rapporte (positions, témoins, questions, appoints). */
/* nombre impair de permutations depuis la date t : l'analyse porte sur l'autre rangée aujourd'hui */
function analyseInversee(cs, t){
  const d = Date.parse(t) || 0;
  return (cs.permutations || []).filter(p=>(Date.parse(p) || 0) > d).length % 2 === 1;
}
/* portée d'une analyse sauvegardée dans la disposition actuelle des photos */
function porteeActuelle(cs, x){
  if (!x.portee || x.portee === "deux" || !analyseInversee(cs, x.t)) return x.portee;
  return x.portee === "devant" ? "derriere" : "devant";
}
async function permuterRangees(b, k){
  const cs = b.cases[k];
  if (!cs) return;
  if (cs.certif){ toast("Impossible : une rangée de ce compartiment est certifiée ★ (retirez d'abord la certification).", 6000); return; }
  const a = cs.photo, z = cs.photo2;
  const nb1 = (cs.livres||[]).filter(lv=>lv.rang !== "derriere").length, nb2 = (cs.livres||[]).length - nb1;
  const ok = await confirmer(`<div>Permuter la rangée de devant et la rangée de derrière de ${esc(lib(k))} ?</div>
    <div class="aide">${a ? "La photo de devant devient la photo de derrière" : "Pas de photo de devant"} ; ${z ? "la photo de derrière devient la photo de devant" : "pas de photo de derrière"}.
    Les livres suivent : ${nb1} livre(s) passent en rangée 2, ${nb2} en rangée 1.</div>`, "Permuter les rangées", "⇄ Permuter");
  if (!ok) return;
  const pg = fenetreProgres("Permutation des rangées");
  try{
    // images des deux photos (pour les réécrire sous le bon nom sur GitHub)
    pg.maj(0, 3, "Lecture des photos");
    const imgA = a ? (a.plein || await photoPleine(b, k, "photo")) : null;
    const imgZ = z ? (z.plein || await photoPleine(b, k, "photo2")) : null;
    if ((a && !imgA) || (z && !imgZ)) throw new Error("une des photos est introuvable (ni sur l'appareil ni sur GitHub)");
    // échange
    const nouvDevant = z ? Object.assign({}, z, { plein: imgZ, envoye:false, chemin: cheminPhoto(b, k, "photo") }) : null;
    const nouvDerriere = a ? Object.assign({}, a, { plein: imgA, envoye:false, chemin: cheminPhoto(b, k, "photo2") }) : null;
    if (nouvDevant) cs.photo = nouvDevant; else delete cs.photo;
    if (nouvDerriere) cs.photo2 = nouvDerriere; else delete cs.photo2;
    delete cachePhotos[cleCache(b, k, "photo")]; delete cachePhotos[cleCache(b, k, "photo2")];
    const inv = (r)=> r === "derriere" ? "devant" : "derriere";
    const invChamp = (c)=> c === "photo" ? "photo2" : c === "photo2" ? "photo" : c;
    (cs.livres||[]).forEach(lv=>{
      lv.rang = inv(lv.rang === "derriere" ? "derriere" : "devant");
      (lv.vues || []).forEach(v=>{ v.champ = invChamp(v.champ); });
      lv.temoins = (lv.temoins || []).map(t=>t.startsWith("photo:") ? "photo2:" + t.slice(6) : t.startsWith("photo2:") ? "photo:" + t.slice(7) : t);
      const q = lv.question;
      if (q){ if (q.vue) q.vue.champ = invChamp(q.vue.champ); if (q.zone) q.zone.champ = invChamp(q.zone.champ); }
    });
    // rangée 1 d'abord dans la liste
    cs.livres = (cs.livres||[]).filter(lv=>lv.rang !== "derriere").concat((cs.livres||[]).filter(lv=>lv.rang === "derriere"));
    (cs.appoints||[]).forEach(ap=>{ if (ap.rang) ap.rang = inv(ap.rang); });
    if (cs.analyse && cs.analyse.rangs){ const r = cs.analyse.rangs; cs.analyse.rangs = { devant:r.derriere, derriere:r.devant }; }
    if (cs.photo2) delete cs.unRang;
    cs.permutations = (cs.permutations || []).concat([new Date().toISOString()]);
    versionJournal++;
    sauver();
    if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k);
    rendreBiblio();
    // GitHub : réécrire les fichiers sous leur nouveau nom, supprimer celui qui n'a plus de photo
    if (ghPret() && navigator.onLine !== false){
      pg.maj(1, 3, "Envoi des photos sous leur nouveau nom");
      if (cs.photo) await televerserPhoto(b, k, "photo");
      if (cs.photo2) await televerserPhoto(b, k, "photo2");
      pg.maj(2, 3, "Nettoyage");
      if (!cs.photo) try{ await ghSupprimer(cheminPhoto(b, k, "photo"), "Permutation des rangées " + k); }catch(e){}
      if (!cs.photo2) try{ await ghSupprimer(cheminPhoto(b, k, "photo2"), "Permutation des rangées " + k); }catch(e){}
      pg.fermer();
      envoyerDonneesAuto("Permutation des rangées de " + lib(k));
    } else {
      pg.fermer();
      avertirNonSauve("Permutation des rangées de " + lib(k), raisonEchec());
    }
    toast("Rangées permutées.", 4000);
    journal(`Rangées permutées pour ${lib(k)}`);
  }catch(e){
    pg.fermer();
    toast("Permutation impossible : " + e.message, 6000);
  }
}

/* ====== DÉPLACER UN LIVRE PAR RECHERCHE TOLÉRANTE ======
   On tape quelques lettres du titre (ou de l'auteur) d'un autre livre ; fautes de frappe et mots manquants tolérés. */
function motsRecherche(t){ return simplifier(String(t||"")).replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean); }
function scoreRecherche(q, lv){
  const mq = motsRecherche(q);
  if (!mq.length) return 0;
  const mt = motsRecherche((lv.titre || "") + " " + (lv.auteur || ""));
  const mtTitre = motsRecherche(lv.titre || "");
  if (!mt.length) return 0;
  let total = 0;
  mq.forEach(w=>{
    let best = 0;
    mt.forEach(x=>{
      let sc;
      if (x === w) sc = 1;
      else if (x.startsWith(w)) sc = 0.92 + 0.08 * w.length / x.length;          // début de mot tapé
      else if (w.length >= 3 && x.includes(w)) sc = 0.8;
      else {
        // faute de frappe : comparer au début du mot de même longueur, et au mot entier
        const debut = x.slice(0, Math.max(w.length, 1));
        sc = Math.max(ratioTexte(w, debut) * 0.9, ratioTexte(w, x) * 0.85);
      }
      if (mtTitre.includes(x)) sc += 0.02;                                     // léger avantage au titre
      best = Math.max(best, sc);
    });
    total += best;
  });
  const q2 = simplifier(q).replace(/[^a-z0-9]/g, ""), t2 = simplifier(lv.titre || "").replace(/[^a-z0-9]/g, "");
  const bonus = q2.length >= 3 && t2.startsWith(q2) ? 0.15 : (q2.length >= 3 && t2.includes(q2) ? 0.08 : 0);
  return total / mq.length + bonus;
}

function fenetreDeplacer(cs, lv, apres){
  const rg = (x)=> x.rang === "derriere" ? "derriere" : "devant";
  const candidats = (cs.livres || []).filter(x=>x !== lv && !certifiee(cs, rg(x)));
  let choisi = null;
  const f = modale({ titre:"Déplacer « " + lv.titre + " »",
    html:`<label for="dRech" style="margin-top:0">Près de quel livre ? Tapez quelques lettres de son titre (ou de son auteur)</label>
      <input type="text" id="dRech" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ex. « bouclier arv », « cascad », « goscin »">
      <div class="aide">Fautes de frappe et mots manquants tolérés ; la liste se met à jour à chaque lettre.</div>
      <div id="dRes" style="margin-top:8px"></div>`,
    boutons:[{ texte:"Ne pas déplacer" }] });
  const inp = f.querySelector("#dRech"), zr = f.querySelector("#dRes");
  const nomR = (x)=> cs.photo2 || (cs.livres||[]).some(y=>y.rang === "derriere") ? (rg(x) === "derriere" ? " · rangée 2" : " · rangée 1") : "";
  const deplacer = (ou)=>{
    if (!choisi) return;
    cs.livres.splice(cs.livres.indexOf(lv), 1);
    const j = cs.livres.indexOf(choisi);
    cs.livres.splice(ou === "avant" ? j : j + 1, 0, lv);
    if (rg(choisi) === "derriere") lv.rang = "derriere"; else if (lv.rang === "derriere") lv.rang = "devant";
    f.remove();
    toast(`« ${lv.titre} » déplacé ${ou === "avant" ? "avant" : "après"} « ${choisi.titre} ».`, 4000);
    journal(`Livre déplacé : « ${lv.titre} » ${ou === "avant" ? "avant" : "après"} « ${choisi.titre} »`);
    apres();
  };
  const afficher = ()=>{
    const q = inp.value.trim();
    if (!q){ zr.innerHTML = ""; choisi = null; return; }
    const tri = candidats.map(x=>({ x, s: scoreRecherche(q, x) })).filter(o=>o.s > 0.45).sort((a, z)=>z.s - a.s);
    if (!tri.length){ zr.innerHTML = `<div class="aide">Aucun livre ne correspond encore : continuez à taper.</div>`; choisi = null; return; }
    if (!choisi || !tri.slice(0, 4).some(o=>o.x === choisi)) choisi = tri[0].x;
    // quand le premier se détache nettement, on le dit ; sinon on montre les suivants pour choisir
    const net = tri.length === 1 || tri[0].s - tri[1].s >= 0.12;
    zr.innerHTML = `<div class="prop" style="border-left:3px solid var(--vert)">
        <div class="aide" style="margin:0">${net ? "Livre trouvé :" : "Meilleure correspondance :"}</div>
        <div class="t">${esc(choisi.titre)}</div><div class="chg">${esc(choisi.auteur || "auteur inconnu")}${nomR(choisi)}</div>
        <div class="barre" style="margin-top:8px;flex-direction:column;align-items:stretch">
          <button class="btn principal" data-ou="avant">⬆ Déplacer avant « ${esc(choisi.titre.length > 30 ? choisi.titre.slice(0, 29) + "…" : choisi.titre)} »</button>
          <button class="btn principal" data-ou="apres">⬇ Déplacer après « ${esc(choisi.titre.length > 30 ? choisi.titre.slice(0, 29) + "…" : choisi.titre)} »</button>
        </div></div>
      ${!net ? `<div class="aide" style="margin-top:6px">Ce n'est pas celui-là ? Touchez le bon, ou continuez à taper :</div>` +
        tri.slice(0, 4).filter(o=>o.x !== choisi).map(o=>`<button class="btn plein" data-alt="${(cs.livres||[]).indexOf(o.x)}" style="margin-top:4px;text-align:left">${esc(o.x.titre)} <span class="aide">— ${esc(o.x.auteur || "")}</span></button>`).join("") : ""}`;
    zr.querySelectorAll("[data-ou]").forEach(bt=>bt.onclick = ()=>deplacer(bt.dataset.ou));
    zr.querySelectorAll("[data-alt]").forEach(bt=>bt.onclick = ()=>{ choisi = cs.livres[Number(bt.dataset.alt)]; afficher(); });
  };
  inp.oninput = afficher;
  setTimeout(()=>inp.focus(), 50);
}

/* ====================================================================
   HISTORIQUE GITHUB : restaurer une version précédente de bibliotheques.json
   ==================================================================== */
async function ouvrirHistoriqueGitHub(){
  if (!ghLisible()){ toast("Configurez d'abord le dépôt dans les réglages ⚙️."); return; }
  const pg = fenetreProgres("Historique GitHub");
  let commits;
  try{
    pg.maj(0, 1, "Liste des versions de " + FICHIER_JSON);
    const r = await fetch(`https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/commits?path=${encodeURIComponent(FICHIER_JSON)}&sha=${encodeURIComponent(cfg.ghBranche)}&per_page=30&t=${Date.now()}`, { headers: ghEntetes() });
    if (!r.ok) throw new Error("GitHub " + r.status + " : " + (await r.text()).slice(0,200));
    commits = await r.json();
  }catch(e){ pg.fermer(); toast("Historique illisible : " + e.message, 6000); return; }
  // lecture de chaque version, avec décompte (fait / restant)
  const versions = [];
  for (let i = 0; i < commits.length; i++){
    const c = commits[i];
    pg.maj(i, commits.length, `Version ${i + 1} / ${commits.length} — reste ${commits.length - i}`);
    try{
      const r = await fetch(ghUrl(FICHIER_JSON) + "?ref=" + c.sha, { headers: ghEntetes("application/vnd.github.raw") });
      if (!r.ok) continue;
      const j = JSON.parse(await r.text());
      versions.push({ sha:c.sha, date:(c.commit && c.commit.committer && c.commit.committer.date) || "", message:(c.commit && c.commit.message) || "", jeu:j, res:resume(j) });
    }catch(e){ /* version illisible : ignorée */ }
  }
  pg.fermer();
  if (!versions.length){ toast("Aucune version lisible dans l'historique."); return; }
  const actuelle = resume(data);
  const cel = (v, ref)=> `<td class="n" style="${ref != null && v < ref ? "color:var(--orange);font-weight:700" : ""}">${v}</td>`;
  const lignes = versions.map((v, i)=>`<tr>
      <td style="white-space:nowrap">${esc(dateFr(v.date))}${i === 0 ? " <span class='aide'>(GitHub actuel)</span>" : ""}</td>
      ${cel(v.res.livres)}${cel(v.res.photos)}${cel(v.res.deuxRangs)}${cel(v.res.unRang)}${cel(v.res.appoints)}
      <td><button class="btn" data-v="${i}" style="padding:4px 10px">Voir</button></td></tr>`).join("");
  const f = modale({
    titre:"Restaurer une version précédente",
    html:`<div>Chaque envoi vers GitHub a gardé une copie de ${FICHIER_JSON}. Voici les ${versions.length} dernières, de la plus récente à la plus ancienne.</div>
          <div class="aide">Cet appareil : ${actuelle.livres} livres, ${actuelle.photos} photos, ${actuelle.deuxRangs} compartiment(s) à 2 rangs, ${actuelle.unRang} marqué(s) « 1 rang », ${actuelle.appoints} appoint(s).</div>
          <div style="overflow-x:auto"><table class="compare">
            <tr><th>Date</th><th>Livres</th><th>Photos</th><th>2 rangs</th><th>1 rang</th><th>Appoints</th><th></th></tr>
            ${lignes}</table></div>
          <div class="aide">« Voir » compare la version à cet appareil avant toute restauration. Les photos elles-mêmes sont toujours sur GitHub : restaurer une version rattache à nouveau les photos devenues orphelines. <b>Ne supprimez pas les photos orphelines avant d'avoir restauré.</b></div>`,
    boutons:[{texte:"Fermer"}]
  });
  f.querySelectorAll("[data-v]").forEach(bt=>bt.onclick = async ()=>{
    const v = versions[Number(bt.dataset.v)];
    const ok = await confirmer(
      `<div>Remplacer le contenu de cet appareil par la version du <b>${esc(dateFr(v.date))}</b> ?</div>` +
      tableauComparaison(data, v.jeu, "Version du " + dateFr(v.date)) +
      `<div class="aide">Les photos pas encore envoyées sont conservées. Ensuite, vérifiez l'application puis envoyez sur GitHub (☁️) pour que cette version redevienne la version de référence.</div>`,
      "Restaurer cette version", "Restaurer");
    if (!ok) return;
    const attente = photosEnAttente();
    const j = JSON.parse(JSON.stringify(v.jeu));
    retirerMiniatures(j);
    data = j;
    attente.forEach(p=>{
      const bb = data.bibliotheques.find(x=>x.id === p.bib.id);
      if (bb){ bb.cases = bb.cases||{}; bb.cases[p.cle] = bb.cases[p.cle]||{livres:[]}; poserPhoto(bb.cases[p.cle], p.champ, photoObj(p.cs, p.champ)); }
    });
    // la version GitHub actuelle est connue : l'envoi suivant ne signalera pas un « changement venu d'ailleurs »
    if (versions[0].jeu.maj) localStorage.setItem(CLE_SYNC, versions[0].jeu.maj);
    sauver(true);
    f.remove();
    rendre();
    toast("Version restaurée sur cet appareil. Vérifiez, puis envoyez sur GitHub ☁️.", 7000);
    journal(`Version GitHub du ${dateFr(v.date)} restaurée sur l'appareil (${etatCourt()})`);
  });
}

/* Ce qu'un envoi ferait disparaître de GitHub (compartiments à 2 rangs, « 1 rang », appoints, photos, livres). */
function pertesEnvoi(loc, dist, libDist, libLoc){
  libDist = libDist || "sur GitHub"; libLoc = libLoc || "après l'envoi";
  const a = resume(loc), d = resume(dist);
  if (!a || !d) return [];
  const p = [];
  const test = (cle, lib)=>{ if (a[cle] < d[cle]) p.push(`${lib} : ${d[cle]} ${libDist} → ${a[cle]} ${libLoc}`); };
  test("livres", "livres");
  test("photos", "photos rattachées");
  test("deuxRangs", "compartiments à 2 rangs");
  test("unRang", "compartiments marqués « 1 rang »");
  test("appoints", "photos d'appoint");
  test("resumes", "résumés");
  // livre par livre : ceux qui existent d'un côté et pas de l'autre (les totaux peuvent se compenser)
  const titres = (jeu)=>{ const m = new Map();
    (jeu.bibliotheques || []).forEach(b=>Object.entries(b.cases || {}).forEach(([k, cs])=>(cs.livres || []).forEach(lv=>{
      m.set(lv.id || (b.id + "|" + k + "|" + normaliser(lv.titre)), { titre: lv.titre, ou: b.nom + " " + k }); }))); return m; };
  const A = titres(loc), D = titres(dist);
  const manquants = [...D.keys()].filter(c=>!A.has(c)).map(c=>D.get(c));
  if (manquants.length && !p.some(x=>x.startsWith("livres :")))
    p.push(`${manquants.length} livre(s) ${libDist} absent(s) ${libLoc} : ` + manquants.slice(0, 5).map(x=>`« ${x.titre} » (${x.ou})`).join(", ") + (manquants.length > 5 ? "…" : ""));
  else if (manquants.length)
    p.push(`dont : ` + manquants.slice(0, 5).map(x=>`« ${x.titre} » (${x.ou})`).join(", ") + (manquants.length > 5 ? "…" : ""));
  return p;
}

  try{

      if (j.maj && connue && j.maj !== connue){
        journal("Alerte : version GitHub modifiée ailleurs");
        const ok = await confirmer(
          `<div>La version présente sur GitHub a changé depuis votre dernier échange avec ce dépôt : elle vient probablement d'un autre appareil.</div>` +
          tableauComparaison(data, j, "GitHub") +
          `<div class="aide">Envoyer remplacera la version GitHub par celle de cet appareil.</div>`,

      pg.maj(fait, total, "Photo " + p.cle + quoi + " de « " + p.bib.nom + " »");
      const chemin = cheminPhoto(p.bib, p.cle, p.champ);
      await ghEcrire(chemin, base64Seul(ph.plein), "Photo " + p.bib.nom + " " + p.cle + quoi);
      cachePhotos[cleCache(p.bib, p.cle, p.champ)] = ph.plein;

      ph.plein = null;                  // libère la mémoire de l'appareil
      fait++;

    }
    pg.maj(fait, total, "Fichier " + FICHIER_JSON);
    data.maj = new Date().toISOString();
    await ghEcrire(FICHIER_JSON, enBase64Utf8(JSON.stringify(data, null, 1)), "Bibliothèques — " + dateFr());

async function recupererDeGitHub(silencieux){
  if (!ghLisible()){ if(!silencieux) toast("Configurez d'abord le dépôt dans les réglages ⚙️."); return false; }
  try{
    const txt = await ghLireTexte(FICHIER_JSON);
    if (txt === null){
      if (!silencieux) toast("Aucun fichier " + FICHIER_JSON + " sur le dépôt pour l'instant.");
      etatSync = "ok"; majBandeau();
      return false;
    }
    const j = JSON.parse(txt);
    if (!j || !Array.isArray(j.bibliotheques)) throw new Error("Fichier distant inattendu.");

    // à l'ouverture : ne jamais écraser en silence des données locales plus riches que GitHub
    const pertesLocales = pertesEnvoi(j, data, "sur cet appareil", "si on reprend GitHub");
    if (silencieux && pertesLocales.length){
      const ok = await confirmer(
        `<div><b>⚠️ Cet appareil contient des éléments absents de GitHub :</b></div><ul>${pertesLocales.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` +
        tableauComparaison(data, j, "GitHub") +
        `<div class="aide">Recommandé : <b>Garder cet appareil</b>, puis envoyer ses données sur GitHub ☁️.</div>`,
        "Données de cet appareil plus complètes", "Remplacer par GitHub quand même");
      journal("À l'ouverture, appareil plus complet que GitHub : " + pertesLocales.join(" ; ") + " → " + (ok ? "remplacé par GitHub" : "appareil conservé"));
      if (!ok){ etatSync = "ok"; sale = true; sauver(false); majBandeau(); toast("Données de cet appareil conservées. Pensez à les envoyer sur GitHub ☁️.", 7000); return false; }
    }
    else if (!silencieux || sale){
      if (silencieux && !sale && j.maj === data.maj){ etatSync="ok"; majBandeau(); return false; }
      const ok = await confirmer(
        `<div>Le contenu de cet appareil sera remplacé par celui de GitHub.</div>` +
        tableauComparaison(data, j, "GitHub") +
        (sale ? `<div class="aide">⚠️ Cet appareil a des modifications non envoyées : elles seront perdues, sauf les photos pas encore téléversées.</div>` : ""),
        "Récupérer depuis GitHub", "Remplacer");
      if (!ok) return false;
    }

    const attente = photosEnAttente();   // ne jamais perdre une photo pas encore envoyée
    journal(`Données remplacées par la version GitHub${silencieux ? " (à l'ouverture)" : ""} : ${etatCourt()} → ${etatCourt(j)}`);
    retirerMiniatures(j);
    data = j;
    attente.forEach(p=>{
      const b = data.bibliotheques.find(x=>x.id === p.bib.id);
      if (b){ b.cases = b.cases||{}; b.cases[p.cle] = b.cases[p.cle]||{livres:[]}; poserPhoto(b.cases[p.cle], p.champ, photoObj(p.cs, p.champ)); }
    });
    localStorage.setItem(CLE_SYNC, j.maj || "");
    sale = attente.length > 0;
    etatSync = "ok";
    sauver(false);
    if (biblioCourante && !biblio(biblioCourante)) biblioCourante = null;
    rendre();
    if (!silencieux) toast("Version GitHub appliquée sur cet appareil.");
    return true;
  }catch(e){
    etatSync = "echec"; majBandeau();
    if (!silencieux) toast("Récupération impossible : " + e.message, 6000);
    return false;
  }
}

   GEMINI
   ==================================================================== */
function cleGemini(){ return localStorage.getItem(CLE_GEM) || ""; }

/* Erreur Gemini qui vient du modèle choisi (retiré, quota, refus) : il faut en changer. */
function erreurModele(message, statut){
  const e = new Error(message);
  e.modele = true; e.statut = statut;
  return e;
}

function extraitMessageGoogle(brut){
  try{ const j = JSON.parse(brut); if (j && j.error && j.error.message) return j.error.message; }catch(e){}
  return String(brut||"").slice(0,300);
}

async function gemini(parties, opts){
  opts = opts || {};
  const cle = opts.cle || cleGemini();
  if (!cle) throw new Error("Clé API Gemini absente : réglages ⚙️, onglet Gemini.");
  const modele = opts.modele || cfg.modele || "gemini-2.5-flash";
  const gc = { temperature:0.2, responseMimeType:"application/json", maxOutputTokens: opts.maxTokens || 16384 };
  // Seuls les 2.5 flash acceptent de couper la réflexion (budget 0) ; les autres gardent leur réglage par défaut.
  if (/gemini-2\.5-flash/.test(modele)) gc.thinkingConfig = { thinkingBudget:0 };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modele)}:generateContent?key=${encodeURIComponent(cle)}`;
  const envoyer = (g)=>fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, signal: opts.signal,
      body: JSON.stringify({ contents:[{ role:"user", parts:parties }], generationConfig:g }) });
  let r = await envoyer(gc);
  if (!r.ok && r.status === 400 && gc.thinkingConfig){
    const brut = await r.text();
    if (/thinking/i.test(brut)){ delete gc.thinkingConfig; r = await envoyer(gc); }
    else throw erreurModele(`Gemini 400 (${modele}) : ${extraitMessageGoogle(brut)}`, 400);
  }
  if (!r.ok){
    const brut = await r.text();
    const msg = extraitMessageGoogle(brut);
    if (r.status === 404) throw erreurModele(`Le modèle « ${modele} » n'est plus proposé par Google (ou n'existe pas). Choisissez-en un autre : réglages ⚙️ → Gemini → « Trouver un modèle qui marche ».\n\nMessage de Google : ${msg}`, 404);
    if (r.status === 429) throw erreurModele(`Quota épuisé pour le modèle « ${modele} » (trop de demandes, ou modèle non inclus dans l'offre gratuite). Réessayez plus tard ou choisissez un autre modèle.\n\nMessage de Google : ${msg}`, 429);
    if (r.status === 403) throw erreurModele(`Accès refusé au modèle « ${modele} » avec cette clé.\n\nMessage de Google : ${msg}`, 403);
    if (r.status === 400 && /model|not supported|image|inline/i.test(msg)) throw erreurModele(`Le modèle « ${modele} » refuse cette demande (peut-être ne lit-il pas les images).\n\nMessage de Google : ${msg}`, 400);
    throw new Error("Gemini " + r.status + " : " + msg);
  }
  const j = await r.json();
  const cand = j.candidates && j.candidates[0];
  if (!cand) throw new Error("Gemini n'a renvoyé aucune réponse (contenu peut-être bloqué).");
  if (cand.finishReason === "MAX_TOKENS") throw new Error("Réponse trop longue : réduisez la taille du lot.");
  const txt = ((cand.content && cand.content.parts) || []).filter(p=>!p.thought).map(p=>p.text||"").join("");
  if (!txt.trim()) throw new Error("Réponse vide de Gemini.");
  return txt;
}

   CLAUDE (ANTHROPIC) — même question, mêmes photos
   ==================================================================== */
function cleClaude(){ return localStorage.getItem(CLE_CLAUDE) || ""; }
function entetesClaude(cle){
  return { "content-type":"application/json", "x-api-key":cle, "anthropic-version":"2023-06-01",
           "anthropic-dangerous-direct-browser-access":"true" };
}

async function claude(parties, opts){
  opts = opts || {};
  const cle = opts.cle || cleClaude();
  if (!cle) throw new Error("Clé API Claude absente : réglages ⚙️, onglet IA.");
  const modele = opts.modele || cfg.modeleClaude || "claude-sonnet-5";
  // Conversion des « parties » au format Gemini vers le format Claude
  const content = parties.map(p=> p.inline_data
    ? { type:"image", source:{ type:"base64", media_type:p.inline_data.mime_type, data:p.inline_data.data } }
    : { type:"text", text:String(p.text||"") });
  content.push({ type:"text", text:"Rappel : réponds uniquement par l'objet JSON demandé, sans texte ni balises ``` autour." });
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:entetesClaude(cle), signal:opts.signal,
    body: JSON.stringify({ model:modele, max_tokens: opts.maxTokens || 16000, messages:[{ role:"user", content }] }) });
  if (!r.ok){
    const msg = extraitMessageGoogle(await r.text());
    if (r.status === 401) throw erreurModele(`Clé API Claude refusée.\n\nMessage d'Anthropic : ${msg}`, 401);
    if (r.status === 404) throw erreurModele(`Le modèle Claude « ${modele} » est introuvable. Choisissez-en un autre : réglages ⚙️ → IA → « Liste des modèles ».\n\nMessage d'Anthropic : ${msg}`, 404);
    if (r.status === 429) throw erreurModele(`Limite d'utilisation de Claude atteinte (${modele}). Réessayez un peu plus tard.\n\nMessage d'Anthropic : ${msg}`, 429);
    if (r.status === 400 && /credit|billing|balance/i.test(msg)) throw erreurModele(`Crédit Anthropic insuffisant : rechargez votre compte sur console.anthropic.com.\n\nMessage d'Anthropic : ${msg}`, 402);
    if (r.status === 529) throw new Error("Claude est momentanément surchargé (529). Réessayez dans un instant.");
    throw new Error("Claude " + r.status + " : " + msg);
  }
  const j = await r.json();
  if (j.stop_reason === "max_tokens") throw new Error("Réponse de Claude trop longue : réduisez la taille du lot.");
  const txt = (j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
  if (!txt.trim()) throw new Error("Réponse vide de Claude.");
  return txt;
}

async function listerModelesClaude(cle){
  const r = await fetch("https://api.anthropic.com/v1/models?limit=100", { headers:entetesClaude(cle) });
  if (!r.ok) throw new Error("Liste des modèles Claude refusée (" + r.status + ") : " + extraitMessageGoogle(await r.text()));
  const j = await r.json();
  return (j.data||[]).map(m=>({ id:m.id, nom:m.display_name||"" }));
}

/* ====================================================================
   INTERROGER L'IA : principale d'abord, l'autre en secours si elle échoue
   ==================================================================== */
const iaEnPanne = {};                     // pour la session : une IA en panne n'est pas réessayée à chaque photo
const NOM_IA = { gemini:"Gemini", claude:"Claude" };

/* Vrai si l'IA est réglée « sans clé » (copier-coller dans son site). */
function modeManuel(nom){ return (nom === "claude" ? cfg.claudeMode : cfg.geminiMode) === "manuel"; }

async function interrogerIA(parties, lire, opts){
  opts = opts || {};
  const ordre = cfg.iaPrincipale === "claude" ? ["claude","gemini"] : ["gemini","claude"];
  const essais = cfg.secours ? ordre : [ordre[0]];
  const echecs = [];
  for (let i=0; i<essais.length; i++){
    const nom = essais[i];
    if (iaEnPanne[nom] && i < essais.length-1){ echecs.push({ nom, e:iaEnPanne[nom], deja:true }); continue; }
    if (modeManuel(nom)){
      // IA sans clé : seul l'utilisateur peut transmettre la demande (copier-coller)
      if (opts.manuel){
        const e = new Error("Demande à transmettre à " + NOM_IA[nom] + " à la main.");
        e.manuel = true; e.ia = nom; e.parties = parties; e.echecs = echecs.slice();
        throw e;
      }
      echecs.push({ nom, e:new Error(NOM_IA[nom] + " est réglé « sans clé » : ouvrez le compartiment et touchez 🔍 Analyser pour lui transmettre la photo à la main.") });
      continue;
    }
    try{
      const t0 = performance.now();
      const txt = nom === "gemini" ? await gemini(parties) : await claude(parties);
      const res = lire ? lire(txt) : txt;
      if (nom === "gemini") enregistrerTempsAnalyse(cfg.modele, Math.round(performance.now() - t0));
      return { res, ia:nom, modele: nom === "gemini" ? cfg.modele : cfg.modeleClaude, echecs };
    }catch(e){
      if (e instanceof SyntaxError) e = new Error("Réponse illisible (pas du JSON valide).");
      if (e.modele) iaEnPanne[nom] = e;
      echecs.push({ nom, e });
    }
  }
  if (!echecs.length) throw new Error("Aucune IA disponible : vérifiez les réglages ⚙️ → IA.");
  const err = new Error(echecs.map(x=>NOM_IA[x.nom] + (x.deja?" (déjà en échec plus tôt)":"") + " : " + x.e.message).join("\n\n")
    + (!cfg.secours ? "\n\nAstuce : activez le secours par l'autre IA dans les réglages ⚙️ → IA." : ""));
  err.modele = echecs.some(x=>x.e.modele);
  throw err;
}

function texteSource(src){
  if (!src) return "";
  if (src.manuel) return " Réponse de " + NOM_IA[src.ia||"claude"] + " (copier-coller).";
  return src.echecs && src.echecs.length
    ? ` Réponse de ${NOM_IA[src.ia]} (${NOM_IA[src.echecs[0].nom]} a échoué).`
    : "";
}

   ==================================================================== */
let rafraichirCompartimentOuvert = null;   // fourni par la fenêtre d'un compartiment ouverte

function chargerImage(src){
  return new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("Image illisible")); i.src = src; });
}

/* Une image PNG (seul format accepté par le presse-papier d'iOS) : une photo, ou deux côte à côte avec leur numéro. */
async function blobPourClaude(images){
  const imgs = await Promise.all(images.map(chargerImage));
  const BANDE = imgs.length > 1 ? 70 : 0, MARGE = imgs.length > 1 ? 16 : 0;
  const h = Math.max(...imgs.map(i=>i.height));
  const w = imgs.reduce((n,i)=>n + i.width, 0) + MARGE*(imgs.length-1);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h + BANDE;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#ffffff"; cx.fillRect(0,0,cv.width,cv.height);
  let x = 0;
  imgs.forEach((im,i)=>{
    if (BANDE){
      cx.fillStyle = "#111"; cx.font = "bold 40px Helvetica, Arial, sans-serif"; cx.textBaseline = "middle";
      cx.fillText(i === 0 ? "PHOTO 1 — rang de devant" : "PHOTO 2 — rang de derrière", x + 14, BANDE/2);
    }
    cx.drawImage(im, x, BANDE);
    x += im.width + MARGE;
  });
  return await new Promise(res=>cv.toBlob(b=>res(b), "image/png"));
}

async function copierImagePresse(blobPromise){
  if (!navigator.clipboard || !window.ClipboardItem) throw new Error("Copie d'image non prise en charge par ce navigateur.");

}

const NOM_RANG = { devant:"rang de devant", derriere:"rang de derrière" };
const rangDe = (lv)=> lv.rang === "derriere" ? "derriere" : "devant";

/* Demande quel(s) rang(s) analyser quand le compartiment a les deux photos. Résout "deux" | "devant" | "derriere" | null. */
function choisirPortee(b, k){
  const cs = b.cases[k];
  const nb = (r)=>(cs.livres||[]).filter(lv=>rangDe(lv) === r).length;
  const etat = (r)=> nb(r) ? `${nb(r)} livre(s) déjà relevé(s)` : "aucun livre relevé";
  return new Promise(res=>{
    let fait = false;
    const choisir = (v)=>{ fait = true; res(v); };
    modale({ titre:"Analyser " + lib(k),
      html:`<div>Ce compartiment a deux photos. Que faut-il analyser ?</div>
            <div class="aide">Rang de devant : ${etat("devant")}. Rang de derrière : ${etat("derriere")}.</div>
            <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">ℹ️ Comment ça marche</summary>
              <div class="aide" style="margin:6px 0 0">
                • <b>Les deux rangs ensemble</b> : l'IA voit les deux photos et évite de compter deux fois un livre visible sur les deux (par ex. un livre de derrière qui dépasse). C'est le plus sûr quand les deux photos sont prêtes.<br>
                • <b>Un seul rang</b> : utile si vous n'avez refait qu'une des deux photos, ou pour compléter : analyser le rang de derrière ajoute ses livres à ceux du rang de devant déjà relevés, et inversement.<br>
                • Les livres du rang non analysé ne sont <b>jamais</b> modifiés.<br>
                • Si le rang analysé avait déjà des livres, l'app vous montre la comparaison et vous choisissez : compléter, remplacer ou annuler.
              </div></details>`,
      boutons:[
        {texte:"Annuler", action:()=>choisir(null)},
        {texte:"Devant seul", action:()=>choisir("devant")},
        {texte:"Derrière seul", action:()=>choisir("derriere")},
        {texte:"Les deux rangs", classe:"principal", action:()=>choisir("deux")}
      ],
      surFermeture:()=>{ if (!fait) res(null); } });
  });
}

/* Range les livres trouvés dans un compartiment, rang par rang :
   - le rang que l'analyse ne concerne pas est conservé tel quel ;
   - un rang analysé encore vide est rempli directement ;
   - un rang analysé qui avait déjà des livres donne lieu à une comparaison et à un choix. */
function appliquerLivresCompartiment(b, k, livres){
  const cs = b.cases[k];
  const fin = ()=>{ sauver(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); if (biblioCourante === b.id) rendreBiblio();
    envoyerDonneesAuto("Listes de livres de " + lib(k)); };
  if (!livres.length){ toast(NOM_IA[(livres.source||{}).ia||"gemini"] + " n'a identifié aucun livre." + texteSource(livres.source), 5000); return; }
  const portee = livres.portee || porteeParDefaut(cs);
  const concernesTous = portee === "deux" ? ["devant","derriere"] : [portee];
  const concernes = concernesTous.filter(r=>!certifiee(cs, r));
  if (!concernes.length){ toast("Rangée certifiée ★ : cette analyse ne la modifie pas (retirez la certification pour la mettre à jour).", 6000); return; }
  const anciens = cs.livres || [];
  const ancDe = (r)=>anciens.filter(lv=>rangDe(lv) === r);
  const nouvDe = (r)=>livres.filter(lv=>rangDe(lv) === r);
  const horsPortee = ["devant","derriere"].filter(r=>!concernes.includes(r) && ancDe(r).length);
  const remplisDirect = concernes.filter(r=>!ancDe(r).length);
  const disputes = concernes.filter(r=>ancDe(r).length);
  const enTete = portee === "deux" ? "Analyse des deux rangs" : "Analyse du " + NOM_RANG[portee] + " seul";

  // liste finale : rang de devant puis rang de derrière
  const assembler = (choixDispute)=>{
    const out = [];
    ["devant","derriere"].forEach(r=>{
      if (!concernes.includes(r)) out.push(...ancDe(r));
      else if (!ancDe(r).length) out.push(...nouvDe(r));
      else out.push(...choixDispute(r));
    });
    return out;
  };
  const conserves = horsPortee.map(r=>`${ancDe(r).length} livre(s) du ${NOM_RANG[r]} conservé(s)`);

  remplisDirect.forEach(r=>nouvDe(r).forEach(lv=>{ lv.temoins = [temoinRang(cs, r)]; lv.statut = "probable"; }));
  if (!disputes.length){
    cs.livres = assembler(()=>[]);
    cs.analyse = infoAnalyse(livres, cs);
    journal(`Rangée remplie directement pour ${lib(k)} : ${cs.livres.length} livre(s)`);
    fin();
    const ajouts = remplisDirect.map(r=>`${nouvDe(r).length} livre(s) pour le ${NOM_RANG[r]}`);
    toast(`${enTete} : ${ajouts.join(", ")}${conserves.length ? " ; " + conserves.join(", ") : ""}. Total : ${cs.livres.length}.`, 6000);
    return;
  }

  // comparaison sur les rangs disputés (même titre = même livre)
  const cle = (lv)=>normaliser(lv.titre);
  const parRang = {};
  disputes.forEach(r=>{
    const vieux = ancDe(r), neufs = nouvDe(r);
    const idx = new Map(); vieux.forEach(lv=>{ const c = cle(lv); if (c && !idx.has(c)) idx.set(c, lv); });
    const clesN = new Set(neufs.map(cle));
    parRang[r] = {
      vieux, neufs, idx,
      communs: neufs.filter(lv=>idx.has(cle(lv))),
      nouveaux: neufs.filter(lv=>!idx.has(cle(lv))),
      absents: vieux.filter(lv=>!clesN.has(cle(lv)))
    };
  });
  const somme = (champ)=>disputes.reduce((n,r)=>n + parRang[r][champ].length, 0);
  const liste = (titre, l, coul)=> l.length
    ? `<details style="margin-top:6px" ${l.length <= 10 ? "open" : ""}><summary style="cursor:pointer;font-weight:600;color:${coul}">${titre} (${l.length})</summary>
         <div class="aide" style="margin:4px 0 0 14px">${l.map(x=>esc(x.titre) + (x.auteur ? ` <span style="opacity:.7">— ${esc(x.auteur)}</span>` : "")).join("<br>")}</div></details>`
    : `<div class="aide" style="margin-top:6px">${titre} : aucun.</div>`;
  const blocRang = (r)=>{
    const d = parRang[r];
    return `<div class="titreSection" style="margin-top:12px">${NOM_RANG[r][0].toUpperCase() + NOM_RANG[r].slice(1)} — avant : ${d.vieux.length}, cette analyse : ${d.neufs.length}</div>
      ${liste("✅ Déjà relevés", d.communs, "var(--vert)")}
      ${liste("🆕 Nouveaux", d.nouveaux, "var(--bronze)")}
      ${liste("⚠️ Relevés avant, pas retrouvés cette fois", d.absents, "var(--orange)")}`;
  };
  const autoTxt = [
    ...remplisDirect.map(r=>`le ${NOM_RANG[r]}, encore vide, reçoit ses ${nouvDe(r).length} livre(s)`),
    ...horsPortee.map(r=>`les ${ancDe(r).length} livre(s) du ${NOM_RANG[r]} ne sont pas concernés et restent tels quels`)
  ];
  // a priori : même rangée, même ordre → fusion ordonnée directement ; les incohérences y sont signalées
  const aucunCommun = disputes.filter(r=>parRang[r].vieux.length >= 3 && !parRang[r].communs.length);
  fenetreFusion(k, disputes, parRang, (res, bilan)=>{
    cs.livres = assembler(r=>res[r]);
    cs.analyse = infoAnalyse(livres, cs); fin();
    toast(`${bilan.acquis} livre(s) devenu(s) 🔒 acquis, ${bilan.aj} ajout(s), ${bilan.re} retrait(s), ${bilan.questions} question(s). ${cs.livres.length} livre(s) dans ${lib(k)}.`, 5000);
  }, `<div class="aide"><b>${enTete}.</b> ${esc(texteBilanAnalyse(livres))}${autoTxt.length ? " En plus : " + autoTxt.join(" ; ") + "." : ""}</div>` +
     (aucunCommun.length ? `<div class="encadre">⚠️ <b>Aucun livre en commun</b> avec la liste actuelle de la ${aucunCommun.map(r=>r === "derriere" ? "rangée 2" : "rangée 1").join(" et de la ")} : la photo montre sans doute un autre compartiment ou l'autre rangée. Dans ce cas, touchez « Annuler » et vérifiez la photo.</div>` : ""), cs);
}

/* ====== POSITIONS SUR LES PHOTOS ET EXTRAITS AGRANDIS ======
   L'IA donne, pour chaque livre, sa position horizontale sur la photo (x1, x2 en millièmes de la largeur).
   On garde pour chaque livre ses « vues » : [{ champ, x1, x2 }] ; une question garde l'endroit concerné. */
const CONSIGNE_POSITION = `

Pour chaque livre, ajoute aussi "x1" et "x2" : la position horizontale de sa tranche sur la photo, en millièmes de la largeur (0 = bord gauche, 1000 = bord droit), par exemple {"titre":"...","x1":120,"x2":165}. Donne les livres de gauche à droite.`;

function lirePosition(x){
  const a = Number(x && x.x1), z = Number(x && x.x2);
  if (!isFinite(a) || !isFinite(z)) return null;
  const x1 = Math.max(0, Math.min(1000, Math.min(a, z))), x2 = Math.max(0, Math.min(1000, Math.max(a, z)));
  return x2 > x1 ? { x1, x2 } : null;
}
/* ajoute ou remplace la vue d'un livre sur une photo donnée */
function ajouterVue(lv, vue){
  if (!vue) return;
  lv.vues = (lv.vues || []).filter(v=>v.champ !== vue.champ).concat([vue]);
}
const vueSur = (lv, champ)=> (lv.vues || []).find(v=>v.champ === champ) || null;

/* découpe l'endroit [x1, x2] d'une photo, élargi pour voir les voisins ; renvoie une image (data URL) */
const cacheExtraits = {};
async function extraitPhoto(b, k, champ, x1, x2){
  const cle = [b.id, k, champ, x1, x2].join("|");
  if (cacheExtraits[cle]) return cacheExtraits[cle];
  const src = await photoPleine(b, k, champ);
  if (!src) return null;
  const img = await new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; });
  const W = img.naturalWidth, H = img.naturalHeight;
  const centre = (x1 + x2) / 2 / 1000 * W;
  const larg = Math.max((x2 - x1) / 1000 * W * 3.2, W * 0.22);
  const g = Math.max(0, Math.min(W - larg, centre - larg / 2)), l = Math.min(W, larg);
  const echelle = Math.min(1, 1000 / l);          // extraits nets, même sur écran haute définition
  const c = document.createElement("canvas");
  c.width = Math.round(l * echelle); c.height = Math.round(H * echelle);
  const ctx = c.getContext("2d");
  ctx.drawImage(img, g, 0, l, H, 0, 0, c.width, c.height);
  // repère de l'endroit visé
  const rx1 = (x1 / 1000 * W - g) * echelle, rx2 = (x2 / 1000 * W - g) * echelle;
  ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 3;
  ctx.strokeRect(Math.max(1, rx1), 2, Math.max(4, rx2 - rx1), c.height - 4);
  return cacheExtraits[cle] = c.toDataURL("image/jpeg", 0.85);
}
/* remplit les emplacements <div data-ex="champ|x1|x2" data-leg="…"> d'un élément */
function remplirExtraits(el, b, k){
  el.querySelectorAll("[data-ex]").forEach(async z=>{

    try{

      z.innerHTML = d ? `<div class="aide" style="margin:6px 0 2px">${esc(z.dataset.leg || "")}</div>

        : `<div class="aide">${esc(z.dataset.leg || "")} : photo indisponible.</div>`;

}
const nomChampCourt = (cs, champ)=> estAppoint(champ) ? "l'appoint " + numeroAppoint(cs, champ) : champ === "photo2" ? "la photo de derrière" : "la photo de devant";
/* emplacements d'extraits pour une question (livre de la liste) */
function htmlExtraitsQuestion(cs, lv){
  const q = lv.question || {}, out = [], t = `« ${lv.titre} »`;
  const place = (v, leg)=>{ if (v && photoObj(cs, v.champ)) out.push(`<div data-ex="${v.champ}|${v.x1}|${v.x2}" data-leg="${esc(leg)}"></div>`); };
  const autreVue = (champ)=> (lv.vues || []).filter(v=>v.champ !== champ)[0];
  if (q.type === "lecture"){
    place(q.vue, `Sur ${nomChampCourt(cs, q.vue ? q.vue.champ : "")}, l'IA a lu ici « ${q.autre ? q.autre.titre : ""} » (cadre rouge) :`);
    const v = autreVue(q.vue && q.vue.champ);
    place(v, `Sur ${nomChampCourt(cs, v ? v.champ : "")}, l'IA avait lu ici ${t} (cadre rouge) :`);
  } else if (q.zone){
    place(q.zone, `Sur ${nomChampCourt(cs, q.zone.champ)}, l'endroit où ${t} devrait se trouver (cadre rouge). Y voyez-vous ce livre ?`);
    const v = autreVue(q.zone.champ);
    place(v, `Pour comparer : sur ${nomChampCourt(cs, v ? v.champ : "")}, l'endroit où ${t} avait été lu (cadre rouge) :`);
  } else { const v = (lv.vues || [])[0]; place(v, `Sur ${nomChampCourt(cs, v ? v.champ : "")}, là où ${t} a été lu (cadre rouge) :`); }
  return out.join("");
}

/* ====================================================================
   CONVERGENCE : statut de chaque livre (acquis 🔒 / probable / question ❓)
   - un livre retrouvé à la même place sur deux photos différentes devient acquis automatiquement ;
   - un livre acquis n'est plus jamais modifié, déplacé ni retiré par une analyse ;
   - seules les contradictions deviennent des questions, que l'on peut trancher tout de suite ou plus tard.
   ==================================================================== */
/* bibliothèque qui contient un compartiment donné */
function biblioDeCase(cs){ return (data.bibliotheques || []).find(x=>Object.values(x.cases || {}).includes(cs)) || null; }
function temoinPhoto(cs, champ){
  const p = photoObj(cs, champ);
  return champ + ":" + ((p && (p.maj || p.chemin)) || "");
}
function temoinRang(cs, r){ return temoinPhoto(cs, r === "derriere" ? "photo2" : "photo"); }
/* ajoute un témoin ; deux photos différentes → acquis (sauf question en suspens) */
function ajouterTemoin(lv, t){
  if (!t) return false;
  lv.temoins = [...new Set((lv.temoins || []).concat([t]))];
  if (lv.statut !== "acquis" && lv.temoins.length >= 2 && !lv.question){ lv.statut = "acquis"; return true; }
  return false;
}
function rendreAcquis(lv){ lv.statut = "acquis"; delete lv.question; }
const estAcquis = (lv)=> lv.statut === "acquis";

const certifiee = (cs, r)=> !!(cs && cs.certif && cs.certif[r]);
/* État d'une rangée : { total, acquis, questions, probables, validee } */
function etatRangee(cs, r){
  const l = (cs.livres||[]).filter(lv=>(lv.rang === "derriere" ? "derriere" : "devant") === r);
  const acquis = l.filter(estAcquis).length, questions = l.filter(lv=>lv.question).length;
  return { total:l.length, acquis, questions, probables:l.length - acquis - questions, validee: l.length > 0 && acquis === l.length };
}

/* Fusion convergente : n'interroge que sur les vraies contradictions.
   opts : { titre, intro, blocs:[{r, etapes, avant, apres, entete}], temoin(r), nomSource, surValider(res, bilan), surAnnuler } */
function fusionConvergente(opts){
  const { titre, intro, blocs, temoin, surValider, surAnnuler } = opts;
  const nomSource = opts.nomSource || "cette photo";
  const aut = (lv)=> lv.auteur ? ` <span style="opacity:.75">— ${esc(lv.auteur)}</span>` : "";
  // classement automatique de chaque étape
  blocs.forEach(bl=>bl.etapes.forEach(e=>{
    if (e.type === "paire") e.cat = (e.sur || estAcquis(e.a)) ? "confirme" : "question";
    else if (e.type === "ancien") e.cat = estAcquis(e.a) ? "acquisNonVu" : (e.deplace ? "deplace" : "nonVu");
    else e.cat = e.deplace ? "doublonDeplace" : "ajout";
    if (e.cat === "question") e.choix = "plusTard";
    if (e.cat === "ajout") e.ajouter = true;
    if (e.cat === "nonVu" || e.cat === "deplace") e.retirer = false;
  }));
  const tous = blocs.flatMap((bl, nb)=>bl.etapes.map((e, x)=>({ e, id: nb + "_" + x, r: bl.r })));
  const de = (c)=>tous.filter(t=>t.e.cat === c);
  const nConf = de("confirme").length, nQ = de("question").length, nAj = de("ajout").length,
        nNonVu = de("nonVu").length + de("deplace").length, nDep = de("deplace").length + de("doublonDeplace").length;
  const nNouvAcquis = de("confirme").filter(t=>!estAcquis(t.e.a) && !t.e.a.question &&
    [...new Set((t.e.a.temoins || []).concat([temoin(t.r)]))].length >= 2).length;

  const btn = (id, v, lib, actif)=>`<button data-q="${id}" data-v="${v}" class="${actif ? "actif" : ""}">${lib}</button>`;
  const htmlQuestions = de("question").map(({ e, id })=>`<div class="prop" style="border-left:3px solid var(--orange)">
      <div style="font-weight:700">❓ Quel est le bon titre de ce livre ?</div>
      <div class="aide" style="margin:2px 0 4px">À la même place, deux lectures différentes : même livre lu de deux façons, ou deux livres voisins ?</div>
      <div>Liste : <b>${esc(e.a.titre)}</b>${aut(e.a)}</div>
      <div>${esc(nomSource[0].toUpperCase() + nomSource.slice(1))} : <b>${esc(e.b.titre)}</b>${aut(e.b)}</div>
      ${opts.b && e.b.vues && e.b.vues[0] ? `<div data-ex="${e.b.vues[0].champ}|${e.b.vues[0].x1}|${e.b.vues[0].x2}" data-leg="Sur ${esc(nomSource)}, l'IA a lu ici « ${esc(e.b.titre)} » (cadre rouge) :"></div>` : ""}
      ${opts.b && (e.a.vues || []).filter(v=>!e.b.vues || v.champ !== e.b.vues[0].champ)[0] ? (()=>{ const v = e.a.vues.filter(v=>!e.b.vues || v.champ !== e.b.vues[0].champ)[0];
        return `<div data-ex="${v.champ}|${v.x1}|${v.x2}" data-leg="Sur ${esc(nomChampCourt(opts.cs, v.champ))}, l'IA avait lu ici « ${esc(e.a.titre)} » (cadre rouge) :"></div>`; })() : ""}
      <div class="onglets" style="margin-top:6px">
        ${btn(id, "a", "« " + esc(e.a.titre.slice(0, 28)) + " » est le bon", false)}${btn(id, "b", "« " + esc(e.b.titre.slice(0, 28)) + " » est le bon", false)}
        ${btn(id, "deux", "Deux livres différents", false)}${btn(id, "plusTard", "Je verrai plus tard", true)}</div></div>`).join("");
  const liste = (items, rendu)=>items.map(rendu).join("");
  const htmlAjouts = liste(de("ajout"), ({ e, id })=>`<div class="coche" style="margin:4px 0"><input type="checkbox" data-aj="${id}" checked><label style="margin:0"><b>${esc(e.b.titre)}</b>${aut(e.b)}</label></div>`);
  const htmlNonVus = liste(de("nonVu").concat(de("deplace")), ({ e, id })=>`<div class="coche" style="margin:4px 0"><input type="checkbox" data-ret="${id}"><label style="margin:0">Retirer <b>${esc(e.a.titre)}</b>${aut(e.a)}${e.cat === "deplace" ? " <span class='aide'>(semble ailleurs sur la photo)</span>" : ""}</label></div>`);

  const f = modale({ titre,
    html:`${intro || ""}
      <div style="margin-top:8px">
        <div>✅ <b>${nConf}</b> livre(s) retrouvé(s) à leur place${nNouvAcquis ? ` — dont <b>${nNouvAcquis}</b> deviennent <b>🔒 acquis</b> (vus sur deux photos)` : ""}.</div>
        ${nAj ? `<div>🆕 <b>${nAj}</b> livre(s) nouveau(x), ajouté(s) à leur place.</div>` : ""}
        ${nNonVu ? `<div>👁 <b>${nNonVu}</b> livre(s) de la liste non vu(s) sur ${esc(nomSource)} : gardés, avec une question ❓.</div>` : ""}
        ${nQ ? `<div>❓ <b>${nQ}</b> contradiction(s) de lecture : tranchez maintenant, ou « Plus tard ».</div>` : ""}
        ${nDep ? `<div class="encadre">⚠️ ${nDep} livre(s) semblent avoir changé de place : ils sont signalés en question, rien n'est déplacé.</div>` : ""}
        ${!nQ && !nAj && !nNonVu ? `<div class="aide">Rien à trancher.</div>` : ""}
      </div>
      ${nQ ? `<div class="titreSection" style="margin-top:12px">❓ À trancher (facultatif)</div>${htmlQuestions}` : ""}
      ${nAj ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">🆕 Livres ajoutés (${nAj}) — décocher pour ne pas ajouter</summary>${htmlAjouts}</details>` : ""}
      ${nNonVu ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">👁 Non vus sur ${esc(nomSource)} (${nNonVu})</summary>
         <div class="aide">Ils restent dans la liste avec une question ; cochez seulement si vous êtes sûr qu'ils ne sont pas là.</div>${htmlNonVus}</details>` : ""}
      <div class="aide" style="margin-top:10px">Les livres 🔒 acquis ne sont jamais modifiés par une analyse.</div>`,
    boutons:[
      { texte:"Annuler", action:()=>{ if (surAnnuler) surAnnuler(); } },
      { texte:"Appliquer", classe:"principal", action:(fd)=>{
        const res = {}; const bilan = { aj:0, re:0, co:0, acquis:0, questions:0, vus:[] };
        blocs.forEach((bl, nb)=>{
          const t = temoin(bl.r);
          const l = [];
          const vueB = (e)=> e && e.b && e.b.vues ? e.b.vues[0] : null;
          // endroit, sur la photo lue, où un livre de la liste aurait dû apparaître : entre ses voisins vus
          const zoneEntre = (x)=>{
            let g = null, d = null;
            for (let y = x - 1; y >= 0; y--) if (vueB(bl.etapes[y])){ g = vueB(bl.etapes[y]); break; }
            for (let y = x + 1; y < bl.etapes.length; y++) if (vueB(bl.etapes[y])){ d = vueB(bl.etapes[y]); break; }
            const ref = g || d; if (!ref) return null;
            let x1 = g ? g.x2 : Math.max(0, d.x1 - 60), x2 = d ? d.x1 : Math.min(1000, g.x2 + 60);
            if (x2 - x1 < 20){ const c = (x1 + x2) / 2; x1 = Math.max(0, c - 15); x2 = Math.min(1000, c + 15); }

          };
          bl.etapes.forEach((e, x)=>{
            const id = nb + "_" + x;
            if (e.type === "paire" && (e.cat === "confirme" || (e.cat === "question" && (e.choix === "a" || e.choix === "b")))) ajouterVue(e.a, vueB(e));
            if (e.cat === "confirme"){
              const lv = e.a;
              if (!estAcquis(lv)) ["auteur","annee"].forEach(c=>{ if (!lv[c] && e.b[c]) lv[c] = e.b[c]; });
              if (ajouterTemoin(lv, t)) bilan.acquis++;
              l.push(lv); bilan.vus.push(lv);
            } else if (e.cat === "question"){
              const lv = e.a;
              if (e.choix === "a"){ rendreAcquis(lv); ajouterTemoin(lv, t); bilan.acquis++; l.push(lv); bilan.vus.push(lv); }
              else if (e.choix === "b"){ lv.titre = e.b.titre; if (e.b.auteur) lv.auteur = e.b.auteur; rendreAcquis(lv); ajouterTemoin(lv, t); bilan.co++; bilan.acquis++; l.push(lv); bilan.vus.push(lv); }
              else if (e.choix === "deux"){ e.b.temoins = [t]; e.b.statut = "probable"; l.push(lv, e.b); bilan.aj++; bilan.vus.push(e.b); }
              else { lv.question = { type:"lecture", autre:{ titre:e.b.titre, auteur:e.b.auteur || "" }, vue: vueB(e), source:nomSource, date:new Date().toISOString() }; l.push(lv); bilan.questions++; }
            } else if (e.cat === "acquisNonVu"){ l.push(e.a); }
            else if (e.cat === "nonVu" || e.cat === "deplace"){

              l.push(e.a); bilan.questions++;
            } else if (e.cat === "ajout"){
              const c = fd.querySelector(`[data-aj="${id}"]`);
              if (c && !c.checked) return;
              e.b.temoins = [t]; e.b.statut = "probable";
              l.push(e.b); bilan.aj++; bilan.vus.push(e.b);
            }
            // "doublonDeplace" : le même livre lu ailleurs — rien n'est ajouté
          });
          res[bl.r] = (bl.avant || []).concat(l, bl.apres || []);
        });
        journal(`${titre} appliqué : ${bilan.acquis} acquis, ${bilan.aj} ajout(s), ${bilan.re} retrait(s), ${bilan.co} titre(s) corrigé(s), ${bilan.questions} question(s)`);
        surValider(res, bilan);
      }}
    ],
    surFermeture:()=>{ if (surAnnuler) surAnnuler(); } });
  if (opts.b) remplirExtraits(f, opts.b, opts.k);
  f.querySelectorAll("[data-q]").forEach(bt=>bt.onclick = (ev)=>{
    ev.preventDefault();

    f.querySelectorAll(`[data-q="${bt.dataset.q}"]`).forEach(y=>y.classList.toggle("actif", y === bt));

}

/* Réponse à une question en suspens, depuis la liste du compartiment. */
function repondreQuestion(cs, lv, rep){
  const q = lv.question || {};
  if (rep === "b" && q.autre){ lv.titre = q.autre.titre; if (q.autre.auteur) lv.auteur = q.autre.auteur; }
  if (rep === "deux" && q.autre){
    const nv = { id:uid(), titre:q.autre.titre, auteur:q.autre.auteur || "", annee:"", certitude:"moyenne", remarque:"", resume:"", categorie:"", statut:"acquis", temoins:[] };
    if (lv.rang) nv.rang = lv.rang;
    cs.livres.splice(cs.livres.indexOf(lv) + 1, 0, nv);
  }
  if (rep === "retirer"){ cs.livres.splice(cs.livres.indexOf(lv), 1); return; }
  if (rep.startsWith("fusion:")){
    // même livre : on garde la fiche du voisin (bien lue), enrichie de ce que l'autre avait
    const v = cs.livres.find(x=>x.id === rep.slice(7));
    if (v){
      ["auteur","annee","resume","categorie","remarque"].forEach(c=>{ if (!v[c] && lv[c]) v[c] = lv[c]; });
      (lv.vues || []).forEach(x=>{ if (!vueSur(v, x.champ)) ajouterVue(v, x); });
      v.temoins = [...new Set((v.temoins || []).concat(lv.temoins || []))];
      rendreAcquis(v);
      cs.livres.splice(cs.livres.indexOf(lv), 1);
      return;
    }
  }
  rendreAcquis(lv);
}
/* libellé de la question : { q: question en gras, pourquoi: explication } */
function texteQuestion(lv){
  const q = lv.question || {}, t = `« ${lv.titre} »`;
  if (q.type === "lecture") return { q:`Quel est le bon titre de ce livre ?`,
    pourquoi:`À la même place, la liste dit ${t}, mais sur ${q.source || "une autre photo"} l'IA a lu « ${q.autre.titre} »${q.autre.auteur ? " (" + q.autre.auteur + ")" : ""}. Soit c'est le même livre lu de deux façons, soit ce sont deux livres voisins.` };
  if (q.type === "absent") return { q:`${t}${lv.auteur ? " (" + lv.auteur + ")" : ""} est-il vraiment un livre de cette rangée ?`,
    pourquoi:`Il est dans la liste, mais l'IA ne l'a pas lu sur ${q.source || "une autre photo"}, qui montre pourtant l'endroit où il devrait être. Souvent, son titre a été mal lu la première fois et le vrai livre est juste là.` };
  if (q.type === "deplace") return { q:`${t} est-il bien à cette place ?`,
    pourquoi:`Sur ${q.source || "une autre photo"}, il semble se trouver ailleurs dans la rangée.` };
  return { q:`${t} : à vérifier.`, pourquoi:"" };
}
/* voisins lus sur la même photo à l'endroit où ce livre devrait être : sans doute le même livre, mal lu la première fois */
function voisinsCandidats(cs, lv){
  const q = lv.question || {};
  if (!q.zone) return [];
  const rg = (x)=> x.rang === "derriere" ? "derriere" : "devant";

    if (!x) return false;
    const v = vueSur(x, q.zone.champ);
    return v && v.x2 >= q.zone.x1 - 40 && v.x1 <= q.zone.x2 + 40;
  });
}
function boutonsQuestion(lv, i, cs){
