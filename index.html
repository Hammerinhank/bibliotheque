<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothèques</title>
<style>
:root{
  --encre:#14171a;
  --encre2:#1c2126;
  --encre3:#262d34;
  --trait:#39434c;
  --texte:#e9e4d9;
  --texte2:#a7a293;
  --bronze:#c9a227;
  --bronze-sombre:#7d6415;
  --vert:#4f9d69;
  --vert-sombre:#1f5133;
  --rouge:#d05a4a;
  --rouge-sombre:#5a241d;
  --orange:#e0a83a;
  --orange-sombre:#7a5510;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--encre);color:var(--texte);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:contain;
}
h1,h2,h3{margin:0;font-weight:600}
.serif{font-family:Iowan Old Style,Palatino,Georgia,"Times New Roman",serif}

/* ---------- en-tête ---------- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:7px;
  padding:10px 12px;background:var(--encre2);
  border-bottom:1px solid var(--trait);
}
header h1{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icone{
  background:var(--encre3);border:1px solid var(--trait);color:var(--texte);
  border-radius:10px;padding:7px 10px;font-size:16px;line-height:1;cursor:pointer;
}
.icone:active{background:var(--trait)}
#badgeVersion{
  background:var(--bronze-sombre);border:1px solid var(--bronze);color:#fff8e1;
  font-weight:700;font-size:13px;border-radius:999px;padding:6px 11px;cursor:pointer;letter-spacing:.3px;
}
#btnSync.aenvoyer{background:var(--orange-sombre);border-color:var(--orange)}
#btnSync.ok{background:var(--vert-sombre);border-color:var(--vert)}
#btnSync.echec{background:var(--rouge-sombre);border-color:var(--rouge)}

main{padding:14px 12px 90px;max-width:900px;margin:0 auto}

/* ---------- boutons ---------- */
button{font-family:inherit}
.btn{
  background:var(--encre3);color:var(--texte);border:1px solid var(--trait);
  border-radius:12px;padding:11px 14px;font-size:15px;cursor:pointer;text-align:center;
}
.btn:active{background:var(--trait)}
.btn.principal{background:var(--bronze-sombre);border-color:var(--bronze);color:#fff8e1;font-weight:600}
.btn.vert{background:var(--vert-sombre);border-color:var(--vert)}
.btn.rouge{background:var(--rouge-sombre);border-color:var(--rouge)}
.btn.plein{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.barre{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

/* ---------- bandeau d'état ---------- */
#bandeau{
  display:flex;align-items:center;gap:10px;width:100%;
  background:var(--encre2);border:1px solid var(--trait);border-radius:12px;
  padding:10px 12px;margin-bottom:12px;cursor:pointer;color:var(--texte);
  font-size:14px;text-align:left;
}
#bandeau .pastille{font-size:17px}
#bandeau .txt{flex:1;min-width:0}
#bandeau .txt b{display:block;font-size:14.5px}
#bandeau .txt span{color:var(--texte2);font-size:12.5px}
#bandeau .fleche{color:var(--texte2)}
#bandeau.aenvoyer{border-color:var(--orange)}
#bandeau.echec{border-color:var(--rouge)}
#bandeau.ok{border-color:var(--vert)}

/* ---------- cartes ---------- */
.carte{
  background:var(--encre2);border:1px solid var(--trait);border-left:4px solid var(--bronze);
  border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;
}
.carte h2{font-size:19px}
.carte .meta{color:var(--texte2);font-size:13.5px;margin-top:4px}
.vide{border:1px dashed var(--trait);border-radius:12px;padding:22px 16px;text-align:center;color:var(--texte2)}
.titreSection{font-size:12.5px;color:var(--bronze);letter-spacing:.4px;margin:18px 0 6px}

/* ---------- bloc d'action expliqué ---------- */
.action{margin-bottom:14px}
.action .btn{width:100%}
.action .expl{font-size:12.5px;color:var(--texte2);margin-top:5px;padding:0 2px}
.sens{font-weight:600;color:var(--texte)}

/* ---------- grille des compartiments ---------- */
.rangee{margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.rangee > .titre{font-size:12.5px;color:var(--bronze);margin-bottom:5px;letter-spacing:.4px}
.cases{display:grid;gap:6px}
.case{
  position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;
  background:var(--encre3);border:1px solid var(--trait);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.case img{width:100%;height:100%;object-fit:cover;display:block}
.case .sansphoto{font-size:20px;opacity:.45}
.case .num{position:absolute;top:2px;left:3px;font-size:10px;color:#fff;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px}
.case .nb{position:absolute;bottom:0;left:0;right:0;font-size:11px;text-align:center;background:rgba(0,0,0,.6);color:#fff;padding:1px 0}
.case.analysee{border-color:var(--vert)}
.case.analysee.complete{border-width:2px}
.case.aenvoyer{border-color:var(--orange)}
.case .deux{position:absolute;top:2px;right:3px;font-size:10px;color:#fff;background:rgba(125,100,21,.85);border-radius:4px;padding:0 4px}
.rang{display:inline-block;font-size:11px;border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:1px}
.rang.devant{background:var(--encre3);color:var(--texte2)}
.rang.derriere{background:var(--bronze-sombre);color:#fff8e1}
#cFaces{margin-bottom:8px;align-items:center}
#cFaces select{flex:1;min-width:130px;width:auto;border-radius:999px;padding:7px 10px;font-size:13.5px}
.prop{background:var(--encre);border:1px solid var(--trait);border-left:3px solid var(--bronze);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.prop.ajouter{border-left-color:var(--vert)}
.prop.retirer{border-left-color:var(--rouge)}
.prop .act{font-size:11.5px;letter-spacing:.3px;color:var(--texte2)}
.prop .t{font-size:15px;font-weight:600}
.prop .chg{font-size:13.5px;margin-top:3px}
.prop .chg b{color:var(--bronze)}
.prop .mot{font-size:12.5px;color:var(--texte2);font-style:italic;margin-top:3px}
.legende{font-size:12px;color:var(--texte2);display:flex;gap:14px;flex-wrap:wrap;margin-top:-4px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid;margin-right:4px;vertical-align:-1px}

/* ---------- modales ---------- */
.fond{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}
.modale{background:var(--encre2);border:1px solid var(--bronze);border-radius:14px;width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column}
.modale > .tete{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--trait);position:sticky;top:0;background:var(--encre2);border-radius:14px 14px 0 0}
.modale > .tete h2{font-size:16px;flex:1;min-width:0}
.modale > .corps{padding:13px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modale > .pied{padding:11px 13px;border-top:1px solid var(--trait);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

label{display:block;font-size:13px;color:var(--texte2);margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--encre);color:var(--texte);border:1px solid var(--trait);
  border-radius:9px;padding:9px 10px;font-size:16px;font-family:inherit;
}
textarea{min-height:90px;resize:vertical;line-height:1.4}
.ligne2{display:flex;gap:10px}
.ligne2 > *{flex:1}
.coche{display:flex;align-items:center;gap:7px;font-size:14px;margin:6px 0}
.coche input{width:18px;height:18px;accent-color:var(--bronze)}

/* ---------- tableau de comparaison ---------- */
.compare{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0 4px}
.compare th,.compare td{border:1px solid var(--trait);padding:6px 8px;text-align:left}
.compare th{background:var(--encre3);color:var(--texte2);font-weight:600}
.compare td.n{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- livres ---------- */
.livre{background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.livre .t{font-size:15.5px;font-weight:600}
.livre .a{font-size:13.5px;color:var(--texte2)}
.livre .r{font-size:13px;color:#cfc8b6;margin-top:4px;font-style:italic}
.livre .cat{font-size:11.5px;color:var(--bronze);margin-top:3px}
.livre .actions{display:flex;gap:6px;margin-top:7px}
.livre .actions button{font-size:12.5px;padding:5px 9px;border-radius:8px}
.certitude-faible{border-left:3px solid var(--rouge)}
.certitude-moyenne{border-left:3px solid var(--orange)}

/* ---------- divers ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--encre3);border:1px solid var(--bronze);color:var(--texte);
  padding:10px 15px;border-radius:12px;z-index:90;max-width:92%;font-size:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#toast.masque{display:none}
/* ---------- IA sans clé (Claude ou Gemini) : bouton vert vif en attente de la réponse ---------- */
.btn.vif,#attenteClaude button.vif{background:#19e35f;border-color:#7dffa8;color:#062611;font-weight:700;box-shadow:0 0 0 3px rgba(25,227,95,.28),0 6px 20px rgba(25,227,95,.35)}
.btn.vif:active{background:#12b84b}
#attenteClaude{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:70;
  width:calc(100% - 20px);max-width:620px;display:flex;gap:6px;align-items:stretch}
#attenteClaude[hidden]{display:none}
body.attenteClaude{padding-bottom:84px}
body.attenteClaude #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#attenteClaude button.vif{flex:1;border-radius:14px;padding:13px 12px;font-size:15.5px;cursor:pointer;animation:pulseVif 1.6s ease-in-out infinite}
#attenteClaude button.annul{flex:none;border-radius:14px;background:var(--encre3);border:1px solid var(--trait);color:var(--texte);padding:0 13px;font-size:16px}
@keyframes pulseVif{0%,100%{box-shadow:0 0 0 3px rgba(25,227,95,.28),0 6px 20px rgba(25,227,95,.35)}50%{box-shadow:0 0 0 7px rgba(25,227,95,.18),0 6px 26px rgba(25,227,95,.55)}}
.etape{display:flex;gap:10px;align-items:flex-start;background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:10px;margin-top:8px}
.etape .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bronze-sombre);color:#fff8e1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.etape .c{flex:1;min-width:0}
.etape .btn{margin-top:6px}
.progres{background:var(--encre);border:1px solid var(--bronze);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.progres .barreint{height:6px;background:var(--trait);border-radius:4px;margin-top:7px;overflow:hidden}
.progres .barreint i{display:block;height:100%;background:var(--bronze);width:0}
.aide{font-size:12.5px;color:var(--texte2);margin-top:6px}
.sep{height:1px;background:var(--trait);margin:16px 0}
/* ---------- recherche de modèle Gemini ---------- */
.modeles{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:46vh;overflow-y:auto}
.mod{display:flex;align-items:center;gap:8px;background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:8px 10px;font-size:13.5px}
.mod.ok{border-color:var(--vert)}
.mod.reco{border-color:var(--bronze);box-shadow:0 0 0 1px var(--bronze) inset}
.mod .nomMod{font-weight:600;word-break:break-all}
.mod .detMod{font-size:12px;color:var(--texte2)}
.mod .txtMod{flex:1;min-width:0}
.mod .btn{padding:6px 10px;font-size:13px;flex:none}
.encadre{background:var(--encre);border:1px solid var(--trait);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.onglets{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.onglets button{background:var(--encre);border:1px solid var(--trait);color:var(--texte2);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer}
.onglets button.actif{background:var(--bronze-sombre);border-color:var(--bronze);color:#fff8e1}
.photo-apercu{width:100%;border-radius:10px;border:1px solid var(--trait);display:block}
/* ---------- lignes de coupe ---------- */
.cadrePhoto{position:relative;border-radius:10px;overflow:hidden}
.cadrePhoto .photo-apercu{-webkit-user-drag:none;-webkit-touch-callout:none}
.cadrePhoto.coupe{touch-action:none;-webkit-user-select:none;user-select:none}
.voile{position:absolute;left:0;right:0;background:rgba(0,0,0,.5);pointer-events:none}
.voile.h{top:0}
.voile.b{bottom:0}
.ligneCoupe{position:absolute;left:0;right:0;height:0;pointer-events:none}
.ligneCoupe::before{content:"";position:absolute;left:0;right:0;top:-2px;height:4px;background:#ff1a1a;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(255,26,26,.9)}
.ligneCoupe::after{content:"⇕";position:absolute;right:8px;top:-13px;width:26px;height:26px;border-radius:50%;background:#ff1a1a;color:#fff;font-size:15px;line-height:26px;text-align:center;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.ligneCoupe.active::before{height:6px;top:-3px}
.voile.g,.voile.d{right:auto;left:auto;width:0}
.voile.g{left:0}
.voile.d{right:0}
.ligneV{position:absolute;top:0;bottom:0;width:0;pointer-events:none}
.ligneV::before{content:"";position:absolute;top:0;bottom:0;width:4px;background:#1fd65a;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 8px rgba(31,214,90,.9)}
.ligneV.g::before{left:0}
.ligneV.d::before{right:0}
.ligneV::after{content:"⇔";position:absolute;top:calc(50% - 13px);width:26px;height:26px;border-radius:50%;background:#1fd65a;color:#06240f;font-size:15px;line-height:26px;text-align:center;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.ligneV.g::after{left:6px}
.ligneV.d::after{right:6px}
.ligneV.active::before{width:6px}
.btn.coupeOn{background:var(--rouge-sombre);border-color:#ff1a1a}
/* ---------- photos pleine résolution ---------- */
.case .sansphoto.charge{font-size:16px;opacity:.7}
.chargePhoto{border:1px dashed var(--trait);border-radius:10px;padding:40px 16px;text-align:center;color:var(--texte2);font-size:14px}
.vZone{overflow:auto;-webkit-overflow-scrolling:touch;max-height:68vh;border:1px solid var(--trait);border-radius:10px;background:#000}
.vZone img{display:block;max-width:none}
.vZone.fit img{width:100%;height:auto}
.dims{font-variant-numeric:tabular-nums;color:var(--texte)}
/* ---------- proportions d'un compartiment ---------- */
.scene{position:relative;height:min(340px,62vw);background:var(--encre);border:1px solid var(--trait);border-radius:10px;touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden;margin:8px 0 4px}
.rectComp{position:absolute;left:14px;top:14px;border:2px solid var(--bronze);background:rgba(201,162,39,.14);border-radius:4px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.rectComp span{font-size:15px;font-weight:600;color:var(--texte);background:rgba(0,0,0,.45);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.poignee{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#ff1a1a;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.6);pointer-events:none}
.poignee.active{transform:scale(1.25)}
.hist h3{font-size:15px;color:var(--bronze);margin-top:14px}
.hist ul{margin:5px 0 0;padding-left:18px;font-size:14px}
.hist li{margin-bottom:3px}
/* ---------- sélection d'une série de compartiments ---------- */
.cases{-webkit-user-select:none;user-select:none}
.case{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.case img{pointer-events:none;-webkit-user-drag:none}
.case.depart{outline:3px solid var(--bronze);outline-offset:-3px;box-shadow:0 0 0 3px rgba(201,162,39,.35)}
.case.plage{outline:2px dashed var(--bronze);outline-offset:-2px}
.case.encours{outline:3px solid #fff8e1;outline-offset:-3px}
.case .ordre{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:#1c1500;background:var(--bronze);border-radius:4px;padding:0 4px}
#barreSel,#suivi{
  position:fixed;left:50%;transform:translateX(-50%);z-index:50;width:calc(100% - 24px);max-width:640px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--encre2);border:1px solid var(--bronze);border-radius:12px;
  box-shadow:0 6px 24px rgba(0,0,0,.55);font-size:14px;
}
#barreSel{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 13px}
#barreSel span{flex:1;min-width:0}
#barreSel .btn{padding:7px 12px;font-size:14px}
#suivi{padding:10px 13px}
#barreSel[hidden],#suivi[hidden]{display:none}
.bande{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;margin-bottom:10px}
.vig{position:relative;flex:0 0 46px;height:61px;border-radius:7px;border:1px solid var(--trait);background:var(--encre3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--texte2)}
.vig img{width:100%;height:100%;object-fit:cover}
.vig .lib{position:absolute;bottom:0;left:0;right:0;text-align:center;background:rgba(0,0,0,.6);color:#fff;font-size:10px}
.vig .st{position:absolute;top:1px;right:2px;font-size:11px}
.vig.cour{border:2px solid var(--bronze)}
.cibleSerie{font-size:15px;margin-bottom:8px}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.duo{text-align:center;font-size:12.5px}
.duo img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:7px;border:1px solid var(--trait);display:block;margin-bottom:3px}
.alerte{background:var(--orange-sombre);border:1px solid var(--orange);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){
  .modale{animation:apparait .14s ease-out}
  @keyframes apparait{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<header>
  <button class="icone" id="btnRetour" hidden>←</button>
  <h1 id="titrePage" class="serif">Bibliothèques</h1>
  <button id="badgeVersion">V1.6.0</button>
  <button class="icone" id="btnSync" title="Sauvegarde et transferts">☁️</button>
  <button class="icone" id="btnReglages" title="Réglages">⚙️</button>
</header>

<main>
  <button id="bandeau"></button>
  <section id="vueListe"></section>
  <section id="vueBiblio" hidden></section>
</main>

<div id="toast" class="masque"></div>
<div id="barreSel" hidden></div>
<div id="suivi" class="progres" hidden></div>
<input type="file" id="entreeMulti" accept="image/*" multiple hidden>
<input type="file" id="entreeSerie" accept="image/*" capture="environment" hidden>
<div id="zoneModales"></div>
<div id="attenteClaude" hidden><button class="vif" id="btnAttenteClaude">📥 Copier la réponse de Claude</button><button class="annul" id="btnAnnulClaude" title="Abandonner">✕</button></div>

<script>
"use strict";

/* ====================================================================
   VERSION ET HISTORIQUE
   ==================================================================== */
const VERSION = "V1.16.0";
const HISTORIQUE = [
  { v:"V1.16.0", d:"22/09/2026", l:[

function dateFr(d){
  const x = d ? new Date(d) : new Date();
  if (isNaN(x)) return "";
  return x.toLocaleDateString("fr-FR") + " à " + x.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}

let minuteurToast=null;
function toast(msg, ms){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("masque");
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(()=>t.classList.add("masque"), ms||3200);
}

async function copierTexte(txt){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); return true; }
  }catch(e){}
  try{
    const z = document.createElement("textarea");
    z.value = txt;
    z.style.position="fixed"; z.style.top="0"; z.style.left="0"; z.style.opacity="0";
    document.body.appendChild(z);
    z.focus(); z.select(); z.setSelectionRange(0, txt.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(z);
    return ok;
  }catch(e){ return false; }
}

function modale(opts){
  const fond = document.createElement("div");
  fond.className = "fond";
  const boutons = (opts.boutons||[]).map((b,i)=>
    `<button class="btn ${b.classe||""}" data-b="${i}">${esc(b.texte)}</button>`).join("");
  fond.innerHTML =
    `<div class="modale">
       <div class="tete"><h2 class="serif">${esc(opts.titre||"")}</h2>
         <button class="icone" data-fermer="1">✕</button></div>
       <div class="corps">${opts.html||""}</div>
       ${boutons ? `<div class="pied">${boutons}</div>` : ""}
     </div>`;
  $("#zoneModales").appendChild(fond);
  fond.querySelector('[data-fermer]').onclick = ()=>{ fond.remove(); if(opts.surFermeture) opts.surFermeture(); };
  (opts.boutons||[]).forEach((b,i)=>{
    fond.querySelector(`[data-b="${i}"]`).onclick = ()=>{
      if (b.action){ const r = b.action(fond); if (r === false) return; }
      if (b.garder !== true) fond.remove();
    };
  });
  if (opts.apres) opts.apres(fond);
  return fond;
}

function confirmer(message, titre, texteOui){
  return new Promise(res=>{
    modale({
      titre: titre||"Confirmer",
      html: `<div style="font-size:15px">${message}</div>`,
      boutons:[
        {texte:"Annuler", action:()=>res(false)},
        {texte:texteOui||"Confirmer", classe:"principal", action:()=>res(true)}
      ],
      surFermeture:()=>res(false)
    });
  });
}

function fenetreProgres(titre){
  const f = modale({ titre, html:
    `<div class="progres"><div id="pgTexte">Préparation…</div>
     <div class="barreint"><i id="pgBarre"></i></div></div>
     <div id="pgDetail" class="aide"></div>` });
  return {
    maj(fait, total, detail){
      const t = f.querySelector("#pgTexte"), b = f.querySelector("#pgBarre");
      if (t) t.textContent = `Traités : ${fait} / ${total} — restants : ${Math.max(0,total-fait)}`;
      if (b) b.style.width = total ? Math.round(fait*100/total) + "%" : "0%";
      if (detail !== undefined){ const d = f.querySelector("#pgDetail"); if (d) d.textContent = detail; }
    },
    fermer(){ f.remove(); }
  };
}

function charger(){
  try{ const d = localStorage.getItem(CLE_DATA); if (d) data = JSON.parse(d); }
  catch(e){ console.warn("Données locales illisibles", e); }
  if (!data || !Array.isArray(data.bibliotheques)) data = { bibliotheques:[], maj:null };
  try{ const c = localStorage.getItem(CLE_CFG); if (c) cfg = Object.assign({}, CFG_DEFAUT, JSON.parse(c)); }catch(e){}
  // Un champ laissé vide reprend la valeur par défaut : le dépôt reste toujours lisible.
  ["ghUser","ghRepo","ghBranche"].forEach(k => { if (!cfg[k]) cfg[k] = CFG_DEFAUT[k]; });
  sale = localStorage.getItem(CLE_SALE) === "1";
  if (retirerMiniatures(data)){
    try{ localStorage.setItem(CLE_DATA, JSON.stringify(data)); }catch(e){}
  }
}

function sauver(marquerSale){
  if (marquerSale !== false){ sale = true; data.maj = new Date().toISOString(); }
  try{
    localStorage.setItem(CLE_DATA, JSON.stringify(data));
    localStorage.setItem(CLE_SALE, sale ? "1" : "0");
  }catch(e){
    toast("Mémoire de l'appareil pleine : rien n'a été enregistré. Ouvrez ☁️ et envoyez les photos vers GitHub pour libérer de la place.", 7000);
    console.error(e);
  }
  majBandeau();
}

/* ====================================================================
   PHOTOS
   ==================================================================== */
function lireFichier(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>res(fr.result);
    fr.onerror = ()=>rej(new Error("Lecture du fichier impossible"));
    fr.readAsDataURL(file);
  });
}

function redimensionner(dataURL, maxDim, qualite){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const f = Math.min(1, maxDim/Math.max(w,h));
      w = Math.round(w*f); h = Math.round(h*f);
      const cv = document.createElement("canvas");
      cv.width=w; cv.height=h;
      const cx = cv.getContext("2d");
      cx.fillStyle="#fff"; cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      res(cv.toDataURL("image/jpeg", qualite));
    };
    img.onerror = ()=>rej(new Error("Image illisible"));
    img.src = dataURL;
  });
}

function base64Seul(dataURL){ return (dataURL||"").split(",")[1] || ""; }

/* Photo en pleine résolution : en attente d'envoi (plein), en mémoire, ou lue sur GitHub.
   Plus aucune miniature : on voit toujours la vraie photo, celle que reçoit Gemini. */
const chargementsPhotos = {};
const fileChargements = [];
let chargementsActifs = 0;
const MAX_CHARGEMENTS = 4;

function pomperChargements(){
  while (chargementsActifs < MAX_CHARGEMENTS && fileChargements.length){
    const tache = fileChargements.shift();
    chargementsActifs++;
    tache().finally(()=>{ chargementsActifs--; pomperChargements(); });
  }
}

/* Un compartiment peut avoir deux photos de rang : "photo" (devant) et "photo2" (derrière, prise
   après avoir retiré les livres de devant), plus autant de photos d'appoint que voulu
   (zooms, autres angles), désignées par "appoint:<id>" et rangées dans cs.appoints. */
const CHAMPS_PHOTO = ["photo","photo2"];
const NOM_FACE = { photo:"devant", photo2:"derrière" };
const PRE_APPOINT = "appoint:";
function estAppoint(champ){ return typeof champ === "string" && champ.indexOf(PRE_APPOINT) === 0; }
function idAppoint(champ){ return String(champ).slice(PRE_APPOINT.length); }

/* La photo désignée par un champ, qu'elle soit de rang ou d'appoint. */
function photoObj(cs, champ){
  if (!cs) return null;
  if (estAppoint(champ)) return (cs.appoints||[]).find(a=>a.id === idAppoint(champ)) || null;
  return cs[champ || "photo"] || null;
}
/* Pose (ou retire, avec val null) la photo d'un champ, en gardant la légende d'un appoint. */
function poserPhoto(cs, champ, val){
  if (!estAppoint(champ)){ cs[champ] = val; return; }
  cs.appoints = cs.appoints || [];
  const id = idAppoint(champ);
  const i = cs.appoints.findIndex(a=>a.id === id);
  if (!val){ if (i >= 0) cs.appoints.splice(i, 1); return; }
  val.id = id;
  if (i >= 0){ if (val.legende === undefined) val.legende = cs.appoints[i].legende || ""; cs.appoints[i] = val; }
  else { if (val.legende === undefined) val.legende = ""; cs.appoints.push(val); }
}
/* Tous les champs de photo réellement présents dans un compartiment. */
function champsPhotoCase(cs){
  return CHAMPS_PHOTO.filter(ch=>cs && cs[ch]).concat(((cs && cs.appoints) || []).map(a=>PRE_APPOINT + a.id));
}
function numeroAppoint(cs, champ){ return ((cs && cs.appoints) || []).findIndex(a=>a.id === idAppoint(champ)) + 1; }

function cheminPhoto(b, k, champ){
  const suffixe = estAppoint(champ) ? "-appoint-" + idAppoint(champ) : (champ === "photo2" ? "-derriere" : "");
  return "images/" + b.id + "/" + k + suffixe + ".jpg";
}
function cleCache(b, k, champ){
  const suffixe = estAppoint(champ) ? "#a" + idAppoint(champ) : (champ === "photo2" ? "#2" : "");
  return b.id + "/" + k + suffixe;
}

function photoImmediate(bib, cle, champ){
  champ = champ || "photo";
  const ph = photoObj(bib.cases[cle], champ);
  if (!ph) return null;
  return ph.plein || cachePhotos[cleCache(bib, cle, champ)] || null;
}

function photoPleine(bib, cle, champ){
  champ = champ || "photo";
  const cs = bib.cases[cle];
  const photo = photoObj(cs, champ);
  if (!photo) return Promise.resolve(null);
  const deja = photoImmediate(bib, cle, champ);
  if (deja) return Promise.resolve(deja);
  if (!photo.envoye || !photo.chemin) return Promise.resolve(null);
  const id = cleCache(bib, cle, champ);
  if (chargementsPhotos[id]) return chargementsPhotos[id];
  const p = new Promise(res=>{
    fileChargements.push(async ()=>{
      const d = await ghLireImage(photo.chemin, photo.maj);
      if (d && photoObj(cs, champ) === photo) cachePhotos[id] = d;
      res(d);
    });
    pomperChargements();
  });
  chargementsPhotos[id] = p;
  p.finally(()=>{ delete chargementsPhotos[id]; });
  return p;
}

function retirerMiniatures(jeu){
  let n = 0;
  ((jeu && jeu.bibliotheques) || []).forEach(b=>{
    Object.keys(b.cases||{}).forEach(k=>{
      const ph = b.cases[k].photo;
      if (ph && "mini" in ph){ delete ph.mini; n++; }
    });
  });
  return n;
}

function infoImage(img, dataURL){
  const ko = dataURL ? Math.round(base64Seul(dataURL).length * 3 / 4 / 1024) : 0;
  return `${img.naturalWidth} × ${img.naturalHeight} px` + (ko ? ` · ${ko} Ko` : "");
}

function visionneuse(src, titre){
  const f = modale({ titre: titre || "Photo en taille réelle",
    html:`<div class="onglets" id="vZoom">
            <button data-z="fit" class="actif">Ajustée</button>
            <button data-z="1">100 %</button>
            <button data-z="2">200 %</button>
          </div>
          <div class="vZone fit" id="vZone"><img id="vImg" src="${src}" alt=""></div>
          <div class="aide">Définition : <span class="dims" id="vInfo">…</span></div>
          <div class="aide">C'est exactement cette image que reçoit Gemini. À 100 %, chaque pixel de la photo occupe un point de l'écran : si les titres des tranches n'y sont pas lisibles, l'analyse sera peu fiable. Pour plus de définition, augmentez « Taille maximale des photos » dans les réglages ⚙️ (actuellement ${cfg.tailleMax} px), puis reprenez la photo.</div>`,
    boutons:[{texte:"Fermer"}] });
  const img = f.querySelector("#vImg"), zone = f.querySelector("#vZone");
  const info = ()=>{ f.querySelector("#vInfo").textContent = infoImage(img, src); };
  if (img.complete) info(); else img.onload = info;
  f.querySelectorAll("[data-z]").forEach(bt=>{
    bt.onclick = ()=>{
      f.querySelectorAll("[data-z]").forEach(x=>x.classList.toggle("actif", x === bt));
      const z = bt.dataset.z;
      zone.classList.toggle("fit", z === "fit");
      img.style.width = z === "fit" ? "" : (img.naturalWidth * Number(z)) + "px";
    };
  });
}

function photosEnAttente(){
  const l = [];
  data.bibliotheques.forEach(b=>{
    Object.keys(b.cases||{}).forEach(k=>{
      const cs = b.cases[k];
      champsPhotoCase(cs).forEach(ch=>{
        const ph = photoObj(cs, ch);
        if (ph && ph.plein && !ph.envoye) l.push({bib:b, cle:k, cs, champ:ch});
      });
    });
  });
  return l;
}

/* ====================================================================
   GITHUB
   ==================================================================== */
function ghToken(){ return localStorage.getItem(CLE_TOKEN) || ""; }
function ghLisible(){ return !!(cfg.ghUser && cfg.ghRepo); }          // lecture : dépôt public, pas de jeton requis
function ghPret(){ return !!(ghLisible() && ghToken()); }                // écriture : jeton requis
function ghEntetes(accept){
  const h = { Accept: accept };
  if (ghToken()) h.Authorization = "token " + ghToken();
  return h;
}
function ghUrl(chemin){ return `https://api.github.com/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${chemin}`; }

async function ghLireTexte(chemin){
  const r = await fetch(ghUrl(chemin) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), {
    headers: ghEntetes("application/vnd.github.raw")
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub " + r.status + " : " + (await r.text()).slice(0,200));
  return await r.text();
}

async function ghLireImage(chemin, version){
  const enDataURL = async (r)=>{
    const b = new Blob([await r.arrayBuffer()], { type:"image/jpeg" });
    return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>res(null); fr.readAsDataURL(b); });
  };
  const parApi = async ()=>{
    const r = await fetch(ghUrl(chemin) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), {
      headers: ghEntetes("application/vnd.github.raw")
    });
    return r.ok ? await enDataURL(r) : null;
  };
  // sans jeton : raw.githubusercontent.com (pas de limite de 60 requêtes/heure de l'API)
  const parRaw = async ()=>{
    const u = `https://raw.githubusercontent.com/${cfg.ghUser}/${cfg.ghRepo}/${encodeURIComponent(cfg.ghBranche)}/${chemin}?v=${encodeURIComponent(version||"")}`;
    const r = await fetch(u, { cache:"no-cache" });
    return r.ok ? await enDataURL(r) : null;
  };
  try{
    if (ghToken()) return (await parApi()) || (await parRaw());
    return (await parRaw()) || (await parApi());
  }catch(e){
    try{ return ghToken() ? await parRaw() : await parApi(); }catch(e2){ return null; }
  }
}

async function ghSha(chemin){
  const r = await fetch(ghUrl(chemin) + "?ref=" + encodeURIComponent(cfg.ghBranche) + "&t=" + Date.now(), {
    headers: ghEntetes("application/vnd.github+json")
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  return j.sha || null;
}

async function ghEcrire(chemin, contenuBase64, message){
  const sha = await ghSha(chemin);
  const corps = { message, content: contenuBase64, branch: cfg.ghBranche };
  if (sha) corps.sha = sha;
  const r = await fetch(ghUrl(chemin), {
    method:"PUT",
    headers:{ Authorization:"token " + ghToken(), Accept:"application/vnd.github+json", "Content-Type":"application/json" },
    body: JSON.stringify(corps)
  });
  if (!r.ok) throw new Error("GitHub " + r.status + " : " + (await r.text()).slice(0,200));
  return await r.json();
}

function enBase64Utf8(txt){ return btoa(unescape(encodeURIComponent(txt))); }

/* résumé chiffré d'un jeu de données, pour les comparaisons */
function resume(jeu){
  if (!jeu || !Array.isArray(jeu.bibliotheques)) return null;
  let livres=0, photos=0;
  jeu.bibliotheques.forEach(b=>{
    Object.keys(b.cases||{}).forEach(k=>{
      const cs = b.cases[k];
      photos += champsPhotoCase(cs).length;
      livres += (cs.livres||[]).length;
    });
  });
  return { bibliotheques: jeu.bibliotheques.length, livres, photos, maj: jeu.maj };
}

function tableauComparaison(loc, dist, titreDist){
  const c = (v)=> v==null ? "—" : v;
  return `<table class="compare">
    <tr><th></th><th>Cet appareil</th><th>${esc(titreDist||"GitHub")}</th></tr>
    <tr><th>Bibliothèques</th><td class="n">${c(loc&&loc.bibliotheques)}</td><td class="n">${c(dist&&dist.bibliotheques)}</td></tr>
    <tr><th>Livres</th><td class="n">${c(loc&&loc.livres)}</td><td class="n">${c(dist&&dist.livres)}</td></tr>
    <tr><th>Photos</th><td class="n">${c(loc&&loc.photos)}</td><td class="n">${c(dist&&dist.photos)}</td></tr>
    <tr><th>Modifiée le</th><td>${esc(loc&&loc.maj?dateFr(loc.maj):"—")}</td><td>${esc(dist&&dist.maj?dateFr(dist.maj):"—")}</td></tr>
  </table>`;
}

/* ====================================================================
   ÉCRAN UNIQUE : SAUVEGARDE ET TRANSFERTS
   ==================================================================== */
function ouvrirSync(){
  const f = modale({
    titre:"Sauvegarde et transferts",
    html:
      `<div class="aide" style="font-size:13px;margin-bottom:10px">
         Cet appareil garde les données et les photos pas encore envoyées. Le dépôt GitHub
         <b>${esc(cfg.ghUser||"?")}/${esc(cfg.ghRepo||"?")}</b> est la copie de référence : le fichier
         <b>${FICHIER_JSON}</b> et les photos en pleine résolution dans <b>images/</b>.
         Les deux ne se synchronisent jamais tout seuls : c'est vous qui décidez du sens, ici.
       </div>
       <div id="sEtat"></div>

       <div class="titreSection">GitHub — sauvegarde de référence</div>
       <div class="action">
         <button class="btn principal" id="sEnvoyer">📤 Envoyer vers GitHub</button>
         <div class="expl"><span class="sens">Cet appareil → GitHub.</span> Téléverse les photos en attente, puis remplace le fichier ${FICHIER_JSON} par la version de cet appareil.</div>
       </div>
       <div class="action">
         <button class="btn" id="sRecuperer">📥 Récupérer depuis GitHub</button>
         <div class="expl"><span class="sens">GitHub → cet appareil.</span> Remplace le contenu de cet appareil par celui du dépôt. Les photos pas encore envoyées sont conservées.</div>
       </div>
       <div class="action">
         <button class="btn" id="sVerifier">🔍 Vérifier l'état de GitHub</button>
         <div class="expl">Lit le dépôt sans rien modifier, pour comparer les deux versions ci-dessus.</div>
       </div>

       <div class="titreSection">Fichier — copie de secours et transfert entre appareils</div>
       <div class="action">
         <button class="btn" id="sExport">💾 Exporter un fichier de sauvegarde</button>
         <div class="expl"><span class="sens">Cet appareil → fichier .json.</span> Contient bibliothèques et livres, plus les photos pas encore envoyées ; les autres photos restent sur GitHub. Ne modifie rien.</div>
       </div>
       <div class="action">
         <button class="btn" id="sImport">📂 Importer un fichier de sauvegarde</button>
         <div class="expl"><span class="sens">Fichier .json → cet appareil.</span> Remplace le contenu de cet appareil. GitHub n'est pas touché tant que vous n'envoyez pas ensuite.</div>
       </div>
       <input type="file" id="sFichier" accept="application/json,.json" hidden>`,
    boutons:[{texte:"Fermer"}]
  });

  const zone = f.querySelector("#sEtat");
  let distant = null;

  const afficher = (message)=>{
    zone.innerHTML = tableauComparaison(resume(data), distant, "GitHub")
      + `<div class="aide">${message||""}</div>`;
  };
  afficher(ghLisible()
    ? "Touchez « Vérifier l'état de GitHub » pour remplir la colonne de droite."
    : "Dépôt GitHub non configuré : ouvrez les réglages ⚙️, onglet GitHub.");

  const verifier = async (silencieux)=>{
    if (!ghLisible()){ toast("Configurez d'abord le dépôt dans les réglages ⚙️."); return false; }
    afficher("Lecture du dépôt en cours…");
    try{
      const txt = await ghLireTexte(FICHIER_JSON);
      if (txt === null){
        distant = null; etatSync = "ok"; majBandeau();
        afficher("Le dépôt est accessible mais ne contient pas encore de fichier " + FICHIER_JSON + " : il sera créé au premier envoi.");
        return true;
      }
      const j = JSON.parse(txt);
      distant = resume(j);
      etatSync = "ok"; majBandeau();
      const sameVersion = !sale && distant.maj === data.maj;
      afficher(sameVersion
        ? "Les deux versions sont identiques : rien à transférer."
        : "Les deux versions diffèrent. Choisissez le sens du transfert ci-dessous.");
      return true;
    }catch(e){
      etatSync = "echec"; majBandeau();
      afficher("Lecture impossible : " + esc(e.message));
      return false;
    }
  };
  if (ghLisible()) verifier(true);

  f.querySelector("#sVerifier").onclick = ()=>verifier(false);
  f.querySelector("#sEnvoyer").onclick = async ()=>{ f.remove(); await envoyerVersGitHub(); };
  f.querySelector("#sRecuperer").onclick = async ()=>{ f.remove(); await recupererDeGitHub(); };
  f.querySelector("#sExport").onclick = ()=>exporterFichier();
  f.querySelector("#sImport").onclick = ()=>f.querySelector("#sFichier").click();
  f.querySelector("#sFichier").onchange = async (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    try{
      const j = JSON.parse(await file.text());
      const r = resume(j);
      if (!r) throw new Error("Ce fichier ne contient pas de bibliothèques.");
      const ok = await confirmer(
        `<div>Le contenu de cet appareil sera remplacé par celui du fichier.</div>` +
        tableauComparaison(resume(data), r, "Fichier") +
        `<div class="aide">GitHub n'est pas modifié : il faudra envoyer ensuite si vous voulez y reporter cet import.</div>`,
        "Importer un fichier", "Remplacer");
      if (!ok) return;
      retirerMiniatures(j);
      data = j; biblioCourante = null;
      sauver();                      // marque « à envoyer »
      f.remove(); rendre();
      toast("Fichier importé sur cet appareil.");
    }catch(e){ toast("Import impossible : " + e.message, 5000); }
  };
}

function exporterFichier(){
  const blob = new Blob([JSON.stringify(data,null,1)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bibliotheques-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
  toast("Fichier exporté. Rien n'a été modifié.");
}

async function envoyerVersGitHub(){
  if (!ghLisible()){ toast("Configurez d'abord le dépôt dans les réglages ⚙️."); ouvrirReglages("github"); return; }
  if (!ghToken()){ toast("Un jeton GitHub est nécessaire pour enregistrer sur GitHub. Ajoutez-le dans les réglages ⚙️.", 5000); ouvrirReglages("github"); return; }

  // garde-fou : la version GitHub a-t-elle changé depuis notre dernière synchronisation ?
  try{
    const txt = await ghLireTexte(FICHIER_JSON);
    if (txt){
      const j = JSON.parse(txt);
      const connue = localStorage.getItem(CLE_SYNC);
      if (j.maj && connue && j.maj !== connue){
        const ok = await confirmer(
          `<div>La version présente sur GitHub a changé depuis votre dernier échange avec ce dépôt : elle vient probablement d'un autre appareil.</div>` +
          tableauComparaison(resume(data), resume(j), "GitHub") +
          `<div class="aide">Envoyer remplacera la version GitHub par celle de cet appareil.</div>`,
          "Version GitHub plus récente", "Envoyer quand même");
        if (!ok) return;
      }
    }
  }catch(e){
    const ok = await confirmer(`Impossible de lire l'état actuel de GitHub (${esc(e.message)}).<br><br>Tenter l'envoi quand même ?`, "GitHub illisible", "Tenter l'envoi");
    if (!ok){ etatSync="echec"; majBandeau(); return; }
  }

  const attente = photosEnAttente();
  const total = attente.length + 1;
  const pg = fenetreProgres("Envoi vers GitHub");
  let fait = 0;
  try{
    for (const p of attente){
      const ph = photoObj(p.cs, p.champ);
      const quoi = estAppoint(p.champ) ? " (appoint " + numeroAppoint(p.cs, p.champ) + ")" : (p.champ === "photo2" ? " (derrière)" : "");
      pg.maj(fait, total, "Photo " + p.cle + quoi + " de « " + p.bib.nom + " »");
      const chemin = cheminPhoto(p.bib, p.cle, p.champ);
      await ghEcrire(chemin, base64Seul(ph.plein), "Photo " + p.bib.nom + " " + p.cle + quoi);
      cachePhotos[cleCache(p.bib, p.cle, p.champ)] = ph.plein;
      ph.chemin = chemin;
      ph.envoye = true;
      ph.plein = null;                  // libère la mémoire de l'appareil
      fait++;
      sauver(false);
    }
    pg.maj(fait, total, "Fichier " + FICHIER_JSON);
    data.maj = new Date().toISOString();
    await ghEcrire(FICHIER_JSON, enBase64Utf8(JSON.stringify(data, null, 1)), "Bibliothèques — " + dateFr());
    fait++;
    pg.maj(fait, total, "Terminé");
    localStorage.setItem(CLE_SYNC, data.maj);
    sale = false; etatSync = "ok";
    sauver(false);
    pg.fermer();
    toast(attente.length ? `Envoyé : ${attente.length} photo(s) et les données.` : "Données envoyées sur GitHub.");
  }catch(e){
    pg.fermer();
    etatSync = "echec"; majBandeau();
    modale({titre:"Envoi interrompu",
      html:`<div>L'envoi s'est arrêté après ${fait} élément(s) sur ${total}.</div>
            <div class="aide">${esc(e.message)}</div>
            <div class="aide">Ce qui est déjà parti reste sur GitHub : relancez l'envoi, il reprendra où il s'est arrêté.</div>`,
      boutons:[{texte:"Fermer"}]});
  }
  rendre();
}

async function recupererDeGitHub(silencieux){
  if (!ghLisible()){ if(!silencieux) toast("Configurez d'abord le dépôt dans les réglages ⚙️."); return false; }
  try{
    const txt = await ghLireTexte(FICHIER_JSON);
    if (txt === null){
      if (!silencieux) toast("Aucun fichier " + FICHIER_JSON + " sur le dépôt pour l'instant.");
      etatSync = "ok"; majBandeau();
      return false;
    }
    const j = JSON.parse(txt);
    if (!j || !Array.isArray(j.bibliotheques)) throw new Error("Fichier distant inattendu.");

    if (!silencieux || sale){
      if (silencieux && !sale && j.maj === data.maj){ etatSync="ok"; majBandeau(); return false; }
      const ok = await confirmer(
        `<div>Le contenu de cet appareil sera remplacé par celui de GitHub.</div>` +
        tableauComparaison(resume(data), resume(j), "GitHub") +
        (sale ? `<div class="aide">⚠️ Cet appareil a des modifications non envoyées : elles seront perdues, sauf les photos pas encore téléversées.</div>` : ""),
        "Récupérer depuis GitHub", "Remplacer");
      if (!ok) return false;
    }

    const attente = photosEnAttente();   // ne jamais perdre une photo pas encore envoyée
    retirerMiniatures(j);
    data = j;
    attente.forEach(p=>{
      const b = data.bibliotheques.find(x=>x.id === p.bib.id);
      if (b){ b.cases = b.cases||{}; b.cases[p.cle] = b.cases[p.cle]||{livres:[]}; poserPhoto(b.cases[p.cle], p.champ, photoObj(p.cs, p.champ)); }
    });
    localStorage.setItem(CLE_SYNC, j.maj || "");
    sale = attente.length > 0;
    etatSync = "ok";
    sauver(false);
    if (biblioCourante && !biblio(biblioCourante)) biblioCourante = null;
    rendre();
    if (!silencieux) toast("Version GitHub appliquée sur cet appareil.");
    return true;
  }catch(e){
    etatSync = "echec"; majBandeau();
    if (!silencieux) toast("Récupération impossible : " + e.message, 6000);
    return false;
  }
}

/* ====================================================================
   GEMINI
   ==================================================================== */
function cleGemini(){ return localStorage.getItem(CLE_GEM) || ""; }

/* Erreur Gemini qui vient du modèle choisi (retiré, quota, refus) : il faut en changer. */
function erreurModele(message, statut){
  const e = new Error(message);
  e.modele = true; e.statut = statut;
  return e;
}

function extraitMessageGoogle(brut){
  try{ const j = JSON.parse(brut); if (j && j.error && j.error.message) return j.error.message; }catch(e){}
  return String(brut||"").slice(0,300);
}

async function gemini(parties, opts){
  opts = opts || {};
  const cle = opts.cle || cleGemini();
  if (!cle) throw new Error("Clé API Gemini absente : réglages ⚙️, onglet Gemini.");
  const modele = opts.modele || cfg.modele || "gemini-2.5-flash";
  const gc = { temperature:0.2, responseMimeType:"application/json", maxOutputTokens: opts.maxTokens || 16384 };
  // Seuls les 2.5 flash acceptent de couper la réflexion (budget 0) ; les autres gardent leur réglage par défaut.
  if (/gemini-2\.5-flash/.test(modele)) gc.thinkingConfig = { thinkingBudget:0 };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modele)}:generateContent?key=${encodeURIComponent(cle)}`;
  const envoyer = (g)=>fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, signal: opts.signal,
      body: JSON.stringify({ contents:[{ role:"user", parts:parties }], generationConfig:g }) });
  let r = await envoyer(gc);
  if (!r.ok && r.status === 400 && gc.thinkingConfig){
    const brut = await r.text();
    if (/thinking/i.test(brut)){ delete gc.thinkingConfig; r = await envoyer(gc); }
    else throw erreurModele(`Gemini 400 (${modele}) : ${extraitMessageGoogle(brut)}`, 400);
  }
  if (!r.ok){
    const brut = await r.text();
    const msg = extraitMessageGoogle(brut);
    if (r.status === 404) throw erreurModele(`Le modèle « ${modele} » n'est plus proposé par Google (ou n'existe pas). Choisissez-en un autre : réglages ⚙️ → Gemini → « Trouver un modèle qui marche ».\n\nMessage de Google : ${msg}`, 404);
    if (r.status === 429) throw erreurModele(`Quota épuisé pour le modèle « ${modele} » (trop de demandes, ou modèle non inclus dans l'offre gratuite). Réessayez plus tard ou choisissez un autre modèle.\n\nMessage de Google : ${msg}`, 429);
    if (r.status === 403) throw erreurModele(`Accès refusé au modèle « ${modele} » avec cette clé.\n\nMessage de Google : ${msg}`, 403);
    if (r.status === 400 && /model|not supported|image|inline/i.test(msg)) throw erreurModele(`Le modèle « ${modele} » refuse cette demande (peut-être ne lit-il pas les images).\n\nMessage de Google : ${msg}`, 400);
    throw new Error("Gemini " + r.status + " : " + msg);
  }
  const j = await r.json();
  const cand = j.candidates && j.candidates[0];
  if (!cand) throw new Error("Gemini n'a renvoyé aucune réponse (contenu peut-être bloqué).");
  if (cand.finishReason === "MAX_TOKENS") throw new Error("Réponse trop longue : réduisez la taille du lot.");
  const txt = ((cand.content && cand.content.parts) || []).filter(p=>!p.thought).map(p=>p.text||"").join("");
  if (!txt.trim()) throw new Error("Réponse vide de Gemini.");
  return txt;
}

/* ====================================================================
   CLAUDE (ANTHROPIC) — même question, mêmes photos
   ==================================================================== */
function cleClaude(){ return localStorage.getItem(CLE_CLAUDE) || ""; }
function entetesClaude(cle){
  return { "content-type":"application/json", "x-api-key":cle, "anthropic-version":"2023-06-01",
           "anthropic-dangerous-direct-browser-access":"true" };
}

async function claude(parties, opts){
  opts = opts || {};
  const cle = opts.cle || cleClaude();
  if (!cle) throw new Error("Clé API Claude absente : réglages ⚙️, onglet IA.");
  const modele = opts.modele || cfg.modeleClaude || "claude-sonnet-5";
  // Conversion des « parties » au format Gemini vers le format Claude
  const content = parties.map(p=> p.inline_data
    ? { type:"image", source:{ type:"base64", media_type:p.inline_data.mime_type, data:p.inline_data.data } }
    : { type:"text", text:String(p.text||"") });
  content.push({ type:"text", text:"Rappel : réponds uniquement par l'objet JSON demandé, sans texte ni balises ``` autour." });
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:entetesClaude(cle), signal:opts.signal,
    body: JSON.stringify({ model:modele, max_tokens: opts.maxTokens || 16000, messages:[{ role:"user", content }] }) });
  if (!r.ok){
    const msg = extraitMessageGoogle(await r.text());
    if (r.status === 401) throw erreurModele(`Clé API Claude refusée.\n\nMessage d'Anthropic : ${msg}`, 401);
    if (r.status === 404) throw erreurModele(`Le modèle Claude « ${modele} » est introuvable. Choisissez-en un autre : réglages ⚙️ → IA → « Liste des modèles ».\n\nMessage d'Anthropic : ${msg}`, 404);
    if (r.status === 429) throw erreurModele(`Limite d'utilisation de Claude atteinte (${modele}). Réessayez un peu plus tard.\n\nMessage d'Anthropic : ${msg}`, 429);
    if (r.status === 400 && /credit|billing|balance/i.test(msg)) throw erreurModele(`Crédit Anthropic insuffisant : rechargez votre compte sur console.anthropic.com.\n\nMessage d'Anthropic : ${msg}`, 402);
    if (r.status === 529) throw new Error("Claude est momentanément surchargé (529). Réessayez dans un instant.");
    throw new Error("Claude " + r.status + " : " + msg);
  }
  const j = await r.json();
  if (j.stop_reason === "max_tokens") throw new Error("Réponse de Claude trop longue : réduisez la taille du lot.");
  const txt = (j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");
  if (!txt.trim()) throw new Error("Réponse vide de Claude.");
  return txt;
}

async function listerModelesClaude(cle){
  const r = await fetch("https://api.anthropic.com/v1/models?limit=100", { headers:entetesClaude(cle) });
  if (!r.ok) throw new Error("Liste des modèles Claude refusée (" + r.status + ") : " + extraitMessageGoogle(await r.text()));
  const j = await r.json();
  return (j.data||[]).map(m=>({ id:m.id, nom:m.display_name||"" }));
}

/* ====================================================================
   INTERROGER L'IA : principale d'abord, l'autre en secours si elle échoue
   ==================================================================== */
const iaEnPanne = {};                     // pour la session : une IA en panne n'est pas réessayée à chaque photo
const NOM_IA = { gemini:"Gemini", claude:"Claude" };

/* Vrai si l'IA est réglée « sans clé » (copier-coller dans son site). */
function modeManuel(nom){ return (nom === "claude" ? cfg.claudeMode : cfg.geminiMode) === "manuel"; }

async function interrogerIA(parties, lire, opts){
  opts = opts || {};
  const ordre = cfg.iaPrincipale === "claude" ? ["claude","gemini"] : ["gemini","claude"];
  const essais = cfg.secours ? ordre : [ordre[0]];
  const echecs = [];
  for (let i=0; i<essais.length; i++){
    const nom = essais[i];
    if (iaEnPanne[nom] && i < essais.length-1){ echecs.push({ nom, e:iaEnPanne[nom], deja:true }); continue; }
    if (modeManuel(nom)){
      // IA sans clé : seul l'utilisateur peut transmettre la demande (copier-coller)
      if (opts.manuel){
        const e = new Error("Demande à transmettre à " + NOM_IA[nom] + " à la main.");
        e.manuel = true; e.ia = nom; e.parties = parties; e.echecs = echecs.slice();
        throw e;
      }
      echecs.push({ nom, e:new Error(NOM_IA[nom] + " est réglé « sans clé » : ouvrez le compartiment et touchez 🔍 Analyser pour lui transmettre la photo à la main.") });
      continue;
    }
    try{
      const txt = nom === "gemini" ? await gemini(parties) : await claude(parties);
      const res = lire ? lire(txt) : txt;
      return { res, ia:nom, modele: nom === "gemini" ? cfg.modele : cfg.modeleClaude, echecs };
    }catch(e){
      if (e instanceof SyntaxError) e = new Error("Réponse illisible (pas du JSON valide).");
      if (e.modele) iaEnPanne[nom] = e;
      echecs.push({ nom, e });
    }
  }
  if (!echecs.length) throw new Error("Aucune IA disponible : vérifiez les réglages ⚙️ → IA.");
  const err = new Error(echecs.map(x=>NOM_IA[x.nom] + (x.deja?" (déjà en échec plus tôt)":"") + " : " + x.e.message).join("\n\n")
    + (!cfg.secours ? "\n\nAstuce : activez le secours par l'autre IA dans les réglages ⚙️ → IA." : ""));
  err.modele = echecs.some(x=>x.e.modele);
  throw err;
}

function texteSource(src){
  if (!src) return "";
  if (src.manuel) return " Réponse de " + NOM_IA[src.ia||"claude"] + " (copier-coller).";
  return src.echecs && src.echecs.length
    ? ` Réponse de ${NOM_IA[src.ia]} (${NOM_IA[src.echecs[0].nom]} a échoué).`
    : "";
}

let rafraichirCompartimentOuvert = null;   // fourni par la fenêtre d'un compartiment ouverte

function chargerImage(src){
  return new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("Image illisible")); i.src = src; });
}

/* Une image PNG (seul format accepté par le presse-papier d'iOS) : une photo, ou deux côte à côte avec leur numéro. */
async function blobPourClaude(images){
  const imgs = await Promise.all(images.map(chargerImage));
  const BANDE = imgs.length > 1 ? 70 : 0, MARGE = imgs.length > 1 ? 16 : 0;
  const h = Math.max(...imgs.map(i=>i.height));
  const w = imgs.reduce((n,i)=>n + i.width, 0) + MARGE*(imgs.length-1);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h + BANDE;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#ffffff"; cx.fillRect(0,0,cv.width,cv.height);
  let x = 0;
  imgs.forEach((im,i)=>{
    if (BANDE){
      cx.fillStyle = "#111"; cx.font = "bold 40px Helvetica, Arial, sans-serif"; cx.textBaseline = "middle";
      cx.fillText(i === 0 ? "PHOTO 1 — rang de devant" : "PHOTO 2 — rang de derrière", x + 14, BANDE/2);
    }
    cx.drawImage(im, x, BANDE);
    x += im.width + MARGE;
  });
  return await new Promise(res=>cv.toBlob(b=>res(b), "image/png"));
}

async function copierImagePresse(blobPromise){
  if (!navigator.clipboard || !window.ClipboardItem) throw new Error("Copie d'image non prise en charge par ce navigateur.");
  await navigator.clipboard.write([ new ClipboardItem({ "image/png": blobPromise }) ]);
}

/* Ouvre la démarche pas à pas. parties = la demande préparée (texte + photo(s)), echecs = IA déjà tombées en panne. */

  gemini:{ url:q=>"https://gemini.google.com/app?q=" + encodeURIComponent(q) }

function lancerClaudeManuel(b, k, parties, echecs, ia, genre){
  ia = ia || "claude";

  const NOM = NOM_IA[ia], autre = ia === "claude" ? "gemini" : "claude";

  const cs = b.cases[k];
  let question = parties.filter(p=>p.text && !/^Photo \d/.test(p.text)).map(p=>p.text).join("\n\n");
  if (deux) question += "\n\nL'image jointe réunit les deux photos côte à côte : à GAUCHE la photo 1 (rang de devant), à DROITE la photo 2 (rang de derrière). Si je joins deux images séparées, la première est la photo 1 et la seconde la photo 2.";
  question += "\n\nL'image est en pièce jointe. Réponds uniquement par l'objet JSON demandé, sans texte ni balises ``` autour.";

  // L'attente n'est enregistrée qu'au moment où la demande part réellement vers Claude (étape 2).
  const marquerEnvoi = ()=>{
    localStorage.setItem(CLE_ATTENTE_CLAUDE, JSON.stringify({ ia, genre, bibId:b.id, cle:k, deux, avecAvant: !!cs.photo, date:new Date().toISOString() }));

  };

  const tombees = (echecs||[]).filter(x=>x.nom === autre);
  const f = modale({
    titre: (genre === "controle" ? "Contrôler avec " : "Demander à ") + NOM + " (sans clé)",
    html:
      (tombees.length ? `<div class="encadre" style="margin-top:0">${NOM_IA[autre]} a échoué : ${esc(String(tombees[0].e.message).split("\n")[0])}</div>` : "") +
      (genre === "controle" ? `<div class="encadre" style="margin-top:0">Contrôle de la liste déjà relevée : la question contient cette liste, et ${images.length > 3 ? "les 3 premières photos d'appoint sont jointes (relancez ensuite pour les suivantes)" : "les photos d'appoint sont jointes"}.</div>` : "") +
      `<div class="etape"><div class="n">1</div><div class="c">Copier ${deux ? "les deux photos (réunies côte à côte)" : "la photo"} dans le presse-papier.
         <button class="btn principal plein" id="mcCopier">📋 Copier ${deux ? "les 2 photos" : "la photo"}</button>
         ${deux ? `<div class="aide">Pour une lecture plus fine, vous pouvez aussi les envoyer une par une :</div>
           <div class="barre"><button class="btn" id="mcP1" style="flex:1">Photo 1</button><button class="btn" id="mcP2" style="flex:1">Photo 2</button></div>` : ""}
         <div class="aide" id="mcEtatCopie"></div></div></div>
       <div class="etape"><div class="n">2</div><div class="c">Ouvrir ${NOM} : la question est déjà écrite. <b>Collez la photo en pièce jointe</b>, puis envoyez.
         <button class="btn plein" id="mcOuvrir">↗️ Ouvrir ${NOM} avec la question</button>
         <button class="btn plein" id="mcQuestion">Copier seulement le texte de la question</button>
         ${ia === "gemini" ? `<div class="aide">Si la question n'apparaît pas déjà écrite dans Gemini, collez d'abord la photo, revenez ici toucher « Copier seulement le texte de la question », puis collez-la sous la photo.</div>` : ""}</div></div>
       <div class="etape"><div class="n">3</div><div class="c">Dans ${NOM}, copiez sa réponse (le bloc JSON), revenez ici et touchez le bouton vert.
         <button class="btn vif plein" id="mcReponse">📥 Copier la réponse de ${NOM}</button>
         <div class="aide">Dès que vous avez ouvert ${NOM} (étape 2), le bouton vert reste aussi en bas de l'écran tant que la réponse est attendue, même si vous fermez cette fenêtre. Fermer cette fenêtre sans ouvrir ${NOM} n'enregistre aucune attente.</div></div></div>`,
    boutons:[{texte:"Fermer"}]
  });
  const etat = f.querySelector("#mcEtatCopie");
  const copier = async (liste, quoi)=>{
    try{
      await copierImagePresse(blobPourClaude(liste));        // la promesse est passée telle quelle : exigence de Safari
      etat.textContent = "✓ " + quoi + " dans le presse-papier. Passez à l'étape 2.";
    }catch(e){
      etat.innerHTML = "Copie automatique impossible (" + esc(e.message) + "). Ouvrez l'image ci-dessous, appui long → Copier.";
      visionneuse(liste[0], "Appui long sur l'image → Copier");

  f.querySelector("#mcCopier").onclick = ()=>copier(images, deux ? "Les deux photos sont" : "La photo est");

    f.querySelector("#mcP2").onclick = ()=>copier([images[1]], "La photo 2 est");

  };

    marquerEnvoi();
    toast(await copierTexte(question) ? "Question copiée (la photo n'est plus dans le presse-papier : recopiez-la ensuite)." : "Copie impossible.", 5000);

async function recevoirReponseClaude(fenetre){
  const a = lireAttenteClaude();
  if (!a){ toast("Aucune demande à une IA en attente."); majAttenteClaude(); return; }
  let txt = "";
  try{ txt = await navigator.clipboard.readText(); }catch(e){ txt = ""; }
  if (!appliquerReponseClaude(a, txt, true)) collerReponseClaudeMain(a, txt);
  else if (fenetre && fenetre.isConnected) fenetre.remove();
}

/* Renvoie false si le texte n'est pas une réponse exploitable (on proposera alors de la coller à la main). */
function appliquerReponseClaude(a, txt, silencieux){
  const b = biblio(a.bibId);
  if (!b){ toast("La bibliothèque de cette demande n'existe plus."); localStorage.removeItem(CLE_ATTENTE_CLAUDE); majAttenteClaude(); return true; }
  const ia = a.ia || "claude";
  let j;
  try{ j = jsonDepuisTexte(String(txt||"")); }
  catch(e){ if (!silencieux) toast("Ce texte ne contient pas de JSON lisible : copiez bien toute la réponse de " + NOM_IA[ia] + ".", 5000); return false; }
  const source = { ia, modele: ia === "gemini" ? "gemini.google.com (copier-coller)" : "claude.ai (copier-coller)", manuel:true, echecs:[] };
  b.cases[a.cle] = b.cases[a.cle] || { livres:[] };
  if (a.genre === "controle"){

/* Range les livres trouvés dans un compartiment (demande avant d'écraser des livres déjà relevés). */
function appliquerLivresCompartiment(b, k, livres){
  const cs = b.cases[k];
  const fin = ()=>{ sauver(); if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k); if (biblioCourante === b.id) rendreBiblio(); };
