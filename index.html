function listeLivresPourIA(cs){
  const l = cs.livres || [];
  if (!l.length) return "(aucun livre relevé pour l'instant)";
  return l.map((lv,i)=>`${i}. ${lv.titre}${lv.auteur?" — "+lv.auteur:""}${lv.annee?" ("+lv.annee+")":""}`
    + (lv.rang ? " [" + (lv.rang==="derriere"?"derrière":"devant") + "]" : "")
    + (lv.certitude && lv.certitude !== "haute" ? " (certitude " + lv.certitude + ")" : "")
    + (lv.remarque ? " — " + lv.remarque : "")).join("\n");
}

/* Envoie les photos d'appoint par lots de 3, avec la liste actuelle, et rassemble les changements proposés. */
async function controlerAvecAppoints(bib, cle, opts){
  const cs = bib.cases[cle];
  const app = (cs && cs.appoints) || [];
  if (!app.length) throw new Error("Aucune photo d'appoint sur ce compartiment.");
  const LOT = 3;
  const propositions = [];
  let source = null;
  const pg = app.length > LOT ? fenetreProgres("Contrôle par les photos d'appoint") : null;
  let fait = 0;
  try{
    for (let d = 0; d < app.length; d += LOT){
      const tranche = app.slice(d, d + LOT);
      if (pg) pg.maj(fait, app.length, `Photos ${d+1} à ${Math.min(d+LOT, app.length)} — envoi à l'IA…`);
      const parties = [{ text: (cfg.qAppoint || QUESTION_APPOINT_DEFAUT) + "\n\nListe actuelle du compartiment :\n" + listeLivresPourIA(cs) }];
      for (const a of tranche){
        const img = await photoPleine(bib, cle, PRE_APPOINT + a.id);
        if (!img) throw new Error("Photo d'appoint " + (app.indexOf(a)+1) + " introuvable (ni sur cet appareil ni sur GitHub).");
        parties.push({ text: "Photo d'appoint " + (app.indexOf(a)+1) + (a.legende ? " — " + a.legende : "") + " :" });
        parties.push({ inline_data:{ mime_type:"image/jpeg", data: base64Seul(img) } });
      }
      const rep = await interrogerIA(parties, jsonDepuisTexte, opts);
      source = { ia:rep.ia, modele:rep.modele, echecs:rep.echecs };
      propositionsDepuisReponse(rep.res, cs).forEach(p=>propositions.push(p));
      fait += tranche.length;
      if (pg) pg.maj(fait, app.length, "");
    }
  } finally { if (pg) pg.fermer(); }
  return { propositions: fusionnerPropositions(propositions), source };
}

const CHAMPS_PROP = ["titre","auteur","annee","certitude","rang","remarque"];
const NOM_CHAMP = { titre:"Titre", auteur:"Auteur", annee:"Année", certitude:"Certitude", rang:"Rang", remarque:"Remarque" };

/* Transforme la réponse de l'IA en propositions rattachées aux livres existants. */
function propositionsDepuisReponse(j, cs){
  const bruts = Array.isArray(j && j.corrections) ? j.corrections : [];
  const livres = cs.livres || [];
  const out = [];
  bruts.forEach(x=>{
    if (!x) return;
    const a = String(x.action||"").toLowerCase();
    const action = /ajout/.test(a) ? "ajouter" : /retir|suppr/.test(a) ? "retirer" : "corriger";
    const i = Number(x.i);
    const cible = Number.isInteger(i) && i >= 0 && i < livres.length ? livres[i] : null;
    if (action !== "ajouter" && !cible) return;
    const p = { action, cible, motif:String(x.motif||"").trim(), champs:{} };
    CHAMPS_PROP.forEach(ch=>{
      let v = x[ch];
      if (v == null) return;
      v = String(v).trim();
      if (!v) return;
      if (ch === "rang") v = /derri/.test(v.toLowerCase()) ? "derriere" : "devant";
      if (ch === "certitude" && !["haute","moyenne","faible"].includes(v)) return;
      if (action !== "ajouter" && String(cible[ch]||"") === v) return;   // rien de nouveau
      p.champs[ch] = v;
    });
    if (action === "corriger" && !Object.keys(p.champs).length) return;  // simple confirmation
    if (action === "ajouter" && !p.champs.titre) return;
    if (action === "ajouter" && livres.some(lv=>normaliser(lv.titre) === normaliser(p.champs.titre))) return;
    out.push(p);
  });
  return out;
}

/* Deux lots peuvent proposer la même chose : on ne la présente qu'une fois. */
function fusionnerPropositions(props){
  const vus = new Set(), out = [];
  props.forEach(p=>{
    const c = p.action + "|" + (p.cible ? p.cible.id || p.cible.titre : "") + "|" + JSON.stringify(p.champs);
    if (vus.has(c)) return;
    vus.add(c); out.push(p);
  });
  return out;
}

/* Chaque proposition est présentée avec son motif ; rien n'est appliqué sans être coché. */
function validerPropositions(b, k, props, source){
  const cs = b.cases[k];
  const marquerControle = ()=>{
    cs.controle = { maj:new Date().toISOString(), ia:(source&&source.ia)||"gemini",
      modele:(source&&source.modele)||"", manuel:!!(source&&source.manuel), photos:(cs.appoints||[]).length };
  };
  if (!props.length){
    marquerControle(); sauver();
    if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k);
    if (biblioCourante === b.id) rendreBiblio();
    modale({ titre:"Contrôle terminé",
      html:`<div>Aucun changement proposé : les photos d'appoint confirment la liste de ce compartiment.</div>
            <div class="aide">${esc(texteSource(source).trim() || "")}</div>`,
      boutons:[{texte:"Fermer"}]});
    return;
  }
  const ETIQ = { corriger:"✏️ Corriger", ajouter:"➕ Ajouter", retirer:"🗑 Retirer" };
  const cartes = props.map((p,i)=>{
    let corps = "";
    if (p.action === "ajouter"){
      corps = `<div class="t">${esc(p.champs.titre)}</div>
               <div class="chg">${esc(p.champs.auteur||"auteur inconnu")}${p.champs.annee?" · "+esc(p.champs.annee):""}${p.champs.rang?" · "+(p.champs.rang==="derriere"?"derrière":"devant"):""}</div>`;
    } else if (p.action === "retirer"){
      corps = `<div class="t">${esc(p.cible.titre)}</div>
               <div class="chg">${esc(p.cible.auteur||"auteur inconnu")}</div>`;
    } else {
      corps = `<div class="t">${esc(p.cible.titre)}</div>` +
        Object.keys(p.champs).map(ch=>
          `<div class="chg">${esc(NOM_CHAMP[ch]||ch)} : ${esc(String(p.cible[ch]||"—"))} → <b>${esc(p.champs[ch])}</b></div>`).join("");
    }
    return `<div class="prop ${p.action}">
      <div class="coche" style="align-items:flex-start">
        <input type="checkbox" data-p="${i}" ${p.action==="retirer"?"":"checked"} style="margin-top:3px">
        <label style="margin:0;flex:1"><span class="act">${ETIQ[p.action]}</span>${corps}
        ${p.motif?`<div class="mot">${esc(p.motif)}</div>`:""}</label></div></div>`;
  }).join("");

  const f = modale({
    titre:"Changements proposés",
    html:`<div class="aide" style="margin-top:0">${props.length} proposition(s) à partir de ${(cs.appoints||[]).length} photo(s) d'appoint.${esc(texteSource(source))} Décochez ce que vous ne voulez pas appliquer ; les retraits sont décochés d'office.</div>
          <div class="barre" style="margin:8px 0 4px">
            <button class="btn" id="pvTous" style="flex:1">Tout cocher</button>
            <button class="btn" id="pvAucun" style="flex:1">Tout décocher</button>
          </div>
          ${cartes}`,
    boutons:[
      {texte:"Ne rien appliquer", action:()=>{ marquerControle(); sauver(); if (biblioCourante === b.id) rendreBiblio(); }},
      {texte:"Appliquer les cochés", classe:"principal", action:(fd)=>{
        const retenus = props.filter((p,i)=>fd.querySelector(`[data-p="${i}"]`).checked);
        let cor=0, ajo=0, ret=0;
        retenus.filter(p=>p.action==="corriger").forEach(p=>{
          Object.keys(p.champs).forEach(ch=>{ p.cible[ch] = p.champs[ch]; });
          cor++;
        });
        retenus.filter(p=>p.action==="ajouter").forEach(p=>{
          cs.livres = cs.livres || [];
          cs.livres.push(Object.assign({ id:uid(), titre:"", auteur:"", annee:"", certitude:"moyenne",
            remarque:"", resume:"", categorie:"", origine:"ia" }, p.champs));
          ajo++;
        });
        const aRetirer = new Set(retenus.filter(p=>p.action==="retirer").map(p=>p.cible));
        if (aRetirer.size){ cs.livres = (cs.livres||[]).filter(lv=>!aRetirer.has(lv)); ret = aRetirer.size; }
        marquerControle();
        sauver();
        if (rafraichirCompartimentOuvert) rafraichirCompartimentOuvert(b.id, k);
        if (biblioCourante === b.id) rendreBiblio();
        toast(`${cor} correction(s), ${ajo} ajout(s), ${ret} retrait(s) appliqué(s).`, 5000);
      }}
    ],
    surFermeture:()=>{ marquerControle(); sauver(); if (biblioCourante === b.id) rendreBiblio(); }
  });
  const coches = ()=>[...f.querySelectorAll("[data-p]")];
  f.querySelector("#pvTous").onclick = ()=>coches().forEach(c=>c.checked = true);
  f.querySelector("#pvAucun").onclick = ()=>coches().forEach(c=>c.checked = false);
  coches().forEach(c=>{ const l = c.nextElementSibling; if (l) l.onclick = e=>{ if (e.target.tagName !== "INPUT") c.checked = !c.checked; }; });
}

/* ====================================================================
   RECHERCHE D'UN MODÈLE GEMINI QUI FONCTIONNE
   ==================================================================== */
const EXCLUS_MODELES = /embedding|tts|image|imagen|veo|lyria|live|audio|native|robotics|computer-use|aqa|learnlm|gemma|nano|banana|search|dialog/i;

async function listerModelesGemini(cle){
  const tous = []; let jeton = ""; let tours = 0;
  do{
    const u = `https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=${encodeURIComponent(cle)}${jeton?"&pageToken="+encodeURIComponent(jeton):""}`;
    const r = await fetch(u);
    if (!r.ok) throw new Error("Liste des modèles refusée (" + r.status + ") : " + extraitMessageGoogle(await r.text()));
    const j = await r.json();
    (j.models||[]).forEach(m=>tous.push(m));
    jeton = j.nextPageToken || "";
  } while (jeton && ++tours < 10);
  const candidats = tous.filter(m=>{
    const id = String(m.name||"").replace(/^models\//,"");
    return /^gemini/i.test(id) && (m.supportedGenerationMethods||[]).includes("generateContent") && !EXCLUS_MODELES.test(id);
  }).map(m=>({ id:String(m.name).replace(/^models\//,""), nom:m.displayName||"" }));
  candidats.sort((a,b)=>rangModele(a.id).localeCompare(rangModele(b.id)));
  return { total: tous.length, candidats };
}

/* Clé de tri : alias « -latest » d'abord, puis stables avant preview/exp, version la plus récente, flash > pro > flash-lite. */
function rangModele(id){
  const alias = /latest$/i.test(id) ? 0 : 1;
  const instable = /preview|exp/i.test(id) ? 1 : 0;
  const mv = id.match(/gemini-(\d+)(?:\.(\d+))?/i);
  const version = mv ? (parseInt(mv[1],10)*100 + parseInt(mv[2]||"0",10)) : 0;
  const famille = /lite/i.test(id) ? 2 : /flash/i.test(id) ? 0 : /pro/i.test(id) ? 1 : 3;
  return `${alias}${instable}${String(9999-version).padStart(4,"0")}${famille}${id}`;
}

/* Petite image JPEG contenant un nombre à lire : preuve que le modèle lit bien les photos. */
function imageDeTest(){
  const n = String(1000 + Math.floor(Math.random()*9000));
  const c = document.createElement("canvas"); c.width = 480; c.height = 200;
  const x = c.getContext("2d");
  x.fillStyle = "#f4ecd8"; x.fillRect(0,0,480,200);
  x.fillStyle = "#1a1a1a"; x.font = "bold 64px Georgia, serif"; x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText("LIVRE " + n, 240, 100);
  return { n, b64: c.toDataURL("image/jpeg", 0.85).split(",")[1] };
}

async function testerModele(id, cle, fournisseur){
  const img = imageDeTest();
  const ctl = new AbortController();
  const minuteur = setTimeout(()=>ctl.abort(), 45000);
  const t0 = performance.now();
  try{
    const txt = await (fournisseur === "claude" ? claude : gemini)([
      { text:'Recopie exactement le texte écrit sur cette image. Réponds UNIQUEMENT par un objet JSON : {"texte":""}' },
      { inline_data:{ mime_type:"image/jpeg", data: img.b64 } }
    ], { modele:id, cle, signal:ctl.signal, maxTokens:2048 });
    const ms = Math.round(performance.now() - t0);
    const lu = txt.replace(/\D/g,"");
    return lu.includes(img.n)
      ? { etat:"ok", ms, detail:`lit l'image en ${(ms/1000).toFixed(1).replace(".",",")} s` }
      : { etat:"aveugle", ms, detail:"répond mais ne lit pas l'image correctement" };
  }catch(e){
    if (e.name === "AbortError") return { etat:"delai", detail:"pas de réponse en 45 s" };
    const st = e.statut;
    if (st === 404) return { etat:"indispo", detail:"retiré ou indisponible (404)" };
    if (st === 429) return { etat:"quota", detail:"quota épuisé ou hors offre gratuite (429)" };
    if (st === 403) return { etat:"refus", detail:"accès refusé à cette clé (403)" };
    if (st === 401) return { etat:"refus", detail:"clé refusée (401)" };
    if (st === 402) return { etat:"quota", detail:"crédit insuffisant" };
    return { etat:"erreur", detail: String(e.message||e).split("\n")[0].slice(0,140) };
  }finally{ clearTimeout(minuteur); }
}

      ${choix.id===cfg.modele ? "<br>C'est déjà le modèle utilisé." : `<br><button class="btn principal plein" id="mAdopter" style="margin-top:8px">Utiliser ${esc(choix.id)}</button>`}</div>`;
    const b = reco.querySelector("#mAdopter");
    if (b) b.onclick = ()=>{ adopter(choix.id); b.remove(); };
  };

  // Affiche le dernier test conservé
  const ancien = lireTestsModeles();
  if (ancien){
    etat.textContent = `Dernier test : ${dateFr(ancien.date)} — ${ancien.liste.filter(x=>x.etat==="ok").length} modèle(s) opérationnel(s) sur ${ancien.liste.length} testé(s). Relancez un test pour mettre à jour.`;
    ancien.liste.forEach(x=>liste.appendChild(ligne(x, x)));
    afficherReco(ancien.liste);
  } else {
    etat.textContent = "Aucun test encore fait sur cet appareil. « Jusqu'au premier qui marche » est le plus rapide ; « Tout tester » donne le tableau complet.";
  }

  async function lancer(premierSeul){
    if (enCours) return;
    enCours = true; arret = false;
    boutonsLancer.forEach(b=>b.disabled = true);
    liste.innerHTML = ""; reco.innerHTML = "";
    etat.textContent = "Demande de la liste des modèles à Google…";
    let cands;
    try{
      const r = await listerModelesGemini(cle);
      cands = r.candidats;
      etat.textContent = `${r.total} modèle(s) ouverts à votre clé, dont ${cands.length} capable(s) a priori d'analyser une photo. Essai de chacun…`;
    }catch(e){
      etat.textContent = "Échec : " + e.message;
      enCours = false; boutonsLancer.forEach(b=>b.disabled = false);
      return;
    }
    const prog = f.querySelector("#mProg"), progT = f.querySelector("#mProgT"), progB = f.querySelector("#mProgB");
    prog.hidden = false;
    const resultats = [];
    for (let i=0; i<cands.length; i++){
      if (arret || !f.isConnected) break;
      const m = cands[i];
      progT.textContent = `Testés : ${i} / ${cands.length} — restants : ${cands.length-i} · essai de ${m.id}…`;
      progB.style.width = Math.round(i*100/cands.length) + "%";
      const r = await testerModele(m.id, cle);
      const res = Object.assign({ id:m.id, nom:m.nom }, r);
      resultats.push(res);
      liste.appendChild(ligne(m, res));
      if (premierSeul && r.etat === "ok") break;
    }
    const n = resultats.length;
    progT.textContent = `Testés : ${n} / ${cands.length} — restants : ${cands.length-n}${arret?" (arrêté)":""}`;
    progB.style.width = cands.length ? Math.round(n*100/cands.length) + "%" : "100%";
    const bons = resultats.filter(x=>x.etat==="ok").length;
    etat.textContent = `${bons} modèle(s) opérationnel(s) sur ${n} testé(s).` + (premierSeul && bons && n<cands.length ? " « Tout tester » pour voir les autres." : "");
    try{ localStorage.setItem(CLE_MODELES, JSON.stringify({ date:new Date().toISOString(), liste:resultats })); }catch(e){}
    afficherReco(resultats);
    if (surChoix) surChoix(cfg.modele);
    enCours = false; boutonsLancer.forEach(b=>b.disabled = false);
  }
}

/* Remplit la liste déroulante des modèles : modèles testés opérationnels d'abord, puis les autres connus. */
function majSelectModeles(sel, choisi){
  const t = lireTestsModeles();
  const ok = t ? t.liste.filter(x=>x.etat==="ok").map(x=>x.id) : [];
  const ko = t ? t.liste.filter(x=>x.etat!=="ok").map(x=>x.id) : [];
  const base = ["gemini-flash-latest","gemini-2.5-flash","gemini-2.5-pro"];
  const tous = [...new Set([choisi || cfg.modele, ...ok, ...base.filter(x=>!ko.includes(x))])].filter(Boolean);
  sel.innerHTML = tous.map(m=>{
    const marque = ok.includes(m) ? "✅ " : ko.includes(m) ? "⚠️ " : "";
    return `<option value="${esc(m)}" ${m===(choisi||cfg.modele)?"selected":""}>${marque}${esc(m)}</option>`;
  }).join("");
}

function jsonDepuisTexte(txt){
  let t = txt.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  const d = t.indexOf("{"), f = t.lastIndexOf("}");
  if (d > 0 || (f >= 0 && f < t.length-1)) t = t.slice(d>=0?d:0, f>=0?f+1:undefined);
  return JSON.parse(t);
}

/* Analyse d'un compartiment : une photo, ou deux photos (rang de devant + rang de derrière)
   envoyées ensemble pour que Gemini produise une liste unique sans doublon. */
/* portée d'une analyse : "deux" (les deux rangs), "devant" ou "derriere" (une seule photo) */
function porteeParDefaut(cs){ return cs && cs.photo && cs.photo2 ? "deux" : (cs && cs.photo ? "devant" : "derriere"); }
/* rang de chaque livre selon la portée + mémorisation de la portée dans la liste */
function finaliserPortee(livres, portee, cs){
  if (portee === "devant" && cs && cs.photo2) livres.forEach(lv=>{ lv.rang = "devant"; });
  if (portee === "derriere") livres.forEach(lv=>{ lv.rang = "derriere"; });
  livres.portee = portee;
  return livres;
}
async function analyserPhoto(bib, cle, opts){
  opts = opts || {};
  const cs = bib.cases[cle];
  const portee = opts.portee || porteeParDefaut(cs);
  const deux = portee === "deux" && !!(cs && cs.photo && cs.photo2);
  const avant = cs && cs.photo && portee !== "derriere" ? await photoPleine(bib, cle, "photo") : null;
  const arriere = cs && cs.photo2 && portee !== "devant" ? await photoPleine(bib, cle, "photo2") : null;
  if (!avant && !arriere) throw new Error("Photo introuvable (ni sur cet appareil ni sur GitHub).");
  if (deux && (!avant || !arriere)) throw new Error("Une des deux photos du compartiment est introuvable (ni sur cet appareil ni sur GitHub).");

  let parties;
  if (deux){
    parties = [
      { text: cfg.qAnalyse2 || QUESTION_DEUX_RANGS_DEFAUT },
      { text: "Photo 1 (compartiment tel quel, rang de devant) :" },
      { inline_data: { mime_type:"image/jpeg", data: base64Seul(avant) } },
      { text: "Photo 2 (après avoir retiré les livres de devant, rang de derrière) :" },
      { inline_data: { mime_type:"image/jpeg", data: base64Seul(arriere) } }
    ];
  } else {
    parties = [
      { text: cfg.qAnalyse },
      { inline_data: { mime_type:"image/jpeg", data: base64Seul(avant || arriere) } }
    ];
  }
  let rep;
  try{ rep = await interrogerIA(parties, jsonDepuisTexte, opts); }
  catch(e){ e.portee = portee; throw e; }
  return finaliserPortee(livresDepuisReponse(rep.res, deux, !!avant, { ia:rep.ia, modele:rep.modele, echecs:rep.echecs }), portee, cs);
}

/* Transforme la réponse JSON d'une IA en livres (commun à Gemini, Claude par clé et Claude par copier-coller). */
function livresDepuisReponse(j, deux, avecAvant, source){
  const bruts = Array.isArray(j && j.livres) ? j.livres : (Array.isArray(j) ? j : []);
  const livres = bruts.filter(x=>x && String(x.titre||"").trim()).map(x=>{
    const lv = {
      id: uid(),
      titre: String(x.titre||"").trim(),
      auteur: String(x.auteur||"").trim(),
      annee: String(x.annee||"").trim(),
      certitude: ["haute","moyenne","faible"].includes(x.certitude) ? x.certitude : "moyenne",
      remarque: String(x.remarque||"").trim(),
      resume:"", categorie:"",
      origine:"ia"
    };
    if (deux){
      const r = String(x.rang||"").toLowerCase();
      lv.rang = /derri/.test(r) ? "derriere" : "devant";
    } else if (!avecAvant){
      lv.rang = "derriere";
    }
    return lv;
  });
  if (!deux){ livres.source = source; return livres; }
  const fus = fusionnerDoublons(livres);
  fus.fusionnes = livres.length - fus.length;
  fus.source = source;
  return fus;
}

/* Filet de sécurité : même titre (et même auteur, ou auteur absent d'un côté) = même livre. */
function normaliser(t){
  return String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g," ").replace(/^(le|la|les|l|un|une|des|the) /,"").trim();
}
function fusionnerDoublons(livres){
  const rangC = { haute:3, moyenne:2, faible:1 };
  const res = [];
  livres.forEach(lv=>{
    const t = normaliser(lv.titre), a = normaliser(lv.auteur);
    const d = res.find(x=>normaliser(x.titre) === t && (!a || !normaliser(x.auteur) || normaliser(x.auteur) === a));
    if (!d){ res.push(lv); return; }
    if (!d.auteur && lv.auteur) d.auteur = lv.auteur;
    if (!d.annee && lv.annee) d.annee = lv.annee;
    if (!d.remarque && lv.remarque) d.remarque = lv.remarque;
    if ((rangC[lv.certitude]||0) > (rangC[d.certitude]||0)) d.certitude = lv.certitude;
    if (lv.rang === "derriere") d.rang = "derriere";   // vu sur la photo du fond : il est derrière
  });
  return res;
}

function texteBilanAnalyse(livres){
  return texteBilanSimple(livres) + texteSource(livres.source);
}
/* Vrai si chaque photo présente du compartiment a été analysée après sa dernière modification.
   Données antérieures sans trace d'analyse : un compartiment à une seule photo et avec des livres est réputé analysé. */
/* Date de la dernière analyse de chaque rang. Les analyses anciennes (sans détail par rang) valent pour les deux rangs. */
function datesAnalyseRangs(cs){
  const a = cs && cs.analyse;
  if (!a) return {};
  return a.rangs ? Object.assign({}, a.rangs) : { devant:a.maj, derriere:a.maj };
}
/* État d'analyse d'un compartiment : null s'il n'a pas de livre, sinon
   { rangs: photos de devant/derrière toutes analysées, appoints: photos d'appoint toutes prises en compte } */
function etatAnalyse(cs){
  if (!cs || !(cs.livres||[]).length) return null;
  const appoints = cs.appoints || [];
  const presents = [["photo","devant"],["photo2","derriere"]].filter(([ch])=>cs[ch]);
  if (!presents.length && !appoints.length) return null;
  if (!cs.analyse) return { rangs: presents.length === 1, appoints: !appoints.length };
  const dates = datesAnalyseRangs(cs);
  const rangs = presents.every(([ch, r])=>(Date.parse(cs[ch].maj || "") || 0) <= (Date.parse(dates[r] || "") || 0));
  // une photo d'appoint compte comme prise en compte dès qu'une analyse ou un contrôle postérieur a eu lieu
  const tc = Math.max(Date.parse(cs.analyse.maj || "") || 0, Date.parse((cs.controle && cs.controle.maj) || "") || 0);
  return { rangs, appoints: appoints.every(a=>(Date.parse(a.maj || "") || 0) <= tc) };
}
/* Vrai si chaque photo présente du compartiment a été analysée après sa dernière modification. */
function photosToutesAnalysees(cs){
  const e = etatAnalyse(cs);
  return !!(e && e.rangs && e.appoints);
}

function infoAnalyse(livres, cs){
  const src = livres.source || {};
  const maintenant = new Date().toISOString();
  const portee = livres.portee || porteeParDefaut(cs);
  const rangs = datesAnalyseRangs(cs);
  (portee === "deux" ? ["devant","derriere"] : [portee]).forEach(r=>{ rangs[r] = maintenant; });
  return { maj:maintenant, rangs, ia: src.ia || "gemini", modele: src.modele || cfg.modele, photos: cs.photo && cs.photo2 ? 2 : 1, manuel: !!src.manuel };
}
function texteBilanSimple(livres){
  if (!livres.some(x=>x.rang)) return livres.length + " livre(s) identifié(s).";
  const der = livres.filter(x=>x.rang==="derriere").length;
  return `${livres.length} livre(s) identifié(s) : ${livres.length-der} devant, ${der} derrière` +
         (livres.fusionnes ? ` (${livres.fusionnes} doublon(s) fusionné(s))` : "") + ".";
}

async function traiterParLots(livres, question, champs, titreFenetre, taille){
  const lot = taille || 20;
  const pg = fenetreProgres(titreFenetre);
  let fait = 0;
  try{
    for (let d=0; d<livres.length; d+=lot){
      const tranche = livres.slice(d, d+lot);
      pg.maj(fait, livres.length, `Lot ${Math.floor(d/lot)+1} sur ${Math.ceil(livres.length/lot)} — envoi à Gemini…`);
      const liste = tranche.map((lv,i)=>`${i}. ${lv.titre}${lv.auteur?" — "+lv.auteur:""}${lv.annee?" ("+lv.annee+")":""}`).join("\n");
      const j = (await interrogerIA([{ text: question + "\n\nListe :\n" + liste }], jsonDepuisTexte)).res;
      (Array.isArray(j.livres)?j.livres:[]).forEach(rep=>{
        const i = Number(rep.i);
        if (!Number.isInteger(i) || i<0 || i>=tranche.length) return;
        champs.forEach(ch=>{
          const v = rep[ch];
          if (v != null && String(v).trim() && String(v).trim() !== "?") tranche[i][ch] = String(v).trim();
        });
      });
      fait += tranche.length;
      pg.maj(fait, livres.length, "");
      sauver();
    }
    pg.fermer();
    return true;
  }catch(e){
    pg.fermer();
    modale({titre:"Traitement interrompu",
      html:`<div>${fait} livre(s) sur ${livres.length} ont été traités avant l'erreur ; ils sont conservés.</div>
            <div class="aide">${esc(e.message)}</div>`, boutons:[{texte:"Fermer"}]});
    return false;
  }
}

/* ====================================================================
   MODÈLE DE DONNÉES
   ==================================================================== */
function biblio(id){ return data.bibliotheques.find(b=>b.id===id) || null; }

function tousLesLivres(bib){
  const out = [];
  for (let r=1; r<=bib.rangees; r++)
    for (let c=1; c<=bib.compartiments; c++){
      const cs = bib.cases[clef(r,c)];
      if (cs) (cs.livres||[]).forEach(lv=>out.push({ livre:lv, r, c }));
    }
  Object.keys(bib.cases||{}).forEach(k=>{
    const [r,c] = k.split("-").map(Number);
    if (r>bib.rangees || c>bib.compartiments)
      (bib.cases[k].livres||[]).forEach(lv=>out.push({ livre:lv, r, c, horsGrille:true }));
  });
  return out;
}
function compteLivres(bib){ return tousLesLivres(bib).length; }
function comptePhotos(bib){ return Object.keys(bib.cases||{}).reduce((n,k)=>n + champsPhotoCase(bib.cases[k]).length, 0); }

/* ====================================================================
   PROPORTIONS D'UN COMPARTIMENT (hauteur / largeur), propre à chaque bibliothèque
   ==================================================================== */
const RATIO_DEFAUT = 4/3;          // ancien affichage : compartiment plus haut que large (3:4)
const RATIO_MIN = 0.15, RATIO_MAX = 6;
function ratioBiblio(b){
  const r = Number(b && b.ratio);
  return (isFinite(r) && r >= RATIO_MIN && r <= RATIO_MAX) ? r : RATIO_DEFAUT;
}
const fmtRatio = r => r.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 });

function formProportions(b){
  let ratio = ratioBiblio(b);
  const f = modale({
    titre:"Proportions d'un compartiment — " + b.nom,
    html:
      `<div class="aide" style="margin-top:0">Déplacez le coin rouge en bas à droite jusqu'à ce que le rectangle ait la forme d'un compartiment réel. La grille de cette bibliothèque sera dessinée avec ces proportions, sur tous vos appareils.</div>
       <div id="pScene" class="scene"><div id="pRect" class="rectComp"><span id="pCote"></span></div><div id="pPoignee" class="poignee"></div></div>
       <div class="ligne2" style="align-items:flex-end">
         <div><label for="pRatio">Hauteur ÷ largeur</label><input type="number" id="pRatio" step="0.01" min="${RATIO_MIN}" max="${RATIO_MAX}"></div>
         <div><label for="pH">ou mesures réelles (cm)</label>
           <div class="ligne2"><input type="number" id="pH" placeholder="haut." min="1"><input type="number" id="pL" placeholder="larg." min="1"></div></div>
       </div>
       <div class="aide" id="pForme"></div>`,
    boutons:[
      {texte:"Annuler"},
      {texte:"Par défaut", garder:true, action:()=>{ ratio = RATIO_DEFAUT; dessiner(true); }},
      {texte:"Enregistrer", classe:"principal", action:()=>enregistrer()}
    ]
  });

  const scene = f.querySelector("#pScene"), rect = f.querySelector("#pRect"), poignee = f.querySelector("#pPoignee");
  const MARGE = 14;
  let w = 0, h = 0;

  const dims = ()=>{ const rc = scene.getBoundingClientRect(); return { W: rc.width - 2*MARGE, H: rc.height - 2*MARGE, rc }; };

  // place le rectangle pour un ratio donné, le plus grand possible dans la scène
  const ajuster = ()=>{
    const { W, H } = dims();
    w = Math.min(W * 0.85, (H * 0.85) / ratio);
    h = w * ratio;
  };

  const dessiner = (recalculer, depuisSaisie)=>{
    if (recalculer) ajuster();
    rect.style.width = w + "px"; rect.style.height = h + "px";
    poignee.style.left = (MARGE + w) + "px"; poignee.style.top = (MARGE + h) + "px";
    f.querySelector("#pCote").textContent = fmtRatio(ratio);
    if (!depuisSaisie) f.querySelector("#pRatio").value = ratio.toFixed(2);
    f.querySelector("#pForme").textContent =
      ratio > 1.05 ? `Compartiment plus haut que large (hauteur = ${fmtRatio(ratio)} × la largeur).`
      : ratio < 0.95 ? `Compartiment plus large que haut (largeur = ${fmtRatio(1/ratio)} × la hauteur).`
      : "Compartiment à peu près carré.";
  };

  let glisse = false;
  const commencer = e=>{
    const { rc } = dims();
    const x = e.clientX - rc.left, y = e.clientY - rc.top;
    if (Math.hypot(x - (MARGE + w), y - (MARGE + h)) > 44) return;   // seulement près du coin
    glisse = true;
    poignee.classList.add("active");
    try{ scene.setPointerCapture(e.pointerId); }catch(er){}
    e.preventDefault();
  };
  scene.addEventListener("pointerdown", commencer);
  scene.addEventListener("pointermove", e=>{
    if (!glisse) return;
    const { W, H, rc } = dims();
    w = Math.max(24, Math.min(W, e.clientX - rc.left - MARGE));
    h = Math.max(24, Math.min(H, e.clientY - rc.top - MARGE));
    ratio = Math.max(RATIO_MIN, Math.min(RATIO_MAX, h / w));
    dessiner(false);
    e.preventDefault();
  });
  const lacher = ()=>{ if (!glisse) return; glisse = false; poignee.classList.remove("active"); };
  scene.addEventListener("pointerup", lacher);
  scene.addEventListener("pointercancel", lacher);

  f.querySelector("#pRatio").oninput = ev=>{
    const v = parseFloat(String(ev.target.value).replace(",", "."));
    if (isFinite(v) && v >= RATIO_MIN && v <= RATIO_MAX){ ratio = v; dessiner(true, true); }
  };
  const depuisMesures = ()=>{
    const hh = parseFloat(f.querySelector("#pH").value), ll = parseFloat(f.querySelector("#pL").value);
    if (hh > 0 && ll > 0){ ratio = Math.max(RATIO_MIN, Math.min(RATIO_MAX, hh / ll)); dessiner(true); }
  };
  f.querySelector("#pH").oninput = depuisMesures;
  f.querySelector("#pL").oninput = depuisMesures;

  const enregistrer = async ()=>{
    b.ratio = Math.round(ratio * 1000) / 1000;
    sauver(); rendreBiblio();
    if (ghPret()){
      toast("Proportions enregistrées : envoi vers GitHub pour tous vos appareils…");
      await envoyerVersGitHub();
    } else {
      toast("Proportions enregistrées sur cet appareil. Ajoutez un jeton GitHub puis envoyez via ☁️ pour les partager avec vos autres appareils.", 6000);
    }
  };

  requestAnimationFrame(()=>dessiner(true));
}

/* ====================================================================
   COMPARTIMENT
   ==================================================================== */
function ouvrirCompartiment(b, k){
  b.cases[k] = b.cases[k] || { livres:[] };
  const cs = b.cases[k];
  const [r,c] = k.split("-");
  let face = "photo";            // "photo" = devant, "photo2" = derrière, "appoint:<id>" = photo d'appoint
  let enAjoutAppoint = false;    // la prochaine photo choisie crée un appoint au lieu de remplacer

  const f = modale({
    titre: `Rangée ${r} · compartiment ${c}`,
    html: `<div class="onglets" id="cFaces"></div>
           <div id="zonePhoto"></div>
           <div class="barre">
             <button class="btn" id="cPhoto" style="flex:1">📷 Ajouter une photo</button>
             <button class="btn principal" id="cAnalyser" style="flex:1">🔍 Analyser</button>
           </div>
           <div class="aide" style="margin:4px 0 0">Livres sur deux rangs : prenez aussi la photo de derrière (onglet « Derrière »). Chaque analyse porte sur un rang ou sur les deux ; celle d'un rang ne touche jamais les livres de l'autre.</div>
           <input type="file" id="cFichier" accept="image/*" hidden>
           <div class="titreSection">Livres de ce compartiment</div>
           <div id="zoneFiltreRang"></div>
           <div id="zoneLivres"></div>
           <button class="btn plein" id="cAjouter">➕ Ajouter un livre à la main</button>`,
    boutons:[{texte:"Fermer"}],
    surFermeture:()=>{ rafraichirCompartimentOuvert = null; rendreBiblio(); }
  });
  f.querySelector("[data-b='0']").addEventListener("click", ()=>{ rafraichirCompartimentOuvert = null; });

  /* ---------- lignes de coupe (haut / bas, en % de la hauteur) ---------- */
  const lireCoupe = ()=>{
    try{
      const j = JSON.parse(localStorage.getItem(CLE_COUPE) || "null");
      if (j && isFinite(j.haut) && isFinite(j.bas) && j.haut >= 0 && j.bas <= 100 && j.bas - j.haut >= 5) return { haut:+j.haut, bas:+j.bas, gauche:0, droite:100 };
    }catch(e){}
    return { haut:25, bas:75, gauche:0, droite:100 };   // lignes vertes : toujours sur les bords au départ
  };
  const ecrireCoupe = ()=>{ try{ localStorage.setItem(CLE_COUPE, JSON.stringify({ haut:coupe.haut, bas:coupe.bas })); }catch(e){} };
  let coupe = lireCoupe();
  let lignesVisibles = false;
  let avantTroncature = null;     // pour « Annuler la troncature » tant que la fenêtre est ouverte

  const placerLignes = ()=>{
    const cadre = f.querySelector("#cCadre");
    if (!cadre) return;
    cadre.querySelector(".ligneCoupe.h").style.top = coupe.haut + "%";
    cadre.querySelector(".ligneCoupe.b").style.top = coupe.bas + "%";
    cadre.querySelector(".voile.h").style.height = coupe.haut + "%";
    cadre.querySelector(".voile.b").style.height = (100 - coupe.bas) + "%";
    cadre.querySelector(".ligneV.g").style.left = coupe.gauche + "%";
    cadre.querySelector(".ligneV.d").style.left = coupe.droite + "%";
    const vg = cadre.querySelector(".voile.g"), vd = cadre.querySelector(".voile.d");
    [vg, vd].forEach(v=>{ v.style.top = coupe.haut + "%"; v.style.height = (coupe.bas - coupe.haut) + "%"; });
    vg.style.width = coupe.gauche + "%";
    vd.style.width = (100 - coupe.droite) + "%";
  };

  const brancherGlisser = (cadre)=>{
    let ligne = null;       // "haut" | "bas" | "gauche" | "droite"
    const CLASSE = { haut:".ligneCoupe.h", bas:".ligneCoupe.b", gauche:".ligneV.g", droite:".ligneV.d" };
    cadre.addEventListener("pointerdown", e=>{
      if (!lignesVisibles) return;                        // lignes masquées : rien ne se passe
      const rc = cadre.getBoundingClientRect();
      const x = e.clientX - rc.left, y = e.clientY - rc.top;
      const dist = {
        haut:   Math.abs(y - rc.height * coupe.haut / 100),
        bas:    Math.abs(y - rc.height * coupe.bas / 100),
        gauche: Math.abs(x - rc.width * coupe.gauche / 100),
        droite: Math.abs(x - rc.width * coupe.droite / 100)
      };
      const PROCHE = 32;                                  // px : « à proximité » de la ligne
      let choix = null;
      Object.keys(dist).forEach(n=>{ if (dist[n] <= PROCHE && (!choix || dist[n] < dist[choix])) choix = n; });
      if (!choix) return;
      // deux lignes superposées : on prend celle vers laquelle on tire
      if (choix === "haut" && coupe.haut === coupe.bas - 5 && y > rc.height * coupe.bas / 100) choix = "bas";
      if (choix === "gauche" && coupe.gauche === coupe.droite - 5 && x > rc.width * coupe.droite / 100) choix = "droite";
      ligne = choix;
      cadre.querySelector(CLASSE[ligne]).classList.add("active");
      try{ cadre.setPointerCapture(e.pointerId); }catch(er){}
      e.preventDefault();
    });
    cadre.addEventListener("pointermove", e=>{
      if (!ligne) return;
      const rc = cadre.getBoundingClientRect();
      const px = Math.max(0, Math.min(100, (e.clientX - rc.left) * 100 / rc.width));
      const py = Math.max(0, Math.min(100, (e.clientY - rc.top) * 100 / rc.height));
      const r1 = v => Math.round(v * 10) / 10;
      if      (ligne === "haut")   coupe.haut   = r1(Math.min(py, coupe.bas - 5));
      else if (ligne === "bas")    coupe.bas    = r1(Math.max(py, coupe.haut + 5));
      else if (ligne === "gauche") coupe.gauche = r1(Math.min(px, coupe.droite - 5));
      else                         coupe.droite = r1(Math.max(px, coupe.gauche + 5));
      placerLignes();
      e.preventDefault();
    });
    const lacher = ()=>{
      if (!ligne) return;
      ligne = null;
      cadre.querySelectorAll(".ligneCoupe,.ligneV").forEach(x=>x.classList.remove("active"));
      ecrireCoupe();                                      // position des lignes rouges mémorisée
    };
    cadre.addEventListener("pointerup", lacher);
    cadre.addEventListener("pointercancel", lacher);
  };

  const tronquer = async ()=>{
    if (!photoObj(cs, face) || !lignesVisibles) return;
    const btn = f.querySelector("#cTronquer");
    if (btn){ btn.disabled = true; btn.textContent = "Troncature…"; }
    try{
      const plein = await photoPleine(b, k, face);
      if (!plein) throw new Error("Aucune photo disponible.");
      const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error("Image illisible")); i.src = plein; });
      const sy = Math.round(img.height * coupe.haut / 100);
      const sh = Math.max(1, Math.round(img.height * (coupe.bas - coupe.haut) / 100));
      const sx = Math.round(img.width * coupe.gauche / 100);
      const sw = Math.max(1, Math.round(img.width * (coupe.droite - coupe.gauche) / 100));
      const cv = document.createElement("canvas");
      cv.width = sw; cv.height = sh;
      const cx = cv.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, sw, sh);
      cx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      const nouveau = cv.toDataURL("image/jpeg", cfg.qualite);
      avantTroncature = { plein };
      poserPhoto(cs, face, { plein: nouveau, chemin:cheminPhoto(b,k,face), envoye:false, maj:new Date().toISOString() });
      delete cachePhotos[cleCache(b,k,face)];
      lignesVisibles = false;                             // évite une seconde coupe par mégarde
      sauver(); majPhoto(); rendreBiblio();
      await envoyerSiPossible("Photo tronquée");
    }catch(e){
      toast("Troncature impossible : " + e.message, 6000);
      if (btn){ btn.disabled = false; btn.textContent = "✂️ Tronquer"; }
    }
  };

  const annulerTroncature = async ()=>{
    if (!avantTroncature) return;
    poserPhoto(cs, face, { plein: avantTroncature.plein, chemin:cheminPhoto(b,k,face), envoye:false, maj:new Date().toISOString() });
    delete cachePhotos[cleCache(b,k,face)];
    avantTroncature = null;
    sauver(); majPhoto(); rendreBiblio();
    await envoyerSiPossible("Photo d'origine rétablie");
  };

  const envoyerSiPossible = async (quoi)=>{
    if (!ghPret()){ toast(quoi + " sur cet appareil. Ouvrez ☁️ pour l'envoyer sur GitHub."); return; }
    toast(quoi + " : envoi vers GitHub…");
    try{ await televerserPhoto(b, k, face); toast(quoi + " et envoyée sur GitHub."); }
    catch(e){ toast(quoi + " sur cet appareil ; envoi GitHub impossible (" + e.message + ").", 6000); }
    if (f.isConnected) majPhoto();
  };

  const changerFace = (nouvelle)=>{
    if (face === nouvelle) return;
    face = nouvelle; lignesVisibles = false; avantTroncature = null;
    majPhoto();
  };

  const ajouterAppoint = ()=>{ enAjoutAppoint = true; f.querySelector("#cFichier").click(); };

  const majFaces = ()=>{
    const zf = f.querySelector("#cFaces");
    const app = cs.appoints || [];
    zf.innerHTML =
      `<button data-face="photo" class="${face==="photo"?"actif":""}">📚 Devant${cs.photo?"":" (vide)"}</button>
       <button data-face="photo2" class="${face==="photo2"?"actif":""}">${cs.photo2 ? "📚 Derrière" : "➕ Derrière"}</button>
       <select id="cAppoints" title="Photos d'appoint">
         <option value="">🖼 Appoints${app.length ? " ("+app.length+")" : " : aucun"}</option>
         ${app.map((a,i)=>`<option value="${PRE_APPOINT+esc(a.id)}" ${face===PRE_APPOINT+a.id?"selected":""}>Appoint ${i+1}${a.legende?" — "+esc(a.legende):""}</option>`).join("")}
         <option value="__nouveau">➕ Ajouter une photo d'appoint</option>
       </select>`;
    zf.querySelectorAll("[data-face]").forEach(bt=>bt.onclick = ()=>changerFace(bt.dataset.face));
    const sel = zf.querySelector("#cAppoints");
    sel.value = estAppoint(face) ? face : "";
    sel.onchange = ()=>{
      const v = sel.value;
      if (v === "__nouveau"){ sel.value = estAppoint(face) ? face : ""; ajouterAppoint(); return; }
      if (!v){ if (estAppoint(face)) changerFace("photo"); return; }
      changerFace(v);
    };
  };

  const majPhoto = ()=>{
    majFaces();
    const z = f.querySelector("#zonePhoto");
    const appoint = estAppoint(face);
    const num = appoint ? numeroAppoint(cs, face) : 0;
    f.querySelector("#cPhoto").textContent = photoObj(cs, face)
      ? (appoint ? "📷 Changer cette photo d'appoint" : face === "photo2" ? "📷 Changer la photo de derrière" : "📷 Changer la photo")
      : (face === "photo2" ? "📷 Photo du rang de derrière" : "📷 Ajouter une photo");
    const bAn = f.querySelector("#cAnalyser");
    bAn.textContent = appoint ? "🔎 Contrôler la liste" : "🔍 Analyser";
    bAn.title = appoint ? "Compare la liste déjà relevée aux photos d'appoint et propose des corrections" : "";
    if (!photoObj(cs, face)){
      z.innerHTML = face === "photo2"
        ? `<div class="vide">Pour un compartiment rangé sur deux rangs : retirez les livres de devant, puis photographiez le rang de derrière.<br><br>« Analyser » enverra alors les deux photos ensemble à l'IA, qui dressera une seule liste : les livres du fond déjà visibles sur la première photo ne seront pas comptés deux fois.</div>`
        : `<div class="vide">Aucune photo. Photographiez le compartiment de face, bien éclairé, tranches lisibles.</div>`;
      return;
    }
    const src = photoImmediate(b, k, face);
    const statut = `<div class="aide">${appoint ? "<b>Appoint "+num+"</b> · " : face==="photo2" ? "<b>Rang de derrière</b> · " : (cs.photo2 ? "<b>Rang de devant</b> · " : "")}${photoObj(cs, face).envoye ? "Photo sauvegardée sur GitHub ("+esc(photoObj(cs, face).chemin)+")" : "Photo encore sur cet appareil seulement — ouvrez ☁️ pour l'envoyer"}
       · ${esc(dateFr(photoObj(cs, face).maj))}
       <button class="btn rouge" id="cRetirer" style="margin-left:8px;padding:4px 9px;font-size:12px">Retirer</button></div>`;

    if (!src){
      // pas encore en mémoire : chargement de la vraie photo, jamais de version dégradée
      z.innerHTML = `<div class="chargePhoto">⏳ Chargement de la photo en pleine résolution…</div>` + statut;
      brancherRetirer(z);
      const photoAvant = photoObj(cs, face);
      photoPleine(b, k, face).then(d=>{
        if (!f.isConnected || photoObj(cs, face) !== photoAvant) return;
        if (d) majPhoto();
        else {
          const c = z.querySelector(".chargePhoto");
          if (c) c.innerHTML = "⚠️ Photo introuvable sur GitHub. Vérifiez le dépôt ou reprenez la photo.";
        }
      });
      return;
    }

    z.innerHTML =
      `<div class="cadrePhoto${lignesVisibles ? " coupe" : ""}" id="cCadre">
         <img class="photo-apercu" src="${src}" alt="Compartiment ${k}">
         ${lignesVisibles ? `<div class="voile h"></div><div class="voile b"></div><div class="voile g"></div><div class="voile d"></div>
           <div class="ligneCoupe h"></div><div class="ligneCoupe b"></div><div class="ligneV g"></div><div class="ligneV d"></div>` : ""}
       </div>
       <div class="aide">Définition : <span class="dims" id="cDims">…</span>${lignesVisibles ? "" : " — touchez la photo pour la voir en taille réelle"}</div>
       <div class="barre" style="margin:8px 0 2px">
         <button class="btn" id="cTailleReelle" style="flex:1">🔍 Taille réelle</button>
         <button class="btn ${lignesVisibles ? "coupeOn" : ""}" id="cLignes" style="flex:1">${lignesVisibles ? "✂️ Masquer les lignes" : "✂️ Lignes de coupe"}</button>
         ${lignesVisibles ? `<button class="btn rouge" id="cTronquer" style="flex:1">✂️ Tronquer</button>` : ""}
         ${avantTroncature ? `<button class="btn" id="cAnnulerCoupe" style="flex:1">↶ Annuler la troncature</button>` : ""}
       </div>
       ${lignesVisibles ? `<div class="aide" style="margin-top:2px">Posez le doigt près d'une ligne pour la déplacer : rouges pour le haut et le bas, vertes (sur les bords au départ) pour la gauche et la droite. Seul le rectangle entre les quatre lignes sera conservé.</div>` : ""}
       ${appoint ? `<label for="cLegende">Légende de cette photo d'appoint</label>
         <input type="text" id="cLegende" value="${esc(photoObj(cs, face).legende||"")}" placeholder="zoom sur l'étagère du bas, tranche illisible…">
         <div class="aide">Cette légende est transmise à l'IA lors du contrôle : elle l'aide à savoir ce que vous vouliez montrer.</div>` : ""}
       ${statut}`;

    const cadre = z.querySelector("#cCadre");
    const img = cadre.querySelector("img");
    const dims = ()=>{ const d = z.querySelector("#cDims"); if (d) d.textContent = infoImage(img, src); };
    if (img.complete) dims(); else img.onload = dims;

    if (lignesVisibles){ placerLignes(); brancherGlisser(cadre); }
    img.addEventListener("contextmenu", e=>{ if (lignesVisibles) e.preventDefault(); });
    const titrePhoto = `Compartiment ${lib(k)}${appoint ? " (appoint "+num+")" : face==="photo2" ? " (derrière)" : ""} — taille réelle`;
    img.addEventListener("click", ()=>{ if (!lignesVisibles) visionneuse(src, titrePhoto); });

    z.querySelector("#cTailleReelle").onclick = ()=>visionneuse(src, titrePhoto);
    z.querySelector("#cLignes").onclick = ()=>{ lignesVisibles = !lignesVisibles; if (lignesVisibles) coupe = lireCoupe(); majPhoto(); };
    const bt = z.querySelector("#cTronquer");      if (bt) bt.onclick = tronquer;
    const ba = z.querySelector("#cAnnulerCoupe");  if (ba) ba.onclick = annulerTroncature;
    const bl = z.querySelector("#cLegende");
    if (bl) bl.onchange = ()=>{
      const ph = photoObj(cs, face);
      if (!ph) return;
      ph.legende = bl.value.trim();
      sauver(); majFaces();
    };
    brancherRetirer(z);
  };

  const brancherRetirer = (z)=>{
    const btn = z.querySelector("#cRetirer");
    if (!btn) return;
    btn.onclick = async ()=>{
      if (estAppoint(face)){
        const ok = await confirmer("Retirer cette photo d'appoint ? Les livres relevés sont conservés.", "Retirer la photo d'appoint", "Retirer");
        if (!ok) return;
        delete cachePhotos[cleCache(b,k,face)];
        poserPhoto(cs, face, null);
        face = "photo"; avantTroncature = null; lignesVisibles = false;
        sauver(); majPhoto(); rendreBiblio();
        toast("Photo d'appoint retirée.");
        return;
      }
      const choix = await choisirRetraitPhoto(cs, face);
      if (!choix) return;
      if (choix.ids && choix.ids.size){
        cs.livres = (cs.livres||[]).filter(lv => !choix.ids.has(lv));
        if (!cs.livres.length) delete cs.analyse;
      }
      poserPhoto(cs, face, null); avantTroncature = null; lignesVisibles = false;
      delete cachePhotos[cleCache(b,k,face)];
      sauver(); majPhoto(); majLivres(); rendreBiblio();
      toast(choix.ids && choix.ids.size
        ? `Photo retirée, ainsi que ${choix.ids.size} livre(s).`
        : "Photo retirée ; les livres sont conservés.");
    };
  };

  let filtreRang = "tous";          // "tous" | "devant" (rangée 1) | "derriere" (rangée 2)
  const majLivres = ()=>{
    const z = f.querySelector("#zoneLivres");
    const zf = f.querySelector("#zoneFiltreRang");
    const l = cs.livres || [];
    const n1 = l.filter(lv=>lv.rang !== "derriere").length, n2 = l.length - n1;
    if (!l.length){ zf.innerHTML = ""; z.innerHTML = `<div class="vide">Aucun livre relevé ici.</div>`; return; }
    zf.innerHTML =
      `<div class="aide" style="margin:-4px 0 8px">${l.length} livre(s) : <b>${n1}</b> sur la rangée 1 (devant) · <b>${n2}</b> sur la rangée 2 (derrière)</div>
       <div class="onglets" style="margin-bottom:10px">
         <button data-filtre="tous" class="${filtreRang==="tous"?"actif":""}">Tous (${l.length})</button>
         <button data-filtre="devant" class="${filtreRang==="devant"?"actif":""}">Rangée 1 (${n1})</button>
         <button data-filtre="derriere" class="${filtreRang==="derriere"?"actif":""}">Rangée 2 (${n2})</button>
       </div>`;
    zf.querySelectorAll("[data-filtre]").forEach(bt=>bt.onclick=()=>{ filtreRang = bt.dataset.filtre; majLivres(); });
    const visibles = l.map((lv,i)=>({lv,i})).filter(({lv})=>
      filtreRang === "tous" || (filtreRang === "derriere" ? lv.rang === "derriere" : lv.rang !== "derriere"));
    if (!visibles.length){ z.innerHTML = `<div class="vide">Aucun livre sur la ${filtreRang === "derriere" ? "rangée 2 (derrière)" : "rangée 1 (devant)"}.</div>`; return; }
    z.innerHTML = visibles.map(({lv,i})=>
      `<div class="livre ${lv.certitude==="faible"?"certitude-faible":(lv.certitude==="moyenne"?"certitude-moyenne":"")}">
         <div class="t">${esc(lv.titre)}</div>
         <div class="a">${lv.rang ? `<span class="rang ${lv.rang}">${lv.rang==="derriere"?"derrière":"devant"}</span> ` : ""}${esc(lv.auteur||"auteur inconnu")}${lv.annee?" · "+esc(lv.annee):""}${lv.remarque?" · "+esc(lv.remarque):""}</div>
         ${lv.resume?`<div class="r">${esc(lv.resume)}</div>`:""}
         ${lv.categorie?`<div class="cat">${esc(lv.categorie)}</div>`:""}
         <div class="actions">
           <button class="btn" data-modif="${i}">Modifier</button>
           <button class="btn rouge" data-suppr="${i}">Supprimer</button>
         </div></div>`).join("");
    z.querySelectorAll("[data-modif]").forEach(el=>el.onclick=()=>formLivre(cs, Number(el.dataset.modif), majLivres));
    z.querySelectorAll("[data-suppr]").forEach(el=>el.onclick=async()=>{
      const i = Number(el.dataset.suppr);
      const ok = await confirmer(`Supprimer « ${esc(cs.livres[i].titre)} » ?`, "Supprimer le livre", "Supprimer");
      if (!ok) return;
      cs.livres.splice(i,1); sauver(); majLivres(); rendreBiblio();
    });
  };

  f.querySelector("#cPhoto").onclick = ()=>{ enAjoutAppoint = false; f.querySelector("#cFichier").click(); };
  f.querySelector("#cFichier").onchange = async (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    const nouveau = enAjoutAppoint;
    enAjoutAppoint = false;
    if (!file) return;
    try{
      toast("Compression de la photo…");
      const brut = await lireFichier(file);
      const plein = await redimensionner(brut, cfg.tailleMax, cfg.qualite);
      const cible = nouveau ? PRE_APPOINT + uid() : face;
      poserPhoto(cs, cible, { plein, chemin:cheminPhoto(b,k,cible), envoye:false, maj:new Date().toISOString() });
      delete cachePhotos[cleCache(b,k,cible)];
      avantTroncature = null;
      face = cible; lignesVisibles = false;
      sauver(); majPhoto(); rendreBiblio();
      toast((estAppoint(cible) ? "Photo d'appoint " + numeroAppoint(cs, cible) + " enregistrée"
             : face === "photo2" ? "Photo de derrière enregistrée" : "Photo enregistrée")
            + " sur cet appareil. Ouvrez ☁️ quand vous voudrez la sauvegarder.");
    }catch(e){ toast("Photo illisible : " + e.message, 5000); }
    ev.target.value = "";
  };

  f.querySelector("#cAnalyser").onclick = async ()=>{
    const btnA = f.querySelector("#cAnalyser");
    if (estAppoint(face)){
      btnA.disabled = true; btnA.textContent = "Contrôle…";
      try{
        const r = await controlerAvecAppoints(b, k, { manuel:true });
        btnA.disabled = false; btnA.textContent = "🔎 Contrôler la liste";
        validerPropositions(b, k, r.propositions, r.source);
      }catch(e){
        btnA.disabled = false; btnA.textContent = "🔎 Contrôler la liste";
        if (e.manuel){ lancerClaudeManuel(b, k, e.parties, e.echecs, e.ia, "controle"); return; }
        montrerErreurAnalyse(e);
      }
      return;
    }
    if (!cs.photo && !cs.photo2){ toast("Ajoutez d'abord une photo."); return; }
    const portee = (cs.photo && cs.photo2) ? await choisirPortee(b, k) : porteeParDefaut(cs);
    if (!portee) return;
    const btn = f.querySelector("#cAnalyser");
    btn.disabled = true; btn.textContent = "Analyse…";
    try{
      const livres = await analyserPhoto(b, k, { manuel:true, portee });
      btn.disabled = false; btn.textContent = "🔍 Analyser";
      appliquerLivresCompartiment(b, k, livres);
    }catch(e){
      btn.disabled = false; btn.textContent = "🔍 Analyser";
      if (e.manuel){ lancerClaudeManuel(b, k, e.parties, e.echecs, e.ia, undefined, e.portee || portee); return; }
      montrerErreurAnalyse(e);
    }
  };

  f.querySelector("#cAjouter").onclick = ()=>formLivre(cs, -1, majLivres);
  rafraichirCompartimentOuvert = (bid, kk)=>{ if (f.isConnected && bid === b.id && kk === k){ majLivres(); majFaces(); } };

  majPhoto(); majLivres();
}

/* Retrait d'une photo : propose de supprimer aussi les livres identifiés à partir d'elle.
   Photo 1 (devant) -> livres non marqués « derrière » ; photo 2 -> livres « derrière » ;
   compartiment à une seule photo -> tous ses livres. Les ajouts à la main ne sont pas cochés d'office.
   Renvoie null (annulé) ou { ids:Set de livres à supprimer }. */
function choisirRetraitPhoto(cs, face){
  const livres = cs.livres || [];
  const autre = face === "photo2" ? cs.photo : cs.photo2;
  const lies = livres.filter(lv => {
    if (!autre) return true;
    return face === "photo2" ? lv.rang === "derriere" : lv.rang !== "derriere";
  });
  const intro = face === "photo2"
    ? "Retirer la photo du rang de derrière ? La prochaine analyse ne portera plus que sur la photo de devant."
    : "Retirer la photo de ce compartiment ?";
  return new Promise(res=>{
    if (!lies.length){
      confirmer(`${intro} Les livres déjà relevés sont conservés.`, "Retirer la photo", "Retirer").then(ok => res(ok ? { ids:new Set() } : null));
      return;
    }
    let fini = false;
    const finir = v => { if (!fini){ fini = true; res(v); } };
    const lignes = lies.map((lv,i)=>{
      const main = lv.origine === "main";
      return `<div class="coche" style="align-items:flex-start;margin:6px 0">
        <input type="checkbox" data-rl="${i}" ${main ? "" : "checked"} style="margin-top:3px">
        <label style="margin:0;font-weight:normal">${esc(lv.titre)}<span class="aide" style="display:block;margin:0">${esc(lv.auteur||"auteur inconnu")}${lv.rang ? " · " + (lv.rang==="derriere"?"derrière":"devant") : ""}${main ? " · ajouté à la main" : ""}</span></label></div>`;
    }).join("");
    const f = modale({
      titre: "Retirer la photo",
      html: `<div style="font-size:15px">${intro}</div>
        <div style="margin-top:12px;font-weight:600">Supprimer aussi les livres identifiés à partir de cette photo ?</div>
        <div class="aide" style="margin-top:2px">${lies.length} livre(s) concerné(s). Décochez ceux à conserver.</div>
        <div class="barre" style="margin:8px 0 4px">
          <button class="btn" id="rlTous" style="flex:1">Tout cocher</button>
          <button class="btn" id="rlAucun" style="flex:1">Tout décocher</button>
        </div>
        <div style="max-height:40vh;overflow:auto;border:1px solid var(--trait);border-radius:10px;padding:4px 10px">${lignes}</div>`,
      boutons: [
        { texte:"Annuler", action:()=>finir(null) },
        { texte:"Photo seule", action:()=>finir({ ids:new Set() }) },
        { texte:"Photo + livres cochés", classe:"rouge", action:(fd)=>{
            const ids = new Set();
            fd.querySelectorAll("[data-rl]").forEach(c => { if (c.checked) ids.add(lies[Number(c.dataset.rl)]); });
            finir({ ids });
        }}
      ],
      surFermeture: ()=>finir(null),
      apres: (fd)=>{
        const bouton = [...fd.querySelectorAll(".pied .btn")].pop();
        const maj = ()=>{
          const n = [...fd.querySelectorAll("[data-rl]")].filter(c=>c.checked).length;
          bouton.textContent = n ? `Photo + ${n} livre(s)` : "Photo + livres cochés";
          bouton.disabled = !n;
        };
        fd.querySelectorAll("[data-rl]").forEach((c)=>{
          c.onchange = maj;
          const l = c.nextElementSibling; if (l) l.onclick = ()=>{ c.checked = !c.checked; maj(); };
        });
        fd.querySelector("#rlTous").onclick = ()=>{ fd.querySelectorAll("[data-rl]").forEach(c=>c.checked=true); maj(); };
        fd.querySelector("#rlAucun").onclick = ()=>{ fd.querySelectorAll("[data-rl]").forEach(c=>c.checked=false); maj(); };
        maj();
      }
    });
  });
}

    html:
      `<label for="lT">Titre</label><input type="text" id="lT" value="${esc(lv.titre)}">

         <div><label for="lC">Catégorie</label><input type="text" id="lC" value="${esc(lv.categorie)}"></div>
       </div>
       <label for="lR">Résumé en une ligne</label><textarea id="lR">${esc(lv.resume)}</textarea>
       <label for="lM">Remarque</label><input type="text" id="lM" value="${esc(lv.remarque)}">
       ${(cs.photo2 || lv.rang) ? `<label for="lG">Rang dans le compartiment</label>

         <option value="derriere" ${lv.rang==="derriere"?"selected":""}>Derrière</option></select>` : ""}`,
    boutons:[
      {texte:"Annuler"},

        lv.titre=t;

        lv.categorie=f.querySelector("#lC").value.trim();

        sauver(); f.remove(); if (apres) apres(); rendreBiblio();
      }}
    ]
  });
}

/* ====================================================================
   ANALYSE DE TOUTES LES PHOTOS
   ==================================================================== */
async function analyserToutesPhotos(b){
  const cibles = Object.keys(b.cases||{}).filter(k=>b.cases[k].photo || b.cases[k].photo2);
  if (!cibles.length){ toast("Aucune photo à analyser dans cette bibliothèque."); return; }
  const vierges = cibles.filter(k=>!(b.cases[k].livres||[]).length);
  const choix = await new Promise(res=>{
    modale({ titre:"Analyser les photos",
      html:`<div>${cibles.length} photo(s) dans cette bibliothèque, dont ${vierges.length} sans livre relevé.</div>
            <div class="aide">Chaque photo part chez Gemini une par une ; les compartiments déjà remplis seront écrasés si vous choisissez « toutes ».</div>`,
      boutons:[
        {texte:"Annuler", action:()=>res(null)},
        {texte:`Les ${vierges.length} vierges`, action:()=>res(vierges)},
        {texte:`Les ${cibles.length} photos`, classe:"principal", action:()=>res(cibles)}
      ], surFermeture:()=>res(null)});
  });
  if (!choix || !choix.length) return;
  await analyserListe(b, choix, "Analyse des photos");
}

async function analyserListe(b, choix, titre){
  const pg = fenetreProgres(titre || "Analyse des photos");
  let fait=0, trouves=0; const erreurs=[]; let erreurBloquante=null; const parIA = { gemini:0, claude:0 };
  for (const k of choix){
    pg.maj(fait, choix.length, "Compartiment " + k + (b.cases[k].photo && b.cases[k].photo2 ? " — deux rangs, 2 photos" : ""));
    try{
      const livres = await analyserPhoto(b, k);
      b.cases[k].livres = livres;
      b.cases[k].analyse = infoAnalyse(livres, b.cases[k]);
      if (livres.source) parIA[livres.source.ia]++;
      trouves += livres.length;
      sauver();
    }catch(e){
      // Modèle retiré / quota / refus : inutile de continuer, toutes les photos échoueraient.
      if (e.modele){ erreurBloquante = e; break; }
      erreurs.push(k + " : " + e.message);
    }
    fait++;
    pg.maj(fait, choix.length, "");
  }
  pg.fermer();
  if (erreurBloquante){
    rendreBiblio();
    toast(`Analyse arrêtée après ${fait} photo(s) sur ${choix.length}.`, 5000);
    montrerErreurAnalyse(erreurBloquante);
    return;
  }
  rendreBiblio();
  modale({ titre:"Analyse terminée",
    html:`<div>${fait} photo(s) traitée(s), ${trouves} livre(s) relevé(s).</div>
          ${parIA.gemini && parIA.claude ? `<div class="aide">Réponses : ${parIA.gemini} par Gemini, ${parIA.claude} par Claude (en secours).</div>`
            : parIA.claude ? `<div class="aide">Toutes les réponses viennent de Claude.</div>` : ""}
          ${erreurs.length?`<div class="aide">${erreurs.length} échec(s) :<br>${esc(erreurs.join(" | "))}</div>`:""}
          ${erreurs.length && (modeManuel("claude") || modeManuel("gemini")) ? `<div class="aide">Une IA sans clé (copier-coller) ne peut pas traiter une série : ouvrez chaque compartiment en échec et touchez 🔍 Analyser.</div>` : ""}`,
    boutons:[{texte:"Fermer"}]});
}

/* ====================================================================
   SÉRIE DE PHOTOS : APPUI LONG + TOUCHER → PLUSIEURS COMPARTIMENTS
   ==================================================================== */
const DUREE_APPUI_LONG = 600;   // ms
let selDepart = null;           // { bibId, cle } : compartiment tenu longtemps
let serie = null;               // { bibId, liste:[clés], inverse, encours, actif }
let appuiLongActif = false;
let ignorerClicJusqua = 0;

const lib = k => String(k).replace("-", "·");

function brancherCase(el, b){
  const k = el.dataset.case;
  let minuteur = null, x0 = 0, y0 = 0;
  const stop = ()=>{ clearTimeout(minuteur); minuteur = null; };
  el.addEventListener("pointerdown", e=>{
    if (e.pointerType === "mouse" && e.button !== 0) return;
    x0 = e.clientX; y0 = e.clientY; stop();
    minuteur = setTimeout(()=>{ minuteur = null; appuiLongActif = true; appuiLong(b, k, el); }, DUREE_APPUI_LONG);
  });
  el.addEventListener("pointermove", e=>{
    if (minuteur && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) stop();
  });
  ["pointerup","pointercancel","pointerleave"].forEach(t=>el.addEventListener(t, stop));
  el.addEventListener("contextmenu", e=>e.preventDefault());
  el.addEventListener("click", e=>{
    e.stopPropagation();
    if (Date.now() < ignorerClicJusqua) return;          // relâchement de l'appui long
    if (selDepart && selDepart.bibId === b.id){ toucherArrivee(b, k); return; }
    if (serie && serie.actif && serie.liste.includes(k)){ toast("Ce compartiment est en cours de remplissage."); return; }
    ouvrirCompartiment(b, k);
  });
}

function appuiLong(b, k){
  if (serie){ toast(serie.actif ? "Un remplissage est déjà en cours : attendez qu'il se termine." : "Une sélection est déjà en cours."); return; }
  try{ if (navigator.vibrate) navigator.vibrate(35); }catch(e){}
  selDepart = { bibId:b.id, cle:k };
  majBarreSel(); majMarquesGrille();
}

function majMarquesGrille(){
  const b = biblio(biblioCourante);
  document.querySelectorAll("#vueBiblio [data-case]").forEach(el=>{
    const k = el.dataset.case;
    el.classList.toggle("depart", !!(b && selDepart && selDepart.bibId === b.id && selDepart.cle === k));
    const pos = (b && serie && serie.bibId === b.id) ? serie.liste.indexOf(k) : -1;
    el.classList.toggle("plage", pos >= 0);
    el.classList.toggle("encours", !!(b && serie && serie.bibId === b.id && serie.encours === k));
    let o = el.querySelector(".ordre");
    if (pos >= 0){
      if (!o){ o = document.createElement("span"); o.className = "ordre"; el.appendChild(o); }
      o.textContent = pos + 1;
    } else if (o) o.remove();
  });
}

function majBarreSel(){
  const z = $("#barreSel");
  if (selDepart){
    z.innerHTML = `<span>Départ : <b>${lib(selDepart.cle)}</b> — touchez le compartiment d'arrivée</span>
                   <button class="btn" id="bsAnnuler">Annuler</button>`;
  } else if (serie && !serie.actif){
    z.innerHTML = `<span>Sélection : <b>${serie.liste.length}</b> compartiment(s)</span>
                   <button class="btn" id="bsAnnuler">Annuler</button>`;
  } else { z.hidden = true; z.innerHTML = ""; return; }
  z.hidden = false;
  z.querySelector("#bsAnnuler").onclick = ()=>annulerSelection("Sélection annulée.");
}

function annulerSelection(msg){
  const avait = !!(selDepart || (serie && !serie.actif));
  selDepart = null;
  if (serie && !serie.actif) serie = null;
  majBarreSel(); majMarquesGrille();
  if (msg && avait) toast(msg);
}

/* ordre rangée par rangée, de gauche à droite ; à rebours si l'arrivée précède le départ */
function plageCases(b, k1, k2){
  const idx = k=>{ const [r,c] = k.split("-").map(Number); return (r-1)*b.compartiments + (c-1); };
  const i1 = idx(k1), i2 = idx(k2), pas = i2 >= i1 ? 1 : -1;
  const liste = [];
  for (let i = i1; ; i += pas){
    liste.push(clef(Math.floor(i / b.compartiments) + 1, (i % b.compartiments) + 1));
    if (i === i2) break;
  }
  return { liste, inverse: pas < 0 };
}

function texteOrdre(liste){
  if (liste.length <= 8) return liste.map(lib).join(" → ");
  return liste.slice(0,3).map(lib).join(" → ") + " → … → " + liste.slice(-2).map(lib).join(" → ");
}

function blocOrdre(){
  return `<div class="aide" style="font-size:13px">Ordre de remplissage : ${esc(texteOrdre(serie.liste))}</div>` +
    (serie.inverse ? `<div class="alerte">⚠️ Sens inversé : le compartiment d'arrivée est avant celui de départ. Les compartiments seront remplis en remontant, de ${lib(serie.liste[0])} vers ${lib(serie.liste[serie.liste.length-1])}.</div>` : "");
}

async function toucherArrivee(b, k){
  const depart = selDepart.cle;
  if (k === depart){ annulerSelection("Sélection annulée."); return; }
  const { liste, inverse } = plageCases(b, depart, k);
  selDepart = null;
  serie = { bibId:b.id, liste, inverse, encours:null, actif:false };
  majBarreSel(); majMarquesGrille();
  if (inverse) toast("⚠️ Sens inversé : les compartiments seront remplis en remontant.", 4500);

  // compartiments qui ont déjà une photo
  const occupes = liste.filter(x=>b.cases[x] && b.cases[x].photo);
  if (occupes.length){
    const choix = await new Promise(res=>{
      modale({ titre:"Compartiments déjà photographiés",
        html:`<div>${liste.length} compartiment(s) sélectionné(s), dont <b>${occupes.length}</b> qui ont déjà une photo :
              ${esc(occupes.map(lib).join(", "))}.</div>` + blocOrdre() +
             `<div class="aide">« Remplacer » : leurs photos seront changées (les livres relevés sont conservés).<br>
              « Les sauter » : ils gardent leur photo et sont retirés de la sélection.</div>`,
        boutons:[
          {texte:"Ne rien faire", action:()=>res(null)},
          {texte:"Les sauter", action:()=>res("sauter")},
          {texte:"Remplacer", classe:"principal", action:()=>res("remplacer")}
        ], surFermeture:()=>res(null) });
    });
    if (!choix){ annulerSelection(); return; }
    if (choix === "sauter"){
      serie.liste = liste.filter(x=>!occupes.includes(x));
      majBarreSel(); majMarquesGrille();
      if (!serie.liste.length){ annulerSelection(); toast("Tous les compartiments sélectionnés ont déjà une photo : rien à faire."); return; }
    }
  }

  const n = serie.liste.length;
  modale({ titre:`Photos pour ${n} compartiment(s)`,
    html: blocOrdre() +
      (ghPret() ? `<div class="aide">Chaque photo est envoyée sur GitHub dès qu'elle est placée ; la grille se remplit au fur et à mesure.</div>`
                : `<div class="alerte">Pas de jeton GitHub : les photos resteront sur cet appareil (envoi possible plus tard via ☁️). La mémoire de l'appareil est limitée à quelques dizaines de photos.</div>`) +
      `<div class="aide">📁 Photos existantes : choisissez exactement ${n} photo(s), dans l'ordre des compartiments.<br>
       📷 Appareil photo : une photo par compartiment, avec possibilité de la reprendre.</div>`,
    boutons:[
      {texte:"Annuler", action:()=>annulerSelection()},
      {texte:"📁 Photos existantes", action:()=>ouvrirSelecteurPhotos(b)},
      {texte:"📷 Appareil photo", classe:"principal", action:()=>serieAppareil(b)}
    ],
    surFermeture:()=>annulerSelection() });
}

/* ---------- photos existantes ---------- */
function ouvrirSelecteurPhotos(b){
  const inp = $("#entreeMulti");
  inp.value = "";
  inp.onchange = ()=>{
    const files = Array.from(inp.files || []);
    inp.value = "";
    recevoirPhotosExistantes(b, files);
  };
  inp.oncancel = ()=>annulerSelection("Aucune photo choisie : sélection annulée.");
  inp.click();          // appelé directement dans le geste de l'utilisateur (exigence iOS)
}

function recevoirPhotosExistantes(b, files){
  if (!serie) return;
  const n = serie.liste.length;
  if (!files.length){ annulerSelection("Aucune photo choisie : sélection annulée."); return; }
  if (files.length !== n){
    modale({ titre:"Nombre de photos différent",
      html:`<div>Vous avez choisi <b>${files.length}</b> photo(s) pour <b>${n}</b> compartiment(s) : <b>rien n'a été fait</b>.</div>
            <div class="aide">Chaque photo doit aller dans un compartiment, dans l'ordre où vous l'avez sélectionnée : il faut donc exactement ${n} photo(s).
            ${files.length > n ? `Il y en a ${files.length - n} de trop.` : `Il en manque ${n - files.length}.`}</div>`,
      boutons:[
        {texte:"Annuler", action:()=>annulerSelection()},
        {texte:"Choisir à nouveau", classe:"principal", action:()=>ouvrirSelecteurPhotos(b)}
      ],
      surFermeture:()=>annulerSelection() });
    return;
  }
  const urls = files.map(f=>URL.createObjectURL(f));
  const liberer = ()=>setTimeout(()=>urls.forEach(u=>URL.revokeObjectURL(u)), 1000);
  modale({ titre:"Vérifiez l'ordre",
    html:`<div class="aide" style="margin-top:0">Chaque photo ira dans le compartiment indiqué dessous. Si l'ordre ne convient pas, choisissez à nouveau en touchant les photos dans le bon ordre.</div>
          ${serie.inverse ? `<div class="alerte">⚠️ Sens inversé : remplissage en remontant.</div>` : ""}
          <div class="recap">${urls.map((u,i)=>`<div class="duo"><img src="${u}" alt=""><span>→ ${lib(serie.liste[i])}</span></div>`).join("")}</div>`,
    boutons:[
      {texte:"Annuler", action:()=>{ liberer(); annulerSelection(); }},
      {texte:"Choisir à nouveau", action:()=>{ liberer(); ouvrirSelecteurPhotos(b); }},
      {texte:"Valider", classe:"principal", action:()=>{ liberer(); remplirDepuisFichiers(b, files); }}
    ],
    surFermeture:()=>{ liberer(); annulerSelection(); } });
}

async function remplirDepuisFichiers(b, files){
  const liste = serie.liste.slice();
  serie.actif = true; majBarreSel();
  const total = liste.length;
  let fait = 0, envoyees = 0, locales = 0;
  const affectees = [], erreurs = [];
  for (let i = 0; i < total; i++){
    const k = liste[i];
    serie.encours = k; majMarquesGrille();
    majSuivi(fait, total, `${lib(k)} : préparation de la photo…`);
    try{
      await affecterPhoto(b, k, files[i]);
      affectees.push(k);
      if (ghPret()){
        majSuivi(fait, total, `${lib(k)} : envoi vers GitHub…`);
        try{ await televerserPhoto(b, k); envoyees++; }
        catch(e){ locales++; erreurs.push(lib(k) + " (envoi) : " + e.message); }
      } else locales++;
    }catch(e){ erreurs.push(lib(k) + " : " + e.message); }
    fait++;
    majSuivi(fait, total, "");
  }
  masquerSuivi();
  bilanSerie(b, affectees, envoyees, locales, erreurs, false);
}

/* ---------- outils communs ---------- */
async function affecterPhoto(b, k, file){
  const brut  = await lireFichier(file);
  const plein = await redimensionner(brut, cfg.tailleMax, cfg.qualite);
  b.cases[k] = b.cases[k] || { livres:[] };
  b.cases[k].photo = { plein, chemin:cheminPhoto(b, k, "photo"), envoye:false, maj:new Date().toISOString() };
  delete cachePhotos[cleCache(b, k, "photo")];
  sauver(); rendreBiblio();
}

async function televerserPhoto(b, k, champ){
  champ = champ || "photo";
  const cs = b.cases[k];
  const ph = photoObj(cs, champ);
  if (!ph || !ph.plein) return;
  const plein = ph.plein;
  const chemin = cheminPhoto(b, k, champ);
  const quoi = estAppoint(champ) ? " appoint " + numeroAppoint(cs, champ) : (champ === "photo2" ? " derrière" : "");
  await ghEcrire(chemin, base64Seul(plein), "Photo " + b.nom + " " + k + quoi);
  if (photoObj(cs, champ) === ph && ph.plein === plein){    // pas remplacée entre-temps
    cachePhotos[cleCache(b, k, champ)] = plein;
    ph.chemin = chemin;
    ph.envoye = true;
    ph.plein = null;                              // libère la mémoire de l'appareil
    sauver(); rendreBiblio();
  }
}

function majSuivi(fait, total, detail){
  const z = $("#suivi");
  z.hidden = false;
  z.innerHTML = `<div><b>Remplissage : ${fait} / ${total}</b> — restants : ${Math.max(0, total - fait)}</div>
    <div class="barreint"><i style="width:${total ? Math.round(fait*100/total) : 0}%"></i></div>
    ${detail ? `<div class="aide">${esc(detail)}</div>` : ""}`;
}
function masquerSuivi(){ const z = $("#suivi"); z.hidden = true; z.innerHTML = ""; }

/* ---------- appareil photo ---------- */
function serieAppareil(b){
  const liste = serie.liste.slice();
  serie.actif = true; serie.encours = liste[0];
  majBarreSel(); majMarquesGrille();
  const inp = $("#entreeSerie");
  const et = { i:0, fichier:null, url:null, statuts:{}, chaine:Promise.resolve(),
               affectees:[], envoyees:0, locales:0, erreurs:[], termine:false };
  liste.forEach(k=>et.statuts[k] = "attente");
  const ICONE = { attente:"", traitement:"⏳", envoi:"⬆️", envoye:"☁️", local:"📱", echec:"⚠️" };

  const f = modale({ titre:"Photos en série",
    html:`<div class="bande" id="aBande"></div><div id="aCible" class="cibleSerie"></div>
          <div id="aZone"></div><div id="aEnvoi" class="aide"></div>`,
    boutons:[{texte:"Terminer", classe:"principal", action:()=>terminer()}],
    surFermeture:()=>terminer() });

  const dessiner = ()=>{
    if (!f.isConnected) return;
    const courant = liste[et.i];
    f.querySelector("#aBande").innerHTML = liste.map(k=>{
      const ph = b.cases[k] && b.cases[k].photo;
      const src = ph ? photoImmediate(b, k) : null;
      const montrer = et.statuts[k] !== "attente" && src;
      return `<div class="vig ${k===courant?"cour":""}" data-v="${k}">
        ${montrer ? `<img src="${src}" alt="">` : "📷"}
        <span class="lib">${lib(k)}</span><span class="st">${ICONE[et.statuts[k]]||""}</span></div>`;
    }).join("");
    const cv = f.querySelector(`[data-v="${courant}"]`);
    if (cv) cv.scrollIntoView({ inline:"center", block:"nearest" });

    f.querySelector("#aCible").innerHTML = courant
      ? `Compartiment <b>${lib(courant)}</b> — traités : ${et.i} / ${liste.length}, restants : ${liste.length - et.i}`
      : `Toutes les photos sont prises.`;

    const z = f.querySelector("#aZone");
    if (!courant){ z.innerHTML = ""; }
    else if (et.fichier){
      z.innerHTML = `<img class="photo-apercu" src="${et.url}" alt="Photo prise">
        <div class="barre"><button class="btn" id="aReprendre" style="flex:1">↺ Reprendre</button>
        <button class="btn principal" id="aUtiliser" style="flex:1">✓ Utiliser</button></div>`;
      z.querySelector("#aReprendre").onclick = ()=>prendre();
      z.querySelector("#aUtiliser").onclick = ()=>utiliser();
    } else {
      z.innerHTML = `<button class="btn principal plein" id="aPrendre">📷 Photographier ${lib(courant)}</button>
        <div class="aide">De face, bien éclairé, tranches lisibles.</div>`;
      z.querySelector("#aPrendre").onclick = ()=>prendre();
    }

    const enCours = liste.filter(k=>["traitement","envoi"].includes(et.statuts[k])).length;
    f.querySelector("#aEnvoi").textContent = ghPret()
      ? `GitHub : ${et.envoyees} photo(s) envoyée(s)${enCours ? `, ${enCours} en cours` : ""}${et.locales ? `, ${et.locales} restée(s) sur l'appareil` : ""}.`
      : `Sans jeton GitHub : les photos restent sur cet appareil.`;
  };

  const prendre = ()=>{
    inp.value = "";
    inp.onchange = ()=>{
      const file = inp.files && inp.files[0];
      inp.value = "";
      if (!file || et.termine) return;
      if (et.url) URL.revokeObjectURL(et.url);
      et.fichier = file; et.url = URL.createObjectURL(file);
      dessiner();
    };
    inp.click();        // directement dans le geste de l'utilisateur (exigence iOS)
  };

  const utiliser = ()=>{
    const k = liste[et.i], file = et.fichier, url = et.url;
    if (!k || !file) return;
    et.fichier = null; et.url = null;
    et.statuts[k] = "traitement";
    et.i++;
    const suivant = liste[et.i];
    serie.encours = suivant || null; majMarquesGrille();
    dessiner();
    if (suivant) prendre();               // enchaîne sur le compartiment suivant
    et.chaine = et.chaine.then(async ()=>{
      try{
        await affecterPhoto(b, k, file);
        et.affectees.push(k);
      }catch(e){
        et.statuts[k] = "echec"; et.erreurs.push(lib(k) + " : " + e.message);
        URL.revokeObjectURL(url); dessiner(); rafraichirSuivi(); return;
      }
      URL.revokeObjectURL(url);
      if (ghPret()){
        et.statuts[k] = "envoi"; dessiner();
        try{ await televerserPhoto(b, k); et.statuts[k] = "envoye"; et.envoyees++; }
        catch(e){ et.statuts[k] = "local"; et.locales++; et.erreurs.push(lib(k) + " (envoi) : " + e.message); }
      } else { et.statuts[k] = "local"; et.locales++; }
      dessiner(); rafraichirSuivi();
    });
    if (!suivant) terminer();
  };

  const rafraichirSuivi = ()=>{
    if (!et.termine) return;
    const n = liste.filter(k=>et.statuts[k] !== "attente").length;
    const faits = liste.filter(k=>["envoye","local","echec"].includes(et.statuts[k])).length;
    majSuivi(faits, n, "Envoi des dernières photos…");
  };

  const terminer = async ()=>{
    if (et.termine) return;
    et.termine = true;
    if (et.url) URL.revokeObjectURL(et.url);
    et.fichier = null; et.url = null;
    if (f.isConnected) f.remove();
    serie.encours = null; majMarquesGrille();
    rafraichirSuivi();
    await et.chaine;
    masquerSuivi();
    bilanSerie(b, et.affectees, et.envoyees, et.locales, et.erreurs, et.i < liste.length);
  };

  dessiner();
  prendre();            // ouvre l'appareil tout de suite pour le premier compartiment
}

/* ---------- bilan + proposition d'analyse ---------- */
function bilanSerie(b, affectees, envoyees, locales, erreurs, interrompu){
  serie = null;
  majBarreSel(); rendreBiblio();
  if (!affectees.length){
    toast(interrompu ? "Série terminée sans photo affectée." : "Aucune photo n'a été affectée.");
    if (erreurs.length) modale({ titre:"Remplissage", html:`<div class="aide">${esc(erreurs.join(" | "))}</div>`, boutons:[{texte:"Fermer"}] });
    return;
  }
  const avecLivres = affectees.filter(k=>(b.cases[k].livres||[]).length).length;
  const html =
    `<div>${affectees.length} photo(s) placée(s) dans leur compartiment${interrompu ? " (série arrêtée en route)" : ""}.</div>
     <div class="aide">☁️ ${envoyees} envoyée(s) sur GitHub${locales ? ` · 📱 ${locales} restée(s) sur cet appareil, à envoyer via ☁️` : ""}.
     Le fichier ${FICHIER_JSON} reste à envoyer via ☁️ pour que vos autres appareils voient ces photos.</div>
     ${erreurs.length ? `<div class="aide">⚠️ ${esc(erreurs.join(" | "))}</div>` : ""}
     <div class="sep"></div>
     <div>Analyser maintenant ces ${affectees.length} compartiment(s) avec Gemini ?</div>
     ${avecLivres ? `<div class="aide">${avecLivres} d'entre eux ont déjà des livres relevés : leur liste sera remplacée.</div>` : ""}
     ${cleGemini() ? "" : `<div class="alerte">Clé Gemini absente : renseignez-la d'abord dans les réglages ⚙️.</div>`}`;
  modale({ titre:"Remplissage terminé", html,
    boutons: cleGemini()
      ? [ {texte:"Plus tard"},
          {texte:"🔍 Analyser", classe:"principal", action:()=>{ analyserListe(b, affectees, "Analyse des nouvelles photos"); }} ]
      : [ {texte:"Plus tard"},
          {texte:"Réglages ⚙️", classe:"principal", action:()=>ouvrirReglages("gemini")} ] });
}
